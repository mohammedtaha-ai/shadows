name: AYLUL desktop

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aylul-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
            apps/desktop/hook -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Install shared dashboard dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Core for desktop launch tests
        # core_connection tests start the real target/debug/shadows.exe.
        working-directory: .
        run: cargo build -p shadows --bin shadows

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test frontend interactions and generated native permissions
        run: npm test

      - name: Typecheck companion tests and fixtures
        run: npm run typecheck:tests

      - name: Test companion units and source boundaries
        run: npm run test:companion:unit

      - name: Test companion production bundle boundaries
        run: npm run test:companion:production

      - name: Hook format
        run: cargo fmt --manifest-path hook/Cargo.toml --check

      - name: Hook clippy
        run: cargo clippy --manifest-path hook/Cargo.toml --all-targets -- -D warnings

      - name: Hook tests
        run: cargo test --manifest-path hook/Cargo.toml

      - name: Hook release build
        run: cargo build --release --manifest-path hook/Cargo.toml

      - name: Sidecar install
        working-directory: apps/desktop/sidecar
        run: npm ci

      - name: Sidecar typecheck
        working-directory: apps/desktop/sidecar
        run: npm run typecheck

      - name: Sidecar tests
        working-directory: apps/desktop/sidecar
        env:
          AYLUL_HOOK_EXE: ${{ github.workspace }}\apps\desktop\hook\target\release\aylul-hook.exe
        run: npm test

  # RECORD_PURPLE and EXPORT_COLORS generate review artifacts on demand.
  # Native acceptance scripts need an interactive Windows desktop and stay opt-in.
  companion-browser:
    name: Companion browser suite
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chrome
        # playwright.config.ts selects the Chrome channel.
        run: npx playwright install --with-deps chrome

      - name: Test companion in the browser
        run: npm run test:companion:browser
