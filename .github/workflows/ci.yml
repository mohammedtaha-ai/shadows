name: CI

# Two platforms, two different jobs, on purpose.
#
# Windows is the acceptance gate: Milestone 0 claims Windows and nothing else
# (plan Task 13), so Windows runs the full suite and its failure is a real
# failure.
#
# Linux is the COMPILE gate only. It proves the crate still builds, lints, and
# passes its platform-neutral tests on a Unix target. It does NOT certify
# process-tree containment there: `src/process/containment_unix.rs` covers
# deliberate termination only, and the parent-death half of spec §1.5 is a
# known, recorded gap. Tests that would assert that gap are `#[ignore]`d with
# the reason in the source. Never silence one to make this job green — a green
# job that hides a gap is exactly the failure this project exists to avoid.

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows — acceptance gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Ship build — the test-only seams must not be in it
        # Three seams exist in this tree only because `test-support` is off in
        # an ordinary build: `storage::test_support` (a durable event appended
        # with no state write), `<Id>::from_literal` (an id minted from
        # arbitrary text), and `ProcessHandle::force_termination_failure`
        # (termination that reports failure on demand). `cargo test` turns that
        # feature on through the self dev-dependency, so every other step in
        # this job builds WITH it and none of them can notice if it became a
        # default feature or a dependency started requesting it. The whole
        # suite would stay green while all three shipped.
        #
        # So this step builds what ships and then asks Cargo, of the non-dev
        # graph, whether the feature is on. A failure here means a test-only
        # seam has entered the product build: fix the gating, never relax the
        # step.
        shell: bash
        run: |
          cargo build
          if cargo tree -e features,no-dev --package shadows | grep -q 'test-support'; then
            echo "::error::test-support is enabled in the shipping build - a test-only seam would ship"
            exit 1
          fi
      - name: Test
        run: cargo test

  linux:
    name: Linux — compile gate only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Ship build — the test-only seams must not be in it
        # Three seams exist in this tree only because `test-support` is off in
        # an ordinary build: `storage::test_support` (a durable event appended
        # with no state write), `<Id>::from_literal` (an id minted from
        # arbitrary text), and `ProcessHandle::force_termination_failure`
        # (termination that reports failure on demand). `cargo test` turns that
        # feature on through the self dev-dependency, so every other step in
        # this job builds WITH it and none of them can notice if it became a
        # default feature or a dependency started requesting it. The whole
        # suite would stay green while all three shipped.
        #
        # So this step builds what ships and then asks Cargo, of the non-dev
        # graph, whether the feature is on. A failure here means a test-only
        # seam has entered the product build: fix the gating, never relax the
        # step.
        shell: bash
        run: |
          cargo build
          if cargo tree -e features,no-dev --package shadows | grep -q 'test-support'; then
            echo "::error::test-support is enabled in the shipping build - a test-only seam would ship"
            exit 1
          fi
      - name: Test (ignored tests stay ignored; see the note at the top)
        run: cargo test
