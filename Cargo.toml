[package]
name = "shadows"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "1"
agent-client-protocol = { version = "=2.2.0", features = ["unstable_session_fork"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
# `std::fs::canonicalize` answers `\\?\C:\...` on Windows: a path no person
# typed and most tools refuse. `dunce` strips that prefix where it is safe to.
dunce = "1"
futures-core = "0.3"
# Spec §13.4's plan cycle check is petgraph's `tarjan_scc`, not a hand-written graph search.
petgraph = "0.8"
process-wrap = { version = "10", features = ["tokio1"] }
# Spec §13.6: Shadows' MCP server, over Streamable HTTP on the daemon's own
# listener. Never `transport-child-process` or `which-command`: `tokio::process`
# stays private to `process/`. The client features are `test-support` only.
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
# The major rmcp 3.4.1's `server` feature uses: MCP tool input schemas are
# derived from the argument types, never written by hand.
schemars = "1"
# The MCP test client's HTTP stack: the major rmcp 3.4.1 itself depends on, so
# one copy is built. Plain HTTP to loopback only, hence no TLS.
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Spec §1: the protocol is described, not copied. The OpenAPI document is
# generated from the routes and their types; `utoipa-axum` 0.2 is the line
# built for axum 0.8.
utoipa = { version = "5", features = ["uuid"] }
utoipa-axum = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Test apparatus, not product (docs/codebase: `src/bin/`). Built only with
# `test-support`, which `cargo test` enables through the self dev-dependency
# below, so `cargo build --release` and `cargo install` never ship them.
[[bin]]
name = "tree_probe"
path = "src/bin/tree_probe.rs"
required-features = ["test-support"]

[[bin]]
name = "fake_acp"
path = "src/bin/fake_acp.rs"
required-features = ["test-support"]

[features]
# Compiles in `storage::test_support`, a hook onto an otherwise-private
# capability (`append_event` without a state write) that must never ship in
# an ordinary build — see cross-cutting rule 10. Also `rmcp`'s MCP client, for
# tests that call `/mcp` as an agent does. Enabled for `cargo test` only via
# the self dev-dependency below, never a default feature.
test-support = [
    "rmcp/client",
    "rmcp/transport-streamable-http-client-reqwest",
    "dep:reqwest",
]

[dev-dependencies]
tempfile = "3"
# `tests/codemap` generates docs/codebase/inventory.md from the source tree and
# fails when the checked-in file has drifted. syn parses, prettyplease prints —
# neither is a product dependency and neither ships.
syn = { version = "2", features = ["full", "parsing", "printing", "clone-impls"] }
prettyplease = "0.2"
# Token trees for expanding `newtype_id!` in the code map; already syn's own.
proc-macro2 = "1"
# `tests/protocol.rs` drives the real router in-process with `oneshot`. Already
# in the graph through axum; listed here only to name its `util` trait.
tower = { version = "0.5", features = ["util"] }
# Enables `test-support` for integration tests (tests/*.rs) without turning
# it on for `cargo build` or `cargo run`: Cargo's feature resolver unifies
# features per build/test graph, so this only affects `cargo test`.
shadows = { path = ".", features = ["test-support"] }
