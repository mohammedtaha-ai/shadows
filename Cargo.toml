[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
anyhow = "1"
agent-client-protocol = { version = "=2.2.0", features = ["unstable_session_fork"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
# `std::fs::canonicalize` answers `\\?\C:\...` on Windows: a path no person
# typed and most tools refuse. `dunce` strips that prefix where it is safe to.
dunce = "1"
futures-core = "0.3"
# Spec §13.4's plan cycle check is petgraph's `tarjan_scc`, not a hand-written graph search.
petgraph = "0.8"
process-wrap = { version = "10", features = ["tokio1"] }
# Spec §13.6: Shadows' MCP server, over Streamable HTTP on the daemon's own
# listener. Never `transport-child-process` or `which-command`: `tokio::process`
# stays private to `shadows-process`. The client features are test-side only: a
# `shadows` dev-dependency and `fake-acp`'s `test-support`.
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
# The major rmcp 3.4.1's `server` feature uses: MCP tool input schemas are
# derived from the argument types, never written by hand.
schemars = "1"
# The MCP test client's HTTP stack: the major rmcp 3.4.1 itself depends on, so
# one copy is built. Plain HTTP to loopback only, hence no TLS.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "=0.58.5", default-features = false }
json-patch = "=4.2.0"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
# Spec §15.3: `shadows-index`'s tagging. Pinned exactly by the probe
# (docs/evidence/milestone3/PROBE.md at 92e6dae): each grammar's ABI must be one the
# `tree-sitter` under `tree-sitter-tags` accepts, and one `tree-sitter` is built.
tree-sitter = "=0.27.0"
tree-sitter-tags = "=0.27.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
# Spec §15.4: the walk of a project's folder, honouring its `.gitignore`
# files whether or not it is a Git repository.
ignore = "0.4.33"
# Spec §15.4: a plain `RecommendedWatcher` per active project. Not
# `notify-debouncer-full`, which lost 98.7 % of 20 000 deletions on Windows
# (docs/evidence/milestone3/PROBE.md at 92e6dae); Shadows gathers the paths itself.
notify = "=8.2.0"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Spec §1: the protocol is described, not copied. The OpenAPI document is
# generated from the routes and their types; `utoipa-axum` 0.2 is the line
# built for axum 0.8.
utoipa = { version = "5", features = ["uuid"] }
utoipa-axum = "0.2"
libc = "0.2"

# Dev-dependencies.
tempfile = "3"
# `shadows_core::testing` builds `fake-acp` and `shadows-process`'s `tree_probe`
# for tests in other packages: `CARGO_BIN_EXE_*` names a binary only inside its
# own package (spec §14.3). An optional dependency of `shadows-core`, enabled
# only by its `test-support`.
escargot = "0.5"
# `shadows-core`'s `tests/contracts.rs` reads each service's test and method names
# from its Rust sources. Never a product dependency.
syn = { version = "2", features = ["full", "parsing", "printing", "clone-impls"] }
# `shadows-core`'s `tests/contracts.rs` parses each service's `contract.yaml` (spec §14.7):
# the maintained successor of the archived `serde_yaml` line. Never a product dependency.
yaml-rust2 = "0.13"
# `crates/shadows/tests/protocol.rs` drives the real router in-process with `oneshot`. Already
# in the graph through axum; listed here only to name its `util` trait.
tower = { version = "0.5", features = ["util"] }

# Debug info is most of what the linker writes for each of the ~75 test
# binaries. Line tables keep file:line in backtraces and panics; the
# dependencies, built once and cached, carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "deny"
# Spec §14.6: a public method that answers a type from a private module is
# refused under `-D warnings`, so the boundary cannot leak by a return type.
unnameable_types = "warn"

[workspace.lints.clippy]
