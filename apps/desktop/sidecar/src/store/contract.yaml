name: sidecar-database
version: 1
status: current
source: apps/desktop/sidecar/src/store
responsibility: Open the single laptop SQLite connection with the fixed schema.
public_api:
  openDatabase: Composition alone opens aylul.db, creates the parent directory, and initializes the unchanged tables; returns the connection for private domain stores.
obligations:
  - rule: The database file and schema remain compatible without migration.
    tested_by: RPC projections and persisted rows survive reopening the unchanged aylul.db schema
  - rule: Domain SQL never returns to shared persistence or adapters.
    tested_by: sidecar ownership and RPC parity match the exact shrinking baseline
gaps:
  - at: openDatabase
    gap: No retention yet; the 90-day approval-record limit is enforced in step 2(d) or later.
