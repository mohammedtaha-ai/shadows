[package]
name = "nylra-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-global-shortcut = "=2.3.2"
# Infrastructure: native OS login-item registration.
tauri-plugin-autostart = "=2.5.1"
# Compatibility constraints: broad upstream minor ranges resolved incompatible 2.12 runtimes.
tauri-runtime = "=2.11.3"
tauri-runtime-wry = "=2.11.4"
tauri-macros = "=2.6.3"
tauri-codegen = "=2.6.3"
tauri-utils = "=2.9.3"
serde_json = "1"
dunce = "1"
pulldown-cmark = "=0.13.4"
eventsource-stream = "=0.2.3"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
shadows-process = { path = "../../../crates/shadows-process" }
uuid = { version = "1", features = ["v4", "v5"] }

sha2 = "=0.10.9"
base64 = "=0.22.1"
url = "=2.5.8"
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
[workspace]

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"
toml = "0.8"
tempfile = "3.27"
axum = "0.8"
