[[permission]]
identifier = "main-actions"
description = "Account, local sidecar and companion controls for main only."
commands.allow = ["desktop_connection", "desktop_connection_config", "save_desktop_connection", "retry_desktop_connection", "open_external", "hide_main", "auth_action", "cancel_login", "aylul_call", "companion_state", "set_companion_visible", "set_companion_paused"]

[[permission]]
identifier = "companion-actions"
description = "Local companion presentation and explicit main navigation only."
commands.allow = ["companion_state", "companion_ready", "companion_failed", "drag_companion", "open_main_from_companion"]
