[[permission]]
identifier = "main-actions"
description = "Account, local sidecar and companion controls for main only."
commands.allow = ["companion_binding", "select_companion_agent", "target_companion_thread", "set_companion_previews", "navigation_snapshot", "ack_navigation", "desktop_connection", "desktop_connection_config", "save_desktop_connection", "retry_desktop_connection", "open_external", "hide_main", "auth_action", "cancel_login", "aylul_call", "companion_state", "set_companion_visible", "set_companion_paused"]

[[permission]]
identifier = "companion-actions"
description = "Local companion presentation, closed navigation and binding-scoped explicit text submission."
commands.allow = ["companion_send", "companion_input", "companion_state", "companion_ready", "companion_failed", "drag_companion", "open_main_from_companion"]
