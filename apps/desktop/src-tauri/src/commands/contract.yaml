name: main-window-command-boundary
version: 1
status: current
source: apps/desktop/src-tauri/src/commands
responsibility: Restrict native account and sidecar actions to main and companion navigation/readiness/drag actions to the owned local surface.
public_api:
  desktop_connection: Main-only verified lifecycle projection.
  desktop_connection_config: Main-only saved nonsecret path references.
  save_desktop_connection: Main-only normalized configuration replacement with background startup.
  retry_desktop_connection: Main-only explicit startup retry.
  open_external: Main-only validated HTTP(S) link through OS browser.
  assistant_call: Require main; translate the closed Request with captured public account/session IDs through the protected account service on a blocking worker. No URL/key selector or account handle reaches the webview.
  assistant_local_call: Require main; dispatch a closed local request with captured installation identity on a blocking worker.
  assistant_sources: Require main; expose local installation identity without the connection capability.
  aylul_call: Require the main label; relay one listed method to the sidecar on a blocking worker; return its result or a stable code.
  auth_action: Require the main label; execute native auth on a blocking worker; return only View or a stable code.
  cancel_login: Require the main label; signal cancellation without waiting for the account worker.
  hide_main: Require main window label; call native hide; return a stable local error without OS details.
  allowed_caller: Explicit per-command window matrix; unknown names and windows are rejected.
  companion_state: Return only the native companion projection to main or companion.
  companion_ready: Require the owned companion and initialize its presentation through the UI dispatcher.
  companion_failed: Companion-only fixed rendering-failure report; revoke permission and expose native Retry state.
  set_companion_visible: Main-only visibility request through the native owner.
  set_companion_paused: Main-only pause request through the native owner.
  drag_companion: Companion-only native drag.
  open_main_from_companion: Companion-only deliberate main navigation.
external_types:
  - tauri::WebviewWindow
obligations:
  - rule: Keyboard action can hide the main surface through the UI wrapper and IPC.
    tested_by: 'integration: apps/desktop/tests/windows-shell.ps1'
  - rule: Other surface labels cannot use this command.
    tested_by: commands::companion::tests::companion_callers_are_restricted_for_every_operation
    note: Matrix unit test; actual native IPC rejection is a separate pending acceptance check.
  - rule: Generated capabilities grant sidecar request authority only to main, preserving the companion's restricted surface.
    tested_by: 'integration: apps/desktop/tests/native-acl.test.mjs'
    note: generated native permissions grant sidecar access only to main inspects cargo-generated ACL metadata; actual webview IPC acceptance remains separate.
