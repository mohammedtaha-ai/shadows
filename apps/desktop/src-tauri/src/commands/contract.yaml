name: main-window-command-boundary
version: 1
status: current
source: apps/desktop/src-tauri/src/commands
responsibility: Restrict native account and sidecar actions to main and companion navigation/readiness/drag actions to the owned local surface.
public_api:
  desktop_preferences: Main-only no-argument full native preference read with actual OS login-item state.
  set_desktop_preferences: Main-only flat optional launchAtLogin/closeToTray patch; return full camelCase view only after saving.
  refresh_companion_appearance: Main-only no-argument metadata reread; return { ok true } only after guarded companion-state publication.
  companion_binding/select_companion_agent/target_companion_thread/set_companion_previews: Main-only configuration-scoped binding operations; validation reads precede mutation; target waits at most two seconds for scoped observer readiness and rechecks generation afterward.
  navigation_snapshot/ack_navigation: Main-only closed pending navigation; exact revision acknowledgement.
  desktop_connection: Main-only verified lifecycle projection.
  desktop_connection_config: Main-only saved nonsecret path references.
  save_desktop_connection: Main-only normalized configuration replacement with background startup.
  retry_desktop_connection: Main-only explicit startup retry.
  open_external: Main-only validated HTTP(S) link through OS browser.
  aylul_call: Require the main label; relay one listed method to the sidecar on a blocking worker; return its result or a stable code.
  auth_action: Require the main label; execute native auth on a blocking worker; return only View or a stable code.
  cancel_login: Require the main label; signal cancellation without waiting for the account worker.
  hide_main: Require main window label; call native hide; return a stable local error without OS details.
  allowed_caller: Explicit per-command window matrix; unknown names and windows are rejected.
  companion_state: Return only the native companion projection to main or companion.
  companion_send: Companion-only text/command/context admission on a blocking worker; no caller-selected target or endpoint.
  companion_input: Companion-only explicit editor mode change through the UI dispatcher.
  companion_ready: Require the owned companion and initialize its presentation through the UI dispatcher.
  companion_failed: Companion-only fixed rendering-failure report; revoke permission and expose native Retry state.
  set_companion_visible: Main-only visibility request through the native owner.
  set_companion_paused: Main-only pause request through the native owner.
  drag_companion: Companion-only native drag.
  open_main_from_companion: Companion-only deliberate open at validated binding destination; pending request survives webview reload.
external_types:
  - tauri::WebviewWindow
obligations:
  - rule: Commands with native owners inject Arc<DesktopApp> and call typed accessors; UI-dispatched navigation resolves that same root.
    tested_by: native_architecture_ratchet
  - rule: All 27 registered commands have build metadata and generated allow/deny permissions; companion_send and companion_input are granted only to companion and guarded by the native caller matrix.
    tested_by: [native_architecture_ratchet, companion_callers_are_restricted_for_every_operation, 'integration: companion submission and editor commands have generated metadata and companion-only grants in apps/desktop/tests/native-acl.test.mjs']
  - rule: Preference commands have both native main-label checks and generated main-only ACL grants; neither webview gets direct autostart plugin permissions.
    tested_by: [companion_callers_are_restricted_for_every_operation, 'integration: desktop preferences are granted only to main in apps/desktop/tests/native-acl.test.mjs']
  - rule: Appearance refresh is denied outside main by both native label guard and generated ACL permissions.
    tested_by: [companion_callers_are_restricted_for_every_operation, 'integration: appearance refresh is granted only to main in apps/desktop/tests/native-acl.test.mjs']
  - rule: Keyboard action can hide the main surface through the UI wrapper and IPC.
    tested_by: 'integration: apps/desktop/tests/windows-shell.ps1'
  - rule: Other surface labels cannot use this command.
    tested_by: commands::companion::tests::companion_callers_are_restricted_for_every_operation
    note: Matrix unit test; actual native IPC rejection is a separate pending acceptance check.
  - rule: Generated capabilities grant sidecar request authority only to main, preserving the companion's restricted surface.
    tested_by: 'integration: apps/desktop/tests/native-acl.test.mjs'
    note: generated native permissions grant sidecar access only to main inspects cargo-generated ACL metadata; actual webview IPC acceptance remains separate.
