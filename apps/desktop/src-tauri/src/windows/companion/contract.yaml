name: native-companion-window
version: 1
status: current
source: apps/desktop/src-tauri/src/windows/companion
responsibility: Own the independent local companion window, revisioned rendering permission, physical fitting and no-activation show adapter.
public_api:
  input::refresh: Read the composition-injected editor context callback synchronously; a changed scope closes editor without activating main; an absent or superseded context skips publication.
  EditorContext: Explicit optional scope, context and agent supplied by composition.
  SurfacePresence/SurfacePreview/SurfaceAppearance: Window-owned serialized presentation values; producers map into them outside window code.
  Store::set_editor_context: Install the editor context callback once during native assembly.
  input::set_input: Explicit companion-only open grants focus; close restores compact bounds without opening main.
  input::open_bounds/closed_origin: Physical editor geometry preserves the character anchor at the monitor scale.
  Store: Application-owned native model, retained origin, visibility-intent counter and optional tray item.
  visibility_token/show_for_selection: Capture the visibility intent before agent validation; show on the UI thread only if no later visibility action occurred.
  setup_companion: Build or reconstruct a hidden transparent 240px logical window; report construction failure without terminating main.
  snapshot: Return revisioned visibility/render permission plus the window-owned surface DTO.
  republish: Emit the current companion state without mutation.
  present: Atomically update conversation presentation plus optional opaque appearance; never grant drawing, clear renderer errors, show or focus a window.
  ready: Initialize current surface and apply requested visibility; used after local Canvas resources are ready.
  failed: Revoke drawing and mark the native projection retryable after Canvas failure.
  set_visible: Apply requested visibility, deny rendering before hide and reconcile actual native visibility.
  set_paused: Publish the application-owned motion pause state.
  drag: Start native dragging for the owned companion.
  on_ui: Serialize command effects onto the native UI thread without retaining the model lock.
external_types:
  - tauri::WebviewWindow
  - tauri::Monitor
obligations:
  - rule: Surface model, placement and paths use their DesktopApp accessors at existing UI dispatch points; editor context arrives through an injected callback, with no Presence or Watcher lookup in window code.
    tested_by: native_architecture_ratchet
  - rule: Command answers and companion-state events serialize the same CompanionState; field order, nulls, omitted appearance, opaque colour, preview expiry and render failure retain their exact bytes.
    tested_by: companion_surface_wire_is_pinned
  - rule: Colour-only updates advance one revision without changing render permission, error, visibility, pause or composer; absent appearance is omitted on the wire.
    tested_by: appearance_changes_revision_without_render_permission
  - rule: Closing input restores the valid prior external foreground only while companion still owns focus; main is never a restoration target.
    tested_by: 'integration: actual-composer-physical-keyboard-and-escape in apps/desktop/tests/companion-native.mjs'
  - rule: Only explicit editor open grants focus; hide closes input and unhide never reopens it.
    tested_by: [windows::companion::state::tests::hide_closes_input_and_unhide_keeps_it_closed, 'integration: apps/desktop/tests/companion-native.mjs']
  - rule: Editor expansion fits the complete rectangle; collapse restores the compact anchor.
    tested_by: [windows::companion::input::tests::open_bounds_centres_the_character, windows::companion::input::tests::open_then_close_restores_exact_origin, windows::companion::input::tests::open_at_bottom_right_edge_fits_whole_rectangle]
  - rule: Presence publication cannot grant rendering or clear a rendering failure.
    tested_by: windows::companion::state::presence_tests::presence_publication_never_grants_render_permission_or_clears_render_failure
  - rule: Initial permission is denied and hide before initialization wins.
    tested_by: windows::companion::state::tests::companion_initially_denies_drawing_and_hide_before_ready_wins
  - rule: A failed hide reconciles actual visibility and reports error.
    tested_by: windows::companion::state::tests::companion_failed_hide_reconciles_actual_visibility
  - rule: Initialization deadlines and retries are generation-scoped.
    tested_by: windows::companion::state::tests::companion_initialization_deadline_is_retryable_and_generation_scoped
  - rule: Drawing failure after readiness revokes permission and exposes Retry.
    tested_by: windows::companion::state::tests::companion_drawing_failure_revokes_permission_and_is_retryable
  - rule: Placement fits complete rectangles and preserves negative monitor positions.
    tested_by: windows::companion::placement::tests::companion_negative_origin_and_small_or_missing_areas
  - rule: Direct no-activate show is paired with direct hide rather than Tao's cached visibility flags.
    tested_by: 'integration: apps/desktop/tests/windows-companion.ps1 and companion-native.mjs'
    note: Native hidden-frame and actual-tray assertions; dated report identifies run outcome.
gaps:
  - at: no_activate::show
    gap: Full optimized resource acceptance is deferred by user instruction to develop in debug. Current device driver is separate from unit tests.
  - at: fit
    gap: Hardware monitor removal and mixed-DPI transitions remain untested.
