name: companion-presentation
version: 1
status: current
source: apps/desktop/src/features/companion
responsibility: Present procedural AYLUL with isolated motion and explicit native rendering permission; desktop gestures invoke narrow platform wrappers. Reusable in-window presence owns message lifetime and optional tones. Development studio is separately owned.
exports:
  - name: paletteFor
    file: apps/desktop/src/features/companion/renderer/palette.ts
  - name: rgba
    file: apps/desktop/src/features/companion/renderer/palette.ts
  - name: CompanionComposer
    file: apps/desktop/src/features/companion/CompanionComposer.tsx
  - name: createDrafts
    file: apps/desktop/src/features/companion/composer-model.ts
  - name: nextAttempt
    file: apps/desktop/src/features/companion/composer-model.ts
  - name: submitKey
    file: apps/desktop/src/features/companion/composer-model.ts
  - name: errorMessage
    file: apps/desktop/src/features/companion/composer-model.ts
  - name: createNativePresentation
    file: apps/desktop/src/features/companion/native-presentation.ts
  - name: DesktopCompanion
    file: apps/desktop/src/features/companion/DesktopCompanion.tsx
  - name: Companion
    file: apps/desktop/src/features/companion/Companion.tsx
  - name: renderCharacter
    file: apps/desktop/src/features/companion/renderer/character.ts
  - name: renderScene
    file: apps/desktop/src/features/companion/renderer/scene.ts
  - name: createMotion
    file: apps/desktop/src/features/companion/animation/model.ts
  - name: readFrame
    file: apps/desktop/src/features/companion/animation/model.ts
entries:
  - file: apps/desktop/src/features/companion/renderer/index.ts
    exposes: renderCharacter (studio) and renderScene (presence canvas); no other renderer module.
  - file: apps/desktop/src/features/companion/animation/index.ts
    exposes: the motion, frame loop, viewport and message operations presence uses, of which studio takes createMotion and readFrame; no test support.
obligations:
  - rule: The bound agent's opaque outfit resolves through catalog.outfitOf; unknown ids draw default in the desktop and reusable Companion.
    tested_by: apps/desktop/tests/companion/desktop-window.spec.ts
    test: the companion window draws the state's outfit
  - rule: Modules reachable from the production companion entry import no studio module, co-located unit test or test fixture, including animation/fixtures/test-fakes.ts.
    tested_by: apps/desktop/tests/companion/boundaries.test.ts
    test: companion import boundaries match the exact shrinking baseline
  - rule: The companion bundle holds no studio module, co-located unit test or test fixture.
    tested_by: apps/desktop/tests/companion/production.test.ts
    test: production includes companion and excludes studio modules and remote assets
  - rule: The entries export only what presence and studio consume; no test checks the export lists.
    tested_by: none
    test: none
  - rule: Character and scene tones resolve from the frame colour; omitted or unknown colour draws every recorded purple frame (4x4 block means, each channel within 24 of the reference, so rasterizer differences pass). Each frame shares its palette with the drawing passes; accessory crystal callers that omit the optional palette keep the base tones.
    tested_by: apps/desktop/tests/companion/renderer.spec.ts
    test: purple draws today's pixels
  - rule: Recolouring preserves transparency and visible coverage while blocked rose and success gold remain state signals.
    tested_by: apps/desktop/tests/companion/renderer.spec.ts
    test: signals keep their colours in every colour
  - rule: The desktop companion copies the parsed state's colour and resolved outfit into motion input without changing shape or motion.
    tested_by: apps/desktop/tests/companion/desktop-window.spec.ts
    test: the companion window draws the state's colour
  - rule: The base palette preserves today's exact tones; unknown or missing colour IDs resolve to the same cached base palette.
    tested_by: apps/desktop/src/features/companion/renderer/palette.test.ts
    test: an unknown or missing id draws purple
  - rule: Each colour derives a complete cached palette by rotating the base hue while preserving saturation and lightness, with explicit tone overrides taking precedence.
    tested_by: apps/desktop/src/features/companion/renderer/palette.test.ts
    test: a derived tone keeps lightness and saturation
  - rule: An in-flight send keeps the textarea focusable but read-only so Escape can close the editor without changing or cancelling the submission.
    tested_by: apps/desktop/tests/companion/composer.spec.ts
    test: pending send retains keyboard focus so Escape can close the editor
  - rule: Ready is an accessible native editor toggle; artwork alone owns drag and main navigation.
    tested_by: apps/desktop/tests/companion/composer.spec.ts
    test: Ready click and keyboard toggle input without main or drag
  - rule: Uncertain Retry keeps its text read-only and command identity even when a later retry finds Core unavailable.
    tested_by: apps/desktop/tests/companion/composer.spec.ts
    test: Core unavailable during Retry keeps the captured text and command locked
  - rule: Scope changes discard drafts; close and hide retain same-scope text.
    tested_by: apps/desktop/tests/companion/composer.spec.ts
    test: draft survives close and hide; switching conversation clears it
  - rule: Enter sends, Shift Enter inserts newline and IME Enter does not submit.
    tested_by: apps/desktop/tests/companion/composer.spec.ts
    test: Shift Enter inserts newline and IME Enter never submits
  - rule: Pause does not disable typing or sending.
    tested_by: apps/desktop/tests/companion/composer.spec.ts
    test: pause does not disable typing or sending and outside click does not close
  - rule: Desktop status comes from native presence; a plain two-line preview retains its absolute expiry and repeated IDs cannot extend it.
    tested_by: apps/desktop/tests/companion/live-presence.spec.ts
    test: native status and a compact plain reply retain their deadlines across repeated events
  - rule: Native hide stops draws and showing cannot revive an expired preview.
    tested_by: apps/desktop/tests/companion/live-presence.spec.ts
    test: native hide stops drawing and showing cannot revive an expired preview
  - rule: Pause and reduced motion preserve readable status; keyboard opens main and dragging consumes the click.
    tested_by: apps/desktop/tests/companion/live-presence.spec.ts
    test: paused and reduced-motion status remains readable, keyboard opens and drag consumes the click
  - rule: Recoverable gesture errors preserve the Canvas and renderer failures report to the native retry owner.
    tested_by: apps/desktop/tests/companion/desktop-window.spec.ts
    test: drawing failure after readiness reports to native recovery owner
  - rule: The compact entry draws a transparent character without account or studio loading.
    tested_by: apps/desktop/tests/companion/desktop-window.spec.ts
    test: desktop entry draws transparent character without account or studio
  - rule: An eight pixel drag consumes the panel click and lost mouse-up does not strand the next gesture.
    tested_by: apps/desktop/src/features/companion/desktop-gesture.test.ts
    test: eight pixel drag consumes panel click and next gesture survives lost up
  - rule: Explicit native denial cancels all draws even if document visibility remains visible.
    tested_by: apps/desktop/tests/companion/native-visibility.spec.ts
    test: native denial stops all draws while document remains visible
  - rule: Canvas readiness does not depend on permission to draw.
    tested_by: apps/desktop/tests/companion/native-visibility.spec.ts
    test: initialization reports ready without a draw under denied permission
  - rule: Perching uses scene-aware scale and position so the hands meet the mock top with hood headroom.
    tested_by: apps/desktop/src/features/companion/animation/model.test.ts
    test: perch hands meet the mock top without clipping the hood
  - rule: A live browser DPR change updates backing pixels while motion remains paused.
    tested_by: apps/desktop/tests/companion/presence.spec.ts
    test: live DPR change resizes backing pixels while paused
  - rule: Locked direction updates remain visible on a still frame without advancing motion.
    tested_by: apps/desktop/src/features/companion/animation/model.test.ts
    test: locked direction is visible on a still redraw without advancing motion
  - rule: Poking cannot replace owner messages or report work outcomes.
    tested_by: apps/desktop/tests/companion/presence.spec.ts
    test: poke preserves controlled message
  - rule: Paused input updates redraw a still without continuous animation.
    tested_by: apps/desktop/tests/companion/presence.spec.ts
    test: paused changes repaint without animation
  - rule: Hidden document cancels scheduled rendering until visibility returns.
    tested_by: apps/desktop/tests/companion/presence.spec.ts
    test: hidden document cancels frames until restored
  - rule: Frame cadence preserves elapsed simulation and each model owns its random state.
    tested_by: apps/desktop/src/features/companion/animation/model.test.ts
    test: motion cadence is stable at 30 60 and 120 Hz and inputs unchanged
  - rule: One frame owner cancels callbacks on pause and disposal.
    tested_by: apps/desktop/src/features/companion/animation/scheduler.test.ts
    test: one loop is owned across double starts stop and dispose
  - rule: Repeated message IDs cannot extend their lifetime.
    tested_by: apps/desktop/src/features/companion/animation/messages.test.ts
    test: same ID does not extend expiry and same text new ID does
  - rule: All nine expressions and ten outfits draw with a real Canvas context and no global engine.
    tested_by: apps/desktop/tests/companion/renderer.spec.ts
    test: all expressions and outfits draw without global engine
  - rule: Identical frame inputs produce identical pixels.
    tested_by: apps/desktop/tests/companion/renderer.spec.ts
    test: same inputs produce same pixels
  - rule: The character canvas retains transparent corners.
    tested_by: apps/desktop/tests/companion/renderer.spec.ts
    test: character render preserves transparent corners
gaps:
  - at: CompanionCanvas
    gap: Simulated document visibility and Chromium tests do not establish Windows tray-hide suspension, DPI or native rendering cost.
