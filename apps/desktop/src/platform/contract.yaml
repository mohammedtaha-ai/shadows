name: desktop-window-invocation
version: 1
status: current
source: apps/desktop/src/platform
responsibility: Isolate credential-free native companion presentation invocations.
public_api:
  setCompanionInput: Request explicit companion-only open or close and validate the returned native state.
  sendFromCompanion: Supply only text, command identity and native context; return thread/operation identity.
  acceptState: Validate required bounded composer fields and credential-free native projection; retain the newest safe revision; optional presence for legacy fixtures validates expressions, scalar bounds and absolute expiry; carry optional appearance.color unread when it is a string of 1 to 32 characters, otherwise purple.
  connectCompanion: Subscribe before initial snapshot or readiness; clean late subscriptions and ignore stale replies.
  dragCompanion: Request companion-only dragging.
  reportCompanionFailure: Notify the native recovery owner of a fixed local rendering failure without transmitting error text.
  openMainFromCompanion: Request deliberate main navigation from companion.
obligations:
  - rule: Missing or malformed appearance falls back to purple without rejecting the state; valid opaque colour IDs pass through and older revisions cannot replace them.
    tested_by: apps/desktop/src/platform/companion-state.test.ts
    note: appearance colour is carried into the state; missing or malformed appearance reads as purple; an older revision cannot change the colour
  - rule: Composer state is mandatory, bounded and validated before use.
    tested_by: apps/desktop/src/platform/companion-state.test.ts
    note: composer view is validated and never optional
  - rule: Older readiness replies cannot reverse newer native state.
    tested_by: apps/desktop/src/platform/companion-state.test.ts
    note: older ready reply cannot reverse newer native hide
  - rule: Disposed subscribers clean late listeners without readiness or callbacks.
    tested_by: apps/desktop/src/platform/companion-state.test.ts
    note: late subscription after disposal cleans up without readiness or callbacks
