[package]
name = "code-record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
codebase = { path = "../codebase" }
core-db = { path = "../core-db" }
# The task contract's types only: `CodeRecord` never calls Plans.
core-plans = { path = "../core-plans" }
core-projects = { path = "../core-projects" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Fixtures stop the code workers they started.
codebase = { path = "../codebase", features = ["test-support"] }

[features]
# Recorded answers for other crates' tests; never a default feature.
test-support = []
