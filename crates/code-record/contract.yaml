# Owns the rule "does the code hold what the contract promised", its verdicts
# and the record a done mark writes (code-record plan, Rulings for every task).
# It reads Design's elements, layout and path owners to answer code_where.
# Project identities are imported from core-projects; the task contract's types
# from core-plans, whose service it never calls. Runs owns the check rows and
# their flow and calls `verify`; CodeRecord never calls Runs.
# Database infrastructure: core-db; its five tables are private to its store.
#
# What is compared is the folder as it stands when `verify` runs. The language
# servers are asked through Codebase (`missing_inputs`, then `lsp`'s
# documentSymbol) as Asker::Person of the project: a system call made for the
# project, not a person's question.
name: code_record
version: 1
status: current
source: crates/code-record/src

modules:
  lib.rs: code record boundary
  error.rs: code record refusals
  model.rs: the code record's values
  verify.rs: comparing a contract's symbols with the code
  elements.rs: judging a design element's build state
  store/mod.rs: code record persistence
  store/elements.rs: the record's element pins
  code_where.rs: answering where a topic is
  digest.rs: the record's digest for a Planner's context
  ranking.rs: ranking a question's matches
  store/lookup.rs: reading the record for a question or whole

dependencies:
  code: crates/codebase/contract.yaml
  design: crates/core-design/contract.yaml # elements, layout and owners
  projects: crates/core-projects/contract.yaml
  # Types only: TaskContract, SymbolWork, FileAction.
  plans: crates/core-plans/contract.yaml

shapes:
  CodeRecord:
    # Cheap to clone: built once in AppCore's assemble_services with the Codebase it shares.
    store: CodeRecordStore
    code: Codebase
    design: Design          # elements and layout, for code_where
    # Only under the `test-support` feature, never a default: answers recorded
    # by tests, by path, which `ask` answers from before any language server.
    recorded: Arc<Mutex<HashMap<String, RecordedAnswer>>>
  RecordedAnswer:
    # test-support only, recorded under a key. Symbols: a documentSymbol result,
    # not truncated, under the path; NoServer: unchecked, "no language server
    # reads it"; Absent: the file is absent; References: a findReferences result
    # under "{path}#references@{line}", truncated standing for Codebase's bound;
    # Failed: under any key, the ask fails with the text; Workspace: a
    # workspaceSymbol result under "#workspace:{query}".
    values: [Symbols(Value), NoServer, Absent, "References { result, truncated }", Failed(String), Workspace(Value)]
  CodeRecordStore:
    storage: Arc<Storage>   # private; tables code_record_verdict, code_record_file, code_record_symbol, code_record_unpromised, code_record_element
  DoneRecord:
    # What a done mark records: attempt and commit none for a task done with
    # no attempt; verdict none then, or when another attempt committed since.
    # A task carried unchanged from an earlier version names the attempt it
    # was marked done on there; Runs decides that, CodeRecord records it.
    project: ProjectId
    workflow: WorkflowId
    version: i64
    task: u32
    attempt: Option<String>
    commit: Option<String>
    contract: TaskContract
    verdict: Option<Verdict>
  SymbolState:
    values: [found, missing, unchecked]
  BuildState:
    values: [planned, built, gap, unchecked, removed]
  Confirmation:
    values: [file_and_symbol, file_only]
  PlannedPin:
    note: Workflow id, version, task number and ElementPin of a task still to build.
  ElementTask:
    note: Workflow, version, task, revision, action, file, optional symbol and its done-time state.
  ElementState:
    note: State of the highest done revision, whether a newer revision is planned, done and planned pins, confirmation and reason.
  PromisedSymbol:
    id: String
    path: String
    name: String
    state: SymbolState
    why: Option<String>     # none when found
  Unpromised:
    path: String
    name: String
  UncheckedFile:
    path: String
    why: String
  Verdict:
    # Ordered by path, then symbol id (symbols) or name (unpromised).
    task: u32
    symbols: Vec<PromisedSymbol>
    unpromised: Vec<Unpromised>
    unchecked_files: Vec<UncheckedFile>
  VerdictOutcome:
    values: [passed, failed, not_run]
  Found:
    # One counted documentSymbol: its name, its type or the counted symbol it is
    # in, top level.
    name: String
    parent: Option<String>
    top: bool
  Rank:
    values: [exact, path, part, words]
  WhereAnswer:
    # The answer to one question, record first.
    topic: String
    entries: Vec<WhereEntry>          # ranked, at most 20
    entries_more: u32
    not_in_record: Vec<UnrecordedFile>
    not_in_record_more: u32
    asked: u32                        # language-server asks spent
    budget: Option<String>            # why the live half stopped early; omitted when none
  WhereEntry:
    # Tagged by `kind`: file or element.
    values: [File(FileEntry), Element(ElementEntry)]
  Owner:
    part_id: PartId
    part_title: String
    layer: Option<String>             # omitted when none
  FileEntry:
    rank: Rank
    path: String
    owner: Option<Owner>
    tasks: Vec<FileTask>              # version DESC, task DESC, workflow_id
    symbols: Vec<SymbolEntry>         # by name
    live: Live
    confirmed: Option<Confirmation>
  FileTask:
    workflow_id: WorkflowId
    version: i64
    task: u32
    action: String
    purpose: String
    commit: Option<String>
  SymbolEntry:
    symbol_id: String
    name: String
    kind: String
    workflow_id: WorkflowId
    version: i64
    task: u32
    behavior: Vec<String>             # from contract_json
    inputs: Vec<ContractValue>        # from contract_json, as the task wrote them; empty when none
    returns: Option<ContractValue>    # from contract_json; omitted for a class or when none
    at_done: SymbolState              # the stored state
    live: Live
    line: Option<u32>
    uses_live: UsesLive               # the reference lookup's outcome, apart from live
    uses: Vec<UseLine>                # minus its own location, by path then line, at most 10
    uses_more: u32                    # returned beyond the 10 listed
    uses_total: Option<u32>           # only with uses_live answered
  UsesLive:
    # Tagged by `state`.
    values: [not_asked, answered, "truncated { why }", "failed { why }", "skipped { why }"]
  RecordDigest:
    parts: Vec<DigestPart>    # map order, parts with files only
    unowned: Vec<DigestFile>  # by path
    gaps: Vec<DigestGap>
    marks: u32                # done marks recorded; versions the Planner's code record source
    # is_empty(): no file and no gap.
  DigestPart:
    part_id: PartId
    title: String
    files: Vec<DigestFile>
  DigestFile:
    path: String
    layer: Option<String>
    purpose: String
    symbols: Vec<DigestSymbol>
  DigestSymbol:
    name: String
    kind: SymbolKind
    inputs: Vec<ContractValue>
    returns: Option<ContractValue>
  DigestGap:
    element_id: String
    kind: ElementKind
    name: String
    part_id: PartId
    state: BuildState
    why: String
  UseLine:
    path: String
    line: u32
    owner: Option<Owner>
  Live:
    # Tagged by `state`.
    values: [not_asked, confirmed, "gap { why }", "unchecked { why }"]
  ElementEntry:
    rank: Rank
    element: DesignElement
    state: ElementState
  UnrecordedFile:
    path: String
    owner: Option<Owner>
    symbols: Vec<UnrecordedSymbol>
  UnrecordedSymbol:
    name: String
    line: u32
  FileAnswer:
    Absent: unit
    Symbols: "{ found: Vec<Found>, truncated: bool }"
    Unchecked: String

functions:
  service:
    new:
      signature: "(storage: Arc<Storage>, code: Codebase, design: Design) -> CodeRecord"
    verify:
      signature: "(&self, key: &str, project: &ProjectId, task: u32, contract: &TaskContract) -> Result<Verdict, CodeRecordError>"
      # Each distinct file of the contract's symbols and created files is asked
      # once (`ask`); `compare` makes the verdict, stored under `key` (an
      # attempt id, or `recheck:{attempt_id}`), replacing one
      # stored before. Only storage fails it.
    verdict:
      signature: "(&self, key: &str) -> Result<Option<Verdict>, CodeRecordError>"
    record_answer_for_tests:
      signature: "(&self, key: &str, answer: RecordedAnswer)"
      # test-support only: `key` is answered with `answer` from then on.
    outcome:
      signature: "Verdict::outcome(&self) -> VerdictOutcome"
      # Failed when a symbol is missing; else passed when one is found; else not_run.
    lines:
      signature: "Verdict::lines(&self) -> String"
      # One line each, missing first: "T3 promises refresh_token in
      # backend/auth/service.py; the code does not have it.", "<path> is
      # promised and does not exist." (once per file), then "unchecked: <path>
      # (<why>).", then "unpromised: <name> in <path>.".
  question:
    code_where:
      signature: "(&self, project: &ProjectId, topic: &str) -> Result<WhereAnswer, CodeRecordError>"
      # The record's half, with no language server:
      # 1. The topic trimmed; fewer than 1 or more than 200 characters is
      #    InvalidTopic("a topic needs 1 to 200 characters").
      # 2. Design's layout, then its elements; a DesignError is Design(error).
      # 3. The lookup reads (store/lookup.rs), completed per path by files_detail.
      # 4. Ranking::entries: at most 20 entries, then entries_more.
      # 5. Each file entry: its tasks newest first (version DESC, task DESC,
      #    workflow_id); each symbol's newest row, by name; its owner from
      #    layout.owners: the first Folder owner's part and the first Layer owner's id.
      # 6. Element entries: element_states(project, &matched, &[]).
      # 7. live and uses_live start not_asked, uses empty, uses_more 0, no uses_total.
      # The code's half (confirm), constants MAX_ASKS 30, LIVE_FOR 20 s (public as
      # CodeRecord::WHERE_MAX_ASKS and WHERE_LIVE_SECS, which the code_where tool
      # description reads),
      # USES_MAX 10, UNRECORDED_MAX 10; one deadline bounds every ask
      # (timeout_at); documentSymbol, findReferences and workspaceSymbol count
      # one each, missing_inputs and inventory none; no wait for a starting server:
      # 1. missing_inputs once: an absent file is gap "{path} is absent now", its
      #    symbols gap "its file is absent now", not asked; an error makes every
      #    file unchecked "the folder could not be read: {error}" and nothing follows.
      # 2. A topic without '/' that is no entry's path: one workspaceSymbol; files
      #    not recorded become not_in_record, by path then line, 10 then a count.
      # 3. A topic with '/': inventory(prefix topic, limit 200); unrecorded files,
      #    10 then a count; an error sets budget "the file list could not be read: {error}".
      # 4. Each file entry in rank order: no symbol is confirmed file_only, no ask;
      #    else documentSymbol: a match is confirmed with its line; no match is
      #    gap "{name} is not in {path} now", or unchecked "the server's answer
      #    was cut short" when truncated; the file confirmed file_and_symbol.
      #    NoServer is unchecked "no language server reads {extension}" (plus
      #    " (not installed)" when install is known); an error unchecked "{error}".
      #    Then one findReferences per confirmed symbol with a line, at its line
      #    and character: its own location dropped, by path then line, 10 listed
      #    with owners; answered with uses_total, truncated (no total), failed
      #    with why (the deadline: "the question's 20 s ran out during the
      #    lookup"), or skipped when the budget was spent before it.
      # 5. Once asks or time run out, what is not asked is unchecked "the
      #    question's budget ran out (30 asks, 20 s)", lookups skipped, and
      #    budget says the same once. 6. asked counts the asks made.
      # Element entries keep element_states' state.
    path_owner:
      signature: "(layout: &ProjectLayout, path: &str) -> Option<Owner>"
      private: true # pub(crate): digest reads the same owner
      # None when no part's folder holds the path.
  digest:
    digest:
      signature: "(&self, project: &ProjectId) -> Result<RecordDigest, CodeRecordError>"
      # The record only, no language server (planner context spec §4.2, "Code
      # record"; code record spec §5.3). One read snapshot (store `whole`): every
      # file and symbol row and `marks`, the count of distinct (workflow, version,
      # task) across code_record_file, code_record_symbol and code_record_element.
      # Each path once with its newest record's purpose (version DESC, task DESC,
      # workflow_id); each symbol's newest row by (path, name), its kind, inputs and
      # returns parsed from contract_json as SymbolWork; symbols by name.
      # Owner by path_owner (as code_where): parts of the layout in map order, only
      # those with files; inside a part by the layer's place in the part's layers
      # (no layer last), then path; files no part owns apart, by path. Gaps:
      # element_states(project, &elements, &[]) filtered to gap and unchecked, by
      # their part's map order, then element number, with why (as project_state).
      # Turns renders and budgets it; CodeRecord never renders it.
  ranking:
    entries:
      signature: "Ranking::entries(topic: &str, layout: &ProjectLayout, elements: &[DesignElement], matches: &Matches) -> (Vec<Ranked>, u32)"
      private: true
      # Pure. Tiers in order:
      #   exact: an element whose id or name equals the topic ignoring case; a
      #     file holding a recorded symbol from symbols_named;
      #   path: a file from files_by_path; an element with a done pin in one;
      #   part: the topic equals a part title ignoring case: files under its
      #     folder (files_under) and the part's elements;
      #   words: a file from rows_with_words; an element whose name, or whose
      #     purpose, holds every word.
      # An entry keeps its best tier, once. Within a tier: files by path, then
      # elements by id number. At most 20; the rest counted.
    words:
      signature: "Ranking::words(topic: &str) -> Vec<String>"
      private: true
      # Split on anything not a letter or digit, lowercased, 3 characters or more.
  lookup:
    files_by_path:
      signature: "(&self, project: &ProjectId, path: &str) -> Result<Vec<String>, CodeRecordError>"
      private: true
      # files_under with the one path.
    files_under:
      signature: "(&self, project: &ProjectId, folders: &[String]) -> Result<Vec<String>, CodeRecordError>"
      private: true
      # Per folder, distinct paths equal to it or LIKE folder || '/%' with %, _ and \
      # escaped, by path; LIMIT 21 paths.
    symbols_named:
      signature: "(&self, project: &ProjectId, name: &str) -> Result<Vec<String>, CodeRecordError>"
      private: true
      # Distinct paths of symbols named exactly, or ending in '.' || name, by path; LIMIT 21 paths.
    rows_with_words:
      signature: "(&self, project: &ProjectId, words: &[String]) -> Result<Vec<String>, CodeRecordError>"
      private: true
      # Distinct paths of a file purpose, and of a symbol contract_json (lowercased),
      # one row holding every word: the words bound as one JSON array, each tested
      # with instr through json_each; by path, LIMIT 21 paths each. The limit counts
      # paths, never rows, so a file many tasks recorded does not crowd out the rest
      # (code_where::a_file_recorded_by_many_tasks_leaves_room_for_the_others).
    files_detail:
      signature: "(&self, project: &ProjectId, paths: &[String]) -> Result<Detail, CodeRecordError>"
      private: true
      # Every file and symbol row of each path, version DESC, task DESC, workflow_id.
      # Every read orders by explicit keys; static SQL, one query per item.
    ask_now:
      signature: "(&self, project: &ProjectId, question: LspQuestion, key: &str, budget: &mut Budget) -> Asked"
      private: true
      # One counted ask with no wait, bounded by the deadline; a recorded answer under key first.
  comparison:
    recorded:
      signature: "(&self, key: &str) -> Option<RecordedAnswer>"
      private: true
      # test-support only: the answer recorded under key.
    file_answer:
      signature: "(result: &Value, truncated: bool) -> FileAnswer"
      private: true
      # A documentSymbol result as Symbols; shared by ask and code_where.
    ask:
      signature: "(&self, project: &ProjectId, path: &str) -> FileAnswer"
      private: true
      # `missing_inputs` first: an absent file is Absent (its symbols missing,
      # never unchecked). Then documentSymbol through `Codebase::lsp`. A NoServer
      # whose server is Some and state Idle, Starting or None is asked again
      # every 5 s for up to 2 minutes; any other NoServer, or an error, is
      # Unchecked at once, so a missing server never holds the project.
    document_symbols:
      signature: "(result: &Value) -> Vec<Found>"
      private: true
      # Kinds class (5), method (6), constructor (9), enum (10), interface (11),
      # function (12) and struct (23) only, at any depth; a DocumentSymbol tree
      # (`children`) or a flat SymbolInformation list (`containerName`). An
      # `impl` block (kind 19, rust-analyzer) is no symbol: its children's
      # parent is `owner`'s type, and they are not top-level. A gopls
      # `(*X).m` or `(X).m` is `m` with parent `X` (`receiver`), not top-level.
    owner:
      signature: "(container: &str) -> &str"
      private: true
      # `impl X`, `impl<T> X<T>`, `impl Trait for X`, `impl<T> Trait for p::X<T>`
      # give `X`: after `for` if present, else after `impl` and its `<...>`,
      # generic arguments stripped, last path segment. Any other name is itself.
    receiver:
      signature: "(name: &str) -> Option<(&str, &str)>"
      private: true
      # A gopls method name `(*X).m` or `(X).m` as (`m`, `X`); else None.
    matches:
      signature: "(name: &str, found: &Found) -> bool"
      private: true
      # Exact, as written, at any depth; `Class.method` is `method` whose parent is `Class`.
    compare:
      signature: "(task: u32, contract: &TaskContract, answers: &BTreeMap<String, FileAnswer>) -> Verdict"
      private: true
      # Found when matched; missing when not matched in a complete answer or
      # its file is absent; unchecked when the answer was truncated and the
      # name not in it, or the file was unchecked. Unpromised: a counted
      # top-level symbol of a created file that no contract symbol of that
      # file names (a `Class.method` names `Class`).
  store_rows:
    files:
      signature: "DoneRecord::files(&self) -> Result<Vec<RecordedFile>, StorageError>"
      private: true
      # Every contract file the task creates or modifies: path, action, purpose.
    symbols:
      signature: "DoneRecord::symbols(&self) -> Result<Vec<RecordedSymbol>, StorageError>"
      private: true
      # Every promised symbol with its kind, contract_json and state.
    unpromised:
      signature: "DoneRecord::unpromised(&self) -> &[Unpromised]"
      private: true
      # The verdict's unpromised symbols; none without a verdict.
  store:
    put:
      signature: "(&self, key: &str, project: &ProjectId, verdict: &Verdict) -> Result<(), CodeRecordError>"
      private: true
      # One write: upsert by key, verified_at Storage::now().
    delete_project_in:
      signature: "(conn: &mut Tx, project: &ProjectId) -> Result<(), StorageError>"
      # Every verdict and record row of the project, inside the caller's write.
    record_done_in:
      signature: "(tx: &mut Tx, done: &DoneRecord) -> Result<(), StorageError>"
      # Inside Runs' marking write: replaces the task's rows. Every file the
      # contract creates or modifies (read and delete are left out); every promised symbol with its state found, missing or unchecked
      # from the verdict by symbol id and path, unchecked when the verdict is
      # none or does not name it; unpromised rows from the verdict only.
      # code_where reads them back.
    forget_done_in:
      signature: "(tx: &mut Tx, project: &ProjectId, workflow: &WorkflowId, version: i64, task: u32) -> Result<(), StorageError>"
      # Inside Runs' marking write: deletes the task's rows and journals CodeRecordChanged.

element_states:
  signature: "(project: &ProjectId, elements: &[DesignElement], planned: &[PlannedPin]) -> Result<Vec<ElementState>, CodeRecordError>"
  rule: >
    For each requested element in input order, consider done pins at their highest revision.
    Deleting revisions give removed when built, or planned changes behind an older built revision.
    Missing files or promised symbols give gap, unknown folder or symbol checks give unchecked.
    There is one folder check for the non-delete pins. Reads do not write the record.
  tested_by: [element_states_read_the_record_and_the_folder]

shared_in_transaction:
  delete_project_in: "ProjectLifecycle's removal transaction: a removed project's verdicts and record go in the removal's own write"
  record_done_in: "Runs' put_mark write: records the task's contract, verdict and element pins; journals CodeRecordChanged"
  forget_done_in: "Runs' put_mark write: a not-done mark, or a done one with no contract, removes the task's record"

obligations:
  - rule: >
      Only class, method, constructor and function symbols count, for promised
      and unpromised alike, with struct, interface and enum counting as a
      class; a variable, parameter, field, constant, property or module never
      matches.
    tested_by: document_symbols_count_classes_methods_and_functions_only
  - rule: >
      A method's class is its type: rust-analyzer's `impl X` / `impl Trait for
      X` block (generics stripped) or gopls' `(*X).m` / `(X).m` gives `X`.
      Neither an impl block nor a `tests` module is ever unpromised.
    tested_by: [a_rust_impl_block_gives_its_methods_their_type,
      an_impl_name_gives_its_type, a_gopls_receiver_name_gives_its_type,
      live_a_rust_struct_and_its_impl_methods_are_found]
  - rule: >
      A truncated answer never makes a symbol missing: a name not in it is unchecked.
    tested_by: a_truncated_answer_never_makes_a_symbol_missing
  - rule: >
      A dotted name `Class.method` matches only a method of that name inside that class.
    tested_by: a_dotted_name_matches_a_method_in_its_class
  - rule: >
      Against a real language server, a promised function is found, a forgotten
      one missing, an absent promised file makes its symbols missing, an
      unpromised top-level function of a created file is listed without failing,
      and a file no server reads is unchecked (not_run).
    tested_by: [live_a_promised_function_is_found_and_a_forgotten_one_missing,
      live_an_absent_promised_file_makes_its_symbols_missing,
      live_an_unpromised_function_in_a_created_file_is_listed,
      live_a_file_no_server_reads_is_unchecked]
    note: >
      Ignored in CI (needs pyright-langserver, and rust-analyzer for
      live_a_rust_struct_and_its_impl_methods_are_found, on PATH); run with
      --include-ignored.

  - rule: >
      A done record replaces the task's rows: files, promised symbols with their
      verdict's state (unchecked without a verdict) and unpromised symbols; a
      contract with no files or symbols records nothing; forgetting the task or
      removing its project removes them.
    tested_by: [done_writes_the_record_and_not_done_removes_it,
      a_second_done_replaces_the_rows,
      a_task_without_a_contract_records_nothing,
      removing_the_project_removes_its_record]

  - rule: >
      code_where ranks by fixed tiers (exact, path, part, words), each entry
      once at its best tier, files by path then elements by number, at most 20
      then a count; a word is 3 characters or more of letters and digits.
    tested_by: [an_exact_name_ranks_before_a_path_and_a_path_before_words,
      an_entry_appears_once_at_its_best_tier, ties_go_by_path_then_element_number,
      short_words_and_punctuation_are_not_words, twenty_entries_then_a_count]
  - rule: >
      code_where's record half finds a file by a symbol name with its tasks
      newest first, by a path or folder prefix with LIKE wildcards escaped, by a
      part title, and an element by id or name with its state; the owner is the
      folder part and the first layer; a blank or long topic is refused, and
      nothing matching answers no entries.
    tested_by: [a_symbol_name_finds_its_file_with_its_tasks_newest_first,
      a_path_prefix_finds_the_files_under_it_and_escapes_like_wildcards,
      a_part_title_finds_the_files_in_its_folder,
      an_element_id_or_name_finds_the_element_with_its_state,
      the_owner_is_the_folder_part_and_the_first_layer,
      a_blank_or_long_topic_is_refused, nothing_matching_answers_no_entries]
  - rule: >
      A symbol entry carries its recorded contract's inputs and return unchanged,
      beside its behavior; a class or a contract with no return has no returns.
    tested_by: [a_symbol_entry_carries_its_contract_inputs_and_returns]

  - rule: >
      code_where's code half confirms a symbol with its line and its uses by
      part, makes a symbol gone from its file or an absent file a gap without an
      ask, confirms a file with no symbol file_only without an ask, leaves the
      record's answer whole when no server reads the file, stops at 30 asks and
      says so, and keeps who-uses as its own outcome: answered with an exact
      total, truncated without one, failed with why, skipped when the budget
      was spent. Files no contract names come from workspaceSymbol or the file list.
    tested_by: [a_found_symbol_has_its_line_and_its_uses_grouped_by_part,
      a_symbol_gone_from_its_file_is_a_live_gap, an_absent_file_is_a_gap_and_is_not_asked,
      a_file_without_symbols_is_confirmed_file_only_without_an_ask,
      no_server_makes_the_file_unchecked_and_the_record_still_answers,
      the_budget_stops_at_thirty_asks_and_says_so, uses_beyond_ten_are_counted,
      an_empty_reference_answer_is_answered_with_no_uses,
      a_failed_reference_lookup_keeps_the_symbol_confirmed_and_says_why,
      a_truncated_reference_answer_keeps_its_uses_and_has_no_total,
      a_budget_spent_after_the_line_skips_the_lookup_and_says_so,
