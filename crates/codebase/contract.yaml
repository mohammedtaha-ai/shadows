# Project identities and registration methods are imported from core-projects.
# Durable journal publication converts owned ids directly to core-db JournalEntry.
# Database infrastructure: core-db; domain rules and private stores remain here.
# selected_project_in promotes reach refusals as CodebaseError::GrantScope;
# Codebase does not depend on Grants.
# Owns a project's code on disk (spec §15.4–§15.6; language servers design):
# walking a project's folder into `code_file` and `code_inventory`, keeping
# that copy true while the project is in use, running the language servers its
# files want and answering `code_lsp` from them, within the scope of projects
# the asker may read. A file's language is its extension's, by `language_for`.
#
# The index is a copy derived from the files. It carries no CommandId and no
# journal event, and can be deleted and rebuilt. Paths are stored relative
# to the project's folder with '/'; the key is lowercased on Windows
# (`path_key`), so `Foo.rs` and `foo.rs` are one row.
#
# Two functions hold the indexing rules and every path that indexes goes
# through them: `keeps` (the walk's filter) and `index_file` (one file read,
# checked and written). The scan and the watcher's batches (`files`) call
# the same two.
#
# Each active project has one worker (`watch.rs`), a tokio task that does its
# scans and its watcher's batches one after another, so two writes of one
# file never race. The watcher is the fast path only: notify 8.2.0 can lose
# changes on Windows without a word (PROBE.md), so a periodic scan runs
# beside it.
#
# Trap: the uses live in memory only; after a restart a project waits for its
# next use.
# Trap: before `start` nothing is active — every project answers `Inactive`,
# and `touch` only records the use. Tests that build with `assemble` start
# `Codebase` only when they ask.
# Trap: a removed project (§4.2) is none to every read here (`code_scope`,
# Projects::require_live_in); its rows and links go in Projects' removal
# write, through the two `_in` functions, and `forget` then stops its worker.
#
# Unlike the index, the links are the person's choices:
# commands with a CommandId (kinds ProjectLinkPut, ProjectLinkRemove), each
# one write with its journal event (ProjectLinked, ProjectUnlinked), as
# `save_planner_instructions` is.
# Trap: a link's replay answers the link as it stands; once that link is
# removed, the link as the command left it, dated by its command record.

name: code
external_connections: Code questions for an external connection use only the selected project's root. Project links do not widen returned locations.
version: 5
status: current
source: crates/codebase/src


shapes:
  LspQuestion:
    # Serialize, Deserialize and JsonSchema (workspace schemars), so a typed MCP input such as
    # Runs' TaskQuestion carries the native question unchanged; LspOperation derives JsonSchema
    # too, camelCase. Omitted optional fields deserialize as null.
    fields: "{ operation: LspOperation, file, line, character, query, project }"
  Codebase:
    # Cheap to clone: an `Arc` over its private store, Projects and the active set.
    # ProjectLifecycle, Turns, Runs and every worker hold a clone.
    inner: Arc<Inner>
  Inner:
    store: CodeStore
    projects: Projects
    # Held across reads only: `code_scope` in `activate`; never across a
    # write, and no worker takes it.
    active: tokio::sync::Mutex<Active>
    # Each project's last use and its holds; a std mutex, so a hold's drop
    # records its end without awaiting.
    uses: std::sync::Mutex<Uses>
    # IDLE (10 min) unless a test shortens it.
    idle: std::sync::Mutex<Duration>
  CodeStore:
    # Private to code/. Domain methods do not extend Storage.
    storage: Arc<Storage>
  CodebaseConfig:
    rescan_every: Duration   # default 60 s
    debounce: Duration       # default 500 ms
  Asker:
    # HTTP asks as a person, refusals INVALID_COMMAND; MCP under a grant,
    # refusals GRANT_SCOPE. Either names the project the scope starts from.
    Person: "&ProjectId"
    # The authenticated grant's project id, supplied by the adapter.
    Grant: "&ProjectId"
  IndexState:
    # serde internally tagged: { "state": "indexing", "done", "found" }.
    Ready: unit
    Indexing: "{ done: u32, found: u32 }"
    Inactive: unit
    NoDirectory: unit
    DirectoryMissing: unit
  ProjectStatus:
    project: String      # the slug
    state: IndexState
    # Files indexed; a skipped file is counted in `skipped` only.
    files: u32
    skipped: Vec<Skipped>
    # When the worker's last scan ended (RFC 3339), in memory only: None
    # for a project with no worker, or before its first scan ends.
    updated_at: Option<String>
  Skipped:
    reason: String       # too_large | binary | not_utf8
    count: u32
  ProjectLink:
    project: String      # the slug of the project that reads
    linked: String       # the slug of the project it reads
    created_at: String
  FileRow:
    # What `code_file` holds for one file.
    path_key: String
    path: String
    size: i64
    modified_ms: i64
    language: "&'static str"
    skipped: "Option<&'static str>"
  Walked:
    paths: Vec<String>
    # An entry could not be read: the scan then deletes nothing.
    incomplete: bool
  Only:
    # A walk limited to these file keys and the folder keys above them.
    files: HashSet<String>
    folders: HashSet<String>
  Progress:
    # A running scan's counts, and the worker's stop: checked between files.
    found: AtomicU32
    done: AtomicU32
    stop: AtomicBool
  Active:
    # Uses before `start`, oldest first.
    early: Vec<ProjectId>
    running: Option<Running>
    closed: bool
  Running:
    config: CodebaseConfig
    # One per active project.
    workers: HashMap<ProjectId, Worker>
    # The tasks of stopped workers, by project, until they finish: a project
    # active again hands its own to its new worker, which waits for it (one
    # writer per project); `close` hands the rest to `shut_down`.
    leaving: HashMap<ProjectId, JoinHandle<()>>
  Usage:
    last: Instant
    holds: usize
  ActiveHold:
    # Keeps its project active while it lives; its drop is a use. It keeps the
    # project-relative paths the watcher saw change while it lived (`changed`).
    code: Codebase
    project: ProjectId
    seen: Arc<Mutex<BTreeSet<String>>>
  Job:
    Scan: unit
    Files: Vec<String>
    Refresh: "oneshot::Sender<()>"   # a scan, then the reply
  Seen:
    # What the watcher's thread passes on.
    Path: String
    Rescan: unit
  Worker:
    jobs: mpsc::Sender<Job>        # bounded, 64
    shared: Arc<Shared>
    task: JoinHandle<()>
  Shared:
    progress: Progress
    scanning: AtomicBool
    scanned: AtomicBool
    missing: AtomicBool
    paused: AtomicBool   # test only: every path the watcher reports is dropped
    servers: Mutex<HashMap<String, ServerState>>  # each wanted server's state
    updated_at: Mutex<Option<String>>
    stopping: Notify
  Run:
    # The worker's own state, owned by its task.
    code: Codebase
    project: ProjectId
    dir: PathBuf
    shared: Arc<Shared>
    watcher: Option<RecommendedWatcher>
    seen: mpsc::Sender<Seen>       # bounded, 8192; kept so it outlives a watcher
    lost: Arc<AtomicBool>
    pending: HashSet<String>
    servers: HashMap<String, (Wanted, Arc<Server>)>
    extra: HashSet<String>         # extensions the watcher saw since the last listing
    files: HashMap<String, (i64, i64)>  # every file the last scan listed, its stamp
    known: HashSet<String>         # the files the servers know are on disk (`tell_servers`)
    started: mpsc::UnboundedSender<Started>
  Scanned:
    # What `scan_project` answers.
    indexed: u32                   # index rows written or deleted
    files: Option<FileStamps>      # None when nothing was listed
  FileStamps:
    # The listing's files by path (as written) with (size, modified ms), and
    # whether the listing read every entry.
    files: HashMap<String, (i64, i64)>
    complete: bool
  InventoryQuery:
    # Built by an adapter; never deserialized. Default: "", None, 100.
    prefix: String         # a folder relative to the project's folder; "" for all
    after: Option<String>  # the `next` of the page before
    limit: u16             # 1..=200
  InventoryKind:
    # serde snake_case.
    Directory: unit
    File: unit
    Excluded: unit
  InventoryState:
    Missing: unit      # no stored directory, or the folder is not there
    Indexing: unit     # no listing stored yet
    Ready: unit
    Incomplete: unit   # the last listing could not read an entry
  InventoryEntry:
    path: String                     # relative, '/', a folder without a trailing '/'
    kind: InventoryKind
    language: Option<String>         # language_for's name; null for any other file
    excluded_reason: Option<String>  # dependencies | ignored | secret | link; null unless excluded
  InventoryPage:
    state: InventoryState
    generation: u64                  # 0 before the first listing
    entries: Vec<InventoryEntry>     # by path_key
    next: Option<String>             # "<generation>:<path_key>"; null on the last page
    observed_at: Option<String>      # when the last listing ended (RFC 3339)
  Listed:
    rows: Vec<InventoryRow>
    incomplete: bool
  InventoryRow:
    # What `code_inventory` holds for one path.
    path_key: String
    path: String
    kind: "&'static str"
    excluded_reason: "Option<&'static str>"


modules:
  lib.rs: code indexing boundary
  error.rs: index refusals
  testing.rs: gated index inspection
  model.rs: public index values
  active.rs: active project selection
  scan.rs: filesystem indexing
  scope.rs: question scope validation
  links.rs: reading a project's links
  watch.rs: project indexing worker
  store/: private index SQL
  inventory.rs: the paged file inventory of a project's folder
  inputs.rs: the real-path check of a project path
  store/inventory.rs: file inventory persistence
  lsp/mod.rs: the language servers a project's files want
  lsp/catalog.rs: the language-server catalog
  lsp/ask.rs: answering a code_lsp question
  store/servers.rs: the person's server settings persistence

dependencies:
  projects: crates/core-projects/contract.yaml
  # A library, not a service: one language server's process and its requests.
  shadows-lsp: crates/shadows-lsp

functions:
  servers:
    servers:
      signature: "(&self, asker: Asker<'_>) -> Result<Vec<ServerStatus>, CodebaseError>"
      # Every catalog then added server, with `wanted` (the project's listed files
      # need it). State, in order: Off (switched off), NotInstalled
      # (`find_command` finds nothing on PATH), the worker's Starting / Running /
      # Failed for a wanted server of an active project, else Idle. It does not touch.
    wanted:
      signature: "(&self, extensions: &HashSet<String>, off: &HashSet<String>, added: &[Added]) -> Vec<Wanted>"
      private: true
      # The one rule "the files choose": a catalog or added server one of whose
      # extensions is in `extensions` and whose id is not in `off`. `.C` and `.H`
      # compare as written, any other extension lower-cased.
    wanted_servers:
      signature: "(&self, project: &ProjectId, extra: &HashSet<String>) -> Result<Vec<Wanted>, CodebaseError>"
      # `wanted` over the listing's extensions plus `extra` (the watcher's new ones).
    every_server:
      signature: "(added: &[Added]) -> Vec<Wanted>"
      private: true
    catalog:
      signature: "() -> &'static [CatalogEntry]"
      # `catalog.json`, parsed once: the twelve upstream definitions
      # (LICENSE-claude-plugins-official) with Shadows' install lines. typescript
      # departs: it runs TypeScript 7's `tsc --lsp --stdio`, since TypeScript 7 ships
      # no tsserver.js (spec 2026-11-13-language-servers-design, Install lines).
    extension:
      signature: "(path: &str) -> Option<&str>"
    find_command:
      signature: "(command: &str, path: &OsStr) -> Option<PathBuf>"
      # A command naming a path is checked as is; a bare name is looked up on
      # `path`, on Windows with each PATHEXT ending (an npm `.cmd` shim).
    running_server:
      signature: "(&self, project: &ProjectId, id: &str) -> Option<(Wanted, Arc<Server>)>"
      # Through the worker's `Job::Lsp`, so the changes it gathered reach the
      # servers before the question.
    catalog_for_test: "test-support: the catalog's ids and extensions"
    set_server_off:
      signature: "(&self, command_id: String, id: &str, off: bool) -> Result<(), CodebaseError>"
      # "CodeServerSwitch" { server, off }, scope Code "servers": a known catalog or
      # added id, else INVALID_COMMAND; event CodeServerSwitched. Every worker
      # follows at its next recompute.
    add_server:
      signature: "(&self, command_id: String, server: AddedServer) -> Result<ServerStatus, CodebaseError>"
      # "CodeServerAdd": an id, a command, extensions each starting with a dot; a
      # catalog id or one already added is INVALID_COMMAND; event CodeServerAdded.
    remove_server:
      signature: "(&self, command_id: String, id: &str) -> Result<(), CodebaseError>"
      # "CodeServerRemove": added servers only, else INVALID_COMMAND; its off row
      # goes too; event CodeServerRemoved.
    change_servers:
      signature: "(&self, ctx: &CommandContext, change: ServerChange) -> Result<Result<(), String>, StorageError>"
      # Store: one write, classify (a replay answers at once), the change, its
      # event, the command record; Err(String) is a refusal with nothing written.
    lsp:
      signature: "(&self, asker: Asker<'_>, question: LspQuestion) -> Result<LspAnswer, CodebaseError>"
      # The scope (its refusals first), `touch` of the asker's project; the
      # project asked is `question.project` or the asker's. workspaceSymbol needs
      # `query` and asks every running server, merged. Every other operation
      # needs `file`: `inside`, then `checked_path` (its real path must be that
      # path inside the folder's real path, as `names_itself` checks for the
      # index), and all but documentSymbol a one-based line and character. The
      # server reading the file's extension, waited for up to 20 s while it
      # starts; none running is NoServer with its state and, when not installed,
      # its install line. The file's current text goes with the request
      # (`Server::ask`, 20 s). incomingCalls and outgoingCalls open the document
      # once (`Server::open`) under one 20 s deadline from the question's start,
      # over the lock wait, prepareCallHierarchy and every follow-up; at most
      # `MAX_ROOTS` (100) prepared roots are followed up, a root left out sets
      # `truncated`, and the deadline reached midway is the timeout error, never a
      # partial answer. A call whose other end lies outside the scope is dropped. A server failure (no answer in time, exit, an error) is
      # `LanguageServer` (LANGUAGE_SERVER_UNAVAILABLE), its text from `unavailable`.
      # Locations become `{ project, path, line, character }`,
      # one-based; one outside the scope is dropped; 100 items, 32 KiB.
    unavailable:
      signature: "(id: &str, error: LspError) -> CodebaseError"
      private: true
      # "the language server <id> " and how it stands: "is running but did not
      # answer in time (20 s)", "failed: it exited, its error line: …" (or "with
      # no error line"), "failed: it refused to initialize: …", "is not installed
      # or could not start: …", "is running and refused this request (<code>): …".
    checked_path:
      signature: "(dir: &Path, relative: &str, allow_missing: bool) -> Result<PathBuf, CodebaseError>"
      private: true
      # In inputs.rs. `inside`, not the folder itself; then the nearest existing
      # ancestor of the path (the path itself when it exists) by its real path,
      # which must be that path inside the folder's real path: a link or junction
      # out is refused even for an absent file. An existing path must be a regular
      # file, an existing ancestor a folder. Absent without allow_missing is
      # refused; an IO failure other than absence is an error. The one
      # containment check of lsp's file, project_file and missing_inputs.
    missing_inputs:
      signature: "(&self, asker: Asker<'_>, paths: &[String]) -> Result<Vec<String>, CodebaseError>"
      # In inputs.rs. In the asker's own project: every path through `inside`
      # and the inventory's secret-name rule on each component (a secret is
      # refused, never read) before any disk read; then checked_path with
      # allow_missing. Answers the absent ones, sorted, each once. An escaping
      # path, a secret, a folder or an unreadable path is an error, never absent.
    located:
      signature: "(value: Value, roots: &[Root], file: &str) -> Value"
      private: true
    drive_decoded:
      signature: "(uri: &str) -> String"
      private: true
      # A location's `file:///f%3A/...` (typescript-go) becomes `file:///f:/...`
      # before `place` makes it a path; `comparable` then matches its case.
    bounded:
      signature: "(value: Value) -> (Value, bool)"
      private: true
  construction:
    new: "(storage: Arc<Storage>, projects: Projects) -> Code"
    scan_for_test: "test-support: synchronous fixture scan"
    pause_watcher_for_test: "test-support: drop every path the watcher reports"
    active_for_test: "test-support: active project order"
    shut_down_for_test: "test-support: await index workers"
  lifecycle:
    start:
      signature: "(&self, config: CodebaseConfig) -> Result<(), CodebaseError>"
      # `begin` under the lock, then `activate` for each use recorded before
      # it, oldest first, then `spawn_sweep`. Awaits no scan. A second call
      # does nothing; so does one after `shut_down`.
    touch:
      signature: "(&self, project: &ProjectId)"
      # A use: `Uses::used` (the idle time starts again), then `activate`.
      # Never fails, never waits on a scan, never activates a link.
    activate:
      signature: "(&self, project: &ProjectId)"
      private: true
      # Before `start`: `record` only. After: a worker for the project if it
      # has a folder (`folder`) and none runs. After `shut_down`: nothing.
    hold:
      signature: "(&self, project: &ProjectId) -> ActiveHold"
      # `Uses::hold` and `activate`: the project stays active while the
      # answer lives, whatever the idle time; its drop is a use. Uses keeps the
      # hold's seen set weakly, by project. The hold keeps the keys of the
      # files the stored listing held when it began (`file_paths`; a failed
      # read keeps none), so a deletion is told from a file made and removed.
    hold_claiming:
      signature: "(&self, project: &ProjectId, claim: impl Fn(&str) -> bool + Send + Sync + 'static) -> ActiveHold"
      # `hold` whose claim (a project-relative path with '/') takes the paths
      # it admits: while it lives, a path it claims goes to the holds that
      # claim it only, never to the project's other holds. Runs builds the
      # claim from the attempt's `writes`; codebase holds no pattern rule.
    changed:
      signature: "async ActiveHold::changed(&self) -> Vec<String>"
      # The project's files among the paths the watcher reported to this hold
      # (`forward` tells `saw` every path it keeps, before the pause flag),
      # sorted: those `listed_now` holds as files, and those gone now whose key
      # the hold kept when it began. So a folder, an ignored, secret or linked
      # path, `.git/`, target/ and node_modules/, and a file made and removed
      # meanwhile are left out; so is no existing folder modified in place
      # (`forward` skips it). A path another living hold claimed never reached
      # it. A change before the watcher started, or one it lost, is not among
      # them. No folder: empty. Turns reads it when a Planner turn settles.
    saw:
      signature: "(&self, project: &ProjectId, path: &str)"
      private: true
      # On notify's thread, a claim's match and nothing on disk: the living
      # holds that claim the path keep it; when none does, every living hold.
    project_file:
      signature: "(&self, project: &ProjectId, path: &str) -> Result<String, CodebaseError>"
      # The path relative to the project's folder, checked as `lsp`'s file is:
      # `inside` (no absolute, drive or ..), not the folder itself, and, when it
      # is on disk, its real path inside the folder's real path; a path not on
      # disk passes when its nearest existing folder is inside the project
      # (`checked_path` with allow_missing). InvalidCommand otherwise.
      # Turns checks project_change_note's paths with it.
    sweep:
      signature: "(&self)"
      private: true
      # Stops the worker (`code.inactive`) of every active project unused for
      # the idle time with no hold. Its rows stay.
    spawn_sweep:
      signature: "(&self)"
      private: true
      # A task holding the service weakly: `sweep` every 30 s, or every idle
      # time when shorter; it ends with the service or `shut_down`.
    idle_time:
      signature: "(&self) -> Duration"
      private: true
    idle_for_test: "test-support: a shorter idle time"
    forget:
      signature: "(&self, project: &ProjectId)"
      # Projects' `remove`, after its write: its use dropped, `Active::forget`
      # (its worker stopped after the file it is on, the task kept in
      # `leaving`). Never fails.
    shut_down:
      signature: "(&self)"
      # `close` under the lock, then every worker's task awaited outside it.
      # pub(crate): `AppCore::shut_down` calls it before §8.5; tests reach it
      # as `shut_down_for_test` (`testing`).
    pause_watcher:
      signature: "(&self, project: &ProjectId)"
      # test-support only; tests reach it as `pause_watcher_for_test`.
    active_projects:
      signature: "(&self) -> Vec<ProjectId>"
      # test-support only; tests reach it as `active_for_test`.
    folder:
      signature: "(&self, project: &ProjectId) -> Option<PathBuf>"
      private: true
      # Its `code_scope` row's folder; NotFound quiet, any other failure
      # logged `code.touch_failed`.
  questions:
    status:
      signature: "(&self, project: &ProjectId) -> Result<ProjectStatus, CodebaseError>"
      # `status_of`; it does not touch. NotFound for an unknown project.
    status_of:
      signature: "(&self, project: &ScopeRow) -> Result<ProjectStatus, CodebaseError>"
      private: true
      # NoDirectory with no folder; else the worker's `state` and
      # `updated_at`; Inactive and None without a worker.
  inventory:
    inventory:
      signature: "(&self, asker: Asker<'_>, query: InventoryQuery) -> Result<InventoryPage, CodebaseError>"
      # The asker's own project only, never a linked one. In order: a limit
      # outside 1..=200 is INVALID_COMMAND "limit must be 1 to 200"; the
      # prefix through `inside` and `path_key`; Projects::get (an unknown
      # project is its ProjectsError); `touch`; no directory, or no folder:
      # Missing, 0, []; a cursor not "<generation>:<key>" with its key at or
      # under the prefix is INVALID_COMMAND "the cursor is not one this
      # listing gave"; then one read of the scan row and limit + 1 rows after
      # the cursor's key: no scan row is Indexing, 0, []; a cursor of another
      # generation than the stored one is InventoryStale. `next` when the
      # extra row exists; Incomplete when the scan row says so, else Ready.
    files_present:
      signature: "(&self, project: &ProjectId, paths: &[String]) -> Result<Option<HashSet<String>>, CodebaseError>"
      # Which of `paths` the stored list holds with kind file, one keyed
      # read per path, never the whole list; no touch. None when the project
      # has no directory or folder, or no scan row (first listing unfinished).
      # An excluded path (ignored, secret, link) or a path outside the
      # project is not present. Plans' edit asks it. While a later listing is
      # written its rows change in batches, so a path may be answered from
      # either listing; the scan row says `incomplete` until it ends.
    refresh_inventory:
      signature: "(&self, asker: Asker<'_>) -> Result<InventoryPage, CodebaseError>"
      # Projects::get, `touch`, then a `Job::Refresh` to the project's
      # worker awaited at most 30 s (`code.refresh_timeout`, the page as it
      # stands), or with no worker `scan` on the caller's task; then
      # `inventory` with the default query. No CommandId: the inventory is
      # derived from the files, as the index is.
    cursor:
      signature: "(after: &str, prefix: &str) -> Result<(i64, String), CodebaseError>"
      private: true
    record_inventory:
      signature: "(&self, project: &ProjectId, dir: &Path) -> Option<FileStamps>"
      private: true
      # Under the project's `listing_lock`, so its listings run one at a
      # time and an older one never writes over a newer one. `listed` on a
      # blocking thread; nothing when the folder vanished; then
      # `write_inventory` stamped Storage::now(). The held extensions are
      # dropped before the write and set from the listed files after it. A
      # failure is `code.inventory_failed`, never the scan's. Answers the
      # listed files' stamps (None when the listing failed or the folder vanished).
    extensions:
      signature: "(&self, project: &ProjectId) -> Result<HashSet<String>, CodebaseError>"
      private: true
      # The last listing's file extensions (`extension`), held in memory from
      # `record_inventory`; when none are held (after a restart, or while a
      # listing is written) read once through `file_paths` and kept, unless a
      # listing set them meanwhile. `servers` and `wanted_servers` ask it, so
      # a turn never reads the whole list.
    listing_lock:
      signature: "(&self, project: &ProjectId) -> Arc<tokio::sync::Mutex<()>>"
      private: true
      # One lock per project, made on first use.
    follow:
      signature: "(self: FileStamps, known: &mut HashMap<String, (i64, i64)>) -> Vec<String>"
      # The paths added or changed (stamp differs) since `known`, and, when the
      # listing is complete, those removed; `known` becomes the listing (an
      # incomplete one only adds to it).
    listed:
      signature: "(dir: &Path) -> Listed"
      private: true
      # Blocking. `seen` is `walked(dir, None)`. From `dir`, each listed
      # folder's children by read_dir (an error sets incomplete), each
      # decided by `entry_kind`; an excluded one is never entered, a
      # directory is; a file's stamp is read by `symlink_metadata` on the
      # file (Windows' directory entry can lag a write); a name not UTF-8 is
      # not listed.
    walked:
      signature: "(dir: &Path, only: Option<Arc<Only>>) -> (HashSet<String>, bool)"
      private: true
      # Blocking. Every key `walker(dir, false)` yields, its filter refusing
      # a folder named .git or one `never_walked` names and, with `only`, any
      # entry outside it; and whether a walk error made it incomplete.
    entry_kind:
      signature: "(name: &str, kind: FileType, walked: bool) -> Option<(&str, Option<&str>)>"
      private: true
      # The listing's one rule, the first that decides: .git is not listed;
      # a never-walked folder is excluded dependencies; a secret name
      # (`secret_name`) excluded secret; a link or junction excluded link; a
      # key the walk did not yield excluded ignored. Else a folder is a
      # directory, a regular file a file; anything else is not listed.
    listed_now:
      signature: "(dir: &Path, paths: &[String]) -> HashSet<String>"
      # Blocking. Of `paths`, the keys a listing made now would hold as
      # files: `walked` limited to them (`Only::over`), then `entry_kind` of
      # each component by `symlink_metadata`, every folder on the way a
      # directory and the path a file. `ActiveHold::changed` asks it.
    secret_name:
      signature: "(name: &str) -> bool"
      private: true
      # Lower case: .env, .env.* not ending .example, *.pem, *.key, *.p12,
      # *.pfx, id_rsa, id_ed25519.
  links:
    links:
      signature: "(&self, project: &ProjectId) -> Result<Vec<ProjectLink>, CodebaseError>"
      # By the linked slug; empty for an unknown project.
    put_link_in:
      signature: "(conn, project, linked, ts) -> Result<bool, StorageError>; inserts a link row in the caller transaction"
    remove_link_in:
      signature: "(conn, project, linked) -> Result<bool, StorageError>; removes a link row in the caller transaction"
  scope:
    projects:
      signature: "(&self, asker: &Asker<'_>, only: Option<&str>) -> Result<Vec<ScopeRow>, CodebaseError>"
      # The asker's project, then its direct links by slug. An `only` not in
      # it: GRANT_SCOPE for a grant, INVALID_COMMAND for a person, "the
      # project <slug> is not linked to this project".
    home:
      signature: "(&self) -> &ProjectId"
      # Asker method: the project a question starts from, and touches.
    inside:
      signature: "(path: &str) -> Result<String, CodebaseError>"
      # '\' becomes '/', "./" and a trailing '/' are dropped; absolute, a
      # ':' or a ".." component is INVALID_COMMAND "the path must be inside
      # the project".
  indexing:
    # Shared indexing helpers are associated Codebase methods; walk/names_itself are private.
    scan:
      signature: "(&self, project: &ProjectId) -> Result<(), CodebaseError>"
      # pub(crate): tests reach it as `scan_for_test` (`testing`), and
      # `refresh_inventory` calls it with no worker. A worker calls
      # `scan_project` with its own `Progress`.
    scan_project:
      signature: "(&self, project: &ProjectId, progress: &Progress) -> Result<Scanned, CodebaseError>"
      # No folder, or a missing one: nothing changes. Walks on a blocking
      # thread, reads `code_file_stamps` and the folder's canonical path
      # once for the walk (either unread: each file reads its own), sets
      # `found`, `index_file`'s steps per kept path (a failure is
      # `code.index_failed` and the walk goes on), `done` after each, and
      # returns early once `stop` is set; then `record_inventory`; then deletes the rows of every key
      # the walk did not see, unless the walk was incomplete or the folder
      # vanished during the scan. Logs `code.scan` { project, seen,
      # indexed, elapsed_ms }. Answers `Scanned`: the files written or deleted,
      # and `record_inventory`'s file stamps (none when stopped early).
    index_file:
      signature: "(&self, project: &ProjectId, dir: &Path, path: &str) -> anyhow::Result<bool>"
      # Gone, or not a regular file (`symlink_metadata`: a link is never
      # followed): its rows are deleted, only while `dir` exists. Unchanged
      # path, size and modified time: nothing. Then, before any read, the
      # canonical file must be `path` inside the canonical `dir`
      # (`names_itself`), else `code.outside_folder` and nothing. Over
      # 1 048 576 bytes: too_large, unread; at most one byte past it is
      # read, so a file grown past it since its stat is too_large. A NUL in
      # the first 8 KiB: binary. Not UTF-8: not_utf8. Else no reason.
      # Then one `write_code_file`. True when it wrote or deleted.
    language_for:
      signature: "(path: &Path) -> Option<&'static str>"
      # The `LANGUAGES` row whose extensions hold the path's, lower-cased:
      # rust (rs), typescript (ts, mts, cts), tsx (tsx), javascript (js, mjs,
      # cjs, jsx). The scan and the inventory both answer it.
    keeps:
      signature: "(path: &Path) -> bool"
      # Relative path: no component `target`, `node_modules` or starting
      # with '.', and a language `language_for` knows.
    kept_now:
      signature: "(dir: &Path, paths: &[String]) -> HashSet<String>"
      # Blocking. `walk` limited (`Only::over`) to those files and the folders
      # above them: the keys the walk keeps now, the ignore files on the way
      # included.
    over:
      signature: "Only::over(paths: &[String]) -> Arc<Only>"
      # Those paths' keys and every folder above them (the root included):
      # the one limit `walk` and the listing's `walked` share (`Only::holds`).
    names_itself:
      signature: "(real: &Path, canonical_dir: &Path, path: &str) -> bool"
      private: true
      # A link or junction on the way, or a name Windows normalises
      # (`a.rs.`), makes the canonical path another file: refused.
    relative:
      signature: "(dir: &Path, path: &Path) -> Option<String>"
    stamp:
      signature: "(meta: &std::fs::Metadata) -> (i64, i64)"
      # Size and modified milliseconds, as `code_file` stores them.
    path_key:
      signature: "(path: &str) -> String"
    walker:
      signature: "(dir: &Path, hidden: bool) -> ignore::WalkBuilder"
      private: true
      # The settings both walks share: parents(false), git_global(false),
      # require_git(false), follow_links(false), hidden(hidden).
    walk:
      signature: "(dir: &Path, only: Option<Arc<Only>>) -> Walked"
      private: true
      # `walker(dir, true)`: hidden entries skipped, and a
      # filter_entry refusing folders named target or node_modules and,
      # with `only`, any entry outside it.
    folder_exists:
      signature: "(dir: &Path) -> bool"
      # Rows are deleted only while the project's folder is there (§15.4).
    never_walked:
      signature: "(name: &str) -> bool"
  active:
    running:
      signature: "(&self) -> bool"
    record:
      signature: "(&mut self, project: &ProjectId)"
      # Once per project, at its last use: a core never started does not grow it.
    begin:
      signature: "(&mut self, config: CodebaseConfig) -> Vec<ProjectId>"
      # Once: answers the uses recorded before it.
    activate:
      signature: "(&mut self, code: &Codebase, project: &ProjectId, dir: PathBuf)"
      # A worker for the project unless it has one (`code.active`), given
      # that project's `leaving` task.
    stop:
      signature: "(&mut self, project: &ProjectId)"
      # Its worker stops after the file it is on (`code.inactive`), the task
      # kept in `leaving`.
    worker:
      signature: "(&self, project: &ProjectId) -> Option<&Worker>"
    forget:
      signature: "(&mut self, project: &ProjectId)"
    active:
      signature: "(&self) -> Vec<ProjectId>"
      # The active projects, by id: the sweep's list.
    close:
      signature: "(&mut self) -> Vec<JoinHandle<()>>"
      # Every worker stopped; answers their tasks and the `leaving` ones.
  worker:
    spawn:
      signature: "(code: Codebase, project: ProjectId, dir: PathBuf, config: CodebaseConfig, before: Option<JoinHandle<()>>) -> Self"
      # The task awaits `before`, the project's previous worker, first.
    state:
      signature: "(&self) -> (IndexState, Option<String>)"
      # DirectoryMissing while missing; Indexing { done, found } while a
      # scan runs or before the first ends; Ready after.
    jobs:
      signature: "(&self) -> mpsc::Sender<Job>"
    pause:
      signature: "(&self)"
      # test-support only.
    stop:
      signature: "(self) -> JoinHandle<()>"
      # Sets `progress.stop` and wakes the task: it ends after the file it
      # is on, dropping its watcher.
    run:
      signature: "(mut self, jobs, seen, config: CodebaseConfig)"
      private: true
      # One select, biased: stop; a job; the interval (its first tick, at
      # once, is the first scan); a seen path (into `pending`, dropped while
      # `paused`) or Rescan (a
      # scan); `debounce` with no new path: `folder_changed` makes the batch
      # one scan (`code.folder_changed`), else `pending` through `keeps`, as
      # `Files`. After each, a set `lost` means a scan
      # (`code.watcher_overflow`).
    scan:
      signature: "(&mut self)"
      private: true
      # Takes `pending`; a missing folder is `folder_missing`; a folder back
      # gets a new watcher. After `scan_project`, one that wrote or deleted
      # files while no path was pending restarts the watcher
      # (`code.watcher_restarted`: notify can stop without a word), the new
      # one made before the old is dropped. Then the taken paths and what the
      # listing changed since the last scan (`follow` over `files`) go to the
      # running servers (`tell_servers`), before `sync_servers(true)`: a change
      # the watcher never reported reaches them before the next `Job::Lsp`. A
      # scan cut short by `stop` does none of this, and marks nothing scanned.
    handle:
      signature: "(&mut self, job: Job)"
      private: true
      # Refresh replies after its scan.
    files:
      signature: "(&mut self, paths: Vec<String>)"
      private: true
      # Folder gone: `folder_missing`. Else by what is on disk now, never by
      # the events' kind: a regular file `kept_now` keeps is indexed, a
      # regular file it does not keep is left alone, anything else (gone, a
      # link, a folder) goes to `index_file`, which deletes its rows. Ends
      # after the file it is on once `stopping`.
    folder_changed:
      signature: "(&self) -> bool"
      private: true
      # A pending path `keeps` does not take, with no hidden component, that
      # is gone, or is a folder `code_files_under` finds nothing under (a
      # failed read counts as nothing) (`symlink_metadata`). A gone non-code
      # file (a README.md) passes too: the scan is cheap.
    stopping:
      signature: "(&self) -> bool"
      private: true
    index:
      signature: "(&self, path: &str)"
      private: true
    folder_missing:
      signature: "(&mut self)"
      private: true
      # `missing` set (`code.directory_missing`, once), the watcher dropped.
    watch:
      signature: "(&self) -> Option<RecommendedWatcher>"
      private: true
      # A new recursive `RecommendedWatcher`; a failure is
      # `code.watcher_failed`, and the next scan tries again.
    server_state:
      signature: "(&self, id: &str) -> Option<ServerState>"
    sync_servers:
      signature: "(&mut self, retry: bool)"
      private: true
      # After each scan (retry: true) and each watcher batch (false): stops the
      # running servers no longer wanted, starts each wanted one not running or
      # starting (a Failed one only on retry; one `find_command` misses is not
      # started), on its own task, reporting through `started`.
    server_started:
      signature: "(&mut self, server: Wanted, result: Result<Server, LspError>)"
      private: true
      # Running, or Failed with the server's error line (`code.server_failed`):
      # shadows-lsp's first non-empty stderr line that is not a backtrace frame
      # (`^\s*\d+:`, `^\s*at `, "Stack backtrace"), else its last line.
    tell_servers:
      signature: "(&mut self, paths: &[String])"
      private: true
      # Every watcher batch's paths, a scan's (see `scan`), and those gathered
      # when a `Job::Lsp` arrives, go to each running server that reads them as
      # `files_changed`: Deleted when gone (it leaves `known`), Created when on
      # disk and not in `known` (it joins), else Changed; a new file's extension
      # joins `extra`. `known` is the files the servers know are on disk: a scan
      # with no server running sets it to its listing (a server starting reads
      # the folder itself), and each file told since. pyright adds a file to its
      # workspace only for Created and takes Changed for a file it does not know
      # as nothing, so a file made after it started was never searched for uses.
    stop_servers:
      signature: "(&mut self)"
      private: true
      # When the worker stops: every server shut down.
    shut:
      signature: "(server: Arc<Server>)"
      private: true
    forward:
      signature: "(dir: &Path, seen: &mpsc::Sender<Seen>, lost: &AtomicBool, event: notify::Result<notify::Event>)"
      private: true
      # On notify's thread, with no await: an error or `need_rescan()` sends
      # Rescan (logged); a read (an `Access` other than `Close(Write)`) is
      # dropped; per path, relative, one under target/ or
      # node_modules/ is dropped, a `.gitignore` sends Rescan, the rest
      # Path. A created folder also reports the files already in it (at most 500):
      # on Linux a file written into a new folder before its watch exists sends no
      # event (`created_files`). `try_send`: a full or closed channel sets `lost`.
  store:
    # All instance methods below belong to the private CodeStore.
    servers_off:
      signature: "(&self) -> Result<HashSet<String>, StorageError>"
    servers_added:
      signature: "(&self) -> Result<Vec<AddedRow>, StorageError>"
    file_paths:
      signature: "(&self, project: &ProjectId) -> Result<Vec<String>, StorageError>"
      # The paths of the listing's files (`code_inventory`, kind file), by key.
      # Reads the whole list: only `extensions` asks it, when nothing is held.
    code_file_stamp:
      signature: "(&self, project: &ProjectId, path_key: &str) -> Result<Option<(String, i64, i64)>, StorageError>"
    code_file_stamps:
      signature: "(&self, project: &ProjectId) -> Result<HashMap<String, (String, i64, i64)>, StorageError>"
      # Every stamp of the project by file key, for one scan's whole walk.
    code_file_keys:
      signature: "(&self, project: &ProjectId) -> Result<Vec<String>, StorageError>"
    code_files_under:
      signature: "(&self, project: &ProjectId, folder_key: &str) -> Result<bool, StorageError>"
      # A row at the key or in the byte range `key/` to `key0`, as
      # `inventory_page`: exact on every platform.
    write_code_file:
      signature: "(&self, project: &ProjectId, file: FileRow) -> Result<(), StorageError>"
      # One write: nothing for a removed project (so a worker finishing a
      # file after a removal writes no row); else upsert its row.
    delete_code_file:
      signature: "(&self, project: &ProjectId, path_key: &str) -> Result<(), StorageError>"
      # One write: the row.
    code_links:
      signature: "(&self, project: &ProjectId) -> Result<Vec<ProjectLink>, StorageError>"
    load_link_in:
      signature: "(conn, project: &ProjectId, linked: &ProjectId) -> Result<ProjectLink, StorageError>"
      private: true
    replayed_link_in:
      signature: "(conn, ctx: &CommandContext, project: &ProjectId, linked: &ProjectId) -> Result<ProjectLink, StorageError>"
      # The link as it stands, else rebuilt from the command record: never
      # NotFound for a command that happened (§14.9).
      private: true
    put_link_in:
      signature: "(conn, project, linked, ts) -> Result<bool, StorageError>; inserts a row only"
      # Codebase associated method: insert within the caller's write; true only
      # for a new row. Caller owns validation, command replay, events and notification.
    remove_link_in:
      signature: "(conn, project, linked) -> Result<bool, StorageError>; removes a row only"
      # Codebase associated method: delete within the caller's write; true only
      # when a link existed. Caller owns command replay, events and notification.
    delete_code_links_in:
      signature: "(conn, project: &ProjectId) -> Result<(), StorageError>"
      # In store/links.rs. Every link with the project at either end; no
      # ProjectUnlinked, the caller's ProjectRemoved says it.
    delete_code_index_in:
      signature: "(conn, project: &ProjectId) -> Result<(), StorageError>"
      # Its files, then its inventory rows and scan row, inside
      # the caller's write.
    write_inventory:
      signature: "(&self, project: &ProjectId, rows: Vec<InventoryRow>, incomplete: bool, observed_at: &str) -> Result<(), StorageError>"
      # In store/inventory.rs. The stored list is read through the reader,
      # outside any write; new keys inserted, changed rows updated, missing
      # keys deleted only when complete, in `write_inventory_batch`es of at
      # most BATCH_ROWS (5,000) rows, each its own write, so Shadows' one
      # write lock is let go between them. The scan row is upserted last, in
      # its own write: generation 1 on the first listing, which readers see as
      # still being made until then. Nothing more is written once the project
      # is removed (`live_in`). Its caller writes one listing of a project at a time.
    write_inventory_batch:
      signature: "(&self, project: &ProjectId, upserts: &[InventoryRow], gone: &[String], first: bool) -> Result<bool, StorageError>"
      private: true
      # One write: false and nothing written for a removed project. The first
      # batch of a listing that changes a stored list moves its generation by
      # one and sets `incomplete`, so a cursor from before is stale. Upserts
      # STATEMENT_ROWS (500) rows per INSERT, under SQLite's bound-value limit.
    live_in:
      signature: "(conn: &mut Tx, project: &ProjectId) -> Result<bool, StorageError>"
      private: true
      # `Projects::require_live_in`, with NotFound as false.
    inventory_page:
      signature: "(&self, project: &ProjectId, prefix_key: &str, after_key: Option<&str>, limit: i64) -> Result<Option<StoredPage>, StorageError>"
      # One read snapshot: None without a scan row; else generation,
      # incomplete, observed_at and at most `limit` (path_key, entry) rows
      # at or under the prefix (the byte range `key/` to `key0`) after the
      # key, ORDER BY path_key.
    code_scope:
      signature: "(&self, home: &ProjectId) -> Result<Vec<ScopeRow>, StorageError>"
      # One read snapshot: Projects::get_in for the home and linked ids.
      # NotFound for a removed home; removed links left out; linked slugs sorted.
    code_counts:
      signature: "(&self, project: &ProjectId) -> Result<(u32, Vec<Skipped>), StorageError>"


shared_in_transaction:
  load_link_in: Retained project link with slugs in the caller snapshot.
  replayed_link_in: Recorded link result even after removal; Plans owns command replay classification.
  # Plans owns command replay and dependency notifications around the Codebase writes.
  put_link_in: "PlansStore::put_code_link: raw insert in its command transaction"
  remove_link_in: "PlansStore::remove_code_link: raw delete in its command transaction"
  selected_project_in: "Plans' store: resolves an optional project slug within the origin's live one-way reach in its read snapshot"
  project_reachable_in: "Plans' store: checks live same-project or existing one-way project-link reach in the dependency read/approval snapshot"
  delete_code_index_in: "ProjectLifecycle's removal transaction: a removed project's index goes in the removal's own write (§15.4)"
  delete_code_links_in: "ProjectLifecycle's removal transaction: the links a removed project reads, and those reading it, go in the removal's own write (§15.4)"


called_by_other_services:
  touch: "Turns send records a use of the thread's project without waiting for indexing."
  hold: "Turns holds one per running turn until it settles."
  hold_claiming: "Runs holds one per running attempt, claiming its writes, until it settles."
  changed: "Turns compares a settled Planner turn's changes with its notes."
  project_file: "Turns checks project_change_note's paths."
  missing_inputs: "Runs checks a task's required files before Start."
  forget: "ProjectLifecycle removal stops the worker after its committed removal write."


enums:
  CodebaseError:
    source: codebase::CodebaseError
    values: [InvalidCommand, GrantScope, InventoryStale, LanguageServer, Projects, Storage]
  StorageError:
    source: core_db::StorageError
    values: []
  ProjectId:
    source: core_projects::ProjectId
    values: []


obligations:
  - rule: A file question (shadows-lsp Server::ask, or a Document from Server::open) closes the document it opened however it ends, a caller dropped mid-request included, before its question lock is released.
    tested_by: [a_question_dropped_while_held_closes_its_document]
  - rule: Server::open waits for the question lock only until its deadline, then answers LspError::Timeout; each Document::request times out at that same deadline.
    tested_by: [an_open_past_its_deadline_while_another_holds_the_lock_times_out]
  - rule: >
      A call-hierarchy question opens its document once and follows up at most 100
      prepared roots, setting truncated when roots are left out; calls outside the
      scope are dropped before the 100 visible items are counted.
    tested_by: [a_hierarchy_follows_up_at_most_a_hundred_roots_in_one_open_document]
  - rule: >
      A call-hierarchy question whose follow-ups are slow ends with the timeout error
      near one 20 s deadline, not one per root, and its document is closed.
    tested_by: [slow_hierarchy_follow_ups_share_one_deadline]
  - rule: >
      A hold keeps the paths the project's watcher saw change while it lived, git's
      own bookkeeping and a folder modified in place left out.
    tested_by: [an_unnoted_shell_change_is_recorded_and_asked_about, a_turn_with_no_change_sends_nothing,
      a_folder_modified_in_place_is_not_a_hold_change, live_a_codex_planner_reads_a_file_and_writes_none]
  - rule: >
      A hold reports only project files: by the listing's own rule a file now,
      or a file the listing held when the hold began and gone now. A folder, an
      ignored or otherwise excluded path, and a file made and removed meanwhile
      are not changes.
    tested_by: a_hold_reports_only_project_files
  - rule: >
      While a claiming hold lives, a path it claims reaches it alone; a path no
      hold claims reaches every hold of the project.
    tested_by: a_claimed_path_goes_to_its_claiming_hold_only
  - rule: >
      The person's server settings change only by command (CodeServerSwitch,
      CodeServerAdd, CodeServerRemove), each one write with its replay, event
      and command record; a catalog id is never added, and only an added server
      is removed.
    tested_by: a_replayed_command_changes_nothing
    note: also switching_a_server_off_lists_it_off, an_added_server_is_listed_and_removable, a_catalog_id_cannot_be_added.
  - rule: >
      A code_lsp file is read and sent to a server only when it is inside the
      project by its real path: `../`, an absolute path and a link or junction
      out of the folder are refused INVALID_COMMAND before any server is asked.
    tested_by: code_lsp_refuses_a_link_out_of_the_project
    note: also code_lsp_refuses_a_path_outside_the_project.
  - rule: >
      A server that does not answer never holds a question: each request ends
      after 20 s with LanguageServer, refused LANGUAGE_SERVER_UNAVAILABLE "the
      language server <id> is running but did not answer in time (20 s)".
    tested_by: a_slow_answer_times_out
  - rule: >
      A file whose language has no running server is answered NoServer.
    tested_by: code_lsp_answers_no_server_for_an_unknown_extension
  - rule: >
      The files choose a project's language servers: while the project is
      active its worker runs each server one of whose extensions its files
      have, unless the person switched it off, and starts one when a file with
      a new extension appears, without a refresh.
    tested_by: a_new_extension_starts_its_server
  - rule: >
      A server reads a closed file again only when told, so every change the
      watcher sees goes to the running servers that read it before the next
      question reaches them.
    tested_by: a_watched_change_reaches_the_server
  - rule: >
      A file made after a server started reaches it as created, whether the
      watcher or a scan finds it, so a server that adds a file to its workspace
      only when told it was created (pyright) searches it for uses; a file it
      already knows is told changed.
    tested_by: a_file_made_after_the_server_started_reaches_it_as_created
    note: >
      Live: pyright_finds_uses_in_files_made_after_it_started (ignored, needs
      pyright-langserver), the P9 case of docs/evidence/2026-11-21-code-record-2-live.md.
  - rule: >
      A server is Running only once it has read its workspace: shadows-lsp's
      `Server::start` answers after `initialized` only when the server has sent
      nothing of its own (a request or a notification) for 1 s, or when the
      start's time runs out; until then the worker reads it Starting and `lsp`
      waits for it (20 s), so an empty answer is never one from a server still
      reading. A server that exits meanwhile is Exited.
    tested_by: pyright_finds_uses_in_files_made_after_it_started
    note: >
      pyright, asked at once, answers references with [] while it loads its
      settings and lists its files, in silence, then registers its watchers
      again (0.3 s for 5 files, 0.5 s for 4,000, run by hand). shadows-lsp holds
      the start's side: crates/shadows-lsp/tests/ready.rs
      (a_started_server_has_read_its_workspace). Trap: a server silent for more
      than 1 s while it reads, or one still talking when the start's 120 s run
      out, is taken as ready.
  - rule: >
      A change the watcher never reported reaches the servers through the scan:
      each scan's listing is compared with the last one, and the paths added,
      changed or removed go to the running servers that read them before any
      later question, whatever the index's languages.
    tested_by: a_scanned_change_reaches_the_server
  - rule: >
      A server that exits or does not initialize reads Failed, never Running,
      and is tried again at the next scan; one whose command is not found reads
      NotInstalled and is not started.
    tested_by: a_server_that_exits_reads_failed
    note: >
      shadows-lsp holds the start's side: a server that refuses initialize or
      exits at once is that error and leaves no panic, since its client loop
      keeps a socket to itself and ends with the server's stdout
      (crates/shadows-lsp/tests/start.rs). An exit carries the first stderr
      line that is not a backtrace frame, else the last line, so a crash
      reports its reason and not `14: <unknown>` (shadows-lsp client.rs
      a_crash_reports_its_first_line_not_its_last_frame). A server's own requests
      (client/registerCapability, workspace/configuration one null per item,
      window/workDoneProgress/create, any other) are answered null, so one that
      waits for them goes on (crates/shadows-lsp/tests/requests.rs).
  - rule: >
      The index follows the files: a scan indexes a new file, re-indexes a
      changed one (its size or modified time differs), and deletes the rows
      of one that is gone; `target/`, `node_modules/`, hidden entries and
      what a `.gitignore` in the folder names (with no `.git` anywhere) are
      never indexed; a file over 1 MB is recorded as too_large.
    tested_by: indexing_follows_the_files

  - rule: >
      While a project is active its index stays true without a request: the
      worker's first scan indexes it, a change the watcher reports is
      indexed once no path has arrived for `debounce`, and a change the
      watcher never delivers is found by the periodic scan within
      `rescan_every`.
    tested_by: watching_and_the_periodic_scan_keep_the_index_true
    note: >
      The body drops every path the worker's watcher reports before
      writing b.rs, so only the periodic scan can index it. The watcher's
      own path (create, delete, a `.gitignore` starting a scan) was run once
      by hand and is held by no test.

  - rule: >
      A read is not a change: `forward` drops every `Access` event but
      `Close(Write)`, so the scan's own reads, which Linux reports (notify's
      inotify backend watches OPEN and CLOSE_NOWRITE), never come back as
      paths, never fill the channel, and never start another scan. A
      `Close(Write)` is kept: it ends a write, and inotify reports a write
      through mmap(2) by nothing else.
    tested_by: a_read_is_not_a_change
    note: >
      Before this rule the daemon idle on the Shadows repo on Linux ran 596
      scans in 45 s (LINUX_WATCHER_READS.md). The test was broken once, by
      removing the filter, and failed.

  - rule: >
      A folder renamed or deleted inside an active project is in the index
      once no path has arrived for `debounce`, not at the next periodic scan:
      the watcher reports only the folder, so a batch holding a path that is
      gone and not a code file, or a folder the index holds no file under
      (moved in), is handled as one scan (outside target/, node_modules/ and
      hidden entries, which never start one). A folder with indexed files,
      which Windows reports on every save inside it, starts none: its files'
      own paths go as `Files`. One batch starts at most one scan, and the
      worker runs it inline, so no second is queued behind it.
    tested_by: none
    note: >
      Mohammed's Windows run, check 3, exercises it. Checked once by hand
      with a throwaway test (rescan_every 60 s, debounce 500 ms): a renamed
      folder's function answered at its new path in about 0.7 s, a deleted
      folder's rows were gone in about 0.7 s, a folder moved in from outside
      was answered in about 0.6 s, and saves and a new file inside an indexed
      subfolder started no scan; with the rule switched off, a rename was not
      answered within 10 s.

  - rule: >
      A project is active while it is used: a sent message, a code question
      or a live `ActiveHold` gives it a worker, and the sweep stops that worker
      once the project went unused with no hold for the idle time (10 min);
      its rows stay. Listing threads, creating a project and touching a project
      activate nothing else: not the project for a listing, never its links.
    tested_by: a_held_project_outlives_the_idle_time
    note: >
      also a_sent_message_activates_its_project, listing_threads_does_not_activate,
      an_idle_project_stops and a_touch_does_not_activate_links. A project used
      again before its old worker finished its file never has two writers: the
      new worker awaits the old task first (structural, `leaving`).

  - rule: >
      `touch` never fails its caller and never waits on a scan: an error is
      logged and dropped, and the scan runs in the worker.
    tested_by: none
    note: >
      Structural: `touch` returns `()`. `lsp` and the inventory reads call
      it after their own checks succeeded;
      a sent message and an attempt take a `hold` instead.

  - rule: >
      No path outside the project's folder is ever read. The walk reads no
      parent's ignore file and no global one, and follows no link;
      `index_file` stats with `symlink_metadata`, and before it opens a file
      its canonical path must be the path inside the folder's canonical
      path, so a link or junction on the way, or a name Windows normalises,
      is skipped and logged; `inside` (which `code_lsp`'s file goes through)
      refuses an absolute path, a ':' or a '..' component.
    tested_by: the_scope_is_the_project_and_its_links_only
    note: >
      `inside`, the WalkBuilder settings, `symlink_metadata` and
      `names_itself` are the whole rule. code_lsp_refuses_a_path_outside_the_project
      asks for "../x.go" and an absolute path; a test would also have the
      watcher report a file under a junction leading out of the folder.

  - rule: >
      A folder that is missing, or vanishes, keeps its index: the scan
      returns before walking and skips step 6, `index_file` deletes a gone
      file's rows only while `folder_exists`, and the worker answers
      DirectoryMissing and drops its watcher. When a periodic scan finds
      the folder again, a new watcher is made and the folder scanned.
    tested_by: none
    note: >
      A test would index a folder, rename it away, wait a periodic scan,
      find the hits still answered with DirectoryMissing, bring it back and
      see a new file indexed through the watcher.

  - rule: >
      One short transaction per file: `write_code_file` and
      `delete_code_file` each run one `write_txn` for one file, and the
      file is read before it, outside any transaction. The watcher's
      handler never awaits.
    tested_by: none
    note: >
      Structural: read in `index_file`, the two store methods and `forward`.

  - rule: >
      Shutdown stops every worker after the file it is on: `stop` sets the
      flag that `scan_project` and `files` check between files
      and wakes the task, and `shut_down` awaits every task, those of
      workers that left the active set included, before
      `AppCore::shut_down` runs §8.5.
    tested_by: none
    note: >
      Both new tests end with `shut_down_for_test`, which returns; none
      stops a worker in the middle of a scan.

  - rule: >
      A question's scope is the asker's project and its direct links, one
      way; an `only` outside it is refused GRANT_SCOPE under a grant and
      INVALID_COMMAND for a person, and an unnamed question never answers
      from a project outside it.
    tested_by: the_scope_is_the_project_and_its_links_only
    note: >
      The test holds the grant's refusal of an unlinked project only. The
      person's INVALID_COMMAND, the one-way direction, an unnamed question's
      scope and a link's own links are held by no test: no route asks a
      linked project's code as the person.

  - rule: >
      Links change only by command: ProjectLinkPut and ProjectLinkRemove,
      each one write with its replay, its event and its command record. A
      link to itself or to no project and removing a link that is not there
      are INVALID_COMMAND, with nothing written; linking twice answers the link.
    tested_by: the_scope_is_the_project_and_its_links_only
    note: >
      The body makes one link through the route and nothing else; the
      refusals, the replays and the events are held by no test.
      A test would link twice, unlink twice, link to itself and to a random id.

  - rule: Every file of the folder is listed whatever its language, and no content is.
    tested_by: inventory_lists_every_file_whatever_its_language

  - rule: A file's language is its extension's, by `language_for`, for the listing and the scan alike.
    tested_by: each_known_extension_keeps_its_language

  - rule: >
      A folder never walked, an ignored path, a secret name and a link are
      each one excluded entry, never entered.
    tested_by: inventory_lists_every_file_whatever_its_language
    note: The link case is a_link_out_of_the_folder_is_listed_and_never_entered.

  - rule: >
      A stale cursor is refused: a cursor from another generation is
      InventoryStale (409), and the generation moves only when a listing
      changed the stored entries.
    tested_by: inventory_pages_in_path_order_and_refuses_a_stale_cursor

  - rule: >
      A listing never holds Shadows' one write lock for its whole length:
      it writes in batches, and another write lands between them.
    tested_by: other_writes_go_on_while_a_big_listing_is_written

  - rule: >
      The servers a project wants come from its last listing held in memory,
      so a turn does not read the whole file list.
    tested_by: the_wanted_servers_come_from_the_listing_not_a_second_read

  - rule: An incomplete listing deletes nothing; a complete one removes what is gone.
    tested_by: an_incomplete_listing_deletes_nothing
    note: removing_a_file_removes_its_entry_and_moves_the_generation holds the complete side.

agreements:
  - between: [scan_project, files]
    must: index a file the same way
    holds: true
    why: >
      Both call `index_file` for each path, and nothing else writes a
      file's rows; `scan_project` deletes the keys its walk did not see
      itself only because the walk, not the disk, decides they left the
      scope.
    tested_by: watching_and_the_periodic_scan_keep_the_index_true
  - between: [walk, files]
    must: >
      decide keep-or-skip by the same rules, so the index does not depend on
      which path saw a change
    holds: true
    why: >
      `walk` keeps what passes `keeps` and the ignore files; the watcher's
      batch passes `keeps`, then `kept_now`, which is `walk` limited to the
      batch's files and the folders above them, reading the same ignore
      files. `forward` drops target/ and node_modules/ with the walk's own
      `never_walked`.
    tested_by: indexing_follows_the_files
    note: >
      The test holds the walk's side; the watcher's `.gitignore` handling
      was run once by hand.
  - between: [changed, project_file]
    must: >
      every path a hold reports is one `project_file` accepts, so the Planner
      can always note a change it is asked about
    holds: true
    why: >
      `changed` reports a regular file the listing holds (not a link, inside
      the folder by every component) or a gone file under an existing folder
      inside it; `project_file`'s `checked_path` with allow_missing accepts
      both.
    tested_by: every_reported_path_is_one_a_note_accepts


not_the_caller's:
  - >
      Check the scope, resolve a slug, or join a path to a project's folder
      yourself: an adapter passes the asker, `only` and the text to `Codebase`,
      which owns `projects` and `inside`.
  - >
      Check a server setting, or build its fingerprint, yourself: an adapter
      passes the command id and the server to `set_server_off`, `add_server` or
      `remove_server`, which refuse and record.
  - >
      Filter a changed path or write a file's rows yourself: `keeps` and
      `index_file` are the only implementation of either.
  - >
      Start or stop a worker yourself: call `touch` for a use, `forget` for
      a removal; `start` and `shut_down` belong to `AppCore`.


tests:
  - name: other_writes_go_on_while_a_big_listing_is_written
    checks: >
      A folder of 30 folders of 1,000 files is listed in a spawned refresh;
      meanwhile writes through `write_txn` read the stored row count and
      whether the scan row exists. One of them lands with rows stored and no
      scan row (between batches); the listing ends Ready at generation 1
      with all 30,030 rows.
  - name: the_wanted_servers_come_from_the_listing_not_a_second_read
    checks: >
      After listing a folder with src/lib.rs, the stored rows are deleted
      by SQL; `servers` still wants rust-analyzer, from the held extensions.
  - name: indexing_follows_the_files
    checks: >
      After one scan the status counts two files, src/a.rs and src/b.rs:
      target/, a file a nested .gitignore names and a .md file are not
      indexed, and one too_large file is counted. After changing a.rs,
      deleting b.rs and adding c.ts and a binary d.js: two files, and one
      binary.
  - name: watching_and_the_periodic_scan_keep_the_index_true
    checks: >
      With a 400 ms scan and a 100 ms debounce: a.rs is indexed after start;
      a new b.rs is indexed (the watcher); with the worker's `Files` jobs
      dropped, a new c.rs is indexed (the periodic scan).
  - name: a_read_is_not_a_change
    checks: >
      A unit test in watch.rs calls `forward` directly: `Access(Open)` and
      `Access(Close(Read))` on src/a.rs send nothing and leave `lost`
      false; `Modify(Data)` and `Access(Close(Write))` each send
      Path("src/a.rs").
  - name: a_sent_message_activates_its_project
    checks: A message sent in a project's thread makes its status other than Inactive.
  - name: listing_threads_does_not_activate
    checks: Threads::list on an idle project leaves it Inactive.
  - name: an_idle_project_stops
    checks: With a 1 s idle time, a touched project is Inactive 3 s later, with no worker.
  - name: a_touch_does_not_activate_links
    checks: Touching a project linked to another activates the first only.
  - name: a_held_project_outlives_the_idle_time
    checks: >
      With a 1 s idle time, a hold kept 3 s keeps the project active; just after
      its drop it is still active (the drop is a use); 3 s later it is Inactive.
  - name: a_hold_reports_only_project_files
    checks: >
      tests/hold.rs, a real git repository whose .gitignore names __pycache__/,
      .pytest_cache/ and /out/*.exe, listed once. During a hold: tracked.txt
      modified, gone.txt deleted, an ignored .pyc, .pytest_cache file and
      out/water.exe written, a folder made, temp.txt made and removed.
      `changed` is exactly [gone.txt, tracked.txt].
  - name: every_reported_path_is_one_a_note_accepts
    checks: >
      The same changes and a new new/fresh.txt: every path `changed` reports
      (the three) is accepted by `project_file`.
  - name: a_claimed_path_goes_to_its_claiming_hold_only
    checks: >
      A plain hold and a hold claiming report/: report/kept.txt and
      outside.txt are written. The claiming hold reports both; the plain one
      outside.txt only.
  - name: the_scope_is_the_project_and_its_links_only
    checks: >
      demo linked to backend through PUT …/code/links/{linked}; secret not
      linked. Over a project grant: code_lsp naming secret is GRANT_SCOPE
      before any server is asked; code_lsp on "../x.rs" is refused "the path
      must be inside the project".
  - name: each_known_extension_keeps_its_language
    checks: >
      rs is rust; ts, mts and cts typescript; tsx tsx; js, mjs, cjs and jsx
      javascript, in any case (J.RS); k.py has no language.
  - name: inventory_lists_every_file_whatever_its_language
    checks: >
      PHP, JSON, Rust and dotfiles are listed, src/lib.rs as rust; .env is excluded secret, vendor (a .gitignore) ignored,
      node_modules dependencies, with nothing under them; .git is absent;
      the order is the path order; no SECRET_CANARY in the JSON.
  - name: inventory_pages_in_path_order_and_refuses_a_stale_cursor
    checks: >
      Five files in pages of two; an unchanged refresh keeps generation 1;
      a new file makes it 2 and the old cursor InventoryStale; limits 0 and
      201 and a garbage cursor are INVALID_COMMAND.
  - name: inventory_prefix_lists_one_folder
    checks: Prefix "app" lists app and under it, not app.php; "../x" is refused.
  - name: inventory_is_indexing_before_its_first_listing_and_missing_without_a_folder
    checks: Indexing with generation 0 before a listing; Missing after the folder is removed.
  - name: removing_a_file_removes_its_entry_and_moves_the_generation
    checks: A removed file's entry is gone after a refresh, at generation 2.
  - name: a_link_out_of_the_folder_is_listed_and_never_entered
    checks: A symlink (Unix) or junction (Windows) out is excluded link, nothing under it.
  - name: the_catalog_has_the_twelve_servers
    checks: Twelve ids; clangd's extensions hold `.C` and `.c`.
  - name: a_go_file_wants_gopls
    checks: Ignored, needs gopls. A folder with main.go, touched; gopls Running within 60 s, alone.
  - name: a_new_extension_starts_its_server
    checks: Ignored, needs gopls. An empty folder touched, then main.go written; gopls Running.
  - name: a_watched_change_reaches_the_server
    checks: >
      Ignored, needs gopls. Hello moved two lines down in a.go on disk with no
      question between; the next definition (`lsp`) from b.go answers line 5.
  - name: a_scanned_change_reaches_the_server
    checks: >
      Ignored, needs gopls. With the watcher's reports dropped, Hello moved in
      a.go still answers line 3; after `refresh_inventory`'s scan, line 5.
  - name: a_file_made_after_the_server_started_reaches_it_as_created
    checks: >
      An added server `pz` (node) that reads the .pz files on disk at start and
      adds one only for Created. With a.pz and b.pz, references at a.pz answer
      b.pz; a new accounts/c.pz (the watcher) joins them; with the watcher's
      reports dropped, a new d.pz joins after `refresh_inventory` (the scan).
  - name: pyright_finds_uses_in_files_made_after_it_started
    checks: >
      Ignored, needs pyright-langserver. The first question while pyright starts
      answers App's uses in backend/main.py (lines 1, 3); SignIn in
      backend/accounts/application/accounts.py, made after pyright started, is
      answered used in backend/accounts/app_core.py at lines 1, 3 and 4.
  - name: a_missing_command_reads_not_installed
    checks: An added server (`add_server`) `no-such-server-xyz` for `.zz`, with x.zz, reads NotInstalled.
  - name: a_server_that_exits_reads_failed
    checks: An added server whose command exits at once (`cmd /c exit 3`) reads Failed.
  - name: a_cmd_shim_on_path_is_found
    checks: Windows only. `fake-ls.cmd` in a folder on the given PATH is found for `fake-ls`.
  - name: code_lsp_finds_references_with_gopls
    checks: Ignored, needs gopls. findReferences at a.go Hello (3:6) answers a.go and b.go, b.go at 4:9.
  - name: code_lsp_answers_typescript_with_tsc
    checks: >
      Ignored, needs TypeScript 7. lib.ts defines greet, main.ts imports and calls it,
      with a tsconfig.json: definition answers lib.ts:1; findReferences lib.ts:1,
      main.ts:1 and main.ts:4; documentSymbol lib.ts:1; workspaceSymbol greet
      holds lib.ts:1; incomingCalls is from main.ts:3.
  - name: a_percent_encoded_drive_is_decoded
    checks: >
      A unit test in lsp/ask.rs: file:///f%3A/... decodes to file:///f:/..., other
      URIs unchanged; on Windows it is placed in its project, path web/greet.ts.
  - name: code_lsp_answers_no_server_for_an_unknown_extension
    checks: x.zz answers no_server with extension .zz and no server.
  - name: code_lsp_refuses_a_path_outside_the_project
    checks: ../x.go and an absolute path are INVALID_COMMAND.
  - name: code_lsp_refuses_a_link_out_of_the_project
    checks: src/out, a junction (symlink on Unix) out of the folder; src/out/x.go is refused.
  - name: a_slow_answer_times_out
    checks: >
      An added server (`add_server`) that answers initialize only; hover is
      LANGUAGE_SERVER_UNAVAILABLE "… silent is running but did not answer in time" within 25 s.
  - name: the_removed_code_tools_are_listed_nowhere
    checks: No grant kind lists where_is, who_uses or outline; all three list code_lsp.
  - name: switching_a_server_off_lists_it_off
    checks: PUT /api/code/servers/gopls/off true lists gopls off; false lists it not off.
  - name: an_added_server_is_listed_and_removable
    checks: POST adds zz (not_installed), GET lists it, DELETE removes it; DELETE gopls is 422.
  - name: a_catalog_id_cannot_be_added
    checks: Adding gopls, or an extension with no dot, is 422 INVALID_COMMAND.
  - name: a_replayed_command_changes_nothing
    checks: The same POST twice is 200 twice and one row; the id with another body is 409.
  - name: an_incomplete_listing_deletes_nothing
    checks: >
      A unit test in inventory.rs: an incomplete write without b.txt keeps
      it at generation 1, Incomplete; a complete one removes it, generation 2.

  # Link snapshots are tested in store/reach.rs;
  # transaction rollback in store/links.rs. Each test stays with its rule.
  - name: link_reads_keep_the_callers_snapshot_and_replay_removed_projects
    checks: >
      Reach and slug resolution keep a reader's snapshot across project removal;
      a fresh snapshot refuses the removed project, and replay retains link slugs/date.
  - name: link_writes_rollback_with_the_callers_transaction
    checks: >
      Both insert and delete roll back with a caller failure; repeated raw writes
      correctly report whether they changed a row.

# Plans owns link/unlink command replay, events and dependency invalidation.
# Codebase owns project_link persistence through put_link_in/remove_link_in.
