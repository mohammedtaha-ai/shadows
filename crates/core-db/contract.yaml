# Shared database foundation. No service or shadows-core dependency is permitted.
# Storage owns WAL connections, SQLx BEGIN IMMEDIATE serialization, abandoned
# transaction rollback, migrations and publication of committed journal sequences.
# Tx is the borrowed SQLx connection; command and journal methods never commit.
# Subject ids are strings; domain ids and rules stay in their owning services.

name: core-db
version: 1
status: current
source: crates/core-db/src


shapes:
  CommandContext:
    # Everything needed to decide whether a submission is new, a replay, or
    # a conflict. `agent` is set for a Planner's command, `None` for a person's.
    agent: Option<String>
    principal_kind: String
    principal_id: String
    command_id: String
    command_kind: String
    command_schema_ver: i64
    request_fingerprint: String
  Anchor:
    Revision: i64
    Operation: "&str"
    DraftRef: "&str"
  Actor:
    kind: String
    id: String
  Causation:
    # One `Option<Causation>` on an event, because `durable_event` requires
    # `causation_kind` and `causation_ref` both or neither.
    kind: String
    reference: String
  JournalEntry:
    # Subject ids are strings: the service that owns an id converts it.
    event_id: String
    kind: String
    project_id: Option<String>
    thread_id: Option<String>
    operation_id: Option<String>
    actor: Actor
    causation: Option<Causation>
    correlation_id: Option<String>
    payload_json: String


functions:
  command:
    user:
      signature: "CommandContext::user(command_id: String, kind: &str, params: Value) -> CommandContext"
      # Public to service crates. A person's command: agent None, principal `User`/`local`,
      # schema version 1, `fingerprint(kind, &params)`.
    fingerprint:
      signature: "CommandContext::fingerprint(command_kind: &str, params: &Value) -> String"
      # Lowercase hex SHA-256 of the kind, one NUL byte, then the canonical
      # params: object keys sorted, each key JSON-escaped, arrays in order,
      # scalars as serde_json prints them.
    classify:
      signature: "(conn, ctx: &CommandContext, scope_kind: &str, scope_key: &str) -> Result<Option<String>, StorageError>"
      # Public to service crates. Reads `command_record` by principal, scope and command id.
      # None when new; Some(outcome_ref) when kind, schema version and
      # fingerprint all match (NotFound("outcome_ref") if the row has none);
      # otherwise CommandConflict.
    record_command:
      signature: "(conn, ctx, scope_kind, scope_key, entity_kind, outcome_ref, ts) -> Result<(), StorageError>"
      # Public to service crates. Inserts one `command_record` row, outcome_kind 'Entity';
      # audit_principal is "user:local" and audit_agent the agent when the
      # command has one, both NULL otherwise.
  derive:
    derived_id:
      signature: "Anchor::derived_id(self, fingerprint: &str) -> String"
      # `rev:<n>:<16 hex>`, `op:<operation id>:<16 hex>` or `ref:<draft_ref>`,
      # the hex being the fingerprint's first sixteen characters (all of it
      # when shorter). A draft ref carries no fingerprint, so the same ref with
      # different arguments is a CommandConflict.
  journal:
    new: "JournalEntry::new(kind, actor) constructs a v4 event id with empty scope and payload."
    with_project: "(self, id: &str) -> Self; the publisher converts its ProjectId."
    with_thread: "(self, id: &str) -> Self; the publisher converts its ThreadId."
    with_operation: "(self, id: &str) -> Self; the publisher converts its OperationId."
    with_payload: "(self, payload: Value) -> Self; serde_json serialization is unchanged."
    with_causation: "Test-support causation metadata."
    with_correlation: "Test-support correlation metadata."
    system:
      signature: "Actor::system() -> Actor"
      # kind "System", id "daemon".
    user:
      signature: "Actor::user(id: impl Into<String>) -> Actor"
      # kind "User".
    append_event:
      signature: "(conn, event: impl Into<JournalEntry>, now: &str) -> Result<i64, StorageError>"
      # Public to service crates. Inserts one `durable_event` row with every JournalEntry
      # field and `created_at = now`; answers its `seq`. Called inside the
      # transaction that writes the state the event describes.
    append_event_for_test:
      signature: "(conn, event: impl Into<JournalEntry>, now: &str) -> Result<i64, StorageError>"
      # JournalEntry method; test-support only, without a state write.
  storage:
    now:
      signature: "Storage::now() -> String"
      # RFC3339 UTC clock used by persisted records.
    open:
      signature: "(db_path: &Path) -> Result<Self, StorageError>"
      # Opens WAL storage with foreign keys, migrations, an eight-connection reader
      # pool and one serialized writer; initializes the committed journal cursor.
    reader:
      signature: "(&self) -> &SqlitePool"
      # Shared reader pool; callers begin a transaction when reads need one snapshot.
    close:
      signature: "Storage::close(&self) -> Result<(), StorageError>"
      # Awaits reader pool and serialized writer closure. Repeated closure is a no-op;
      # subsequent reads and writes report the existing Unavailable error.
      # Releases the writer mutex before draining readers so a reader holder's
      # write attempt can report Unavailable without blocking reader return.
    watch_committed:
      signature: "(&self) -> watch::Receiver<i64>"
      # Highest committed journal sequence; subscribe before reading the journal.
    write_txn:
      signature: "(&self, f: F) -> Result<T, StorageError>"
      # Serializes BEGIN IMMEDIATE writes; commits on success, rolls back on error,
      # uses SQLx drop rollback for abandoned transactions and publishes only after commit.
      # A thin call to write_txn_as with E = StorageError.
    write_txn_as:
      signature: "(&self, f: F) -> Result<T, E> where E: From<StorageError>"
      # The one implementation of the serialized write: a closure refuses with its
      # owner's error and the transaction still rolls back; recovery, rollback and
      # the committed-journal publish are the same path as write_txn.

  observation:
    observe:
      signature: "DatabaseWrites::observe(storage: &Storage) -> Result<DatabaseWrites, StorageError>"
      # test-support only; retains one reader connection for PRAGMA data_version.
    version:
      signature: "DatabaseWrites::version(&mut self) -> Result<i64, StorageError>"
      # test-support only; observes other connections' committed changes.

enums:
  StorageError:
    source: core_db::StorageError
    values: []


obligations:
  - rule: Closing storage releases database files before its directory is removed, and is idempotent.
    tested_by: close_releases_the_database_and_is_idempotent
  - rule: Closing storage never holds the writer mutex while awaiting borrowed readers.
    tested_by: close_refuses_writes_while_waiting_for_a_borrowed_reader
  - rule: Closing storage waits for an in-flight serialized transaction before closing readers.
    tested_by: close_waits_for_an_in_flight_transaction_before_closing_readers
  - rule: A failed BEGIN does not poison later serialized writes.
    tested_by: write_txn_recovers_after_begin_times_out
  - rule: The embedded migration catalog preserves every base version, description and checksum.
    tested_by: embedded_migrations_match_the_base_catalog
  - rule: Cancellation rolls back partial commands and events before another serialized write.
    tested_by: cancelled_write_rolls_back_command_and_event_before_recovery
  - rule: The observer detects committed writes and ignores rolled-back command records.
    tested_by: command_rollback_is_invisible_to_replay_and_the_write_observer
  - rule: Command replay compares every persisted identity field within its principal and scope.
    tested_by: commands_replay_only_with_identical_persistence_inputs
  - rule: Fingerprints and derived ids are byte-compatible with persisted command identities.
    tested_by:
      - fingerprints_match_persisted_values
      - derived_ids_match_persisted_values
  - rule: >
      The fingerprint ignores object key order, depends on the command kind
      and on every value, and a key cannot impersonate the separator structure.
    tested_by:
      - the_fingerprint_ignores_key_order_but_not_command_kind
      - the_fingerprint_does_not_let_a_key_impersonate_the_separator_structure
      - the_fingerprint_changes_when_a_value_changes
  - rule: >
      A recorded command replays only with an equal kind, schema version and
      fingerprint; any difference under the same id is CommandConflict.
    tested_by:
      - replaying_an_identical_command_returns_the_stored_outcome
      - the_same_command_id_with_a_different_request_is_a_conflict
      - the_same_command_id_under_a_different_schema_version_is_a_conflict
  - rule: >
      The commands a person and the Planner send record the principal, kind,
      schema version and fingerprint their parameters give.
    tested_by:
      - grant_command_fingerprints_do_not_move
      - project_thread_and_instructions_command_fingerprints_do_not_move
      - plan_command_fingerprints_do_not_move
      - turn_command_fingerprints_do_not_move
  - rule: A derived id carries its anchor and the fingerprint's first sixteen characters, a draft ref none.
    tested_by: derived_ids_carry_their_anchor
  - rule: >
      `append_event` writes the event's causation and correlation, and the
      committed signal moves only when its transaction commits.
    tested_by:
      - event_provenance_round_trips_through_append_event
      - the_committed_signal_moves_on_commit_and_never_on_rollback


tests:
  - name: close_releases_the_database_and_is_idempotent
    checks: Immediate directory removal succeeds after close twice; reads and writes report Unavailable.
  - name: close_refuses_writes_while_waiting_for_a_borrowed_reader
    checks: A borrowed reader delays close, but its write attempt returns Unavailable before reader return.
  - name: close_waits_for_an_in_flight_transaction_before_closing_readers
    checks: An in-flight write keeps close pending and readers open; transaction completion lets close finish.
  - name: embedded_migrations_match_the_base_catalog
    checks: All 39 versions, descriptions and SHA-384 checksums match the 0327292 Git catalog.
  - name: write_txn_recovers_after_begin_times_out
    checks: An external writer exceeds busy_timeout; the next write succeeds after it releases its lock.
  - name: fingerprints_match_persisted_values
    checks: Fixed SHA-256 vectors from 5169647 cover nested keys, arrays, escaping, Unicode and null.
  - name: derived_ids_match_persisted_values
    checks: Fixed ids from 5169647 cover all anchors, truncation, short and empty fingerprints.
  - name: the_fingerprint_ignores_key_order_but_not_command_kind
    checks: Reordered keys hash equal; a different kind does not.
  - name: the_fingerprint_does_not_let_a_key_impersonate_the_separator_structure
    checks: '{"a":1,"bc":2} and {"a:1,bc":2} hash differently.'
  - name: the_fingerprint_changes_when_a_value_changes
    checks: One changed value changes the hash.
  - name: replaying_an_identical_command_returns_the_stored_outcome
    checks: An identical project.create replays its outcome.
  - name: the_same_command_id_with_a_different_request_is_a_conflict
    checks: The same id with other params is CommandConflict.
  - name: the_same_command_id_under_a_different_schema_version_is_a_conflict
    checks: The same id and params under schema version 2 is CommandConflict.
  - name: grant_command_fingerprints_do_not_move
    checks: The command log rows of a grant issue and revoke equal the pinned principal, kind, version and fingerprint.
  - name: derived_ids_carry_their_anchor
    checks: rev, op and ref ids have their exact text.
  - name: event_provenance_round_trips_through_append_event
    checks: causation_kind, causation_ref and correlation_id are stored.
  - name: the_committed_signal_moves_on_commit_and_never_on_rollback
    checks: A rolled-back append is not signalled; a committed one is, with its seq.

modules:
  lib.rs: Storage lifetime, Tx and the UTC persistence clock
  command.rs: CommandContext identity and durable replay classification
  derive.rs: Anchor-derived command ids
  journal.rs: Transaction-local journal append
  embedded_migrations.rs: SQLx migration catalog validation
  error.rs: Database failure vocabulary
  id.rs: Exported newtype_id macro with service-owned id declarations
  write_observer.rs: Feature-gated committed-write observation
