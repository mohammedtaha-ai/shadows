called_by_other_services:
  heard_context_digest: "Turns (spawn.rs, before compose): the planning context goes into the prompt only when its digest differs from the session's newest heard one."
  prepare_context: "Turns (spawn.rs, after compose): a turn that carried planning context records it unheard; a failed write logs planner.context_record_failed and the context stays owed."
  forget_context: "Turns (turn.rs accept, a completed compaction) and shadows-http (POST /api/threads/{id}/context/resend, with a command)."
  record_limits: "Turns (turns/turn.rs accept): a turn's watcher records the account limits the harness reports, before it publishes the usage that `limits_of` answers (§12.8)"
  remembered_model: "Runs (lib.rs suggested_model): the executor's harness's last model, suggested when the Planner's last turn ran on another harness."


shared_in_transaction:
  mark_context_heard_in: Harness acknowledges context with the successful turn completion transaction.
  permission_replay: Private store read; Harness classifies a permission answer's command before acting.
  record_permission_answer: Private store write of a classified permission answer and its command record.
  change_mode: Private store command; Harness owns permission persistence and replay.
  check_mode_in: Private store policy guard within the caller's transaction.
  forget_mode: Private store cleanup during a failed opening.
  opening_mode: Private store selection before opening an adapter.
  remember_mode_in: Private store write of a validated conversation mode.
  remember_settings: Private store write called by the public transaction entry.
  remembered: Private store snapshot of remembered model and effort.
  selected_mode_in: Turns reads the validated conversation mode in its start transaction.
  set_thread_harness: Private store command composed through Threads and Operations.
  copy_mode_in: Harness copies a conversation preference in the fork transaction.
  remove_mode_in: Harness deletes the conversation preference in the removal transaction.
  delete_invocation_for_test: "Unit fixtures remove historical metadata through its owner; test-support only."
  set_invocation_pin_for_test: "Unit fixtures simulate legacy or foreign pins through its owner; test-support only."
  remember_settings_in: "Turns' start (turns/store/turn.rs start_turn): the turn's model is remembered for its harness, and its effort for that model, in the same write that records the turn, so a refused or replayed start remembers nothing"
  record_invocation_in: "Turns records immutable invocation input and the conversation mode with its turn command in the same write."
  observe_invocation_in: "Turns records the harness observation with terminal status and measured usage."
  invocation_in: "Turns enriches an operation or completion event from Harness metadata, including planning context state."
  invocations_in: "Turns enriches an operation list with bounded batches in its read snapshot, including planning context state."
  invocation_versions_in: "Turns reads recorded versions while composing delivered context from Threads and Operations."
  invocation_model_in: "Plans reads model and harness provenance without SQL into Harness tables."
  invocation_standards_in: "The pinned additions id; missing invocation is NotFound(invocation)."
  pinned_standards_in: "Design reads the required recorded base version and optional additions pin."
  invocation_usage_in: "Turns composes AYLUL routing with operation thread and measured usage."


obligations:
  - rule: >
      An addition requests a change to task files, never a question or evidence the commit
      shows; the Planner reads that through task_diff and task_file. An executor with
      nothing to change ends with a last message explaining why, without a commit;
      Shadows refuses an empty commit. The report still names commands and their results.
      The Planner is told a failed attempt's notice carries the executor's last message.
    tested_by: [the_planner_is_told_how_to_run_and_judge_tasks,
      the_executor_reports_commands_and_leaves_its_writes_clean]
  - rule: >
      The Planner reads the manifest, composition root, relevant layers and every modified
      file whole before naming files or symbols in a task. It reads on Claude Code with
      Read, Grep and Glob, and on Codex with read-only shell commands in the project folder.
      Commands that write, install, build, start servers or reach the network are forbidden;
      Shadows tools are its only writes. File names alone do not make a plan ready.
      The live test proves a Codex Planner's completed shell command reads a file whose
      word is in no prompt or name, and that a request to write leaves no file; it does not
      prove the sandbox refused a write, since the model may decline before trying.
    tested_by: [the_planner_reads_the_code_before_it_plans,
      live_a_codex_planner_reads_a_file_and_writes_none]
  - rule: invocation_in and invocations_in read planning_context from the turn's context record (LEFT JOIN invocation_context), heard if acknowledged, prepared if unconfirmed, null without a record.
    tested_by: ["integration: an_invocation_without_a_record_has_no_planning_context", "integration: a_prepared_record_reads_prepared", "integration: a_heard_record_reads_heard"]
    note: The tests live in crates/shadows/tests/context_record.rs and read through the operations list and Turns get_operation.
  - rule: A session option RPC waits at most the setup deadline, so its caller releases the session lease and shutdown stays bounded.
    tested_by: [shutdown_is_bounded_while_group_settings_are_unanswered]
  - rule: The connection settles a prompt session's outstanding requests before returning its result or disconnect error, so Turns drains and journals their end in the same turn.
    tested_by: [ending_a_turn_settles_its_unanswered_requests, disconnecting_settles_requests_before_the_turn_is_collected]
  - rule: AYLUL and the Planner hold permission requests for offered-option answers; replay returns its first result after session close, while an executor refuses immediately.
    tested_by: [an_aylul_request_waits_and_is_listed, answering_runs_the_tool_and_records_by_you, a_rejected_request_ends_rejected_and_the_turn_goes_on, an_option_not_offered_is_refused, a_second_answer_is_settled, an_equal_replay_answers_the_first_result, a_planner_permission_request_waits_for_the_person]
  - rule: Cancellation and session closure refuse waiting requests before stopping the adapter; project events carry the durable change.
    tested_by: [cancelling_while_asked_ends_refused_and_publishes, closing_the_session_while_asked_ends_refused, permissions_changed_reaches_the_aylul_project_stream, waiting_is_listed_oldest_first_across_agents]
  - rule: A failed durable answer leaves the request waiting; shutdown refuses requests before stopping their adapters.
    tested_by: [a_failed_permission_record_leaves_the_request_waiting, stopping_all_sessions_refuses_waiting_requests, a_prepared_answer_serializes_with_cancel_and_drop_keeps_it_waiting]
  - rule: AYLUL opening writes stored or template instructions atomically under the home lock, leaving unimported files untouched; the same library snapshot supplies enabled MCP servers and excludes Shadows' grant.
    tested_by: [opening_writes_the_stored_instructions, opening_writes_the_template_for_empty_instructions, opening_leaves_an_unimported_home_file, opening_sends_only_enabled_mcp_items, an_aylul_opening_never_receives_shadows_mcp, mcp_values_reach_the_session_as_hashes_only]
  - rule: >
      Deleting an agent is Harness's: the tombstone, its variables and its
      extension switches commit in one write through Agents and Extensions,
      then the agent's live adapters close. Neither owner holds a reference to
      Sessions.
    tested_by:
      - deleted_agent_with_live_adapter_is_not_found
      - deleted_agent_slug_is_never_reused
      - delete_agent_removes_its_variables
  - rule: >
      A Codex opening issues the thread grant before spawning the configured
      app-server, passes the bearer only in the child environment, and opens
      in `read-only` with the grant's tool policy. A failed launch, handshake,
      inventory check or thread opening revokes that grant and leaves nothing
      live; a new opening after a close carries a fresh grant while the old
      one stays refused. Stop settles one Cancelled ending while a tool call
      is pending, and refused permission requests write nothing.
    tested_by: [codex_uses_shadows_mcp, codex_resume_rotates_the_grant,
      codex_failed_setup_revokes_the_grant, codex_approval_waits_for_the_person,
      codex_stop_during_a_tool_call]
  - rule: >
      Configured Codex runs the existing choice, remembering, busy and mode
      rules: catalog models in order, the selected model's efforts, only a
      committed turn start remembers, a project without `read-only` refuses
      the start, and fork and Send now reach the native thread.
    tested_by: [codex_choices_follow_the_model_catalog, codex_efforts_belong_to_the_selected_model,
      codex_project_modes_are_enforced, codex_fork_keeps_the_source_unchanged,
      codex_steer_targets_the_active_turn, codex_forks_first_turn_leads_with_the_persons_text]
  - rule: Actual openings project only enabled managed items; cached adapters are not reconfigured.
    tested_by: [opening_projects_only_enabled_extensions]
  - rule: Disabled cached plugins remain explicitly false; user-owned content is preserved.
    tested_by: [opening_removes_disabled_cached_extensions]
  - rule: Projection serializes per home and refuses collisions without spawning or replacing user files.
    tested_by: [extension_projection_is_atomic]
  - rule: Cached adapters retain their opening provider attribution until reopened.
    tested_by: [usage_snapshot_survives_provider_changes]
  - rule: An AYLUL opening appends aylul_calls_me or name, or nothing when neither is set.
    tested_by: [opening_names_the_person, opening_without_person_appends_nothing]
  - rule: >
      AYLUL context variables use the accepted model window, including when a
      remembered model is refused; compact is capped or omitted below 100000.
      A fallback adapter is replaced under the thread lock before any prompt.
      A failed replacement invalidates outstanding sessions and stays owned for
      cleanup; openings cannot reuse its stale process limits.
    tested_by: [switching_model_uses_the_new_models_window, auto_compact_window_is_capped_or_omitted,
      a_refused_remembered_model_uses_the_fallback_models_window,
      model_replacement_keeps_turn_output_and_closes_the_current_adapter,
      a_failed_model_replacement_cannot_prompt_with_stale_process_limits]
  - rule: AYLUL resolves encrypted pairs at each spawn; live adapters retain their starting environment.
    tested_by: [two_agents_share_one_provider_key, settings_json_keeps_other_keys]
  - rule: Missing and unreadable stored keys keep their typed client errors before any spawn.
    tested_by: [missing_provider_key_is_named, reserved_variable_row_fails_opening]
  - rule: Planner instructions describe whole first maps and person-approved waiver cards; no tool approves a map.
    tested_by: map_propose_before_a_complete_vision_answers_stage_blocked
  - rule: >
      Planner instructions name roadmap_propose and roadmap_approve, say that plans
      come after the roadmap, and that draft_start takes the parts a plan changes.
      The Planner's tools stay the one mcp__shadows__* pattern (§24.2).
    tested_by: a_session_opens_with_shadows_mcp_instructions_and_the_pre_approval
  - rule: >
      The prompt's Setup section, after The roadmap, has the Planner set the project up
      first through a plan titled "Setup" whose every task writes files and leaves nothing
      uncommitted, then read the new files as "Look before you write a path" says; only a
      Setup task may commit binary files. The prompt names no Agent Mode.
    tested_by: the_planner_sets_the_project_up_first
  - rule: >
      Standards::current_in supplies opening additions; Turns::standards_for_invocation_in
      resolves the recorded pin through Standards in one read snapshot.
      Effective standards reach the session at opening, then once after each
      base or additions version change, between turns. A Claude fork keeps its
      parent's prompt, so it receives them even before it has an invocation of
      its own; a Codex fork's `thread/fork` takes them as its developer
      instructions, so it heard its opening as a new thread did and its first
      turn does not repeat them after the person's text
      (`Harness::keeps_parent_prompt`, used by both the turn and the
      forget/reset path; codex_forks_first_turn_leads_with_the_persons_text).
      Every person's prompt ends
      with the stage line, including Send now.
      The Planner's standards text names each base kind with its presence
      (`required`, `waivable with a reason` or `optional`) and the base rules.
      It carries no contract template.
    tested_by:
      - a_session_opens_with_the_effective_standards
      - changed_standards_reach_the_next_turn_once
      - additions_saved_after_session_open_reach_its_first_turn
      - a_thread_from_before_the_standards_gets_them_once
      - every_turn_ends_with_the_stage_line
      - a_pending_turn_delivers_the_standards_version_it_recorded
      - send_now_steers_the_running_turn_after_its_streamed_text
  - rule: >
      Harness availability. `open_session` and `change_model` check
      `Sessions::harness_available` (`policy::is_available_with`: `aylul` only
      with a profile) on the thread's harness before any session work:
      an unavailable one is HarnessUnavailable and no adapter is opened.
    tested_by:
      - change_model_on_an_unavailable_harness_opens_no_session
      - a_codex_thread_cannot_open_a_session
    note: >
      Both create a codex thread and assert 422 HARNESS_UNAVAILABLE with no
      session live. Removing the check from the change path fails the first
      (502 HARNESS_START_FAILED; tried on b4d614e).

  - rule: >
      Busy, early. `change_model` checks `thread_is_busy` after the harness
      and before `Sessions::open`: a thread with an operation not yet ended is
      ThreadBusy without an adapter being opened or its model set. No caller
      performs this check; `change_model` does.
    tested_by:
      - change_model_on_a_busy_thread_opens_no_session
      - change_model_is_refused_while_a_turn_runs
    note: >
      The first holds a Pending operation with no live turn and no lease, so
      only the early check can refuse it; it asserts no session is live.
      Removing the check fails it (200 with the model changed; tried on
      b4d614e and on the moved code). The second does not pin this check: with
      it removed the lease still refuses, after its wait.

  - rule: >
      Busy, under the lease. The model is set only while `change_model`
      holds the session's events (`lease_events`), given back whatever the
      outcome: a running turn's session is refused as ThreadBusy and keeps
      its model.
    tested_by:
      - change_model_is_refused_while_another_holds_the_session
      - change_model_is_refused_while_a_turn_runs
      - a_running_turns_model_is_not_changed
    note: >
      Only the first pins the lease with the early check in place: it holds
      the events with no operation, asserts 409 THREAD_BUSY with the model
      unchanged, and after the give-back the same change is 200. Removing the
      lease from `Sessions::change_model` fails it and no other test (tried
      in the Task 8 review). The second and third run under a live turn, where
      the early check answers first; they prove the lease only with that
      check removed. The third also sets the model once the turn ended.

  - rule: >
      A refused model change maps as the route did before the move: a model
      the session does not list, or one the harness refuses (its words in
      the message), is 422 SETTING_NOT_OFFERED, and the session keeps its
      model.
    tested_by:
      - a_model_the_session_does_not_list_is_not_offered
      - a_model_the_harness_refuses_is_not_offered_in_its_words

  - rule: >
      No command. Opening a session and changing its model record no
      command, write no entry or operation, and leave the
      remembered model where the last turn put it. An opening that starts an
      adapter does write, when `mcp_url` is set (always, under `shadows
      serve`): the thread grant's `mcp_grant` row and `McpGrantIssued`, after
      `McpGrantRevoked` for a closed adapter's grant it replaces (the Trap
      above). The route texts in `shadows-http/src/harness.rs` say so.
    tested_by:
      - harness_calls_record_no_command
      - picking_a_model_answers_that_models_efforts
      - a_sessions_grant_reaches_a_subscriber_live
    note: >
      The first counts `command_record` before and after both calls; it
      passes on b4d614e, so no harness call carries a fingerprint the move
      could shift. The second asserts `remembered` is still null after two
      model changes. The third is the write: POST session appends the
      thread's `McpGrantIssued`. The revocation of a replaced grant has no
      test of its own here.

  - rule: >
      A person's effort change is the model change's mirror: an effort the
      session's model does not offer (a model with no effort offers none) is
      422 SETTING_NOT_OFFERED and the session keeps its effort; a running
      turn's session is 409 THREAD_BUSY and keeps it; a change writes
      nothing and remembers nothing.
    tested_by:
      - picking_an_effort_sets_it_at_once
      - an_effort_the_model_does_not_offer_is_not_offered
      - a_running_turns_effort_is_not_changed

  - rule: >
      The effort is remembered per model. A turn started records its model for
      the harness and its effort for that model. An opening sets the
      remembered model, then the remembered effort of the model the session
      holds; `change_model` moving the session to a model sets that model's
      remembered effort. A model with none, or whose remembered effort is not
      offered or is refused, keeps the adapter's current effort.
      `GET /api/harnesses` answers the remembered model with its effort.
    tested_by:
      - the_effort_is_remembered_per_model
      - a_new_session_starts_at_the_remembered_model_and_effort
      - remembered_settings_survive_migration_0011
      - a_remembered_default_effort_is_not_carried_by_migration_0011
    note: >
      The first runs turns on two models at two efforts and checks that
      choosing each model, and a new session, come back at its effort, and
      that a model never run on starts at the fake's `high`. The last seeds
      a database at 0010 with a remembered model and effort and checks that
      0011 carried the effort to that model's row and an opening applies it;
      the one after it, that an effort `default` (no level, EFFORT_DEFAULT_PROBE
      §1) is not carried, so the model opens at the adapter's effort.

  - rule: >
      No `default` is asked of the adapter: `initialize` advertises the
      `recommendedValue` and `asyncTasks` extensions in the client capabilities' `_meta`, so
      the adapter offers no effort or model `default` (EFFORT_DEFAULT_PROBE
      §2). The menus are the harness's, unfiltered.
    tested_by:
      - initialize_advertises_recommended_value
    note: >
      Asserts the `_meta` fake-acp received. With the capability removed from
      `capabilities()` it fails (`Null` received; tried while writing it).

  - rule: >
      Opening is idempotent: an open session answers the choices it holds,
      on one adapter, and starts in the remembered allowed mode or the policy default.
    tested_by:
      - opening_a_session_answers_the_harness_choices_after_the_policy
      - opening_twice_reuses_one_adapter_and_starts_in_accept_edits

  - rule: >
      An opening that cannot finish leaves no adapter: a missing project
      directory starts none, and a harness slower than `setup_wait` (20 s by
      default) is HarnessStartFailed with nothing live.
    tested_by:
      - a_project_without_its_directory_does_not_start_an_adapter
      - a_harness_slower_than_setup_wait_fails_and_leaves_no_adapter
      - the_default_setup_wait_outlasts_a_slow_harness
    note: >
      The last asserts the default is at least 15 s, not exactly 20 s, and
      that a slow resume opens under it.

  - rule: >
      A thread's opening, close or stop holds only that thread's slot; the
      map's lock is never held across a process wait (§16.6). An action on
      the same thread still waits for its own opening: `setup_wait` plus the
      bounded stop of a failed adapter and the storage reads around it
      (§16.6).
      The idle close skips a slot someone holds: it is in use, so not idle.
      Opening reads the thread after taking its slot, before returning even
      a cached live adapter; removal already committed is NotFound.
    tested_by:
      - one_thread_opening_does_not_hold_another
      - a_removed_thread_cannot_reuse_its_still_open_adapter
    note: >
      Fails before the slot map: `terminate` on the other thread waited 1.39 s
      for a slow resume's opening.

  - rule: >
      The session's event lease is exclusive. A turn started while another
      holder owns it waits for the give-back and collects only its own output.
    tested_by: a_turn_started_during_a_session_hold_keeps_its_output

  - rule: >
      One pool. `Sessions` writes through the core's `Arc<Storage>`, never a
      `Storage` of its own: the `McpGrantIssued` an opening appends (and the
      `McpGrantRevoked` a close appends) raises the committed-sequence signal
      `Events` watches, so a thread's subscriber reads it at once, not at the
      next commit through another pool.
    tested_by:
      - a_sessions_grant_reaches_a_subscriber_live
    note: >
      The test fails on 099ef69, where `AppCore::start` and the test fixture
      opened a second `Storage` for `Sessions` ("no frame in time": the grant
      event never reached the subscriber), and passes with the `Arc` shared.
      Only the opening's event is tested; the close revokes through the same
      `Setups` and pool. The test proves the fixture's wiring, which
      `testing::acp::fake_sessions` shares (it takes the core's `Arc`);
      `AppCore::start`'s own wiring has no test that would catch a second
      pool there.


agreements:
  - between: [open_session, change_model, offer_for_model]
    must: Resolve the current provider model window through Harness::model_window.
    holds: true
    tested_by: [opening_and_turn_model_selection_use_the_same_window]
  - between: [change_mode, open_session, prepare_turn]
    must: Apply session modes through Sessions::set_mode; a leased running turn keeps its settings.
    holds: true
    tested_by: [running_turn_keeps_its_mode_and_next_turn_uses_the_pick]
  - between: [write_extensions, extensions::opening_snapshot]
    must: Snapshot per-agent enablement under the library mutation guard before projecting owned files.
    holds: true
    tested_by: [opening_projects_only_enabled_extensions, extension_deletions_remove_enablement_atomically]
  - between: [providers::test_saved_provider, opening]
    must: Resolve the provider key through Secrets::resolve_provider_key, which owns its scope and name; a missing or empty key is AylulKeyMissing.
    holds: true
    tested_by: [saved_test_uses_the_stored_key]
  - between: [change_model, turns::send]
    must: >
      refuse while the thread has an open operation: both check
      `thread_is_busy` early, before the session is touched, and both take
      the session's lease before changing it
    holds: true
    why: >
      Both call `Operations::thread_is_busy` (`Operations::has_open_in` on a read
      connection) after `Sessions::harness_available` (`aylul` only with a
      profile) and before `Sessions::open`,
      and both change the session only while holding `lease_events`, mapping
      its Busy to ThreadBusy.
    tested_by:
      - change_model_is_refused_while_a_turn_runs
      - a_busy_thread_is_refused_before_its_session_opens
    note: >
      Each test proves one side: the first `change_model` under a running
      turn, the second `send` against a Pending operation.

  - between: [open_session, change_model]
    must: judge a harness's availability identically
    holds: true
    why: >
      Both call `Sessions::harness_available` (`aylul` only with a profile)
      on `turn_context`'s harness, first.
    tested_by:
      - a_codex_thread_cannot_open_a_session
      - change_model_on_an_unavailable_harness_opens_no_session

  - between: [change_model, change_effort]
    must: >
      check availability, then busyness, then open the session in the same
      order, and set the value only under the session's lease
    holds: true
    why: >
      Both begin with `open_idle`, the one copy of that order, and both
      `Sessions` methods take `lease_events` and give the events back
      whatever the outcome.
    tested_by:
      - a_running_turns_model_is_not_changed
      - a_running_turns_effort_is_not_changed


not_the_caller's:
  - >
      Check availability or busyness, or open the session, before
      `change_model` or `open_session`; they do, in the only safe order.
  - >
      Map `SettingRefused` or `OpenError`; the service answers a `HarnessError`.
  - >
      Filter the offer by policy or the project's modes; `choices` does.


tests:
  - name: the_planner_follows_the_stacks_layout
    checks: The session opening append follows the framework layout, carries S10 and declared dependencies, and contains no Structure command instructions.
  - name: a_forget_makes_a_heard_context_owed
    checks: crates/shadows/tests/context_record.rs; a heard digest recorded before a forget no longer counts.
  - name: a_context_prepared_after_the_forget_counts
    checks: crates/shadows/tests/context_record.rs; a heard digest prepared after the thread's latest forget counts again.
  - name: a_forget_in_the_turn_that_carried_it_still_counts_as_lost
    checks: crates/shadows/tests/context_record.rs; a compaction in the turn that carried the context forgets it, though that turn is marked heard after.
  - name: a_replayed_request_forgets_once
    checks: crates/shadows/tests/context_record.rs; the same command_id writes one context_forget row.
  - name: a_request_with_other_params_conflicts
    checks: crates/shadows/tests/context_record.rs; another kind on the same command_id is CommandConflict and writes no row.
  - name: an_aylul_thread_cannot_forget
    checks: crates/shadows/tests/context_record.rs; on an AYLUL thread a request is InvalidCommand, a compaction answers Ok, and neither writes a row.
  - name: the_harness_list_carries_the_policy_modes
    checks: >
      tests/list.rs: claude-code and aylul list acceptEdits then auto with
      initial acceptEdits and unattended auto; unconfigured codex lists
      read-only, initial read-only, no unattended mode, unavailable with
      a reason naming --codex.
  - name: idle_choices_report_the_adapters_mode
    checks: Idle choices expose an adapter mode change without overwriting the saved pick.
  - name: picking_auto_without_sending_survives_reopen_and_core_restart
    checks: Saving Auto sends no turn and survives adapter replacement and a Core restart.
  - name: disallowed_mode_is_refused_before_any_write
    checks: Policy refusal creates no preference, command, or live adapter.
  - name: disallowed_remembered_mode_falls_back_on_open
    checks: The session and client both receive the policy default after a policy restriction.
  - name: a_new_conversation_including_a_draft_uses_its_own_default
    checks: A conversation's Auto choice does not affect a new draft conversation.
  - name: a_replay_with_another_mode_conflicts_and_equal_replay_keeps_later_choice
    checks: Different-mode replay conflicts; equal replay never restores an obsolete choice.
  - name: running_turn_keeps_its_mode_and_next_turn_uses_the_pick
    checks: Busy picks leave ACP unchanged and the next invocation records Auto.
  - name: fork_copies_the_mode_and_removal_deletes_only_its_row
    checks: The first fork prompt runs in the saved Auto mode even if the adapter reports Accept edits on opening; source removal preserves the fork's choice.
  - name: a_turn_start_remembers_its_explicit_mode_in_its_transaction
    checks: The first prompt after resume runs in the saved Auto mode even if the replacement adapter reports Accept edits on opening.
  - name: opening_uses_agent_and_provider
    checks: >
      tests/aylul_session/opening.rs: a send on an agent's thread spawns with
      the agent home as cwd and CLAUDE_CONFIG_DIR, the provider token present,
      only the user settings source, no append when no person is set, no MCP, one prompt block.
  - name: two_agents_share_one_provider_key
    checks: >
      tests/aylul_session/opening.rs: two agents on one provider both receive
      the token from the single `provider/<slug>` row.
  - name: deleted_agent_with_live_adapter_is_not_found
    checks: >
      tests/aylul_session/opening.rs: deleting an agent whose thread holds a
      live adapter makes the next send AYLUL_PROFILE_NOT_FOUND.
  - name: deleting_last_agent_is_not_found_not_unavailable
    checks: >
      tests/aylul_session/opening.rs: with the last agent deleted, opening and
      sending give AYLUL_PROFILE_NOT_FOUND, not HarnessUnavailable, while the
      list shows aylul available=false.
  - name: missing_provider_key_is_named
    checks: >
      tests/aylul_session/opening.rs: a provider with no key fails the opening
      with AYLUL_KEY_MISSING naming the provider.
  - name: reserved_variable_row_fails_opening
    checks: >
      tests/aylul_session/opening.rs: an agent variable row with a reserved
      name fails the opening with SECRET_NAME_RESERVED naming it.
  - name: settings_json_keeps_other_keys
    checks: >
      tests/aylul_session/homes.rs: the opening writes only availableModels
      and model, keeping every other key.
  - name: concurrent_openings_keep_settings_valid
    checks: >
      tests/aylul_session/homes.rs: two openings of one agent leave a valid
      settings.json with the person's keys intact.
  - name: aylul_choices_have_no_default_model
    checks: >
      tests/aylul_session/preferences.rs: AYLUL choices list each provider
      model once and never `default`.
  - name: remembered_model_is_per_agent
    checks: >
      tests/aylul_session/preferences.rs: a turn, the opening read and
      change_model use `aylul:<slug>`, leaving claude-code's memory empty.
  - name: absent_and_empty_tool_policies_are_distinct
    checks: None leaves adapter defaults; empty explicitly removes built-in tools.
  - name: a_pending_turn_delivers_the_standards_version_it_recorded
    checks: An additions save between recording and sending waits for the following turn.
  - name: a_session_opens_with_the_effective_standards
    checks: Session append contains the base rules, each kind with its presence, and saved additions.
  - name: changed_standards_reach_the_next_turn_once
    checks: Changed additions arrive once before the following turn's stage.
  - name: additions_saved_after_session_open_reach_its_first_turn
    checks: A first turn receives additions saved after its session opened, once.
  - name: a_thread_from_before_the_standards_gets_them_once
    checks: A legacy invocation with no standards version receives standards once.
  - name: every_turn_ends_with_the_stage_line
    checks: A new turn ends with the database-derived stage.
  - name: a_removed_thread_cannot_reuse_its_still_open_adapter
    checks: >
      A removal commit while an adapter is still open makes another opening
      NotFound instead of returning the cached session; close then reaps it.
  - name: change_model_is_refused_while_another_holds_the_session
    checks: >
      With the session's events leased by the test and no operation, PUT
      model is 409 THREAD_BUSY and the model stays fake-large; after the
      give-back the same PUT answers fake-small.
  - name: change_model_is_refused_while_a_turn_runs
    checks: >
      With `hang` running, PUT model is 409 THREAD_BUSY, the session's model
      is still fake-large, and stopping the turn records Cancelled.
  - name: change_model_on_a_busy_thread_opens_no_session
    checks: >
      With a Pending operation written at the store, PUT model is 409
      THREAD_BUSY and no session is live.
  - name: change_model_on_an_unavailable_harness_opens_no_session
    checks: PUT model on a codex thread is 422 HARNESS_UNAVAILABLE, no session live.
  - name: harness_calls_record_no_command
    checks: >
      Open and change model each answer 200 and the command log
      does not grow.
  - name: a_codex_thread_cannot_open_a_session
    checks: POST session on a codex thread is 422 HARNESS_UNAVAILABLE, nothing started.
  - name: a_running_turns_model_is_not_changed
    checks: >
      With `hang` running, PUT model is 409 THREAD_BUSY; after Stop the same
      PUT sets fake-small.
  - name: a_model_the_session_does_not_list_is_not_offered
    checks: An unlisted model is 422 SETTING_NOT_OFFERED; the session stays fake-large.
  - name: a_model_the_harness_refuses_is_not_offered_in_its_words
    checks: >
      fake-locked is 422 SETTING_NOT_OFFERED with the harness's words; the
      session stays fake-large.
  - name: picking_a_model_answers_that_models_efforts
    checks: >
      Each PUT answers the model's efforts, twice is the same state, the
      session answers the model it holds, and nothing is remembered.
  - name: picking_an_effort_sets_it_at_once
    checks: >
      PUT effort low answers fake-large at low with its efforts; twice is the
      same state; POST session answers the same; nothing is remembered.
  - name: an_effort_the_model_does_not_offer_is_not_offered
    checks: >
      xhigh is 422 SETTING_NOT_OFFERED; on fake-tiny (no effort) low is too;
      the session is unchanged.
  - name: a_running_turns_effort_is_not_changed
    checks: >
      With `hang` running, PUT effort is 409 THREAD_BUSY; after Stop the same
      PUT sets low.
  - name: the_effort_is_remembered_per_model
    checks: >
      A turn on fake-small at low; fake-large, never run, comes back at high.
      A turn on fake-large at max; choosing fake-small answers low and
      fake-large max; a new session opens at fake-large max; the harness
      list remembers fake-large at max.
  - name: remembered_settings_survive_migration_0011
    checks: >
      A database at 0010 remembering fake-small at low lists the same after
      0011, and a session opens at fake-small low.
  - name: a_remembered_default_effort_is_not_carried_by_migration_0011
    checks: >
      A database at 0010 remembering fake-small at `default` lists fake-small
      with no effort after 0011, and a session opens at fake-small high.
  - name: initialize_advertises_recommended_value
    checks: >
      The `_meta` fake-acp's `initialize` received is jetbrains.air version 1
      with capabilities ["recommendedValue", "asyncTasks"].
  - name: opening_a_session_answers_the_harness_choices_after_the_policy
    checks: >
      POST session lists the fake's models, efforts and policy modes in
      acceptEdits; a second POST answers the same; one session live.
  - name: opening_twice_reuses_one_adapter_and_starts_in_accept_edits
    checks: Two opens share one session id and one adapter, in acceptEdits, "new".
  - name: a_project_without_its_directory_does_not_start_an_adapter
    checks: A removed directory is OpenError::Workspace "missing" and no adapter.
  - name: a_harness_slower_than_setup_wait_fails_and_leaves_no_adapter
    checks: A 300 ms setup_wait against a slow resume is OpenError::Start "timed out", none live.
  - name: the_default_setup_wait_outlasts_a_slow_harness
    checks: The default setup_wait is at least 15 s and a slow harness opens under it.
  - name: one_thread_opening_does_not_hold_another
    checks: >
      While one thread's slow resume opens, `terminate` on a second thread
      returns before that opening has finished; the opening then succeeds,
      one session live.
  - name: a_turn_started_during_a_session_hold_keeps_its_output
    checks: >
      A turn polled while a fake wait-for-release prompt holds the session stays
      pending, then records both of its messages and none of the holder's output.
  - name: a_busy_thread_is_refused_before_its_session_opens
    checks: >
      Turns' side: with a Pending operation, a turn start is 409 THREAD_BUSY
      and no session is live.
  - name: a_sessions_grant_reaches_a_subscriber_live
    checks: >
      With `mcp_url` set, a subscriber taken before POST session reads the
      thread's `McpGrantIssued` as its next durable frame, within the frame
      wait.

# AYLUL environment resolution belongs to Secrets, not the adapter.
# Opening decrypts the profile pairs at each spawn; live adapters keep their environment.
# From<OpenError> preserves typed Secrets failures and Env's other opening failures.
# Evidence: two_agents_share_one_provider_key, settings_json_keeps_other_keys,
# missing_provider_key_is_named, reserved_variable_row_fails_opening.
# live.rs owns adapter opening and cache slot types; sessions.rs owns session leases.

# AYLUL model choices are restricted to provider ids, with default removed and labels equal to ids.
# The agent and its provider are checked before reusing a cached adapter or checking availability.
# Only explicit provider keys are sent; daemon-variable fallback and env import are removed.

image_input:
  capability: Session choices carry image and image_reason from Connection initialize.
  require_images: Refuses image-bearing input when the harness reports no image capability.
  tested_by: a_harness_without_image_capability_refuses_with_its_reason

background_tasks:
  owner: Harness
  lifetime: The open session; never persisted. Closing the session publishes an empty list once and forgets it.
  updates: Spawn appends in start order; terminal state updates the existing task.
  delivery: Every list change is published, including between turns.
  stop_task: Unknown thread, session or task is absent; an ended task answers false; the session slot is not held while the adapter answers.
  tested_by: [tasks_outlive_the_turn_that_started_them, stop_reaches_the_adapter,
    unknown_task_is_404, an_ended_task_is_not_stopped]

dependencies:
  agents: crates/core-agents/contract.yaml
  extensions: crates/core-extensions/contract.yaml
  grants: crates/core-grants/contract.yaml
  instructions: crates/core-instructions/contract.yaml
  operations: crates/core-operations/contract.yaml
  person: crates/core-person/contract.yaml
  projects: crates/core-projects/contract.yaml
  providers: crates/core-providers/contract.yaml
  secrets: crates/core-secrets/contract.yaml
  standards: crates/core-standards/contract.yaml
  threads: crates/core-threads/contract.yaml

planning_context:
  modules: [context_record.rs, store/context_record.rs]
  tables: [invocation_context, context_forget]
  types: [CarriedContext, ContextSource, Forget]
  methods: [prepare_context, mark_context_heard, heard_context_digest, forget_context, context_record]
  ordering: Captured operation journal sequence orders contexts within one session; a heard row prepared at or before the thread's latest forget seq does not count.
  acknowledgement: Only a successfully completed turn is marked heard; absent rows remain unknown.

context_completion:
  mark_context_heard_in: Turns acknowledges a prepared context in the successful completion transaction.

# Planner prompt directs building agents to read task_context for the approved task first.
# Phases are edited by phases_set; the Planner never marks one complete.
