# Operations lifecycle and transactions are imported from core-operations.
# Grant authority and approval provenance are imported from core-grants.
# Thread identities and transaction methods are imported from core-threads.
# Extension library methods and refusals are imported from core-extensions.
# AgentsError is translated through HarnessError with unchanged responses.
# Project standards are imported from core-standards.
# Planner instructions are read through core-instructions.
# Person preferences are read through core-person.
# Project identities and registration methods are imported from core-projects.
# Providers is imported from core-providers; HarnessError preserves adapter failure semantics.
# Secrets is imported from core-secrets; application error conversion preserves caller responses.
# Database infrastructure: core-db; domain rules and private stores remain here.
# Running authority is read through Operations; transaction guards remain in the caller snapshot.
# Adapter configuration uses ClaudeAdapter/ClaudeProfile constructors; options use Offered methods.
# Account reports use AccountLimits::from_report.
# Setups receives Grants from AppCore. Thread liveness and ownership are checked in the grant-issuing write.
# Thread facts and entries are accessed through Threads::*_in in the caller's snapshot.
# Owns the harnesses and each thread's open session (spec §12.2–§12.4, §12.8,
# §14.4): the harness list, opening a thread's session and answering its
# choices, a person's model or effort change, the remembered model and
# per-model effort applied to them.
# `Sessions` holds the live adapter per thread; `Turns` drives a turn on it
# through Harness methods named under functions.harness_for_turns; Sessions is private.
#
# `change_model`'s and `change_effort`'s order is the rule (§14.9), held in
# one place, `check_idle` (used by open_idle and Turns): the thread's harness is checked with
# `Sessions::harness_available` (`policy::is_available_with`: `aylul` only
# with a profile), then `thread_is_busy`, before `Sessions::open`
# touches anything; the value is then set under the session's lease
# (`Sessions::change_model` / `change_effort` take the events the way a turn
# does and give them back whatever the outcome), so a turn that took the
# session between the early check and the change refuses it as Busy. The
# change itself writes nothing: no command, no event, and nothing remembered
# moves. An opening it causes writes what any opening writes (the thread
# grant, below).
#
# Remembered settings (§12.4): per harness the model of the last turn started
# (`harness_preference`), per harness and model the effort of the last turn
# started on it (`harness_model_effort`, migration 0011). A turn start writes
# both in its transaction (`remember_settings`). They are applied at opening
# (the model, then the effort remembered for the model the session then
# holds) and when `change_model` moves the session to a model (that model's
# effort). A value not offered or refused is skipped and the adapter's current
# value stands. Shadows keeps no list of models or efforts: no `default` is on
# offer because `initialize` advertises the adapter's `recommendedValue`
# (shadows-agent `acp/connection.rs` `capabilities`), not because anything filters it.
#
# Trap: the early busy check is not redundant with the lease. A thread with an
# operation not yet ended but no live turn holding the events (a Pending
# operation, or a turn whose watcher gave the events back before its ending
# was recorded) holds no lease: only `thread_is_busy` refuses the change there.
# Trap: the lease answers Busy only after (cancel_wait + 1s);
# while a turn runs, the early check is what answers at once.
# Trap: an opening issues the thread's MCP grant (`Setups::for_opening`, on
# `Grants::issue_thread_grant_in`) and every close revokes it (`Setups::forget`).
# Grants owns those rows; Harness supplies checked thread ownership in its write.
# Trap: a harness title is taken off the connection in its dispatch, never
# from a turn's events: it arrives after the turn has ended. Threads' store
# owns whether it replaces the title.

name: harness
layer_catalog: 'Planner standards text lists every kind presence and its layers with required/optional roles and allowed dependencies. The prompt explains places, module patterns, not-used reasons and grouping parts. Tested by planner_mcp::the_standards_text_lists_backend_layers.'
# Planner instructions map responsibilities into the chosen framework's layout.
# Map approval opens Roadmap; framework scaffolding is a task of the Setup plan,
# never a structure-writing command.
# Every new, resumed or forked Planner session sends its Shadows HTTP MCP server
# in the ACP server list; AYLUL sends only its enabled MCP items. HTTP headers and stdio
# environment values are omitted from MCP setup Debug output.
# Extensions' resolved MCP snapshots carry per-agent rules beside transport facts.
# Every new, resumed or forked Planner session sends PLANNER_TOOLS,
# settingSources [] and strictMcpConfig true (the three planner_mcp opening tests).
# Harness opens AYLUL and Planner sessions with PermissionPolicy::Ask (a Codex Planner holds its
# approvals the same way) and an executor with Refuse. PLANNER_TOOLS ends with Bash, the
# Planner's shell; what its program asks about waits for the person. prompt.txt says the shell is
# for installing and the environment, and that a changed project file is noted with
# project_change_note. In a read-only sandbox (Codex's Read only mode) it offers no install of
# its own: the person installs the server or it is left.
# `open_executor(thread, grant, model)` opens an executor the same way, from its one compiled-in
# file, executor.md: the front matter's `tools:` (Read, Grep, Glob, Edit, Write, MultiEdit, Bash,
# TodoWrite) as the session's tools, the body appended; settingSources [] and strictMcpConfig true,
# no permission rules, the session working in its project's folder as every session does, and
# `policy::EXECUTOR_MODE` (`auto`) set after opening. Nothing is asked or refused while it works;
# Runs' check on the reported commit is its one write boundary. The file carries no model and no
# mode (executor::tests parse it; executor_session's opening test; live in runs_attempts: an Edit
# of an existing file in a subfolder runs unasked and its commit is accepted).
# `release_executor` forgets the thread's executor setup and closes the session (revoking its grant).
# An executor-kind thread opens only while its setup is held: any other opening is refused, never
# built as a Planner's (a_released_executor_thread_does_not_open_again). An executor thread's turns
# compare nothing against Planner instructions or standards; the thread's kind decides it
# (an_executors_first_turn_hears_no_planner_instructions, and its live twin).
# Permission answers are recorded before settling the adapter request; cancellation
# and close serialize against that write. A failed write leaves the request waiting.
# §23.5 prompt names stable vision item ids, proposal cards and person-only approval.
# §13.8 prompt: the Planner talks in the person's language and stores everything in English.
# The prompt's "The task contract" section is held by mcp_tools::the_planner_is_told_what_a_contract_holds and, live, planner_live::live_the_planner_writes_a_contract_without_a_function_body.
# executor.md's "Tools" section (no Python; files through Write, Edit and MultiEdit, never the
# shell) is held by executor::tests::the_executor_file_parses_and_names_its_eight_tools.
# executor.md's contract bullets are held, live, by runs_routes::live_an_executor_builds_the_function_its_contract_names.
# executor.md asks for `code_lsp` before searching the tree; prompt.txt names `code_lsp`, and that
# a language with no running server is answered "no server".
# The prompt asks the Planner to ask a choice with person_ask and wait, never the same thing in
# text; held by person_questions::an_executor_cannot_ask.
# The prompt's "Look before you write a path" section is held by code_scope::the_planner_is_told_to_look_at_the_real_files.
# The prompt's project_files line says what each page state means and that indexing is not a complete listing; held by mcp_tools::the_planner_is_told_an_indexing_listing_is_not_complete.
# The prompt's task_add/task_update line says a task_update without the task's contract leaves it with none; held by mcp_tools::the_planner_is_told_what_a_contract_holds.
# The prompt's project_git_init line (a folder Start refuses as not git becomes one, its files committed with secret and dependency files left out and untracked; refused inside a repository; no project file written) is held by mcp_tools::the_planner_is_told_how_to_run_and_judge_tasks.
# The prompt's "Running tasks" paragraph (task_start when the person asks; task_done only after its own judgment; after a done mark, start next at once without waiting; judge the [Shadows] notice of an ended attempt against the acceptance items, counting anything skipped or not run as not done, otherwise task_amend with what is missing; task_amend carries the executor on in its session, at most three additions after a Start, then the task goes back to the person; after that refusal, task_lessons once with what stopped the work and what the plan should have said) is held by the same test.
# The actual appended prompt is checked by a_session_opens_with_shadows_mcp_instructions_and_the_pre_approval.
# Running tasks directs task_diff before judgment, task_file for any file at the commit,
# never asking the executor for file contents; after an addition diff shows only that change.
# Held by mcp_tools::the_planner_is_told_how_to_run_and_judge_tasks and, live,
# planner_runs_live::live_the_planner_reads_the_commit_before_it_judges.
# executor.md asks for each command, its exit code and result lines, anything skipped,
# no pasted file contents, and clean writes after commit including line endings; held by
# executor::tests::the_executor_reports_commands_and_leaves_its_writes_clean.
