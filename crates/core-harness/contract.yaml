status: current
tool_rule_projection:
  tool_identity: Claude normalizes a dot in an MCP tool name to underscore; projection uses that identity.
  owner: Homes under the existing home lock and Extensions snapshot guard.
  file_access: Homes checks managed paths and publishes each file atomically.
  recovery: Write the union of prior and next owned rules before settings, then finalize ownership.
  preservation: Pre-existing exact rules stay foreign and in their order; only owned entries are removed, and new ones follow, sorted.
  collision: Two tools that reach Claude under one name keep only its block.
  no_rules: With no rule to write or clean, settings.json is not read.
  tested_by: [opening_writes_allow_and_deny_rules, rules_of_an_item_switched_off_are_removed,
    foreign_rules_are_kept, a_renamed_item_leaves_no_old_rule,
    interrupted_rule_projection_is_cleaned_at_next_opening,
    an_unwritable_rule_manifest_leaves_settings_unchanged,
    dotted_tool_rules_use_claudes_normalized_name, colliding_tool_names_keep_only_the_block,
    an_agent_without_rules_opens_with_odd_permissions, foreign_rule_order_is_kept]
source: crates/core-harness/src


shapes:
  WaitingPermission:
    note: Thread and agent identity, request id, title, normalized options and UTC asked_at.
  PermissionAnswer:
    note: The command's immutable thread, request, option, kind and answered_at result.
  AylulOwners:
    source: owners.rs
    note: Harness declares its providers, agents, extensions and person dependencies; AppCore constructs them.
  InvocationContext:
    source: setup.rs
    note: Turns supplies read results; private setup applies errors only when their context is needed.
  InvocationView:
    source: model.rs
    note: Requested and observed harness metadata; unknown fields stay null.
  InvocationVersions:
    source: model.rs
    note: Recorded prompt, instructions, base standards and additions versions.
  NewInvocation:
    source: model.rs
    note: Borrowed input for the atomic invocation write.
  InvocationUsage:
    source: model.rs
    note: Nonsecret routing metadata used by terminal usage composition.
  AylulUsageSnapshot:
    source: model.rs
    note: Nonsecret provider routing pinned to the actual adapter at opening
  Harness:
    store: private HarnessStore over the shared storage handle
    operations: Operations
    projects: Projects
    sessions: private Arc<Sessions>
  HarnessInfo:
    # `claude-code`, `codex` or `aylul` (`policy::KNOWN`, in that order).
    kind: String
    # "Claude Code", "Codex", "AYLUL", or "Unknown" (`label`).
    label: String
    available: bool
    # Exactly when `available` is false: `Sessions::unavailable_reason`,
    # the configuration flags for codex, "Coming later" otherwise.
    reason: Option<String>
    # The last turn's model on this harness and that model's remembered
    # effort; never the mode.
    remembered: Option<RememberedSettings>
    limits: Option<AccountLimits>
    # `policy::modes(kind)` in listed order; [] when the harness has no decided modes.
    modes: Vec<HarnessMode>
    # `policy::default_mode(kind)`; None with no decided modes.
    initial_mode: Option<String>
    # `policy::unattended_mode(kind)`, the allowed mode that asks nothing.
    unattended_mode: Option<String>
  HarnessMode:
    source: model.rs
    id: String
    label: String
    description: String
  RememberedSettings:
    model: String
    # The effort remembered for `model`, None when no turn on it had one.
    effort: Option<String>
  Remembered:
    # Private to harness, in store/preferences.rs: everything a harness remembers.
    model: Option<String>
    # Per model, its last turn's effort. Unordered: read by key only.
    efforts: HashMap<String, String>
  SettingRefused:
    # A model not listed, or an effort the session's model does not offer.
    NotOffered: unit
    # The harness's own words.
    Harness: String
    Lease: LeaseError
  Sessions:
    # One live adapter per thread, the offers it made, and the setups it
    # opened with. Built on the core's `Arc<Storage>`, so the grant rows
    # `Setups` writes commit through the one pool `Events` watches; shared as
    # a private cache owned by Harness.
    config: SessionsConfig
  SessionsConfig:
    secrets: Option<Arc<Secrets>>
    aylul: Option<AylulConfig>
    # Defaults: 15 min, 10 s, 20 s, None.
    idle_after: Duration
    cancel_wait: Duration
    setup_wait: Duration
    # Shadows' `/mcp` as bound; `None` issues no thread grant on opening.
    mcp_url: Option<String>
    # AppCore's one CodexProgram when `--codex` and `--codex-home` are given;
    # `None` leaves Codex unavailable.
    codex: Option<Arc<CodexProgram>>
  OpenSession:
    # Kept across a resume: the harness's own session id.
    session_id: String
    # "new", "resume" or "fork", decided from `turn_context`.
    how: "&'static str"
    # Private: the connection (read through `connection()`) and a generation,
    # so a turn that outlives its adapter never gives its events to
    # or terminates the adapter that replaced it.
  OpenError:
    Secrets: core_secrets::SecretsError
    Provider: core_providers::ProvidersError
    Env: HarnessError
    Storage: StorageError
    # Includes "harness setup timed out" after `setup_wait`.
    Start: String
    # The project directory cannot be run in; words a client may show.
    Workspace: String
  LeaseError:
    # A turn or setting change holds the session.
    Busy: unit
    # The adapter this session ran on is gone.
    Closed: unit


functions:
  preference_key: The one storage key for per-agent AYLUL model preferences.
  service:
    prepare_context: "Records immutable prepared text, sources, sizes, cuts, digest and native session for an operation."
    mark_context_heard: "Acknowledges a recorded context through a serialized write."
    mark_context_heard_in: "Acknowledges context in Turns' successful terminal transaction."
    heard_context_digest: "Reads the newest acknowledged digest in one native session by captured operation sequence."
    forget_context: "The one rule for a session that lost what it heard: appends a PlannerContextForgotten journal entry and a context_forget row, then resets the thread's held instructions baseline to what its session opened with. The thread is read in the same write transaction: a missing or removed thread is StorageError::NotFound; on an AYLUL thread a Request is InvalidCommand and a Compaction writes nothing and answers Ok; a Request replayed with its command_id writes nothing."
    context_record: "Reads the prepared context and acknowledgement flag, or None when no row exists."
    answer_permission:
      signature: "(&self, command_id: String, thread: &ThreadId, request: &str, option: &str) -> Result<PermissionAnswer, HarnessError>"
      note: Replay first, validate a live AYLUL or Planner request and offered option, durably record, then answer; only one settlement wins.
    waiting_permissions:
      signature: "(&self) -> Vec<WaitingPermission>"
      note: Current AYLUL and Planner requests sorted by UTC asked_at then request id; a Planner's agent is Planner.
    fork_thread:
      signature: "(&self, command_id, source, at) -> Result<PlanningThread, HarnessError>"
      # Replay first, Operations eligibility, Threads fork, then mode copy in one write.
    change_mode:
      signature: "(&self, command_id, thread, mode) -> Result<SessionChoices, HarnessError>"
      # thread.mode, schema 1, fingerprint {thread_id, mode}, Thread scope.
      # Policy is checked before opening and again in the write transaction.
      # A leased or durably busy turn keeps its mode; choices report the saved selection.
      # Equal replay preserves later choices; a different mode is CommandConflict.
    selected_mode_in:
      signature: "(conn, thread) -> Result<String, HarnessError>"
      # Harness-only: remembered mode when still allowed, otherwise policy default.
    copy_mode_in:
      signature: "(conn, source, fork) -> Result<(), StorageError>"
      # Harness composes this after Threads::fork_in in the same transaction.
    remove_mode_in:
      signature: "(conn, thread) -> Result<(), StorageError>"
      # Thread removal deletes only this conversation's preference in its transaction.
    set_thread_harness:
      signature: "(&self, command_id, thread, harness) -> Result<PlanningThread, HarnessError>"
      # Harness guards the command with Operations, calls Threads::set_harness_in, and closes only on a kind change.
    check_idle:
      signature: "(&self, thread, context) -> Result<(), HarnessError>"
      # Availability, then durable busyness, before any session work; shared with Turns.
    offer_for_model:
      signature: "(&self, thread, opened, model) -> Result<(OpenSession, Offered, Option<String>), HarnessError>"
      # Settles the model before Turns leases events, returning any replacement adapter.
      # The previous model enables refused-start restoration.
    set_model_back:
      signature: "(&self, thread, opened, offered, previous)"
      # Restores through the same idle replacement path; failure preserves the original refusal.
    delete_agent:
      signature: "(&self, command_id: String, slug: &str) -> Result<(), HarnessError>"
      # The one way an agent is deleted (the HTTP route calls it; no MCP tool
      # deletes an agent). One write runs `Agents::delete_in` (its command, the
      # tombstone and its variables) and `Extensions::remove_agent_in` (its
      # switches); after commit `Sessions::close_agent` closes every live adapter
      # of the agent's threads (`terminate`); a failed close is logged
      # (`agent.adapter_close_failed`) and does not undo the deletion.
    aylul_profile:
      signature: "(&self) -> Result<&str, HarnessError>"
      # Configuration-only metadata; absence is AylulNotConfigured.
    list:
      signature: "(&self) -> Result<Vec<HarnessInfo>, HarnessError>"
      # For each of `policy::KNOWN`: availability, `remembered_settings`,
      # `latest_limits`, and the modes, initial and unattended mode from policy
      # alone. Refusals: Storage. `codex` is available exactly when configured
      # and always lists its policy mode `read-only` as the initial mode.
    remembered_model:
      signature: "(&self, kind: &str) -> Result<Option<String>, HarnessError>"
      # The model of `remembered_settings(kind)`: the last turn started on that
      # harness, so a model it offered then. Refusals: Storage.
    open_session:
      signature: "(&self, thread: &ThreadId) -> Result<SessionChoices, HarnessError>"
      # turn_context (NotFound → 404 INVALID_COMMAND) → harness_available
      # (HarnessUnavailable) → Sessions::open (OpenError through
      # `From<OpenError>`: HarnessStartFailed, ProjectDirectoryUnusable,
      # Storage, typed Env errors) → the offer, or HarnessStartFailed "the session closed as it
      # opened" → `choices`.
    change_model:
      signature: "(&self, thread: &ThreadId, model: &str) -> Result<SessionChoices, HarnessError>"
      # open_idle → `remembered` (the model's effort) → Sessions::change_model
      # under the lease → `choices`. `refusal` maps SettingRefused:
      # NotOffered → SettingNotOffered { "model", model, None }; Harness(m) →
      # SettingNotOffered with Some(m); Lease(Busy) → ThreadBusy;
      # Lease(Closed) → HarnessStartFailed("the harness session closed").
    change_effort:
      signature: "(&self, thread: &ThreadId, effort: &str) -> Result<SessionChoices, HarnessError>"
      # open_idle → Sessions::change_effort under the lease → `choices`;
      # `refusal` maps as for the model, with "effort". An effort the
      # session's model does not offer (none, for a model without effort) is
      # NotOffered before the harness is asked.
    open_idle:
      signature: "(&self, thread: &ThreadId) -> Result<(String, OpenSession), HarnessError>"
      # Private: turn_context → harness_available (HarnessUnavailable) →
      # thread_is_busy (ThreadBusy) → Sessions::open. The one copy of the
      # order both changes keep.
  for_events:
    # `Events` delivers a thread's offers and usage through these three, so
    # no adapter reaches `Sessions` or the store for them (Task 10).
    choices:
      signature: "(&self, thread: &ThreadId, offered: &Offered) -> Result<SessionChoices, HarnessError>"
      # Busy or leased sessions report the deferred selection; idle sessions report
      # the adapter's mode so model-driven changes remain visible to the client.
      # pub(crate). `for_client` over the thread's harness and its project's
      # allowed modes; `open_session` and `change_model` answer through it,
      # and `Events` for each offer it delivers (an `Err` delivers nothing).
    watch_options:
      signature: "(&self) -> broadcast::Receiver<(ThreadId, Offered)>"
      # pub(crate). `Sessions::watch_options`: every thread's offer changes;
      # `Events::subscribe` takes one before the journal is read.
    watch_commands:
      signature: "(&self) -> broadcast::Receiver<(ThreadId, Vec<SlashCommand>)>"
      # pub(crate). Every change to any thread's `/` list (§21.2); memory
      # only, forgotten with the offer when the session closes. `Events::subscribe`
      # takes one before the journal is read.
    commands_of:
      signature: "(&self, thread: &ThreadId) -> Option<Vec<SlashCommand>>"
      # pub(crate). The latest list the thread's open session sent, if any;
      # a thread stream sends it right after `caught-up`.
    watch_tasks:
      signature: "(&self) -> broadcast::Receiver<(ThreadId, u64, Vec<BackgroundTask>)>"
      # Every change to any thread's background task list with its revision;
      # memory only. `Subscription` takes one as it is built.
    task_snapshot:
      signature: "(&self, thread: &ThreadId) -> (u64, Vec<BackgroundTask>)"
      # The list and the revision it was published at; a thread stream sends
      # it after `caught-up` when not empty and skips older queued changes.
    tasks_of:
      signature: "(&self, thread: &ThreadId) -> Vec<BackgroundTask>"
      # The list alone; empty for a thread with no open session.
    limits_of:
      signature: "(&self, thread: &ThreadId) -> Option<AccountLimits>"
      # pub(crate). turn_context → latest_limits of its harness; `None` for
      # an unknown thread, no limits, or a failed read, as the SSE usage
      # frame did before the move.
  session_tasks:
    stop_task:
      signature: "(&self, thread: &ThreadId, id: &str) -> Result<Option<bool>, HarnessError>"
      # turn_context (NotFound → None) → the live slot, released before the
      # request (closed or exited → None) → the task (unknown → None; ended or
      # not stoppable → Some(false)) → `Connection::stop_task`. A request
      # failure is HarnessStartFailed. The list changes only on the adapter's
      # own `stopped` report.
  session_close:
    close_session:
      signature: "(&self, thread: &ThreadId) -> io::Result<()>"
      # pub(crate): Harness::set_thread_harness closes the thread session when
      # its harness changed. `Sessions::terminate`: the adapter's tree is
      # stopped, its offer forgotten and its grant revoked
      # (`Setups::forget`); no open session is Ok.
  harness_for_turns:
    open_for_images: Initializes capabilities before issuing the opening grant or changing stored mode.
    require_images: Refuses image input with the initialized harness capability reason.
    # Turns holds the same Arc<Harness> that AppCore serves and uses these methods,
    # a documented cross-service call (§14.6): the session lease is one
    # mechanism with two users, and a second copy would be two locks.
    open:
      signature: "(&self, thread: &ThreadId) -> Result<OpenSession, OpenError>"
    lease_events:
      signature: "(&self, thread, opened) -> Result<UnboundedReceiver<HarnessEvent>, LeaseError>"
    give_back_events:
      signature: "(&self, thread, opened, rx)"
    offered:
      signature: "(&self, thread: &ThreadId) -> Option<Offered>"
    set_option:
      signature: "(&self, thread, opened, config_id: &str, value: &str) -> Result<Offered, ConnectionError>"
    context_facts:
      signature: "(&self, thread: &ThreadId, invocation: Option<InvocationContext>, stage: String) -> Result<ContextFacts, HarnessError>"
      # Harness forwards the stage fact supplied by Turns; changes are read from private Setups.
      # §13.8's text of what changed since the session last heard: compared
      # with the versions held back by command turns when there are any, else
      # with the latest started turn's (or the opened session's). Every change
      # appears once, in its current form. `Turns` (`turns/prompt.rs`) alone
      # decides which of it a turn sends.
    withhold:
      signature: "(&self, thread: &ThreadId, skipped: bool)"
      # Harness delegates to private Setups once the turn has started, since only
      # a started turn counts as heard. `skipped` (a `/` command went without
      # its changes) keeps the versions this turn compared with, so the next
      # turn compares with them too; otherwise they are cleared. Kept with the
      # thread's held session state: a reopened or forgotten session drops it.
    opening:
      signature: "(&self, context: &TurnContext, selected: Option<&str>) -> Result<Opening, OpenError>"
      # assistant.rs, private to harness, called by `open_live`: cwd, session
      # setup and spawn spec. A Planner thread gets its project folder and
      # `for_opening`'s setup; an `aylul` thread the profile home, no
      # tools/MCP grant, an optional person-name append, `settingSources ["user"]`,
      # and the profile's
      # env. OpenError::Env preserves AylulKeyMissing before
      # any spawn, or AylulNotConfigured when no profile exists.
    harness_available:
      signature: "(&self, kind: &str) -> Result<bool, HarnessError>"
      # Harness delegates to private Sessions in assistant.rs, checking whether a
      # profile is configured with `policy::is_available_with`; `codex` is
      # available exactly when SessionsConfig::codex is set. Shared by `list`,
      # `open_session`, `open_idle` and `Turns::send` share.
    change_model:
      signature: "(&self, thread, opened, model: &str, effort: Option<&str>) -> Result<Offered, SettingRefused>"
      # pub(crate), on `Sessions`, called by `Harness::change_model` only:
      # under the lease, sets the model when it differs, then `effort` (that
      # model's remembered one) when offered; a refused remembered effort is
      # skipped.
    change_effort:
      signature: "(&self, thread, opened, effort: &str) -> Result<Offered, SettingRefused>"
      # pub(crate), on `Sessions`, called by `Harness::change_effort` only.
    prepare_turn:
      signature: "(&self, thread, opened, settings: &TurnSettings) -> Result<(), String>"
      # Harness delegates to private Sessions: sets model, effort and mode, one call per value
      # that differs; `Err` names the refused setting in the harness's words.
    touch:
      signature: "(&self, thread: &ThreadId)"
    terminate_adapter:
      signature: "(&self, thread, opened) -> io::Result<()>"
    cancel_wait:
      signature: "(&self) -> Duration"
    adapter:
      signature: "(&self) -> &ClaudeAdapter"
    close_all:
      signature: "(&self) -> io::Result<()>"
    connection:
      signature: "(&self) -> &ManagedConnection"
      # On `OpenSession`: a turn prompts and cancels through it, ACP or Codex alike.
    prompt_version:
      signature: "() -> &'static str"
      # Harness associated method in setup.rs: the Planner prompt version a turn's
      # invocation records.
  construction:
    with_owners:
      signature: "(adapter, storage, config, owners, instructions, grants, operations, projects) -> Arc<Harness>"
      # AppCore builds one Harness; its private Sessions cache reads explicit dependencies.
    # Owner-local fixtures construct declared dependencies without AppCore.
  titles:
    keep_titles:
      signature: "(storage: Arc<Storage>, thread: ThreadId, next: impl Fn(HarnessEvent)) -> impl Fn(HarnessEvent)"
      # pub(super): wraps every opening's event sink. A `SessionTitle` goes
      # to one task per adapter that calls Threads' `title_from_harness` in
      # order (a failure is logged, `thread.harness_title_failed`); every
      # other event goes on to `next`. The adapter sends its title after the
      # turn answered, when no turn reads the events (§12.3).
  for_tests:
    report_commands_for_test: Delivers a command report through the session event dispatcher.
    aylul_owners: Returns declared configuration owners for test fixtures.
    # Behind `test-support`, reached through `shadows_core::testing`.
    take_events:
      signature: "(&self, thread: &ThreadId) -> Option<UnboundedReceiver<HarnessEvent>>"
    terminate:
      signature: "(&self, thread: &ThreadId) -> io::Result<()>"
      # Not test-only: `close_session` is its product caller.
    live_count:
      signature: "(&self) -> usize"
    pid:
      signature: "(&self, thread: &ThreadId) -> Option<u32>"
    force_termination_failure:
      signature: "(&self, thread: &ThreadId) -> bool"
    remember_for_test:
      signature: "(&self, kind: &str, model: &str, effort: Option<&str>)"
  store:
    remembered_settings:
      signature: "(&self, kind: &str) -> Result<Option<(String, Option<String>)>, StorageError>"
      # The remembered model and that model's remembered effort; `list`.
    remembered:
      signature: "(&self, kind: &str) -> Result<Remembered, StorageError>"
      # pub(super): the model and every model's effort; read by opening and
      # `change_model`.
    latest_limits:
      signature: "(&self, kind: &str) -> Result<Option<AccountLimits>, StorageError>"
    record_limits:
      signature: "(&self, kind: &str, limits: &AccountLimits) -> Result<(), StorageError>"
      # Called by a turn's watcher (`turns/turn.rs`) as the harness reports.
    remember_settings:
      signature: "(conn, kind: &str, settings: &TurnSettings, ts: &str) -> Result<(), StorageError>"
      # The harness-wide model and effort. record_invocation_in separately
      # remembers the conversation's mode in the same turn-start transaction.


