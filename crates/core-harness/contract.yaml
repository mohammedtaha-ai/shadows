  context_record.rs: Planning context record boundary
  store/context_record.rs: Planning context record persistence
  permissions.rs: live permission commands
  store/permission.rs: permission answer command persistence
  mode.rs: durable conversation mode commands
  fork.rs: atomic conversation fork composition
  store/mode.rs: conversation permission persistence
  lib.rs: harness service boundary
  error.rs: harness failure vocabulary
  owners.rs: harness configuration dependencies
  access.rs: live session owner operations
