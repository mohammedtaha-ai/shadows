name: messages
version: 1
status: current
source: crates/core-messages/src
modules:
  lib.rs: group messaging boundary
  model.rs: group messaging values
  error.rs: group messaging refusals
  groups.rs: group lifecycle
  send.rs: person message command
  mentions.rs: mention routing
  bounds.rs: delivery budget
  prompt.rs: member context rendering
  deliveries.rs: turn dispatch
  replies.rs: durable reply processing
  store/mod.rs: group persistence
  store/deliveries.rs: delivery persistence
  store/write.rs: message persistence
dependencies:
  agents: crates/core-agents/contract.yaml
  threads: crates/core-threads/contract.yaml
  turns: crates/core-turns/contract.yaml
  events: crates/core-events/contract.yaml
functions:
  new: Composes the group owner over the shared storage and agent owners.
  create_group: Creates a group and its hidden member threads in one replayable write.
  groups: Lists groups in name and id order.
  group: Reads one group with its members and current attention flag.
  messages: Reads a group's durable messages after its group-local cursor.
  send: Atomically records a person message with its bounded delivery intents.
  listen: Runs the dispatcher and journal consumer in one worker.
obligations:
  - rule: Creation records one hidden thread per live member and rolls back the entire group on failure.
    tested_by: [a_group_gets_one_hidden_thread_per_member, a_failed_group_creation_leaves_no_thread, a_group_refuses_a_deleted_agent]
  - rule: A group contains at most six agents.
    tested_by: [a_group_refuses_seven_members]
  - rule: Messages come back in their group-local sequence after the caller's cursor.
    tested_by: [messages_come_back_in_seq_order]
  - rule: A group needs the person when it has an unanswered call; its waiting time is the timestamp of the first such call by group sequence.
    tested_by: [needs_you_since_is_the_first_unanswered_call]
  - rule: MessageAdded records the group id, sequence and whether an agent called the person so a subscriber can alert without fetching the log.
    tested_by: [a_message_reaches_the_project_stream, a_reply_to_mohammed_only_wakes_no_one_and_marks_needs_you]
  - rule: A person message reaches the mentioned members, or every member when it names none; a stranger's mention is not an address.
    tested_by: [a_mention_reaches_only_that_member, no_mention_reaches_every_member, a_mention_of_a_stranger_is_not_an_address, a_person_address_alone_does_not_wake_members]
  - rule: A prompt carries only the messages since the member's last delivery, and always the triggering one.
    tested_by: [the_prompt_carries_only_what_is_new, the_trigger_survives_the_cut]
  - rule: Each delivery is its own turn; a member's next delivery starts after its running one ends.
    tested_by: [a_second_message_to_a_busy_member_gets_its_own_turn]
  - rule: Dispatch replays prepared inputs and links operations before consuming terminal events.
    tested_by: [a_turn_that_ends_before_its_link_is_still_recorded, a_redispatch_uses_the_stored_inputs]
  - rule: A reply, its delivery's state and the journal cursor commit in one write, so an ending is recorded exactly once.
    tested_by: [a_reply_is_recorded_once, a_reply_survives_a_restart_before_it_is_recorded]
  - rule: Member replies only wake explicitly mentioned peers.
    tested_by: [a_group_is_created_written_to_and_read_back, a_reply_without_member_mentions_wakes_no_one, a_reply_mentioning_another_member_reaches_it, a_reply_to_mohammed_only_wakes_no_one_and_marks_needs_you]
  - rule: One cause schedules at most three rounds and ten deliveries, with one limit notice.
    tested_by: [parallel_mentions_stop_at_ten_deliveries_with_one_notice, a_reply_mentioning_another_member_reaches_it]
  - rule: A failed turn writes a notice and the member's next delivery starts.
    tested_by: [a_failed_turn_writes_a_notice_and_the_next_delivery_starts]
  - rule: A busy session can release its lease without a journal event; its delivery remains retryable.
    tested_by: [a_busy_delivery_retries_after_a_lease_releases_without_a_write]
  - rule: Turn shutdown retains its bound while a group delivery is waiting for adapter settings.
    tested_by: [shutdown_is_bounded_while_group_settings_are_unanswered]
