[package]
name = "core-operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
core-db = { path = "../core-db" }
core-runtime = { path = "../core-runtime" }
core-threads = { path = "../core-threads" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[features]
test-support = ["core-db/test-support", "core-runtime/test-support", "core-threads/test-support"]

[dev-dependencies]
core-operations = { path = ".", features = ["test-support"] }
core-projects = { path = "../core-projects", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true }
