# Database infrastructure: core-db; domain rules and private stores remain here.
# Owns the one local person record: the person's name, what AYLUL calls them, their
# language and their theme. It needs no account or agent home, and depends on no
# other service. Reading before the first write answers the defaults without a write.
name: person
version: 1
status: current
source: crates/core-person/src

modules:
  lib.rs: person record rules
  error.rs: person refusals
  model.rs: public person record
  store/mod.rs: person SQL

dependencies: {}

shapes:
  PersonSettings:
    store: private PersonStore over the shared storage handle
  PersonStore:
    storage: Arc<Storage> # Private to person; shares the existing pool.
  Person:
    updated_at: Null before the first write
  PersonPatch:
    note: Sent names and language are absent, null to clear, or a value; theme is absent or a non-null value.
  Theme:
    note: Dark, light or system; defaults to system before the first write

functions:
  new: "(storage: Arc<Storage>) -> PersonSettings"
  person: Read the person record or its defaults without a write.
  update_person: Validate only sent fields and merge them into the stored row inside one write transaction; refuse an empty patch.
  normalize_name: private; trim a name, refuse controls and line breaks, and make empty null.
  language_tag: private; a short tag shape, not a list.

shared_in_transaction: {}

obligations:
  - rule: Names are trimmed, at most 64 characters, without controls or line breaks; empty is null.
    tested_by: [person_names_are_checked]
  - rule: Language is a short tag shape, not a list; theme is dark, light or system.
    tested_by: [language_tag_shape_is_checked, theme_values_are_checked]
  - rule: Person replay requires the same normalized patch as sent and writes nothing on replay or conflict.
    tested_by: [person_replay_with_other_input_conflicts, independent_patches_preserve_other_fields]
  - rule: Absent fields keep their stored values; null clears names or language, never theme.
    tested_by: [patch_distinguishes_absent_null_and_value, independent_patches_preserve_other_fields, concurrent_patches_preserve_each_others_fields]
  - rule: Only sent fields are validated.
    tested_by: [unsent_fields_are_not_validated]
  - rule: Empty patches are refused without writing.
    tested_by: [independent_patches_preserve_other_fields]
