# Plans, Threads, Harness, Turns and Projects are used through their services; Runs reads
# nothing of theirs by SQL. Database infrastructure: core-db, whose command record keeps the
# done-mark commands, as every service's mutating commands are kept; globset is infrastructure
# for pattern matching, the overlap rule itself is written here. Git runs through
# shadows-process, one child per call in the project folder, never through a shell.
# Owns the attempts at the tasks of an approved plan version: Start, Stop, the commit, the
# scope an attempt holds while its session can still write, the person's done marks that
# `needs` links wait for, and what a restart does with attempts it finds running.
#
# An attempt holds its scope, the `writes` of its task, from Start until its turn has ended
# and its session is closed (`released_at`), whatever its state. Start refuses a task whose
# `writes` may meet a held scope; the check and the insert are one write.
#
# Git first, then SQLite: a commit carries `Shadows-Attempt: <id>` as a trailer and is
# written before the attempt records it, so a crash between the two is repaired by recover.

name: runs
version: 1
status: current
source: crates/core-runs/src

owns_tables: [run_attempts, run_task_marks]

modules:
  lib.rs: the Runs service, its queries and done marks
  model.rs: attempt types
  error.rs: run refusals
  scope.rs: the pattern matcher shared by the overlap check and the commit
  ready.rs: whether a task may start now
  git.rs: git calls in a project folder
  start.rs: starting an attempt
  stop.rs: stopping an attempt
  commit.rs: committing an attempt's work
  diff.rs: reading an attempt's commit
  watch.rs: following a turn to its end and freeing the scope
  recover.rs: settling attempts at startup
  store/mod.rs: run SQL
  store/marks.rs: done marks SQL
  store/recover.rs: startup SQL

dependencies:
  plans: Plans reads the frozen version, its tasks, its links and the tasks other plans' links reach.
  harness: Harness opens the executor session in its project's folder, and releases it.
  turns: Turns sends the first turn and stops it.
  threads: Threads creates the executor thread inside the Start write.
  grants: Grants revokes an interrupted attempt's grant at startup; an executor grant names the attempt's task.
  projects: Projects names the folder git runs in.

shapes:
  Runs:
    store: private RunsStore over the shared storage handle
    commits: one async lock per project, so one commit at a time per folder
  AttemptState: [running, committed, stopped, interrupted, failed]
  Attempt:
    operation_id: the operation of its turn; absent until the turn starts
    commit: absent until a commit exists
  Need: "{ task: TaskParent, title, done }: a task this one needs, in link order"
  TaskRun: "{ task, done, done_at, latest, needs, start: StartAnswer, suggested_model }"
  StartAnswer: "{ allowed, code, reason }: code and reason null when allowed"
  CommitResult: "{ attempt, files, left }: what was committed and the changed paths outside writes left in the folder"
  FileDiff: "{ path, added, removed, patch }: the patch cut at 2,000 lines with a marker"
  RunsError: [NotFrozen, Superseded, Archived, Waiting, TaskBusy, Overlap, NotGit, DirtyScope, LinkInScope, AlreadyCommitted, NothingToCommit, HeadMoved, CommandConflict, NotFound, BadScope, Unavailable, Storage]
  # RunsError::code is the opaque id clients match on: not_frozen, waiting, task_busy, ...

functions:
  new: "(storage, plans, harness, turns, projects) -> Runs; AppCore constructs the service"
  start: "(command, workflow, version, task, model) -> Attempt; a replay answers the first attempt before any check the plan's later state could fail, the same id with other input is CommandConflict; then the version, the task, its needs links, then the folder: NotGit, or DirtyScope when git lists a changed path inside writes; an attempt whose session or turn cannot start is recorded, so it is answered Failed with its reason, not refused; once the session opened it sends the turn only if the attempt is still Running (a Stop while the session opened found no turn to stop), and a Stop between that check and the turn's record stops the turn"
  can_start: "(workflow, version, task) -> StartAnswer; Start's checks in Start's order (the version, the task, its needs, the folder, then the busy and overlap check read without writing); a refusal is an answer with RunsError::code and its text, a failure to read is an error"
  stop: "(attempt) -> Attempt; waits for the turn's confirmed end"
  commit: "(grant, message) -> CommitResult; the executor grant's attempt must be Running (Committed is AlreadyCommitted); git status lists the changed paths git does not ignore, a rename as both ends; those matching writes are committed through a temporary index on HEAD, HEAD moves only if it did not move meanwhile (HeadMoved), and the real index is brought to the commit for those paths only; nothing inside writes is NothingToCommit; a path inside writes through a link or junction is LinkInScope and fails the attempt"
  diff: "(attempt) -> Vec<FileDiff>; each file of the attempt's commit, nothing before it commits"
  task: "(workflow, version, task) -> TaskRun; needs from the version's needs links and the done marks, start from can_start, suggested_model the model the plan's Planner conversation last asked for (none for an external writer)"
  attempts: "(workflow, version, task) -> Vec<Attempt>, newest first"
  mark_done: "(command, workflow, version, task, done) -> TaskRun; the command record keeps every mark command: a replay writes nothing, the same id with other input is CommandConflict"
  recover: "() -> RecoverReport; a Running attempt whose commit git holds becomes Committed with it, every other Interrupted; none restarted"

transitions:
  - "Start accepted: Running"
  - "session fails to open: Failed with reason `session did not open: ...`"
  - "task_commit succeeds: Committed"
  - "task_commit finds a link inside writes: Failed with the paths"
  - "turn ends with no commit: Failed with reason `ended without a commit`"
  - "turn fails: Failed with the turn's failure"
  - "Stop confirmed: Stopped"
  - "found Running at startup, its commit in git: Committed"
  - "found Running at startup, no commit: Interrupted"
# A turn whose end cannot be read keeps its scope held and is read again: an unread end
# proves nothing about whether the session can still write.

agreements:
  - rule: One matcher decides overlap at Start, the dirty check at Start and the commit.
    where: scope.rs

obligations:
  - rule: Start opens one Running attempt on an executor thread with the model given.
    tested_by: [start_opens_one_attempt_on_an_executor_thread]
  - rule: The same command id answers the same attempt, even once the plan could not start it; the same id with other input is a conflict.
    tested_by: [the_same_command_returns_the_same_attempt]
  - rule: A mark command is replayed, never applied again after a later mark, and its id names one mark.
    tested_by: [start_waits_for_needs_links]
  - rule: A task with an attempt that can still write cannot start again.
    tested_by: [a_second_start_while_running_is_busy]
  - rule: A task waits for the tasks its needs links name, in this plan or another plan's latest version, until they are marked done.
    tested_by: [start_waits_for_needs_links, start_waits_for_a_needs_link_to_another_plans_task]
  - rule: A draft, a superseded version and an archived plan cannot start.
    tested_by: [start_refuses_a_draft, start_refuses_a_superseded_version, start_refuses_an_archived_plan]
  - rule: A folder that is not git, or that has uncommitted changes inside the task's writes, cannot start.
    tested_by: [start_refuses_a_folder_that_is_not_git, start_refuses_uncommitted_changes_in_writes]
  - rule: Stop ends the attempt, closes its session, revokes its grant and frees its scope.
    tested_by: [stop_ends_the_attempt_and_closes_its_session, live_stop_ends_a_running_attempt_and_frees_its_scope]
  - rule: A Stop while Start opens the session leaves the attempt Stopped with no turn sent and no session open.
    tested_by: [live_stop_while_the_session_opens_sends_no_turn]
  - rule: A task's read answers its needs, whether Start may run and why not, by Start's own checks, without writing.
    tested_by: [the_task_answers_its_needs_start_and_suggested_model, a_done_mark_frees_the_tasks_that_need_it, the_folder_decides_start_not_git_and_dirty_scope]
  - rule: On the real adapter, an executor runs in mode default; a Write inside its writes runs unasked, one outside is refused and never reaches the folder or git.
    tested_by: [live_an_executor_writes_inside_its_task_in_mode_default_and_is_refused_outside]
  - rule: On a real executor session, a turn in any mode but default is refused before anything is written.
    tested_by: [live_an_executor_turn_in_another_mode_is_refused]
  - rule: A session that cannot open fails the attempt and frees its scope.
    tested_by: [a_session_that_fails_to_open_fails_the_attempt]
  - rule: A turn that ends without a commit fails the attempt.
    tested_by: [a_turn_that_ends_without_a_commit_fails_the_attempt]
  - rule: Recovery interrupts running attempts and restarts none; one whose commit git holds is Committed.
    tested_by: [recover_interrupts_running_attempts_without_restarting_them, a_crash_between_git_and_sqlite_recovers_as_committed]
  - rule: Tasks whose writes may meet cannot run together; disjoint ones can; two concurrent Starts admit one.
    tested_by: [overlapping_tasks_cannot_start_together, disjoint_tasks_start_together, two_concurrent_starts_of_overlapping_tasks_admit_one]
  - rule: A committed attempt holds its scope until its turn has ended.
    tested_by: [a_committed_attempt_holds_its_scope_until_its_turn_ends]
  - rule: A released executor thread opens again neither as an executor nor as a Planner, and an executor's first turn hears no Planner instructions, planning context or stage line.
    tested_by: [a_released_executor_thread_does_not_open_again, an_executors_first_turn_hears_no_planner_instructions, live_an_executors_first_turn_hears_no_planner_instructions]
  - rule: A commit holds only the changed paths inside writes; a path outside is left changed and named; a second commit is AlreadyCommitted.
    tested_by: [commit_takes_only_the_paths_in_writes, a_rename_from_outside_writes_leaves_its_origin]
  - rule: The person's staged entries outside the commit stay staged.
    tested_by: [a_persons_staged_file_stays_staged]
  - rule: Files no tool call wrote are committed when inside writes; ignored files never are.
    tested_by: [files_a_generator_wrote_are_committed, ignored_files_never_enter_the_commit]
  - rule: A path inside writes reached through a link or junction refuses the commit and fails the attempt; HEAD does not move.
    tested_by: [a_junction_inside_writes_refuses_the_commit]
  - rule: A HEAD that moved while the commit was written refuses it and loses nothing.
    tested_by: [head_moving_during_the_commit_is_refused]
  - rule: Commits in one folder run one at a time, each with its own paths.
    tested_by: [two_commits_at_once_are_serialized]
  - rule: An attempt's diff lists each file of its commit with its counts and patch.
    tested_by: [diff_returns_each_files_counts_and_patch]
  - rule: The matcher admits by pattern, with `*` stopping at `/`, an empty set admitting nothing, bad patterns refused and Windows separators normalised.
    tested_by: [a_star_does_not_cross_a_separator, no_patterns_admit_nothing, an_invalid_pattern_is_an_error, windows_separators_are_normalised]
  - rule: Two patterns may overlap unless their literal prefixes are disjoint folders; a pattern led by a glob or climbing out with `..` may overlap anything.
    tested_by: [a_folder_and_its_subfolder_may_overlap, a_folder_overlaps_its_subfolder_not_its_sibling, disjoint_folders_do_not_overlap, a_pattern_without_a_folder_may_overlap_anything, a_pattern_that_climbs_out_may_overlap_anything]

tests:
  shadows-core/tests/runs_attempts.rs: attempts through AppCore over the fake adapter, in a real git repository
  shadows-core/tests/runs_attempts/commit.rs: commits in a real git repository; the test plays the executor, no agent runs
  shadows/tests/runs_routes.rs: the HTTP routes over Runs, in a real git repository, with no adapter to open
  shadows/tests/runs_routes/live.rs: a task started over HTTP on the real adapter commits through task_commit on the real /mcp; ignored in CI
  shadows-core/tests/runs_attempts/live.rs: attempts on the real adapter against MiniMax in a real git repository; ignored in CI, run with API_KEY_MINIMAX and `-- --ignored --test-threads=1`
