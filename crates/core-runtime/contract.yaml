# Database infrastructure: core-db; domain rules and private stores remain here.
# Owns runtime identity rows and their journal events. Operations composes recovery and
# the Graceful unfinished-work guard with Runtime::stop_in in one write transaction.
name: runtime
version: 1
status: current
source: crates/core-runtime/src
modules:
  lib.rs: process identity registration
  model.rs: runtime identity values
  store/mod.rs: private runtime row persistence
shapes:
  Runtime:
    instance_id: private RuntimeInstanceId
    storage: Arc<Storage> # Exists only with test-support for the legacy fixture accessor.
  RuntimeStore:
    storage: "&Storage"
enums:
  StopKind:
    values: [Graceful, Escalated]
functions:
  service:
    instance_id: "Borrow the runtime identity without exposing mutable state."
    from_recorded: "Reconstruct a persisted runtime id without changing its text."
    start: "(storage: Arc<Storage>) -> Result<Self, StorageError>; registers the package version"
  transaction_writes:
    stop_in: Updates the unstopped runtime row and appends RuntimeStopped; caller checks owned work.
  transaction_reads:
    require_active_in: Refuses a stopped or unknown runtime before an operation is created.
    stop_kind_in: Reads one runtime stop kind for recovery anomaly reporting.
  store:
    register_runtime_instance: Inserts the identity and RuntimeStarted in one write.
  testing:
    storage_for_test: Legacy fixture handle, compiled only with test-support.
    register_runtime_instance_for_test: Registers the fixture's explicit version through RuntimeStore.
obligations:
  - rule: Register and stop journal events share the row transaction.
    tested_by: [registration_persists_identity_and_journal_together, stop_and_journal_roll_back_together]
  - rule: A stopped runtime cannot accept a Pending operation.
    tested_by: [stopped_runtime_refuses_work_and_duplicate_stop_without_another_event, a_turn_requested_after_shutdown_began_is_refused]
not_the_caller's:
  - Read runtime_instance directly; use the transaction-local Runtime methods.
  - Treat runtime registration as recovery; AppCore calls Operations::recover before accepting work.

shared_in_transaction:
  require_active_in: Operations checks the runtime before inserting Pending.
  stop_kind_in: Operations composes recovery anomaly reporting with runtime metadata.
  stop_in: Operations checks owned unfinished rows and persists the runtime stop in one transaction.
