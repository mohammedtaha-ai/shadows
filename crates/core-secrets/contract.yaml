# Database infrastructure: core-db; domain rules and private stores remain here.
# Owns encrypted profile environment values. No adapter or agent can read a value.
# It stores by scope and checks nothing upward: the owner of a scope (Agents for an
# agent, Providers for a provider key) checks its own row inside the write it runs
# and stores through put_in or remove_in.
name: secrets
version: 1
status: current
source: crates/core-secrets/src
shapes:
  SecretsError: Own validation, decryption and storage failures; contains no application error type.
  Secrets:
    store: private SecretsStore over the shared storage handle
    keys: Option<Keys>
  KeySource: OS master key or an injected optional key for tests.
  SecretKey:
    bytes: private 32-byte master key; Debug is redacted
  EnvEntry:
    name: String
    updated_at: String
  SealedEnv:
    fields: private profile, name, envelope and value fingerprint; stored only under the profile/name its AAD names
    value_mac: The keyed fingerprint the command record carries, never the value
  EnvWrite:
    fields: private secret_env.set command and its SealedEnv
    value_mac: Public keyed fingerprint for an owning command's replay record.
  EnvRemoval:
    fields: private secret_env.remove command, profile and name
functions:
  load_or_create: Serialize access to the Windows credential, creating only on NoEntry.
  provider_key_set: Read key presence without decrypting it.
  reserved_env_name: Identify routing names that agents cannot override.
  seal: public; check the key, the name and the value, then encrypt it into a SealedEnv before any transaction; set_env uses it too. Returns SecretsError.
  env_write: public; seal a value and build its secret_env.set command before any transaction.
  provider_key_write: public; env_write under the provider key scope and name.
  env_removal: public; check the key and the name shape and build the secret_env.remove command.
  provider_key_removal: public; env_removal under the provider key scope and name.
  replayed_write_in: public; the recorded entry when the write replays, inside the caller's write, before the caller's owner check.
  put_in: public; upsert one sealed value and record its command in the caller's write; Agents::set_env and Providers::set_key call it after their owner check.
  replayed_removal_in: public; whether the removal replays, inside the caller's write.
  remove_in: public; delete one value and record its command in the caller's write.
  remove_scope_in: public; delete one scope in the caller transaction; returns StorageError.
  provider_scope: public; the one place that names the provider key scope `provider/{slug}`; the key name is a private constant.
  mcp_scope: public; the one place that names an MCP server's scope `mcp/{id}`.
  mcp_value_write: public; seal one value under the MCP scope with the MCP name rule, before any transaction.
  EnvWrite.value_mac: public; expose only the prepared write's keyed value fingerprint to its owning command.
  mcp_value_removal: public; check the key and the MCP name shape and build the secret_env.remove command for the MCP scope.
  resolve_provider_key: Decrypted provider key for trusted provider probes and harness openings; None when unset or empty.
  new: Build a shared service over injected storage and an optional master key.
  list_env: Return metadata ordered by name, never values.
  set_env: Validate and encrypt a value of any scope, atomically classify/write/record one user command; checks no owner.
  remove_env: Atomically classify/delete/record one user command of any scope, replay without deleting again; checks no owner.
  resolve_env: Decrypt all profile pairs for a new harness opening; public for trusted harness openings and owner tests.
  validate_mcp_name: public; the MCP name rule beside validate_env_name, also checking a name whose value Extensions keeps unsent: 1..=128 of A-Z a-z 0-9 - _, reserved names refused.
  validate_env_name: Shared uppercase name validation including reserved names; removal checks the shape only.
obligations:
  - rule: A shared per-user OS file lock covers read, create and readback across daemon databases.
    tested_by: [master_key_creation_waits_for_the_other_starter, absent_master_key_is_created_once]
    note: The persistent lock file is empty; OS handle close releases the lock, including on crash.
  - rule: Wrong lengths or read errors never overwrite an existing entry or expose its bytes.
    tested_by: [wrong_length_master_key_is_never_replaced, unreadable_master_key_is_never_replaced]
    note: Tests use in-memory keyring entries; real credential-store acceptance is pending.
  - rule: The backend is windows-native; non-Windows loading fails without a mock fallback.
    tested_by: none
    note: Compilation is checked by the platform CI gate.
  - rule: Values never enter metadata, command records or diagnostic output.
    tested_by: [list_names_in_order_without_values, value_absent_from_db_wal_shm_and_command_record]
  - rule: AEAD binds each row to profile/name; malformed envelopes return an error.
    tested_by: [moved_row_is_unreadable, short_nonce_is_an_error_not_a_panic, unknown_format_is_an_error]
  - rule: HMAC fingerprints conflict on a changed value while exact replays keep the original result.
    tested_by: [replay_same_value_replays, replay_other_value_conflicts, hkdf_keys_differ]
  - rule: An unavailable key refuses every operation; another key still lists names.
    tested_by: [no_key_refuses_every_method, other_master_key_lists_but_cannot_resolve]
  - rule: A reserved name is refused at set but can be removed, so a row the opening names can go.
    tested_by: [lower_case_bad_and_reserved_names_are_refused, reserved_name_can_be_removed]
  - rule: MCP names are 1..=128 of A-Z a-z 0-9 - _; reserved names are refused in every scope.
    tested_by: [mcp_names_follow_their_own_rule, mcp_scope_refuses_reserved_names]
  - rule: MCP values live under mcp/{id}, resolve with resolve_env and never enter the database in clear or a command record.
    tested_by: [mcp_values_round_trip_under_their_scope, mcp_value_absent_from_db_and_command_record]
  - rule: Prepared MCP writes expose a keyed fingerprint that changes with the value, never the value itself.
    tested_by: [mcp_write_fingerprint_is_keyed_and_value_sensitive]
agreements:
  - between: [set_env, provider_key_write]
    must: Validate names and values through the same rules before storing ciphertext; both go through env_write and put_in.
    holds: true
    tested_by: [lower_case_bad_and_reserved_names_are_refused, provider_key_is_write_only]
not_the_caller's:
  - Do not duplicate validation or encryption in adapters.
  - Adapters never resolve plaintext; the architecture ratchet checks both instance and associated calls.
tests:
  - name: seal_open_round_trips
    checks: A sealed synthetic value resolves without printing it.
  - name: open_with_other_aad_fails
    checks: Another associated-data name fails authentication.
  - name: open_with_other_key_fails
    checks: Another master key fails authentication.
  - name: replace_keeps_one_row
    checks: Replacement resolves to the newest synthetic value.
  - name: remove_drops_the_row
    checks: Removal and replay leave no row.
  - name: empty_nul_and_oversized_values_are_refused
    checks: Invalid values are refused before storage.

# These transaction methods are on Secrets in src/lib.rs, not exposed store functions.
# Agents and Providers call put_in and remove_in; remove_scope_in is used by
# Agents::delete_in and Providers::delete_in.
shared_in_transaction:
  replayed_write_in: Replay the sealed write before checking the caller owner.
  replayed_removal_in: Replay the removal before checking the caller owner.
  put_in: Persist a sealed write in the caller transaction.
  remove_in: Persist a removal in the caller transaction.
  remove_scope_in: Remove one scope in the caller transaction.
