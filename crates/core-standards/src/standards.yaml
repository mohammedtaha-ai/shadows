# Compiled-in base standards. A reviewed change increments version.
version: 3
parts:
  - name: backend
    owns: "The business logic, in modules, reached through one owner object."
    presence: required
    layers:
      - id: domain
        role: "Business rules and the state they guard"
        required: true
        may_use: []
      - id: application
        role: "Use cases: one operation each, and the ports it needs"
        required: true
        may_use: [domain]
      - id: interface
        role: "Receives HTTP/queue/console input and calls one use case"
        required: true
        may_use: [application, api.contract]
      - id: infrastructure
        role: >-
          Implements the application's ports: repositories over the database,
          and technical adapters such as mail, files and clock
        required: true
        may_use: [domain, application, database.schema, database.connection]
      - id: composition
        role: "Builds every module once and wires ports to implementations"
        required: true
        may_use:
          [domain, application, interface, infrastructure, integration.adapters]
  - name: database
    owns: >-
      The schema and storage: the only part that touches the database;
      migrations are append-only.
    presence: required
    layers:
      - id: schema
        role: "Tables, columns, keys and relations"
        required: true
        may_use: []
      - id: migrations
        role: "Append-only changes that produce the schema"
        required: true
        may_use: [schema]
      - id: connection
        role: "How the application connects: driver, pool, transactions"
        required: true
        may_use: []
  - name: api
    owns: >-
      The only path between the frontend and the backend, with a versioned contract.
    presence: waivable
    layers:
      - id: contract
        role: "The versioned contract the clients build against"
        required: true
        may_use: []
  - name: frontend
    owns: "The interface only, with no business rules."
    presence: waivable
    layers:
      - id: screens
        role: "What the person sees: routes and pages"
        required: true
        may_use: [features, design_system]
      - id: features
        role: "A feature's interactions and its state"
        required: true
        may_use: [data_access, design_system]
      - id: data_access
        role: "The only code that calls the api"
        required: true
        may_use: [api.contract]
      - id: design_system
        role: "Shared components and tokens"
        required: false
        may_use: []
  - name: integration
    owns: "The adapters to outside services, each one talking to one of them."
    presence: optional
    layers:
      - id: adapters
        role: "Talks to one outside service and implements a backend port"
        required: true
        may_use: [backend.application]
rules:
  - id: S1
    text: >-
      Each service owns its tables and reads no other service's; it asks the owning service.
    parts: [backend, database]
  - id: S2
    text: "The frontend reaches data only through the api."
    parts: [frontend, api]
  - id: S3
    text: "Every part has a contract head in Shadows."
    parts: []
  - id: S4
    text: "Migrations are never edited; a change is a new migration."
    parts: [database]
  - id: S5
    text: >-
      Ordering is explicit: a sequence, an ordinal or another stable key,
      never insertion order.
    parts: [backend, database]
  - id: S6
    text: >-
      The database code is its own part or layer. Business logic reaches the
      database only through the layer that owns it. A change of database stays
      in that owner.
    parts: [backend, database]
  - id: S7
    text: "A layer depends only on the layers its may_use lists."
    parts: []
  - id: S8
    text: >-
      The domain and application layers never name a database, framework or
      outside service. They declare a port, and an outer layer implements it.
    parts: []
  - id: S9
    text: >-
      Each part owns one folder. Each layer records where it lives, in the
      layout the framework and the person chose.
    parts: []
  - id: S10
    text: >-
      Each runnable part has one owner object (its AppCore). It builds every
      service once and is the one way in from outside: an adapter such as an
      HTTP route or a CLI reaches a service only through it. Services reach
      each other through their declared dependencies, never through the owner,
      so it does not become a go-between for every internal call. A rule lives
      in one service, and there is no second way in.
    parts: []
