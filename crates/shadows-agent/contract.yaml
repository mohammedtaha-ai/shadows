name: shadows-agent
version: 1
status: current
source: crates/shadows-agent/src
purpose: Translate one managed harness process, ACP v1 or Codex app-server, into harness operations and events.

modules:
  connection.rs: The protocol-neutral managed connection and the session and prompt values it carries.
  acp.rs: Public ACP connection types, re-exporting the neutral values.
  acp/connection.rs: Transport initialization and ordered inbound dispatch.
  acp/session.rs: Session opening and configuration requests.
  acp/prompt.rs: Prompt, steering and cancellation requests.
  acp/permissions.rs: Settlement of held permission requests.
  acp/mapping.rs: Translation of session updates to HarnessEvent.
  codex.rs: The configured Codex executable, its process-local Planner launch policy and handshake.
  codex/connection.rs: Ordered JSONL dispatch for one app-server child.
  codex/protocol.rs: What Shadows uses of the app-server protocol, compared against a CLI's.
  codex/tested_protocol.json: The tested protocol extract; its version is the floor.
  codex/session.rs: Thread opening, MCP inventory verification and native model choices.
  codex/prompt.rs: Turn start, binding to the acknowledged turn and confirmed interruption.
  codex/mapping.rs: Translation of the active turn's notifications to HarnessEvent.
  choices.rs: Parsing adapter-provided session configuration.
  claude.rs: Launch specification for the configured Claude adapter.
  policy.rs: Supported harnesses, their allowed modes, and the executor's own mode.
  profile.rs: Explicit provider environment for a Claude invocation.
  usage.rs: Connection-local attribution of cumulative session cost to prompts.

functions:
  Connection::open: Initializes ACP v1 over the managed process pipes.
  Connection::start_session: Sends new, resume, or fork followed by resume, in the cwd it is given; the setup's permission rules travel in settings.permissions.allow.
  Connection::prompt_blocks: Sends ordered content and reports completion with optional usage.
  Connection::steer_blocks: Sends the adapter steering extension without starting an idle prompt.
  Connection::stop_task: Requests the adapter to stop one background task.
  Connection::cancel: Refuses held permissions and sends a session cancel notification.
  ManagedConnection: >
    A finite ACP or Codex enum with the same session, prompt, option, cancel,
    steering, task and permission operations. Errors are ConnectionError;
    Codex answers task stop with an Rpc refusal. Both hold permission requests
    the same way (acp::Permissions), each answered back in its own protocol.
  policy::EXECUTOR_HARNESSES: The harnesses that can execute plan tasks, when configured (claude-code, codex).
  policy::executor_mode: >
    The one mode an executor session of a harness runs in, unattended: Claude
    Code's `auto`, Codex's Approve for me (`ask`), whose own reviewer answers
    its approvals; None for a harness that cannot execute. Runs' check on the
    reported commit is the write boundary. Offered::refusal accepts it beside
    the policy's allowed modes.
  policy::default_mode: >
    The mode a new conversation starts in: `auto` for a Claude Code Planner, `acceptEdits`
    for AYLUL, `ask` for Codex. Tested by the_initial_and_unattended_modes_are_allowed and
    claude_policy_is_accept_edits_and_auto_and_codex_is_read_only.
  CodexProgram::new: Holds the configured executable and dedicated Codex home.
  CodexProgram::process_spec: >
    `app-server --listen stdio://` with apps, plugins, hooks, multi-agent and
    web search off, the project forced untrusted, the bearer variable excluded
    from shells, the `shadows_ask` permission profile (default_permissions, and
    its filesystem: `:root` read, `:tmpdir` write, the project and its `.git`
    write, `.git/hooks` and `.git/config` read, `.git/config.lock` deny; the
    project path with forward slashes) and (Windows) the MXC sandbox. The environment carries
    CODEX_HOME and the thread grant; arguments never carry the grant.
  CodexProgram::catalog_spec: >
    The same app-server launch as process_spec without a thread grant in its
    environment, used only to read the model catalog.
  CodexProgram::check: >
    Runs the CLI's --version and app-server generate-json-schema --experimental
    (the connection opens with experimentalApi, for `permissions`) in a scratch
    folder it then removes, with catalog_spec's environment. Refuses a CLI below
    the tested snapshot's version ("Codex CLI {tested} or later is required")
    without generating; otherwise extracts the used methods, answers,
    notifications and every definition they reach, and refuses removals and
    changes (a removed method, definition, property or variant; a changed type
    or $ref; a removed enum value; a changed or new required property),
    naming five then "and N more". Additions pass. A failed generator answers
    its first stderr line. Answers CheckedCodex { version }.
  CodexProgram::adopt: >
    The installed CLI's extract in the snapshot form with sorted keys, which
    the ignored adopt_the_installed_codex_protocol test writes to
    tested_protocol.json.
  codex::Connection::open: >
    Initializes app-server with experimentalApi on the checked version and refuses a userAgent with
    another one: "Codex CLI changed to {found}; it is checked again on the next
    opening". ManagedConnection::open takes that version as codex: Option<&str>.
  codex::Connection::start_session: >
    Refuses a dedicated home with MCP configuration or without a ChatGPT
    sign-in, opens, resumes or forks the thread in Codex's default mode,
    Approve for me (id `ask`): permissions `shadows_ask` (never `sandbox`: a
    legacy sandbox replaces the profile, probed 2026-11-24 on codex-cli 0.171.0),
    approvalPolicy on-request and approvalsReviewer auto_review (refused unless
    Codex answers that mode's own activePermissionProfile id, or a legacy mode's
    sandbox type, and its approval and reviewer), and the one
    required Shadows server, then refuses any inventory
    beyond the permitted tools. A thread opened without an effort reports its
    model's catalog default, which Codex applies.
  codex::Connection::prompt_blocks: >
    Starts a turn with the selected model, effort and mode (the mode's
    sandbox, approvalPolicy and approvalsReviewer: Read only is sandboxPolicy
    readOnly, never and user; Approve for me is permissions `shadows_ask`,
    on-request and auto_review, so it commits with no approval round, a hook
    write and `git config` stay refused, Codex's reviewer allows or denies each
    request and none is held for the person) and answers only its
    matching turn/completed. A failed turn is Refused in the provider's own
    first line, cut before any bearer value; RPC errors carry the same text.
  codex::Connection::steer_blocks: >
    Sends turn/steer to the acknowledged running turn (Injected); with none
    running nothing starts (PromptRequired).
  codex::Connection::model_choices: >
    Refuses a home without a ChatGPT sign-in, then answers Codex's native model
    list in its order, each model with its own efforts.
  codex::Connection::cancel: Interrupts the acknowledged turn; the matching terminal event settles it.
  codex::Connection::last_error: >
    The last ERROR line app-server wrote on stderr, its colours and span prefix
    removed and cut as a provider's words are (first line, 300 chars, before any
    bearer value); none before one. A request Codex is still waiting on (thread/start
    behind its model-list refresh) answers nothing, so this is the only reason there
    is. ManagedConnection::last_error answers it, and none for ACP.
  codex_fork: SessionStart::Fork opens thread/fork from the source thread, which is never resumed or written.
  codex_usage: >
    thread/tokenUsage/updated for the active turn becomes Usage with
    `last.totalTokens` and `modelContextWindow` (missing or zero is 0,
    unknown); the turn's TurnUsage sums each request once, skipping repeated
    reports whose total did not grow. Reports for other turns, including
    those replayed on resume, are dropped.
  codex_limits: >
    account/rateLimits/read, sent in the background at opening so a slow
    provider never delays setup, and account/rateLimits/updated give
    the five-hour (300 min) and weekly (10080 min) windows to every Usage as
    the account-limit report AccountLimits::from_report reads.

obligations:
  - rule: Typed session updates are mapped in dispatch order; unknown kinds can use the raw task fallback.
    tested_by: [async_task_updates_become_task_events]
  - rule: The background task stop is scoped to a session and task id.
    tested_by: [stopping_a_task_asks_the_adapter]
  - rule: A peer RPC failure is distinct from a closed incoming transport.
    tested_by: [a_server_error_mentioning_connection_closed_is_still_an_rpc_error, codex_eof_fails_pending_work]
  - rule: Planner session setup distinguishes an absent tool restriction from an explicit empty list.
    tested_by: [absent_and_empty_tool_policies_are_distinct]
  - rule: The launch specification uses the configured Node, adapter and Claude executable.
    tested_by: [configured_adapter_preserves_launch_identity]
  - rule: >
      Codex text streams before its turn completes, split JSONL frames are
      joined, and unknown notifications are ignored.
    tested_by: [codex_streams_before_completing, codex_unknown_notifications_are_ignored]
  - rule: >
      A Codex turn ends only on its own turn/completed: an interrupt
      acknowledgment or another turn's terminal event does not settle it.
    tested_by: [codex_interrupt_waits_for_the_matching_terminal_event,
      codex_cannot_finish_a_replacement_generation]
  - rule: >
      A Codex command or file-change approval is held with Allow (accept,
      allow_once) and Decline (decline, reject_once) until the person answers;
      the answer goes back as its decision, a refusal or the turn's end as
      decline. A permissions approval is still answered empty at once.
    tested_by: [codex_approvals_wait_for_the_person, codex_approval_waits_for_the_person]
  - rule: >
      A Codex CLI opens only at or above the tested version and with the used
      protocol unchanged; additions pass, removals and changes refuse by name.
    tested_by: [the_tested_protocol_matches_itself, an_added_optional_property_passes,
      an_added_method_passes, an_added_enum_value_passes, a_removed_method_refuses_and_names_it,
      a_removed_property_refuses_and_names_it, a_changed_type_refuses,
      a_newly_required_parameter_refuses, a_removed_union_variant_refuses,
      versions_compare_by_number, the_snapshot_holds_every_used_method,
      the_refusal_names_five_changes_then_counts]
  - rule: The Codex grant reaches only the child environment, under the isolation settings.
    tested_by: [the_codex_grant_reaches_only_the_child_environment]
  - rule: >
      Codex models come from every model/list page in order, efforts from the
      selected model only, and the one mode from policy.
    tested_by: [codex_choices_follow_the_model_catalog, codex_efforts_belong_to_the_selected_model]
  - rule: A provider's refusal reaches the person in its own words, without credential text.
    tested_by: [codex_unavailable_model_reports_its_error]
  - rule: >
      A Codex opening that times out names the last error Codex logged on stderr.
    tested_by: [a_codex_start_past_setup_wait_names_what_codex_logged]
  - rule: >
      The context figure is the last request, never the running total, and a
      resumed thread's replayed history and usage are not new output.
    tested_by: [codex_usage_is_last_request_not_cumulative, codex_usage_is_not_double_charged_on_resume,
      codex_resume_does_not_replay_entries]
  - rule: Fork and Send now use thread/fork and turn/steer.
    tested_by: [codex_fork_keeps_the_source_unchanged, codex_steer_targets_the_active_turn]
  - rule: >
      New projects allow both Codex modes, Approve for me (the default) and
      Read only; each turn sends its mode's sandbox, approval and reviewer,
      and Read only holds no approval.
    tested_by: [new_projects_allow_both_codex_modes, codex_each_mode_sends_its_sandbox_and_approval,
      codex_read_only_holds_no_approval]
  - rule: >
      A Codex conversation in `ask` can commit (Mohammed, 2026-11-24): its profile writes the
      project and its `.git`, and refuses a hook write and `git config`.
    tested_by: [live_a_codex_conversation_in_ask_commits_but_keeps_hooks_and_config]

boundaries:
  - Process creation and containment belong to shadows-process.
  - Applying Core's remembered mode and selecting the project session belong to core-harness.
  - The SDK owns ACP message definitions. Claude adapter code is installed from npm.
  - The installed Codex CLI owns the app-server; Shadows never installs or patches it.
