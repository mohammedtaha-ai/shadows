[package]
name = "shadows-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
core-project-lifecycle = { path = "../core-project-lifecycle" }
core-turns = { path = "../core-turns" }
core-plans = { path = "../core-plans" }
core-design = { path = "../core-design" }
core-harness = { path = "../core-harness" }
core-operations = { path = "../core-operations" }
core-grants = { path = "../core-grants" }
core-threads = { path = "../core-threads" }
core-extensions = { path = "../core-extensions" }
core-agents = { path = "../core-agents" }
core-code = { path = "../core-code" }
core-standards = { path = "../core-standards" }
core-instructions = { path = "../core-instructions" }
core-person = { path = "../core-person" }
core-usage = { path = "../core-usage" }
core-projects = { path = "../core-projects" }
core-db = { path = "../core-db" }
core-runtime = { path = "../core-runtime" }
core-secrets = { path = "../core-secrets" }
core-providers = { path = "../core-providers" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { workspace = true, features = ["rustls"] }
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
anyhow = { workspace = true }
dunce = { workspace = true }
escargot = { workspace = true, optional = true }
futures-core = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
petgraph = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
json-patch = { workspace = true }
sha2 = { workspace = true }
shadows-agent = { path = "../shadows-agent" }
shadows-index = { path = "../shadows-index" }
shadows-process = { path = "../shadows-process" }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
utoipa = { workspace = true }
yaml-rust2 = { workspace = true }

[features]
# Compiles in `testing` (spec §14.6): storage, the runtime and the sessions
# below the services, `append_event_for_test` (a hook onto an otherwise-private
# capability, `append_event` without a state write, that must never ship in an
# ordinary build — see cross-cutting rule 10), and the test binaries it builds
# through `escargot`; plus `<Id>::from_literal`, the test-only store methods
# and `shadows-process`'s `force_termination_failure`. Enabled for
# `cargo test` only via the self dev-dependency below, and by `shadows`' and
# `fake-acp`'s own `test-support`; never a default feature.
test-support = ["core-project-lifecycle/test-support", "core-turns/test-support", "core-plans/test-support", "core-design/test-support", "core-harness/test-support", "core-operations/test-support", "core-grants/test-support", "core-threads/test-support", "dep:escargot", "shadows-process/test-support", "core-db/test-support", "core-runtime/test-support", "core-secrets/test-support", "core-providers/test-support", "core-projects/test-support", "core-code/test-support"]

[dev-dependencies]
tempfile = { workspace = true }
# `tests/contracts.rs` (spec §14.7): the contracts are YAML, the sources Rust.
syn = { workspace = true }
# Enables `test-support` for integration tests (tests/*.rs) without turning
# it on for `cargo build` or `cargo run`.
shadows-core = { path = ".", features = ["test-support"] }
