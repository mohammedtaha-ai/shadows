obligations:
  - rule: >
      The index follows the files: a scan indexes a new file, re-indexes a
      changed one (its size or modified time differs), and deletes the rows
      of one that is gone; `target/`, `node_modules/`, hidden entries and
      what a `.gitignore` in the folder names (with no `.git` anywhere) are
      never indexed; a file over 1 MB is recorded as too_large with no tags.
    tested_by: indexing_follows_the_files

  - rule: >
      While a project is active its index stays true without a request: the
      worker's first scan indexes it, a change the watcher reports is
      indexed once no path has arrived for `debounce`, and a change the
      watcher never delivers is found by the periodic scan within
      `rescan_every`.
    tested_by: watching_and_the_periodic_scan_keep_the_index_true
    note: >
      The body pauses the worker's `Files` jobs (not its watcher) before
      writing b.rs, so only the periodic scan can index it. The watcher's
      own path (create, delete, a `.gitignore` starting a scan) was run once
      by hand and is held by no test.

  - rule: >
      A folder renamed or deleted inside an active project is in the index
      once no path has arrived for `debounce`, not at the next periodic scan:
      the watcher reports only the folder, so a batch holding a path that is
      gone and not a code file, or a folder the index holds no file under
      (moved in), is handled as one scan (outside target/, node_modules/ and
      hidden entries, which never start one). A folder with indexed files,
      which Windows reports on every save inside it, starts none: its files'
      own paths go as `Files`. One batch starts at most one scan, and the
      worker runs it inline, so no second is queued behind it.
    tested_by: none
    note: >
      Mohammed's Windows run, check 3, exercises it. Checked once by hand
      with a throwaway test (rescan_every 60 s, debounce 500 ms): a renamed
      folder's function answered at its new path in about 0.7 s, a deleted
      folder's rows were gone in about 0.7 s, a folder moved in from outside
      was answered in about 0.6 s, and saves and a new file inside an indexed
      subfolder started no scan; with the rule switched off, a rename was not
      answered within 10 s.

  - rule: >
      A question never points at a stale line: before it answers,
      `definitions`, `references` and `outline` stat the files of their
      first 50 hits, send the changed or gone ones to the project's worker
      as `Recheck`, wait at most 2 s, and ask again once.
    tested_by: watching_and_the_periodic_scan_keep_the_index_true
    note: >
      A save through rename (write `.a.rs.tmp`, rename it over a.rs) is
      answered at its new line at once; with `recheck` made to send nothing
      the body fails at that assertion.

  - rule: >
      Only the `active_limit` most recently used projects with a folder are
      active, each with one worker; `start` orders them by their last turn
      (else their creation), and a use (`touch`: a turn, a listing of
      threads, a creation, a question) puts the project's links, then the
      project, first, the least recently used leaving. A question about an
      inactive project answers from its rows with the state Indexing.
      A project evicted and used again before its old worker finished its
      file never has two writers: the new worker awaits the old task first.
    tested_by: only_the_most_recent_projects_are_watched
    note: >
      The one-writer part is structural (`settle` hands `leaving`'s task to
      `Worker::spawn`); no test evicts a project mid-scan.
      The body has six projects with no turn, so the order is by creation;
      it does not order by a turn, and it makes no link, so a link's
      activation before its project is held by no test.

  - rule: >
      `touch` never fails its caller and never waits on a scan: an error is
      logged and dropped, and the scan runs in the worker.
    tested_by: none
    note: >
      Structural: `touch` returns `()`. `Turns::send`, `Threads::list` and
      `Projects::create` call it after their own work succeeded.

  - rule: >
      No path outside the project's folder is ever read. The walk reads no
      parent's ignore file and no global one, and follows no link;
      `index_file` stats with `symlink_metadata`, and before it opens a file
      its canonical path must be the path inside the folder's canonical
      path, so a link or junction on the way, or a name Windows normalises,
      is skipped and logged; `outline` refuses an absolute path, a ':' or a
      '..' component, and reads the index only.
    tested_by: the_scope_is_the_project_and_its_links_only
    note: >
      `inside`, the WalkBuilder settings, `symlink_metadata` and
      `names_itself` are the whole rule. The body asks `outline` for "../"
      only; a test would also ask for "/x" and "C:/x", and have the
      watcher report a file under a junction leading out of the folder.

  - rule: >
      A folder that is missing, or vanishes, keeps its index: the scan
      returns before walking and skips step 6, `index_file` deletes a gone
      file's rows only while `folder_exists`, and the worker answers
      DirectoryMissing and drops its watcher. When a periodic scan finds
      the folder again, a new watcher is made and the folder scanned.
    tested_by: none
    note: >
      A test would index a folder, rename it away, wait a periodic scan,
      find the hits still answered with DirectoryMissing, bring it back and
      see a new file indexed through the watcher.

  - rule: >
      One short transaction per file: `write_code_file` and
      `delete_code_file` each run one `write_txn` for one file, and
      `extract` runs before it, on a blocking thread, outside any
      transaction. The watcher's handler never awaits.
    tested_by: none
    note: >
      Structural: read in `index_file`, the two store methods and `forward`.

  - rule: >
      Shutdown stops every worker after the file it is on: `stop` sets the
      flag that `scan_project`, `files` and `recheck` check between files
      and wakes the task, and `shut_down` awaits every task, those of
      workers that left the active set included, before
      `AppCore::shut_down` runs §8.5.
    tested_by: none
    note: >
      Both new tests end with `shut_down_for_test`, which returns; none
      stops a worker in the middle of a scan.

  - rule: >
      An answer carries at most 50 hits, ordered by the scope's order, then
      path and line; `more` is true when a 51st exists.
    tested_by: none
    note: >
      `indexing_follows_the_files` checks the order of two outline hits
      only. A test would index 51 definitions of one name.

  - rule: >
      Suggestions come only when there is no hit, at most 10, in the
      question's own role, containing the text case-insensitively.
    tested_by: indexing_follows_the_files
    note: The body checks "amm" suggests exactly "gamma".

  - rule: >
      A question's scope is the asker's project and its direct links, one
      way; an `only` outside it is refused GRANT_SCOPE under a grant and
      INVALID_COMMAND for a person, and an unnamed question never answers
      from a project outside it.
    tested_by: the_scope_is_the_project_and_its_links_only
    note: >
      With `projects` made to let `only` name any project, the body fails at
      its first `secret` assertion: `where_is` { key, project: secret } is
      answered with secret's hit instead of refused. A link's own links
      (activation or scope) are held by no test.

  - rule: >
      Links and the active limit change only by command: ProjectLinkPut,
      ProjectLinkRemove and CodeActiveLimitSet, each one write with its
      replay, its event and its command record. A link to itself or to no
      project, removing a link that is not there, and a limit outside
      1..=20 are INVALID_COMMAND, with nothing written; linking twice
      answers the link. A new limit is followed at once.
    tested_by: the_scope_is_the_project_and_its_links_only
    note: >
      The body makes one link through the route and nothing else; the
      refusals, the replays, the events and the limit are held by no test.
      A test would link twice, unlink twice, link to itself and to a random
      id, and set the limit to 0, 21 and then 1 and see four workers stop.


agreements:
  - between: [scan_project, files, recheck]
    must: index a file the same way
    holds: true
    why: >
      All three call `index_file` for each path, and nothing else writes a
      file's rows; `scan_project` deletes the keys its walk did not see
      itself only because the walk, not the disk, decides they left the
      scope.
    tested_by: watching_and_the_periodic_scan_keep_the_index_true
  - between: [walk, files]
    must: >
      decide keep-or-skip by the same rules, so the index does not depend on
      which path saw a change
    holds: true
    why: >
      `walk` keeps what passes `keeps` and the ignore files; the watcher's
      batch passes `keeps`, then `kept_now`, which is `walk` limited to the
      batch's files and the folders above them, reading the same ignore
      files. `forward` drops target/ and node_modules/ with the walk's own
      `never_walked`.
    tested_by: indexing_follows_the_files
    note: >
      The test holds the walk's side; the watcher's `.gitignore` handling
      was run once by hand.


not_the_caller's:
  - >
      Check the scope, resolve a slug, or join a path to a project's folder
      yourself: an adapter passes the asker, `only` and the text to `Code`,
      which owns `projects` and `inside`.
  - >
      Check a link or a limit, or build their fingerprints, yourself: an
      adapter passes the command id and the ids or the number to `link`,
      `unlink` or `set_active_limit`, which refuse and record.
  - >
      Filter a changed path or write a file's rows yourself: `keeps` and
      `index_file` are the only implementation of either.
  - >
      Start or stop a worker yourself: call `touch` for a use, `forget` for
      a removal; `start` and `shut_down` belong to `AppCore`.


tests:
  - name: indexing_follows_the_files
    checks: >
      After one scan: `alpha` is defined at src/a.rs:1 with its signature,
      referenced from src/b.rs with matched_by "name"; definitions in
      target/ and in a file a nested .gitignore names are absent; status
      counts one too_large file. After changing a.rs (line 3), deleting b.rs
      and adding c.ts: alpha is at line 3, has no reference, gamma has one
      definition, outline "src" is [alpha, gamma], and "amm" answers no hit
      with the suggestion ["gamma"].
  - name: watching_and_the_periodic_scan_keep_the_index_true
    checks: >
      With a 400 ms scan and a 100 ms debounce: `one` is found after start;
      a save through rename is answered at line 2 at once (the re-check);
      with the worker's `Files` jobs dropped, a new b.rs's `two` is found
      (the periodic scan).
  - name: only_the_most_recent_projects_are_watched
    checks: >
      Six projects, default config: five are active; the sixth answers
      status Inactive; a question about it answers Indexing or Ready; then
      it is active, five still are, and the least recently used one left.
  - name: the_scope_is_the_project_and_its_links_only
    checks: >
      demo linked to backend through PUT …/code/links/{linked}; secret not
      linked. Over a project grant: where_is orders answers "backend:
      src/api.rs:1 function orders", and so does naming backend; naming
      secret is GRANT_SCOPE; unnamed, `key` never mentions secret; over HTTP
      naming secret is 422 INVALID_COMMAND; outline "../" is refused "the
      path must be inside the project"; backend naming demo is 422
      INVALID_COMMAND (one way).
