# Owns plan versions under the rules of spec §13: every read, start, edit,
# showing and approval of a plan ends in a `Plans` method, whether a person
# asked over HTTP or an agent over MCP (§14.4).
#
# A grant decides reach and writer. Both grant kinds name a plan version in
# their project; a thread grant (the internal Planner) edits only an Active
# plan's latest version and writes as its thread, while a project grant writes
# as its grant. That
# check (`in_scope`) runs before storage; storage checks the writer again
# inside every write's transaction (`check_writer`, owned by Grants' store).
#
# Trap: the `*_for` methods ARE the scope check. A caller that reads through
# `get` or `list` for an agent has skipped it — those two are the person's
# reads and check nothing. Trap: `DraftStart`, `PlanEdit` and `PlanShow`
# carry what the tool received; the command id and fingerprint are built
# here, never by the caller, so a replay matches only when the same
# parameters reach this service.

name: plans
version: 2
status: current
source: crates/shadows-core/src/plans


shapes:
  AgreementBinding:
    task: u32
    agreement_id: AgreementId
    version: i64
    part_id: PartId
    role: AgreementRole
    operations: Vec<String>
  Plans:
    storage: Arc<Storage>
    handles: Arc<LiveHandles>
    # Live only: a `plan_show` signal nobody receives is not a failure.
    ui: broadcast::Sender<UiSignal>
  DraftStart:
    title: Option<String>
    goal: Option<String>
    # The plan to continue; absent when starting a new plan.
    plan_id: Option<PlanId>
    # Why a next version is started (§16.3); storage requires a non-blank one
    # from v2 on and ignores it for v1 and for an existing Draft. In the
    # fingerprint only when present.
    reason: Option<String>
    # External agents only; required for them, and it is the command's id.
    draft_ref: Option<String>
  PlanEdit:
    # Required by `in_scope`; it names the version to edit.
    workflow_id: Option<WorkflowId>
    expected_revision: i64
    ops: Vec<PlanOp>
    # When absent, derived from `expected_revision` and the fingerprint.
    command_id: Option<String>
  PlanShow:
    # Names a version in the Planner's project.
    workflow_id: Option<WorkflowId>
    task_number: Option<u32>
    place: Place
  PlanShown:
    workflow_id: WorkflowId
    version: i64
    task_number: Option<u32>
    place: Place
    entry_id: ThreadEntryId
    # Never serialized or recorded: true when the call replayed a recorded one.
    replayed: bool
  Plan:
    bindings: Vec<AgreementBinding>
    # Derived latest dependency previews, excluded from canonical PlanContent.
    # MCP omits unreachable incoming previews and redacts outgoing metadata.
    linked_tasks: Vec<LinkedTask>
    # One plan version as stored: id, plan_id, plan_state, project_id (its
    # plan's), version, revision, state, title, goal, previous, tasks, links,
    # last_edit, frozen_at, created_at, and the four below.
    written_by: WrittenBy
    # NULL for v1 and for every version before migration 0012; a reader tells
    # them apart by the version number.
    change_reason: Option<String>
    # Empty for a Frozen version; `approval_problems` of the content for a Draft.
    blockers: Vec<Problem>
    # The version copied from this one; changes after the fact, which is why a
    # replayed approval answers `Approved`, never the plan.
    next: Option<WorkflowId>
  PlanListing:
    # A plan by its latest version (`id`), ordered by the plan's `created_at`
    # (by `julianday`), then its id.
    plan_id: PlanId
    plan_state: PlanState
    id: WorkflowId
    title: String
    version: i64
    state: WorkflowState
    updated_at: String
  PlanMap:
    project_id: ProjectId
    plans: Vec<MapPlan>
    links: Vec<MapLink>
  MapPlan:
    # Latest captured metadata; a missing version is unavailable, never invented.
    plan_id: PlanId
    project_id: ProjectId
    project_name: String
    plan_state: PlanState
    workflow_id: Option<WorkflowId>
    title: String
    goal: String
    version: Option<i64>
    state: Option<WorkflowState>
    task_count: u32
    removed: bool
  MapLink:
    plan_id: PlanId
    after: PlanId
    count: u32
    broken: bool
  PlanVersions:
    plan_id: PlanId
    project_id: ProjectId
    state: PlanState
    archived_at: Option<String>
    versions: Vec<VersionLine>
  VersionLine:
    workflow_id: WorkflowId
    version: i64
    state: WorkflowState
    title: String
    written_by: WrittenBy
    change_reason: Option<String>
    created_at: String
  PlanContent:
    # What an edit batch changes; `Plan::content()` rebuilds it from a Plan.
    title: String
    goal: String
    # Keyed by task number, not by id.
    tasks: BTreeMap<u32, TaskContent>
    links: Vec<Link>
  PlanTask:
    # The stable id; the number is inside `content`, flattened on the wire.
    id: TaskId
    content: TaskContent
  TaskContent:
    # A plan-local number: `T4` is task 4 of this version only.
    number: u32
    title: String
    goal: String
    reads: Vec<String>
    writes: Vec<String>
    acceptance: Vec<AcceptanceItem>
  AcceptanceItem:
    number: u32
    text: String
  Link:
    # `task` waits on `after`; at most one link of each kind between two tasks.
    task: u32
    after: TaskParent
    kind: LinkKind
    label: String
    # Defaults to empty when absent.
    waiting_items: Vec<u32>
  TaskParent:
    Local: u32
    Plan: "{ plan_id: PlanId, task: u32 }"
  LinkKind:
    Needs: unit
    CompletesAfter: unit
  WorkflowState:
    Draft: unit
    Frozen: unit
  WrittenBy:
    # §16.3, tagged `kind`, snake_case. A version with a grant is External
    # (2a's external versions also hold a thread); one with a thread only is
    # its Planner's, model and harness read from the turn's `agent_invocation`
    # when `written_by_operation` is set, `None` without a turn.
    Planner: "{ thread_id: ThreadId, thread_title: String, thread_removed: bool, model: Option<String>, harness: Option<String> }"
    External: "{ grant_id: GrantId }"
  PlanState:
    # §16.2. A person archives or unarchives a plan.
    Active: unit
    Archived: unit
  LastEdit:
    revision: i64
    summary: String
    changed_tasks: Vec<u32>
  EditOutcome:
    # What a replayed edit answers too: the recorded one, not a re-read.
    workflow_id: WorkflowId
    version: i64
    revision: i64
    summary: String
    changed_tasks: Vec<u32>
  DraftStarted:
    workflow_id: WorkflowId
    plan_id: PlanId
    version: i64
  Approved:
    # The `WorkflowFrozen` payload, never the plan, so a replay answers what
    # the first approval answered.
    workflow_id: WorkflowId
    version: i64
    revision: i64
    frozen_at: String
  PlanOp:
    BindingPut: "{ binding: AgreementBinding }"
    BindingRemove: "{ task: u32, agreement_id: AgreementId, role: AgreementRole }"
    # Tagged `op`, snake_case. `link_put` replaces the link with the same
    # task, after and kind.
    PlanPut: "{ title: String, goal: String }"
    TaskAdd: "{ task: TaskContent }"
    TaskUpdate: "{ task: TaskContent }"
    TaskRemove: "{ number: u32 }"
    LinkPut: "{ link: Link }"
    LinkRemove: "{ task: u32, after: TaskParent, kind: LinkKind }"
  Applied:
    # Test-only outside the crate (`testing`): a batch that held.
    content: PlanContent
    # Sorted, without repeats.
    changed_tasks: Vec<u32>
    summary: String
  Problem:
    # Named so a person can act on it: tasks as `T4`.
    message: String
  Focus:
    # The task a person points at, at the version and revision they saw;
    # checked by Turns' `start_turn` through `task_of`.
    workflow_id: WorkflowId
    task_id: TaskId
    revision: i64
  Place:
    # Every shown plan is a card; `Side` and `Page` also act in the sending
    # tab, live only.
    Inline: unit
    Side: unit
    Page: unit


functions:
  # Person binding edits use the same write/replay/approval validation as MCP.
  service:
    edit_bindings:
      signature: "(&self, command_id: String, workflow: &WorkflowId, expected_revision: i64, ops: Vec<PlanOp>) -> Result<EditOutcome, CoreError>"
  reads:
    map: "(&self, project: &ProjectId) -> Result<PlanMap, CoreError>"
    list:
      signature: "(&self, project: &ProjectId, archived: bool) -> Result<Vec<PlanListing>, CoreError>"
      # Active plans only, or archived ones too when requested.
    get: "(&self, workflow: &WorkflowId) -> Result<Plan, CoreError>"
    plan: "(&self, plan: &PlanId) -> Result<PlanVersions, CoreError>"
    list_for:
      signature: "(&self, grant: &Grant, archived: bool, project: Option<&str>) -> Result<Vec<PlanListing>, CoreError>"
    # Active plans, or archived ones too when requested.
    get_for: "(&self, grant: &Grant, named: Option<&WorkflowId>, project: Option<&str>) -> Result<Plan, CoreError>"
    task_for:
      signature: "(&self, grant: &Grant, named: Option<&WorkflowId>, number: u32) -> Result<PlanTask, CoreError>"
      # INVALID_COMMAND "T{n} does not exist in this plan" when the number is absent.
  writes:
    approve:
      signature: "(&self, command_id: String, workflow: &WorkflowId, expected_revision: i64) -> Result<Approved, CoreError>"
      # "PlanApprove", params { workflow, expected_revision }, principal User/local.
    archive:
      signature: "(&self, command_id: String, plan: &PlanId) -> Result<PlanVersions, CoreError>"
      # "PlanArchive", params { "plan" }, principal User/local.
    unarchive:
      signature: "(&self, command_id: String, plan: &PlanId) -> Result<PlanVersions, CoreError>"
      # "PlanUnarchive", params { "plan" }, principal User/local.
    prepare_draft: "(&self, grant: &Grant) -> Result<String, CoreError>"
    start_draft:
      signature: "(&self, grant: &Grant, args: DraftStart) -> Result<DraftStarted, CoreError>"
      # Both grant kinds fingerprint { project, plan_id, title, goal, reason }.
      # A Planner's command id is anchored to its running turn; an external
      # agent's is anchored to draft_ref. An absent plan_id creates a new plan;
      # otherwise the start answers that plan's Draft or starts its next
      # version. Storage's `ReasonMissing` becomes INVALID_COMMAND (§16.3).
    edit:
      signature: "(&self, grant: &Grant, args: PlanEdit) -> Result<EditOutcome, CoreError>"
      # "PlanEdit", params { workflow, expected_revision, ops }. A Planner's
      # edit passes its running turn, when there is one, to the event.
    show:
      signature: "(&self, grant: &Grant, args: PlanShow) -> Result<PlanShown, CoreError>"
      # "PlanShow", params { workflow, task_number, place }, id anchored to the
      # running turn. Records first, then signals unless replayed.
  checks:
    in_scope:
      signature: "(&self, grant: &Grant, named: Option<&WorkflowId>, latest_only: bool) -> Result<Plan, CoreError>"
      private: true
      # `edit` passes latest_only = true; `get_for`, `task_for` and `show` false.
    own_thread:
      signature: "(grant: &Grant) -> Result<&ThreadId, CoreError>"
      private: true
    writer_of:
      signature: "(grant: &Grant) -> Result<Writer, CoreError>"
      private: true
    planner_draft:
      signature: "(&self, grant: &Grant, args: DraftStart) -> Result<DraftStarted, CoreError>"
      private: true
      # `start_draft` for a thread grant: plan_id must be Active and in the
      # grant's project; otherwise it starts a new plan. The common fingerprint
      # includes project, plan_id, title, goal and reason.
    external_draft:
      signature: "(&self, grant: &Grant, args: DraftStart) -> Result<DraftStarted, CoreError>"
      private: true
      # `start_draft` for a project grant: the draft_ref is required and is
      # the command id.
  store:
    check_design_plan:
      signature: "(conn: &mut SqliteConnection, project: &ProjectId, plan: &PlanId) -> Result<(), StorageError>"
      # Transactional identity lookup for Design; no lifecycle/content write.
    # Each write that takes a `Writer` checks it inside its own transaction,
    # through Grants' `check_writer`; `approve_plan` is the person's and
    # takes none.
    list_plans: "(&self, project: &ProjectId, archived: bool) -> Result<Vec<PlanListing>, StorageError>"
    get_plan: "(&self, workflow: &WorkflowId) -> Result<Plan, StorageError>"
    plan_map: "(&self, project: &ProjectId) -> Result<PlanMap, StorageError>"
    get_plan_scoped: "(&self, workflow: &WorkflowId, origin: Option<&ProjectId>, project: Option<&str>) -> Result<Plan, StorageError>"
    list_plans_scoped: "(&self, origin: &ProjectId, archived: bool, project: Option<&str>) -> Result<Vec<PlanListing>, StorageError>"
    get_plan_versions: "(&self, plan: &PlanId) -> Result<PlanVersions, StorageError>"
    archive_plan: "(&self, ctx: &CommandContext, plan: &PlanId) -> Result<PlanVersions, StorageError>"
    unarchive_plan: "(&self, ctx: &CommandContext, plan: &PlanId) -> Result<PlanVersions, StorageError>"
    edit_plan: "(&self, ctx: &CommandContext, writer: &Writer, operation: Option<&OperationId>, workflow: &WorkflowId, expected_revision: i64, ops: &[PlanOp]) -> Result<EditOutcome, StorageError>"
    approve_plan:
      signature: "(&self, ctx: &CommandContext, workflow: &WorkflowId, expected_revision: i64) -> Result<Approved, StorageError>"
      # Its PlanApproved entry goes to the version's `written_by_thread` when
      # that thread is not removed, else nowhere; `WorkflowFrozen` names that
      # thread, or none (§16.3).
    start_draft:
      signature: "(&self, ctx: &CommandContext, writer: &Writer, project: &ProjectId, plan: Option<&PlanId>, source: Option<&WorkflowId>, fresh: Option<(&str, &str)>, reason: Option<&str>, operation: Option<&OperationId>, draft_ref: Option<&str>) -> Result<DraftStarted, StorageError>"
      # No plan: a new Active `plan` row and its v1 from `fresh`, in the same
      # transaction. A plan (of `project`, else GrantScope): its Draft, else
      # its next version from the latest, which needs a non-blank `reason`
      # (`ReasonMissing`). Classified under
      # ("Plan", plan), else ("Project", project); a start naming a plan also
      # finds one recorded under its project, which a Planner's first start
      # was. A `source` other than the plan's latest version is
      # `NotLatestVersion`, checked after the replay. The version records its
      # writer: a Planner's thread and `operation`, an external grant. A start
      # refused by `workflow_one_draft` answers the plan's Draft.
    show_plan: "(&self, ctx: &CommandContext, writer: &Writer, turn: &OperationId, workflow: &WorkflowId, task_number: Option<u32>, place: Place) -> Result<PlanShown, StorageError>"
    thread_plan:
      signature: "(&self, thread: &ThreadId) -> Result<Option<WorkflowId>, StorageError>"
      # Test-support only: the latest version of the first plan the thread
      # wrote. Product callers name a version; attribution does not pick it.
    require_active:
      signature: "(conn, plan: &PlanId) -> Result<(), StorageError>"
      # Private to the store: recheck Active inside each new version write.
    task_of:
      signature: "(conn, workflow: &WorkflowId, id: &TaskId) -> Result<Option<(u32, String)>, StorageError>"
  model:
    content:
      signature: "(&self) -> PlanContent"
      # On `Plan`: the content an edit batch applies to, keyed by number.
    as_str:
      signature: "(&self) -> &'static str"
      # On `LinkKind`: "needs" or "completes_after", as stored.
  for_tests:
    # The pure rules, re-exported by `testing` for the rule tests.
    apply: "(current: &PlanContent, ops: &[PlanOp]) -> Result<Applied, Vec<Problem>>"
    edit_problems: "(content: &PlanContent) -> Vec<Problem>"
    approval_problems: "(content: &PlanContent) -> Vec<Problem>"


enums:
  Grant:
    source: crate::grants::Grant
    values: []
  CoreError:
    source: crate::error::CoreError
    values: []
  Writer:
    source: crate::command::Writer
    values: []


shared_in_transaction:
  part_bindings_in: "Design reads derived part-plan adoption in its captured part snapshot, preserving historical pins."
  agreement_participants_in: "Design reads current/historical task adoption in its captured impact review and agreement transaction; Plans owns binding rows."
  notify_project_dependencies_in: "Code link writes and Projects removal: append dependency invalidations for other live connected projects inside the caller's write"
  check_design_plan: "Design's part/outcome association stores: verify project-qualified plan identity before associating; archived/Frozen plans remain valid and their content is not edited"
  task_of: "Turns' store (turns/store/turn.rs `focused`): start_turn checks a Focus's task belongs to its version inside the turn's own write"


obligations:
  - rule: >
      A tool call's grant decides which plan versions it reaches (§16.4): both
      grant kinds may name any version in their project; a Planner may edit
      only an Active plan's latest version. Anything else
      is refused GRANT_SCOPE, with the texts `in_scope` writes, before
      storage is written. A missing or unknown workflow_id is GRANT_SCOPE;
      missing ids tell a Planner to use workflow_list.
    tested_by:
      - a_thread_grant_reaches_every_plan_in_its_project
      - a_project_grant_cannot_reach_another_project
      - a_project_grant_must_name_a_plan_to_read_or_edit
      - a_thread_grant_can_read_and_show_any_plan_in_its_project
      - a_project_grant_is_refused_another_projects_plan_after_the_move
      - a_planner_without_a_workflow_id_is_told_to_list
    note: >
      Only the last asserts a full refusal text ("that plan is not in this
      grant's project"); the others assert the GRANT_SCOPE prefix.

  - rule: >
      Every write checks its writer again inside its own transaction (§13.7):
      a revoked grant, a Planner or an external agent outside its project, or
      an external start without a draft_ref writes nothing.
    tested_by:
      - a_planner_grant_writes_only_in_its_own_project
      - an_edit_by_a_revoked_grant_writes_nothing
      - external_draft_starts_require_a_draft_ref
    note: >
      These drive the store directly, below `Plans`; they prove the
      in-transaction check, not `in_scope`.

  - rule: >
      Replay: a retried command with the same id and the same request answers
      what it answered first, and writes nothing. The command kinds and
      fingerprint parameters are PlanApprove { workflow, expected_revision },
      DraftStart { project, plan_id, title, goal, reason } for both grant
      kinds, PlanEdit { workflow, expected_revision, ops },
      PlanShow { workflow, task_number, place }. A Planner's id carries the
      fingerprint (§13.5); changing any plan id, title, goal or reason is a
      different command.
    tested_by:
      - plan_command_fingerprints_do_not_move
      - plan_commands_replay_after_the_move
      - a_repeated_edit_returns_the_first_result
      - a_replayed_approval_answers_the_first_result
      - a_thread_grant_starts_a_draft_only_inside_a_turn
      - a_planner_draft_start_names_a_project_plan
      - draft_ref_replays_and_distinct_refs_make_distinct_plans
    note: >
      `a_planner_draft_start_names_a_project_plan` pins the Planner's
      fingerprint parameters against the command log. `plan_command_fingerprints_do_not_move`
      pins the wire command shapes. The other tests replay within one database,
      so they prove a request matches itself and would still pass if both calls
      changed the same way. None pins the principal or the derived command ids.

  - rule: >
      `show` sends its UI signal only when the card was newly recorded, never
      on a replay, and only after the card is journaled; the signal names the
      tab that sent the turn.
    tested_by:
      - plan_show_twice_in_one_turn_for_different_tasks_writes_two_cards
      - plan_show_writes_a_card_and_signals_only_the_sending_tab
    note: >
      The first asserts a replayed call sends nothing; the second that one
      signal follows the journaled card and names the sending tab.

  - rule: >
      A Planner's `start_draft` and `show` are anchored to its thread's
      running turn; with none running they are refused INVALID_COMMAND "no
      turn is running for this conversation".
    tested_by:
      - a_thread_grant_starts_a_draft_only_inside_a_turn
      - plan_show_twice_in_one_turn_for_different_tasks_writes_two_cards

  - rule: >
      A grant must name a version for workflow_get, task_get, plan_edit and
      plan_show. It reaches any version in its project. A Planner can edit only
      an Active plan's latest version; an archived plan refuses edits and new
      versions with INVALID_COMMAND so a person can unarchive it. Storage
      rechecks archive state inside the write transaction, including approval,
      after replay classification; an archive racing an earlier scope check
      cannot allow a new write. PlanArchived becomes INVALID_COMMAND at the
      CoreError boundary.
    tested_by:
      - a_planner_without_a_workflow_id_is_told_to_list
      - a_thread_grant_can_read_and_show_any_plan_in_its_project
      - a_planner_edits_only_the_plan_latest_version
      - an_archived_plan_is_read_only_until_unarchived
      - an_archive_blocks_every_new_version_write_in_storage

  - rule: >
      A person archives and unarchives a plan through the web client (§16.2):
      archiving an archived plan, or unarchiving an active one, answers the
      plan unchanged (idempotent in effect). Each change journals PlanArchived
      or PlanUnarchived with the project. A replay answers the plan as it stands.
      A plan of a removed project is not found.
    tested_by: an_archived_plan_is_read_only_until_unarchived

  - rule: >
      An external agent starts a version in a plan of its project. An existing
      Draft is answered unchanged; without one, the latest version must be
      Frozen and a new version needs its reason.
    tested_by: an_external_start_answers_an_existing_plan_draft


  - rule: >
      A version belongs to a plan of its project (§16.2, §16.9). Migration
      0012 moved each thread's chain into one Active plan with the same
      version ids, written by that thread. The original writer remains
      attribution; it does not limit another Planner's project reach.
    tested_by: migration_0012_moves_every_version_into_a_plan

  - rule: >
      Every version records its writer once, when it is created (§16.3): a
      Planner's thread and, inside a turn, its operation; an external
      agent's grant, with no thread, so an external start from scratch makes
      no conversation. `WrittenBy` reads them back. Every plan event carries
      its project; only a Planner's names its thread, and its turn when one
      is running.
    tested_by:
      - a_new_draft_is_version_one_at_revision_zero
      - an_external_start_from_scratch_creates_a_plan_and_no_thread
      - a_planner_grant_writes_only_in_its_own_project
    note: >
      No test reads `model` or `harness` back from a turn's invocation, and
      none asserts a Planner event's operation.

  - rule: >
      Every version after v1 is started with a non-blank `change_reason`;
      without one the start is INVALID_COMMAND "a new version needs its reason"
      and writes nothing. v1 has none, and a Draft answered again keeps the
      reason it was started with (§16.3).
    tested_by: a_new_version_needs_its_reason

  - rule: >
      A person's approval writes its "Plan vN approved" entry in the
      conversation that wrote the version, unless that conversation is
      removed or an external agent wrote it: then it writes no entry, and
      its `WorkflowFrozen` names no thread (§16.3).
    tested_by:
      - approval_freezes_and_writes_a_plan_approved_entry
      - approving_an_external_version_writes_no_entry
    note: The removed-conversation case has no test until a thread can be removed (§16.5).

  - rule: >
      A start naming a plan is classified under ("Plan", plan_id), one
      naming none under ("Project", project_id); an edit or approval under
      ("Workflow", id).
    tested_by:
      - a_thread_grant_starts_a_draft_only_inside_a_turn
      - draft_ref_replays_and_distinct_refs_make_distinct_plans
      - a_retried_first_start_answers_its_v1
    note: >
      The third retries a Planner's first start, recorded under the project,
      after its plan exists and v1 is approved: without the fallback to the
      project it starts a v2. None asserts the scope columns.

  - rule: >
      A plan has at most one Draft, held by the `workflow_one_draft` index as
      well as by the command's transaction: two starts of one plan answer the
      same Draft, never a database error.
    tested_by: two_starts_make_one_draft
    note: >
      Writes are serialized on one connection under `BEGIN IMMEDIATE`, so
      the second start finds the first's Draft before inserting; the index
      and the store's re-read of the Draft on its refusal hold it against a
      writer that is not this process. The test proves the outcome, not that
      re-read path.

  - rule: >
      A Frozen version, its tasks and its links never change: triggers refuse
      an update of the version and an insert, update or delete of its `task`
      and `task_parent` rows with "a frozen plan version never changes".
      Freezing, the update from Draft, is allowed.
    tested_by: migration_0012_moves_every_version_into_a_plan

agreements:
  - between: [check_design_plan, design::edit_design]
    rule: >
      Design validates project-qualified plan identities in its own transaction.
      Archived/Frozen plans remain eligible; Design owns only association rows.
    holds: true
    tested_by: part_order_is_stable_across_restart
  - between: [get, get_for]
    must: >
      answer the same stored plan content for a version the grant's scope covers;
      related previews and blocker labels obey the grant's independent reach
    holds: true
    why: >
      Both use a read snapshot. A selected linked project is checked before
      content is loaded. An unreachable incoming preview is omitted; an outgoing
      stored link stays readable with its metadata redacted.
    tested_by: incoming_previews_obey_the_grants_one_way_project_reach

  - between: [get_for, task_for]
    must: >
      a task read through `task_for` is the task with that number inside the
      plan `get_for` answers for the same grant and own-project version
    holds: true
    why: >
      `task_for` calls `in_scope` with the same arguments as `get_for` and
      picks the task by number from the plan it returns.
    tested_by: arabic_plan_round_trips_through_mcp
    note: >
      It compares the one field `title` of T1 through `workflow_get` and
      `task_get`, not the whole task.

  - between: [list, list_for]
    must: >
      list the same plans for the grant's project as a person's list of that project
    holds: true
    why: Both use the same listing query; list_for validates its project selector in the snapshot.
    tested_by: none
    note: >
      `the_project_lists_each_plans_latest_version` covers `list` and
      `a_project_grant_cannot_reach_another_project` covers `list_for` (empty);
      a test listing one project both ways would hold the agreement.


not_the_caller's:
  - >
      Check a grant's scope before calling a `*_for` method; `in_scope` is that
      check, and a second one in an adapter would drift from its texts.
  - >
      Build a CommandContext, derive a command id or fingerprint a plan
      command; the service does, so every path replays alike.
  - >
      Send `plan_show`'s UI signal; `show` sends it, after the card is recorded
      and never on a replay.


open_questions:
  - >
      `show` reads the running turn from `LiveHandles::running_turn` before its
      write; whether a turn that ends between that read and `show_plan`'s
      transaction can still receive a card anchored to it is decided by the
      operation store and the turn's end (Turns), not here.


tests:
  - name: bindings_are_exact_version_plan_content_and_task_removal_cleans_them
    checks: Old content omits empty pins; task removal cleans bindings atomically.
  - name: binding_storage_checks_agreed_party_and_exact_operations_atomically
    checks: Draft target and invalid operation rollback; SQL Frozen insert/update/delete guards.
  - name: the_map_keeps_incoming_foreign_links_to_archived_plans
    checks: Incoming foreign edges reach the map; an archived referenced plan stays visible from an active consumer.
  - name: incoming_previews_obey_the_grants_one_way_project_reach
    checks: User previews may include reverse project links; grants require their own live outgoing reach.
  - name: a_frozen_sources_preview_follows_the_targets_new_version
    checks: Latest target removal breaks a derived preview without changing Frozen source content or old target tasks.
  - name: a_new_foreign_dependency_invalidates_the_targets_project_once
    checks: A new incoming foreign edge reaches the target project stream in the same commit; replay emits none.
  - name: the_project_map_aggregates_task_links_with_foreign_plan_metadata
    checks: Latest foreign plan metadata, counted edges and retained broken references reach HTTP.
  - name: a_linked_project_can_be_read_but_never_written_by_the_source_grant
    checks: Selected linked-project MCP reads succeed; writes and reads after unlink are refused.
  - name: a_foreign_task_link_names_the_missing_project_link_as_invalid_command
    checks: Missing reach is INVALID_COMMAND with the required link identified; the batch writes nothing.
  - name: outgoing_and_incoming_views_name_the_related_plan_and_task
    checks: Both directions resolve task preview metadata; removal retains a broken edge with its explanation.
  - name: an_unrelated_cycle_in_a_target_plan_does_not_block_this_dependency
    checks: Approval follows reachable task prerequisites, not unrelated tasks in a referenced plan.
  - name: a_removed_target_task_keeps_the_link_and_blocks_source_approval
    checks: A missing latest target task retains the stored edge and blocks approval.
  - name: a_cross_plan_cycle_names_its_tasks_and_blocks_approval_until_removed
    checks: A cross-plan cycle reports its tasks and freezes nothing until an edge is removed.
  - name: a_foreign_target_requires_an_outgoing_project_link_and_breaks_after_unlink
    checks: Missing one-way reach refuses new foreign links; unlink breaks existing links without deleting them.
  - name: local_link_parent_keeps_its_existing_wire_shape
    checks: A local task parent remains a JSON number.
  - name: cross_plan_link_parent_roundtrips_as_plan_identity
    checks: An external task parent carries the stable plan identity and task number.
  - name: cross_plan_links_persist_replay_and_reopen_without_duplicate_events
    checks: Persisted external links survive reopen and identical command replay journals once.
  - name: a_frozen_versions_cross_links_refuse_every_database_write
    checks: A Frozen version refuses cross-link insert, update and delete at the database boundary.
  - name: a_failed_cross_link_batch_leaves_no_tasks_revision_or_event
    checks: A failed batch rolls back task rows, links, revision and journal writes together.
  - name: an_archive_blocks_every_new_version_write_in_storage
    checks: >
      After archiving a Draft, storage edit and draft_start are refused as
      archived, approval is INVALID_COMMAND, and revision, state and tasks
      remain unchanged. Calls below the scope check prove the transaction guard.
  - name: plan_command_fingerprints_do_not_move
    checks: >
      A Planner's DraftStart, PlanEdit and PlanShow, an external DraftStart
      from scratch and a person's PlanApprove each leave one command_record
      whose kind, schema version 1 and fingerprint equal `fingerprint` of the
      parameter literal listed in the replay obligation.
  - name: plan_commands_replay_after_the_move
    checks: >
      Over MCP with a project grant, a draft_start repeated with the same
      draft_ref answers the same workflow, and a plan_edit repeated with the
      same command_id answers the identical outcome at revision 1.
  - name: a_project_grant_is_refused_another_projects_plan_after_the_move
    checks: >
      workflow_get for a plan in another project is refused with the text
      "GRANT_SCOPE: that plan is not in this grant's project".
  - name: a_thread_grant_reaches_every_plan_in_its_project
    checks: >
      A Planner reads and edits another conversation's plan in its project;
      each version is named explicitly.
  - name: a_project_grant_cannot_reach_another_project
    checks: >
      workflow_get, task_get and plan_edit on another project's plan are
      GRANT_SCOPE; workflow_list answers []; the plan stays at revision 0.
  - name: a_project_grant_must_name_a_plan_to_read_or_edit
    checks: >
      Without workflow_id, or with an unknown one, workflow_get, task_get and
      plan_edit under a project grant are GRANT_SCOPE.
  - name: a_thread_grant_can_read_and_show_any_plan_in_its_project
    checks: >
      A Planner reads and shows older and other conversations' versions;
      editing an older version is refused.
  - name: a_planner_grant_writes_only_in_its_own_project
    checks: >
      The store refuses a Planner writer whose thread is in another project
      with GrantScope and records its own thread's edit under the thread.
  - name: an_edit_by_a_revoked_grant_writes_nothing
    checks: The store refuses a revoked grant's edit with GrantInvalid; revision stays 0.
  - name: external_draft_starts_require_a_draft_ref
    checks: >
      The store refuses an external start without a draft_ref, from scratch or
      in a plan, and creates no plan, thread or version.
  - name: a_repeated_edit_returns_the_first_result
    checks: >
      A Planner's plan_edit without a command_id, repeated, answers the same
      outcome and journals one WorkflowEdited.
  - name: a_replayed_approval_answers_the_first_result
    checks: >
      The same approve command answers the same body; the same id with another
      revision is 409 COMMAND_CONFLICT; one WorkflowFrozen is journaled.
  - name: a_thread_grant_starts_a_draft_only_inside_a_turn
    checks: >
      draft_start with no running turn is refused "no turn is running for this
      conversation"; inside a turn it starts v1, and a repeat is a replay.
  - name: a_planner_without_a_workflow_id_is_told_to_list
    checks: >
      workflow_get without workflow_id is GRANT_SCOPE and tells the Planner
      to use workflow_list.
  - name: a_planner_draft_start_names_a_project_plan
    checks: >
      Inside a turn, draft_start by plan_id starts the next version and a
      repeat answers the same Draft. The fingerprint holds project, plan_id,
      title, goal and reason.
  - name: a_planner_edits_only_the_plan_latest_version
    checks: >
      Editing v1 after v2 is frozen is refused; draft_start by plan_id starts
      v3 in the same plan.
  - name: draft_ref_replays_and_distinct_refs_make_distinct_plans
    checks: >
      One draft_ref with the same arguments replays; another ref makes another
      plan; the first ref with changed arguments is COMMAND_CONFLICT.
  - name: plan_show_twice_in_one_turn_for_different_tasks_writes_two_cards
    checks: >
      Idle plan_show is INVALID_COMMAND; two shows write two cards; a repeated
      show answers the first and sends no second signal; T9 is refused.
  - name: plan_show_writes_a_card_and_signals_only_the_sending_tab
    checks: >
      One plan-show frame per subscriber, after the PlanShown event, naming
      the sending tab; the card is a PlanView entry of the turn.
  - name: an_external_start_answers_an_existing_plan_draft
    checks: >
      draft_start from a Frozen plan creates its next version; a new draft_ref
      on that plan answers its existing Draft unchanged.
  - name: arabic_plan_round_trips_through_mcp
    checks: >
      Arabic text survives plan_edit and workflow_get; task_get's T1 title
      equals the title in the plan.
  - name: migration_0012_moves_every_version_into_a_plan
    checks: >
      On a database migrated to 0011, two threads' chains become plans A and B,
      Active in their project, a thread without versions none; the three
      versions keep their ids, with written_by_thread set, no reason and A's
      v2 still after v1; the tasks and the link survive and
      `PRAGMA foreign_key_check` is empty; updating the Frozen v1, or adding a
      task to it, is refused "a frozen plan version never changes".
  - name: two_starts_make_one_draft
    checks: >
      After v1 is approved, two starts of the thread joined with tokio::join!
      answer the same v2 in v1's plan, and the plan holds one Draft.
  - name: a_retried_first_start_answers_its_v1
    checks: >
      A Planner's first start, naming no plan, makes v1; once v1 is approved
      the same command with the same request still answers v1 and the plan
      holds one version.
  - name: a_new_draft_is_version_one_at_revision_zero
    checks: >
      A Planner's first start is v1 at revision 0, written by its thread, in
      the plan it answers, with one WorkflowDraftStarted on the thread.
  - name: an_external_start_from_scratch_creates_a_plan_and_no_thread
    checks: >
      An external v1 from scratch creates no thread; it is written by the
      grant, with no reason, and its WorkflowDraftStarted has the grant as
      actor and no thread.
  - name: a_new_version_needs_its_reason
    checks: >
      Through Plans, after v1 is approved, an external start with no reason
      or a blank one is INVALID_COMMAND "a new version needs its reason";
      with "the API changed",
      v2 holds it and v1 has none; a later start with another reason answers
      v2, which keeps "the API changed".
  - name: approval_freezes_and_writes_a_plan_approved_entry
    checks: >
      Approving a Planner's v1 freezes it, appends "Plan v1 approved" to its
      thread and journals one WorkflowFrozen there.
  - name: approving_an_external_version_writes_no_entry
    checks: >
      Approving an external agent's v1 answers it, written_by External; no
      thread was created, no PlanApproved entry exists, and WorkflowFrozen
      names no thread.
  - name: an_archived_plan_is_read_only_until_unarchived
    checks: >
      A plan with a Draft: POST archive sets state Archived; GET workflows
      leaves it out and GET workflows?archived=true lists it; an external
      edit is refused INVALID_COMMAND "archived"; POST unarchive restores
      Active and the edit succeeds; GET /api/plans/{id} lists v1 with its
      written_by.
