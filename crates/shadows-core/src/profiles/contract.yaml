# Owns AYLUL provider configuration and permanent agent identities.
name: profiles
version: 1
status: current
source: crates/shadows-core/src/profiles
shapes:
  Profiles:
    storage: Arc<Storage>
    home_root: Optional isolated home root
    sessions: Weak session owner used after deletion commits
  Provider:
    source: model.rs
    preset: Optional compiled preset id
    label: Optional trimmed label
    key_set: Metadata only; no key value
  ProviderModel:
    source: model.rs
    context_window: Required per-model window
  ProviderModelInput:
    source: model.rs
    context_window: Optional; defaults to 200000
  ProviderPreset:
    source: presets.rs
    note: Compiled in; no row
  Agent:
    source: model.rs
    deleted: Permanent identity tombstone
functions:
  provider_presets: List the compiled presets in their fixed order.
  workspace: Read the hidden project identity with its live agent list.
  new: Construct configuration over the shared storage.
  providers: List providers in creation order with slug tie break.
  provider: Read provider metadata including key presence.
  agents: List live agents in creation order with slug tie break.
  agent: Read an agent including a tombstone.
  assistant_project: Resolve the hidden assistant project id.
  create_provider: Validate and insert a provider with an immutable generated slug.
  update_provider: Refuse removal of live agents default models in the write transaction.
  delete_provider: Refuse live users and remove the encrypted key in the same write.
  create_agent: Validate the provider default and seed absent home files before insertion.
  update_agent: Change live configuration while retaining the slug.
  delete_agent: Keep the identity and remove variables in one transaction, then close its adapters.
shared_in_transaction:
  require_live_agent_in: Threads checks creation; Secrets checks agent environment writes inside their transaction.
  require_provider_in: Secrets checks provider existence before storing a provider key.
obligations:
  - rule: Each model window defaults to 200000 and is within 1000..=10000000.
    tested_by: [model_window_defaults_and_is_bounded]
  - rule: Model ids stay unique, 1..=20 per provider, and never default.
    tested_by: [model_ids_keep_their_rules]
  - rule: Migration gives each model its provider window in array order.
    tested_by: [migration_gives_models_the_provider_window]
  - rule: A preset supplies the name and URL; differing input is refused.
    tested_by: [preset_supplies_url_and_name, preset_with_other_url_is_refused]
  - rule: Custom requires a name and a valid URL.
    tested_by: [custom_requires_name_and_url]
  - rule: Labels are trimmed, at most 64 characters, without controls; empty is null.
    tested_by: [label_is_trimmed_and_empty_is_null]
  - rule: Unknown presets are refused; China presets carry China hosts.
    tested_by: [unknown_preset_is_refused, china_presets_use_china_hosts]
  - rule: Presets list in fixed order; known stored URLs migrate to their preset.
    tested_by: [presets_list_in_fixed_order, migration_marks_known_urls_with_their_preset]
  - rule: Provider credentials are never returned as provider metadata.
    tested_by: [provider_key_is_write_only]
  - rule: Live default models prevent provider deletion or model removal.
    tested_by: [provider_in_use_cannot_be_deleted, removing_an_agents_default_model_is_refused]
  - rule: A deleted agent retains its slug forever; its variables are removed.
    tested_by: [deleted_agent_slug_is_never_reused, delete_agent_removes_its_variables]
  - rule: Command replay requires the same normalized input.
    tested_by: [replay_with_other_input_conflicts]
agreements:
  - between: [delete_provider, secrets::remove_scope_in]
    must: Remove the key with the provider in one write transaction.
    holds: true
    tested_by: [delete_provider_removes_its_key]
