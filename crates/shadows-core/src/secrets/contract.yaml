# Owns encrypted profile environment values. No adapter or agent can read a value.
name: secrets
version: 1
status: current
source: crates/shadows-core/src/secrets
shapes:
  Secrets:
    store: private SecretsStore over the shared storage handle
    keys: Option<Keys>
  SecretKey:
    bytes: private 32-byte master key; Debug is redacted
  EnvEntry:
    name: String
    updated_at: String
  SealedEnv:
    fields: private profile, name, envelope and value fingerprint; stored only under the profile/name its AAD names
    value_mac: The keyed fingerprint a caller puts in its command record, never the value
functions:
  list_agent_env: Validate the live agent and list its environment metadata.
  set_agent_env: Encrypt and validate the live agent inside the write transaction after replay.
  remove_agent_env: Validate the live agent inside the removal transaction after replay.
  set_provider_key: Encrypt a provider key under its separate provider scope.
  remove_provider_key: Remove a provider key idempotently.
  provider_key_set: Read key presence without decrypting it.
  reserved_env_name: Identify routing names that agents cannot override.
  seal: crate-private; check the key, the name and the value, then encrypt it into a SealedEnv before any transaction; set_env uses it too. Returns CoreError.
  put_in: crate-private, no caller until the agent and provider owners take their env writes; upsert one SealedEnv in the caller transaction; returns StorageError only, so a write_txn caller propagates it. The caller checks its own owner and records its command.
  remove_scope_in: crate-private; delete one scope in the caller transaction; returns StorageError.
  provider_scope: crate-private; the one place that names the provider key scope `provider/{slug}`; the key name is a private constant.
  resolve_provider_key: Decrypted provider key for the harness, None when unset or empty; crate-private.
  new: Build a shared service over injected storage and an optional master key.
  list_env: Return metadata ordered by name, never values.
  set_env: Validate and encrypt a value, atomically classify/write/record one user command.
  remove_env: Atomically classify/delete/record one user command, replay without deleting again.
  resolve_env: Decrypt all profile pairs for a new harness opening; private to the crate.
  validate_env_name: Shared uppercase name validation including reserved names; removal checks the shape only.
obligations:
  - rule: Values never enter metadata, command records or diagnostic output.
    tested_by: [list_names_in_order_without_values, value_absent_from_db_wal_shm_and_command_record]
  - rule: AEAD binds each row to profile/name; malformed envelopes return an error.
    tested_by: [moved_row_is_unreadable, short_nonce_is_an_error_not_a_panic, unknown_format_is_an_error]
  - rule: HMAC fingerprints conflict on a changed value while exact replays keep the original result.
    tested_by: [replay_same_value_replays, replay_other_value_conflicts, hkdf_keys_differ]
  - rule: An unavailable key refuses every operation; another key still lists names.
    tested_by: [no_key_refuses_every_method, other_master_key_lists_but_cannot_resolve]
  - rule: A reserved name is refused at set but can be removed, so a row the opening names can go.
    tested_by: [lower_case_bad_and_reserved_names_are_refused, reserved_name_can_be_removed]
agreements:
  - between: [set_env, set_provider_key]
    must: Validate names and values through the same rules before storing ciphertext.
    holds: true
    tested_by: [lower_case_bad_and_reserved_names_are_refused, provider_key_is_write_only]
not_the_caller's:
  - Do not duplicate validation or encryption in adapters.
  - Do not expose resolve_env outside the harness; tests use feature-gated inspection.
tests:
  - name: seal_open_round_trips
    checks: A sealed synthetic value resolves without printing it.
  - name: open_with_other_aad_fails
    checks: Another associated-data name fails authentication.
  - name: open_with_other_key_fails
    checks: Another master key fails authentication.
  - name: replace_keeps_one_row
    checks: Replacement resolves to the newest synthetic value.
  - name: remove_drops_the_row
    checks: Removal and replay leave no row.
  - name: empty_nul_and_oversized_values_are_refused
    checks: Invalid values are refused before storage.

# These transaction methods are on Secrets in mod.rs, not exposed store functions.
# put_in has no caller yet; remove_scope_in is used by Profiles' deletion write.
shared_in_transaction: {}

gaps:
  - at: require_scope_owner
    gap: >
      Incomplete boundary. set_env, remove_env and list_agent_env still call profiles'
      require_live_agent_in and require_provider_in, an upward check; they move to the
      owners when A-14 moves the callers to put_in.
