# invocation_context supplies read results to Harness without introducing an upward dependency.
# Harness owns all invocation rows; Turns composes each operation with Harness reads.
# Turns::stage_line reads Design once per prompt and supplies the stage fact to Harness.
# Durable operation rows and transitions belong to Operations; Turns composes invocation and usage writes.
# Thread facts and entries are accessed through Threads::*_in in the caller's snapshot.
# Owns starting and stopping a Planner turn (spec §12.3, §12.7, §14.4): the
# "turn.start" command from its replay to its run, Stop as the local user, and
# the arbitration between a turn's own ending and a Stop (`turn.rs`), plus
# shutdown's stop of every live turn (§8.5), which `AppCore::shut_down` calls.
#
# `send`'s order is the rule (§14.9), and every step reads durable or live
# state the step before it relies on: a replay is answered first, before the
# registry, the harness or the thread is looked at; the harness's availability
# is checked before any session work; the thread's busyness before the session
# is touched; the session is opened, then its events leased, before any
# setting changes; the one transaction checks busyness again under
# `BEGIN IMMEDIATE`; only a committed, non-replayed turn is started. Any
# refusal after the lease gives the events back, and any refusal after the
# model was set sets the session's model back.
#
# `Cancelled` means the turn is confirmed stopped and that was written
# (§2.3): by the watcher when the harness answers `cancelled` after a Stop, or
# by `PlannerTurn::stop` after it terminated and reaped the adapter's tree.
# A tree that cannot be terminated writes nothing terminal.
#
# Trap: `send` and `stop` must be run to their end. Dropping `send` between its
# commit and `PlannerTurn::start` strands a `Pending` operation nothing will
# start; dropping `stop` between terminating the tree and writing `Cancelled`
# leaves a dead turn `Running`. The HTTP routes run both in `detached`.
# Trap: the early busy check is not redundant with the lease. The lease waits
# (context_wait + cancel_wait + 1s) before answering Busy, and a turn whose
# watcher gave the events back but whose ending is not yet recorded holds no
# lease: only `Operations::thread_is_busy` refuses a start there before the session's
# model is changed.

name: turns
version: 1
status: current
source: crates/shadows-core/src/turns
modules:
  mod.rs: turn execution boundary
  handles.rs: live turn registry
  model.rs: turn transport values
  prompt.rs: prompt composition
  queue.rs: queue orchestration
  record.rs: start validation
  shutdown.rs: live shutdown orchestration
  spawn.rs: live registration
  steer.rs: steering orchestration
  stage.rs: shared normal/steered stage fact composition
  turn.rs: live completion arbitration
  entries.rs: harness entry collection
  subagents.rs: subagent card collection
  testing.rs: test-only lifecycle composition
  store/mod.rs: private TurnsStore handle
  store/operation.rs: atomic terminal composition
  store/operation_read.rs: operation composition with Harness batched reads
  store/turn.rs: turn command persistence
  store/queue.rs: queue persistence
  store/steer.rs: steer persistence
  store/standards.rs: invocation standards composition
  store/usage.rs: terminal usage composition


shapes:
  Turns:
    storage: Arc<Storage>
    operations: Operations
    # Owns the operations: its `instance_id` goes on every new one.
    runtime: Arc<Runtime>
    # Harness's. Every call a turn makes on it (`prepare_turn`,
    # `context_facts` and `withhold` in `spawn.rs` included) is declared in
    # `harness/contract.yaml` under `functions.harness_for_turns`.
    sessions: Arc<Harness>
    # The registry of live turns; closed by shutdown, after which `send`
    # refuses a new turn with RuntimeStopping.
    handles: Arc<LiveHandles>
    # A running turn's live harness events, for every live subscriber.
    bus: Bus
    # A clone of the core's `Code`: `send` touches the thread's project (§15.6).
    code: Code
    standards: Standards
  ThreadStopper:
    # Narrow handle built at composition, held by Threads.
    storage: Arc<Storage>
    handles: Arc<LiveHandles>
    sessions: Arc<Harness>
  SendTurn:
    command_id: String
    prompt: String
    model: String
    mode: String
    # `None` exactly when the chosen model offers no effort (§12.4).
    effort: Option<String>
    # Part of the command's fingerprint; checked to be a task of that plan
    # version, which must be in this thread's project (TaskNotInPlan otherwise).
    focus: Option<Focus>
    # Part of the command fingerprint; the selected plan must be in this
    # thread's project. It becomes a prompt context block, not a stored entry.
    plan: Option<PlanId>
    # Transport only: not in the fingerprint, never stored; a replay from
    # another tab is still a replay.
    client_tab: Option<String>
  StartError:
    # What `PlannerTurn::start` answers; carried by `CoreError::Start`, which
    # is why it is public.
    RuntimeStopping: unit
    Storage: StorageError
  StopOutcome:
    # The watcher saw the turn's ending, or the harness confirmed the cancel.
    Cancelled: unit
    ResolvedByTurn: unit
    # Nothing registered: the request is recorded and nothing is terminal.
    NotLive: unit
    # The registration is restored; nothing terminal is written.
    TerminationFailed: unit
  LiveHandles:
    # A registry of live turns keyed by operation, closed once at shutdown.
    "0": Mutex<Registry>
  Operation:
    id: OperationId
    kind: String
    status_kind: String
    # A plain String, not ThreadId.
    thread_id: Option<String>
    runtime_instance_id: RuntimeInstanceId
    outcome_json: Option<String>
    failure_stage: Option<String>
    failure_reason: Option<String>
    interrupt_reason: Option<String>
    cancel_requested_at: Option<String>
    created_at: String
    started_at: Option<String>
    finished_at: Option<String>
    # `None` for an operation from before invocations were recorded.
    invocation: Option<InvocationView>
  StartedTurn:
    operation_id: OperationId
    entry_id: ThreadEntryId
    # True when the transaction found the command already recorded.
    replayed: bool
    # The focused task's number and title; `None` without a focus and on a
    # replay.
    focus_task: Option<(u32, String)>
  FailureStage:
    # Test-only outside the crate (`testing`); `as_str` is what is stored.
    Prepare: unit
    # No production path records it today; only tests do.
    Spawn: unit
    Run: unit
  NewTurn:
    # What `start_turn` records: the thread, the runtime, the prompt, the
    # role, the harness and agent paths and versions, the settings, the
    # prompt and instructions versions, and the focus. Borrowed, never kept.
    thread_id: "&ThreadId"
    standards_version: Option<i64>
    standards_additions_version: "Option<&str>"
    # The waiting message this turn sends (§20.3, §20.4), taken in the same
    # transaction; `Dequeue.also` is Send now's own command, recorded with the
    # turn so its replay answers the turn.
    dequeue: "Option<Dequeue>"
  QueuedMessage:
    # §20.2: a message written while a turn ran, waiting to be sent.
    id: QueuedMessageId
    thread_id: ThreadId
    # Send order within the thread.
    position: i64
    prompt: String
    model: String
    mode: String
    effort: Option<String>
    focus: Option<Focus>
    plan: Option<PlanId>
    # Why the last send failed (§20.3).
    last_error: Option<String>
    created_at: String
  Queued:
    # What queueing answers, tagged "status": Waiting { message } or
    # Started { operation_id } when the thread was idle.
    Waiting: QueuedMessage
    Started: OperationId
  SentNow:
    # What Send now answers, tagged "status": Steered { entry_id } or
    # Started { operation_id } when the thread had gone idle.
    Steered: ThreadEntryId
    Started: OperationId
  NewQueued:
    # What `queue_message` records, borrowed.
    prompt: "&str"
    model: "&str"
    mode: "&str"
    effort: "Option<&str>"
    focus: "Option<&Focus>"
    plan: "Option<&PlanId>"
  QueueAnswer:
    Waiting: QueuedMessage
    # The thread runs no turn: nothing was written; the caller starts one.
    Idle: unit
  SteerRequest:
    # A Send now for the running turn (§20.4, `steer.rs`), sent over
    # `LiveTurn.steer` to the watcher, which steers, records and answers on
    # `reply`: `Some(entry)` steered in, `None` the adapter ran no prompt.
    command: CommandContext
    row: QueuedMessageId
    reply: oneshot::Sender<Result<Option<ThreadEntryId>, CoreError>>
  SteerTarget:
    # What `LiveHandles::steer_target` answers (pub(crate)).
    cancel_requested: Arc<AtomicBool>
    steer: UnboundedSender<SteerRequest>
  PlannerTurn:
    # A unit struct: `start` and `stop` are associated functions.
    unit: unit
  PlannerTurnRequest:
    # A turn whose operation `start_turn` committed Pending. `harness` is the
    # one the command validated, so nothing is read between the commit and
    # the run; `events` is the leased session's stream.
    thread_id: ThreadId
    harness: String
    operation_id: OperationId
    prompt: String
    settings: TurnSettings
    focus: Option<String>
    # A context block added after focus when the person selected a plan.
    continue_plan: Option<String>
    client_tab: Option<String>
    events: UnboundedReceiver<HarnessEvent>
    # Called after the watcher recorded `Completed`, and after nothing else;
    # `None` where no queue follows the turn.
    on_completed: Option<OnCompleted>


functions:
  service:
    operations: "(&self, thread) -> Result<Vec<Operation>, CoreError>; Operations rows enriched with invocation reads"
    stop_running:
      signature: "(&self, thread: &ThreadId) -> Result<StopOutcome, StorageError>"
      # On ThreadStopper: finds the durable Pending or Running turn, including
      # before live registration, then PlannerTurn::stop; waits for finished_at
      # through the committed watch without holding a session slot. A failed
      # termination is returned without claiming the operation is terminal.
    send:
      signature: "(&self, thread_id: ThreadId, turn: SendTurn) -> Result<OperationId, CoreError>"
      # "turn.start", principal User/local, schema 1, params { thread_id,
      # prompt, model, mode, effort }, plus focus and plan only when given.
      # plan must be in the thread's project, else INVALID_COMMAND. The plan
      # context block follows focus when present. Refusals:
      # RuntimeStopping (registry closed, or TransitionConflict from
      # `start_turn` while it is closed); HarnessUnavailable; ThreadBusy (early
      # check, lease Busy, or the transaction); HarnessStartFailed (open, lease
      # Closed, or the session gone while reading its offer);
      # SettingNotOffered; ModeNotAllowed; CommandConflict; TaskNotInPlan.
      # Once the checks up to the busy check pass, before the session is
      # opened: `Code::touch` of the thread's project (§15.6), which never
      # fails or delays the turn.
    queue:
      signature: "(&self, thread: ThreadId, turn: SendTurn) -> Result<Queued, CoreError>"
      # §20.2, "turn.queue": a waiting message on a busy thread; on an idle
      # one, the turn it starts through `send` under the derived command id
      # `queue:<id>`, whose `turn.start` fingerprint is `send`'s own
      # (`start_command`). A replay of the derived start answers its turn
      # first, so no copy waits behind it. Refusals: `send`'s, and ThreadBusy
      # after two tries (a turn took the thread between Idle and the start).
    queued:
      signature: "(&self, thread: &ThreadId) -> Result<Vec<QueuedMessage>, CoreError>"
      # §20.5: the thread's waiting messages in `position` order.
    unqueue:
      signature: "(&self, thread: &ThreadId, id: &QueuedMessageId, command_id: String) -> Result<(), CoreError>"
      # §20.5, "turn.unqueue": removes a waiting message. Refusals:
      # QueuedMessageGone, CommandConflict.
    send_with:
      signature: "(&self, thread_id: ThreadId, turn: SendTurn, dequeue: Option<(QueuedMessageId, Option<CommandContext>)>) -> Result<OperationId, CoreError>"
      # pub(crate): `send` is `send_with(.., None)`. With a `dequeue`, the
      # turn takes that waiting message in its own transaction (§20.3).
    send_now:
      signature: "(&self, thread: &ThreadId, id: &QueuedMessageId, command_id: String) -> Result<SentNow, CoreError>"
      # §20.4, "turn.send_now". In order: a replay answers first; the row must
      # exist (QueuedMessageGone); a Stop pending on the running turn
      # (`cancel_requested`) is ThreadBusy, sends nothing and leaves the row
      # without `last_error`; otherwise the watcher is asked (`SteerRequest`) to
      # send the steer BEFORE anything is written; on `injected` it writes the
      # streamed text, then the message in one transaction with taking the row.
      # `promptRequired`, a watcher already gone, or no running turn, is
      # `send_queued` with this command as `also`. A steer that fails sets
      # `last_error`, writes nothing to the thread and is HarnessStartFailed.
    send_queued:
      signature: "(&self, thread: &ThreadId, row: &QueuedMessage, also: Option<CommandContext>) -> Result<OperationId, CoreError>"
      # pub(crate), §20.3: starts `row` as a turn under the derived command id
      # `queued:<row id>`, taking the row inside the turn's transaction. A row
      # already taken is QueuedMessageGone; the rest are `send`'s refusals.
    send_next:
      signature: "(&self, thread: &ThreadId)"
      # pub(crate), §20.3: the thread's first waiting message, unless it
      # carries a `last_error`. ThreadBusy and QueuedMessageGone are not
      # failures and write nothing; any other refusal is `fail_queued`, which
      # sets `last_error` and leaves the row waiting for the person.
    on_completed:
      signature: "(&self) -> OnCompleted"
      private: true
      # The callback each turn's watcher is given: runs `send_next` in a task
      # of its own, to its end.
    stop:
      signature: "(&self, op: &OperationId) -> Result<Operation, CoreError>"
      # `PlannerTurn::stop` as `Actor::user("local")`; TerminationFailed is
      # CoreError::TerminationFailed; otherwise the operation as it now
      # stands, which may still be Running (NotLive, or a watcher recording).
      # An unknown operation is NotFound from `request_cancellation`.
    shut_down:
      signature: "(&self, bound: Duration, second_signal: impl Future<Output = ()>) -> Result<StopKind, StorageError>"
      # pub(crate): `AppCore::shut_down`'s only path.
  steps:
    start:
      signature: "(&self, thread_id, context, turn: Turn, offered: &Offered) -> Result<StartedTurn, CoreError>"
      private: true
      # The offer's checks, the project's modes, then `start_turn`; the checks
      # in the order they ran before the set-back existed.
    compose:
      signature: "(parts: PromptParts) -> Prompt"
      # On `Prompt` (`prompt.rs`), the one place a turn's blocks are built:
      # the person's text, then the changes since the session last heard, focus,
      # the selected plan and the stage line. A text starting with `/` (after
      # any leading whitespace) is sent alone and with that whitespace removed,
      # because the adapter runs a command only as the whole prompt with
      # nothing before the `/`; a `/` further in is text, and plain text is
      # sent as typed. When it
      # skipped changes, `withholds` is set, and `spawn.rs` passes it to
      # Harness's `withhold` once the turn has started, so the next normal
      # turn carries them.
    steered:
      signature: "(text: &str, stage: &str) -> String"
      # On `Prompt`, used by `steer.rs`: the stage line follows a steered
      # message unless it is a command, by the same test as `compose`; a
      # command is sent with its leading whitespace removed.
    focus_block:
      signature: "(focus: &Focus, number: u32, title: &str) -> String"
      # On `Prompt`.
    continue_plan_block:
      signature: "(plan: &PlanListing) -> String"
      # On `Prompt`.
  live:
    start:
      signature: "(runtime, storage, handles, sessions, opened, request: PlannerTurnRequest, bus) -> Result<OperationId, StartError>"
      # Prepare (context, settings) → register → re-read the cancel request →
      # mark Running → watch. A refused prepare is Failed { Prepare }.
    watch_turn:
      signature: "(w: TurnWatch, rx, steers, bus)"
      private: true
      # `steers` carries the Send nows (`LiveTurn.steer`); the select is biased:
      # the prompt's answer, then events, then steers. A steer drains the
      # events already queued, then holds the watcher until it is answered;
      # steers still queued when the prompt answers are dropped, which
      # `send_now` reads as "no prompt runs".
    steer:
      signature: "(w: &TurnWatch, collector: &mut Collector, r: SteerRequest)"
      private: true
      # In `steer.rs`: the row must still be queued (QueuedMessageGone), the
      # steer is sent, and only on `injected` `Collector::cut` writes the
      # message being streamed and `steered_entry` writes the steered one and
      # takes its row. No event is read in between, so the steered reply's
      # first chunk cannot be written before the steered entry.
    cut:
      signature: "(&mut self) -> Vec<Durable>"
      # On `Collector` (`entries.rs`): the message being streamed, written now;
      # the reply then continues as a new message (§20.4).
    changed_cards:
      signature: "(&mut self) -> Vec<SubagentCard>"
      # On `Collector`: each subagent card changed since the last call, as it
      # is now; `accept` publishes each as `HarnessEvent::Subagent` (§22.2).
      # The cards are gathered by `Subagents` (`subagents.rs`).
    steer_target:
      signature: "(&self) -> Option<SteerTarget>"
      # pub(crate) on `LiveHandles`: the running turn of a thread as Send now
      # reaches it (§20.4): its `cancel_requested` and steer channel.
    stop:
      signature: "(runtime, handles, sessions, op: &OperationId, actor: Actor) -> Result<StopOutcome, StorageError>"
      # On `PlannerTurn`. Records the cancel request, claims the live turn,
      # asks the harness to cancel, and terminates the adapter when it does
      # not confirm within `cancel_wait`.
    shut_down:
      signature: "(runtime, handles, sessions, bound: Duration, second_signal) -> Result<StopKind, StorageError>"
      # PlannerTurn method in `shutdown.rs`, behind `Turns::shut_down`; tests call
      # it directly through `testing`.
  registry_for_plans:
    client_tab_for: "(&self, operation) -> Option<String>; transport tab only, never running authority"
  registry:
    # `LiveHandles` methods only Turns calls (and `testing`), never Plans.
    is_closed:
      signature: "(&self) -> bool"
      # `send` refuses a new turn once shutdown closed it.
  for_tests:
    running_for: Live registration inspection, compiled only with test-support.
    running_turn: Live registration plus tab inspection, compiled only with test-support.
    # Behind `test-support`, reached through `testing`.
    contains:
      signature: "(&self, op: &OperationId) -> bool"
    close_for_test:
      signature: "(&self)"
    create_pending_operation:
      signature: "(&self, thread_id: &ThreadId, runtime_instance_id: &RuntimeInstanceId) -> Result<OperationId, StorageError>"
  lifecycle_composition:
    # TurnsStore composes Operations transitions with invocation observations and usage.
    # The operation's lifecycle. Only the turn machinery calls these in the
    # product (`spawn.rs`, `turn.rs`, `shutdown.rs`), except the two named
    # under `called_by_other_services`; storage tests drive them directly.
    mark_operation_started:
      signature: "(&self, op_id: &OperationId, expected_runtime: &RuntimeInstanceId) -> Result<(), StorageError>"
    mark_operation_completed:
      signature: "(&self, op_id: &OperationId, outcome: Value, observation: &TurnObservation) -> Result<(), StorageError>"
    mark_operation_failed_with_usage: Fail atomically with optional measured end-turn usage.
    mark_operation_cancelled_with_usage: Cancel atomically with optional measured end-turn usage.
    mark_operation_failed:
      signature: "(&self, op_id: &OperationId, stage: FailureStage, reason: &str) -> Result<(), StorageError>"
    request_cancellation:
      signature: "(&self, op_id: &OperationId, requester: Actor) -> Result<(), StorageError>"
      # The first step of `PlannerTurn::stop`, before the registry is read.
    mark_operation_cancelled:
      signature: "(&self, op_id: &OperationId) -> Result<(), StorageError>"
    list_operations_for_thread:
      signature: "(&self, thread_id: &ThreadId) -> Result<Vec<Operation>, StorageError>"
  store:
    latest_invocation_versions:
      signature: "(&self, thread: &ThreadId) -> Result<Option<InvocationVersions>, StorageError>"
      # Threads entry order, Operations started ids and Harness version metadata, in one snapshot.
    start_turn:
      signature: "(&self, ctx: &CommandContext, turn: NewTurn) -> Result<StartedTurn, StorageError>"
      # One write: classify (replay), refuse removed thread, has_open_operation (busy), focus,
      # insert_pending, the UserMessage entry, Threads'
      # title_from_first_message_in, Harness::record_invocation_in,
      # Harness::remember_settings_in, record_command. With `NewTurn.dequeue`: the row is
      # taken right after the busy check and `QueuedMessageSent` is journaled
      # after the turn's command is recorded, both in this one write.
    replayed_turn:
      signature: "(&self, ctx: &CommandContext, thread: &ThreadId) -> Result<Option<StartedTurn>, StorageError>"
    queue_message:
      signature: "(&self, ctx: &CommandContext, thread: &ThreadId, new: NewQueued<'_>) -> Result<QueueAnswer, StorageError>"
      # A replay answers the message as first answered; a removed thread is
      # NotFound; an idle thread writes nothing and is Idle; a busy one gets
      # the row, last in `position` order.
    queued_messages:
      signature: "(&self, thread: &ThreadId) -> Result<Vec<QueuedMessage>, StorageError>"
      # In `position` order; none for a removed thread.
    queued_message:
      signature: "(&self, thread: &ThreadId, id: &QueuedMessageId) -> Result<Option<QueuedMessage>, StorageError>"
    unqueue_message:
      signature: "(&self, ctx: &CommandContext, thread: &ThreadId, id: &QueuedMessageId) -> Result<(), StorageError>"
      # A replay is judged first; a new command on a gone row is
      # QueuedMessageGone.
    fail_queued:
      signature: "(&self, thread: &ThreadId, id: &QueuedMessageId, reason: &str) -> Result<(), StorageError>"
      # Why the last send of a waiting message failed (§20.3, §20.4).
    take_queued_in:
      signature: "(conn, thread: &ThreadId, id: &QueuedMessageId) -> Result<(), StorageError>"
      # Removes a waiting message inside the caller's transaction, or
      # QueuedMessageGone: of two writers racing for one row, one wins.
    steered_entry:
      signature: "(&self, ctx: &CommandContext, thread: &ThreadId, op: &OperationId, row: &QueuedMessageId, prompt: &str) -> Result<ThreadEntryId, StorageError>"
      # In `store/steer.rs`, §20.4: one write takes the row (QueuedMessageGone
      # if it is not there), appends the steered message as a user entry of
      # the running turn, journals `QueuedMessageSent` and records the
      # command; a replay answers the first entry.
    replayed_send_now:
      signature: "(&self, ctx: &CommandContext, thread: &ThreadId) -> Result<Option<SentNow>, StorageError>"
      # Read-only: a recorded `turn.send_now` answers Started when its outcome
      # names an operation, Steered when it names an entry.
    get_operation:
      signature: "(&self, op_id: &OperationId) -> Result<Operation, StorageError>"
enums:
  Focus:
    source: crate::plans::Focus
    values: []
  Harness:
    source: crate::harness::Harness
    values: []
  LeaseError:
    source: crate::harness::LeaseError
    values: []
  CoreError:
    source: crate::error::CoreError
    values: []
  StorageError:
    source: crate::db::StorageError
    values: []
  StopKind:
    source: crate::runtime::StopKind
    values: []


shared_in_transaction:
  standards_for_invocation_in: "Turns composes Operations, Harness, Threads, Projects and Standards reads in one snapshot."
  record_usage_in: Terminal transitions read the invocation snapshot and record it through Usage::record_in inside their own transaction.
  take_queued_in: "The start of a waiting message (§20.3) and Send now (§20.4): the row is removed inside the same write that commits the turn or the steered entry, so a message is sent once or not at all"


called_by_other_services:


obligations:
  - rule: Terminal usage and operation state commit together once under the existing claim and CAS.
    tested_by: [usage_ends_atomically_once]
  - rule: Cancelled or refused replies keep actual measurements; missing responses remain unknown.
    tested_by: [usage_refusal_cancel_and_missing_are_honest]
  - rule: >
      Each invocation records the base standards version and the additions
      id selected for the turn. Only started turns count when deciding what
      the session already received. The stage line is last after focus and
      continuation context, and accompanies Send now without changing the
      recorded person's text.
    tested_by:
      - an_invocation_records_the_prompt_and_instructions_versions
      - every_turn_ends_with_the_stage_line
      - send_now_steers_the_running_turn_after_its_streamed_text
  - rule: >
      A text starting with `/` is the whole prompt: no context block rides
      with it. The changes it skipped are not marked as heard, so the next
      normal turn carries them once, in their current form, however many
      commands came between.
    tested_by:
      - a_slash_command_is_sent_as_one_block
      - context_skipped_by_a_command_reaches_the_next_turn
      - changes_skipped_by_two_commands_reach_the_next_turn_once_and_current
  - rule: >
      A tool is one `ToolCall` entry whose body is its title (§23.8). A
      subagent is one `Subagent` entry carrying its card (§22.2, §23.8): the
      subagent's own tool calls are steps of its
      card, never entries; the card is written once its call has ended and
      its numbers came, or, ended without them, before the parent's next
      text, or at the turn's end, `stopped` if still running. Every change
      to a card while the turn runs is published whole on the turn's bus.
    tested_by:
      - a_subagent_becomes_one_entry_with_its_steps_and_numbers
      - a_card_without_numbers_goes_before_the_next_text_and_a_running_one_stops
  - rule: >
      A focused task belongs to the named version in the thread's project;
      the version's writer thread is attribution, not ownership (§16.4).
    tested_by:
      - a_conversation_can_focus_another_conversations_project_plan
      - a_focus_on_a_task_of_another_plan_is_refused
  - rule: >
      Thread removal stops the durable Pending or Running turn even before
      live registration, then waits for its terminal write without holding
      a session slot (§16.5). No polling timer is needed: commits wake the wait.
    tested_by: deletion_waits_for_a_committed_turn_before_live_registration
  - rule: >
      Replay first. A turn start whose command id and request match a
      recorded one answers the first operation and starts nothing, before the
      registry, the harness, the thread's busyness or the project's modes are
      looked at: a replay is answered while the daemon stops and after the
      mode was disallowed.
    tested_by:
      - turn_start_replays_after_the_move
      - a_replay_is_answered_while_the_daemon_is_stopping
      - a_replay_is_answered_even_after_the_mode_was_disallowed
      - a_replayed_turn_start_starts_nothing_and_returns_the_first_operation
    note: >
      The first sends one body twice and gets one operation id and one
      operation; it does not hold the first turn running, so it proves the
      answer, not the order. The order is proved against the registry and the
      modes by the next two; no test replays while the harness is unavailable
      or the thread busy. The last drives `start_turn` at the store, where the
      transaction answers the replay.

  - rule: >
      Replay identity. "turn.start", schema version 1, principal User/local,
      the caller's command id, params { thread_id, prompt, model, mode,
      effort }, and "focus" and "plan" only when given; `client_tab` is not a
      parameter. The same id with another body, focus or plan is
      CommandConflict.
    tested_by:
      - turn_command_fingerprints_do_not_move
      - a_replay_with_another_body_over_http_is_a_command_conflict
      - the_same_command_with_another_focus_is_a_command_conflict
    note: >
      The first reads the command log for a plain and a focused turn and
      compares every column with `fingerprint` of those literals; it passes
      on the code before the move (dc0255e).

  - rule: >
      A closed registry refuses a new turn with RuntimeStopping, and nothing
      durable is written for it.
    tested_by:
      - a_replay_is_answered_while_the_daemon_is_stopping
      - a_turn_requested_after_shutdown_began_is_refused

  - rule: >
      Harness availability. `Sessions::harness_available` is checked on the thread's
      harness before any session work: an unavailable one is
      HarnessUnavailable and no adapter is opened.
    tested_by:
      - an_unavailable_harness_opens_no_session
      - a_turn_on_a_codex_thread_is_harness_unavailable

  - rule: >
      Busy, early. `send` checks `Operations::thread_is_busy` after the harness and
      before `Sessions::open`: a thread with an operation not yet ended is
      ThreadBusy without an adapter being opened, leased or its model set.
      No caller performs this check; `send` does.
    tested_by:
      - a_busy_thread_is_refused_before_its_session_opens
      - a_second_start_while_busy_is_thread_busy
      - a_second_turn_over_http_while_one_runs_is_thread_busy_and_writes_nothing
    note: >
      The first holds a Pending operation with no live turn and no lease, so
      only the early check can refuse it before the session opens; it
      asserts no session is live. Removing the check fails it (tried on
      dc0255e).

  - rule: >
      A selected plan belongs to the thread's project. `send` refuses a plan
      from another project with INVALID_COMMAND before opening the session.
    tested_by: a_second_turn_over_http_while_one_runs_is_thread_busy_and_writes_nothing

  - rule: >
      A selected plan adds one prompt context block after the person's text
      and any focus block. It includes the plan title, id, and latest version;
      it is not recorded as an entry.
    tested_by: a_forks_first_turn_gets_instruction_and_continue_plan_blocks

  - rule: >
      Busy, atomically. `start_turn` checks `has_open_operation` again inside
      its `write_txn` (BEGIN IMMEDIATE), after the replay and before any
      insert: two starts cannot both commit a turn on one thread.
    tested_by: a_second_turn_while_one_is_running_is_thread_busy
    note: >
      It calls `start_turn` twice in sequence at the store; the second is
      ThreadBusy. No test races two starts: the atomicity rests on
      `write_txn`'s serialized BEGIN IMMEDIATE, which storage's own tests hold.

  - rule: >
      Session before lease. The session is opened, then its events leased,
      before any setting is changed or any row written; the turn holds them
      from its checks to its ending. A refusal after the lease, a replay found
      by the transaction, and a Stop before the prompt each give them back.
    tested_by:
      - a_refused_start_gives_the_session_back
      - a_replay_found_by_the_transaction_gives_the_session_back
      - a_turn_started_during_a_breakdown_read_keeps_its_output
      - no_breakdown_before_the_first_turn_or_while_one_runs
      - a_stop_while_pending_cancels_the_turn_before_its_prompt
    note: >
      The order itself is structural: `lease_events` takes the `OpenSession`
      `open` answered. The first test fails when a refused start keeps the
      events (the next start waits out the lease and is THREAD_BUSY; tried on
      dc0255e). The second races two sends of one command behind a
      `/context` read, so the later one's replay is found only by
      `start_turn`; it fails when that path keeps the events (tried on
      a6fa191).

  - rule: >
      Every check comes before any write: a refused start records no
      message, operation or command.
    tested_by:
      - a_mode_the_project_no_longer_allows_is_refused
      - an_effort_the_model_does_not_offer_is_refused
      - a_turn_whose_adapter_cannot_start_writes_nothing

  - rule: >
      A refused start leaves the session on the model it held: a model set
      for the turn is set back when the turn is not started.
    tested_by:
      - a_refused_effort_leaves_the_session_on_its_model
      - a_refused_mode_leaves_the_session_on_its_model
    note: >
      Both fail on the code before the set-back: the session answers
      `fake-small` after the refusal. A failed transaction and a replay found
      by it take the same path in `record` and have no test of their own.

  - rule: >
      Stop records Cancelled only when the turn is confirmed stopped; a tree
      that cannot be terminated is TerminationFailed (500
      PROCESS_TERMINATION_FAILED over HTTP) and the operation stays Running.
    tested_by:
      - stop_after_the_move_records_cancelled
      - stop_is_confirmed_by_the_harness_when_it_answers_cancelled
      - stop_terminates_the_adapter_when_the_harness_does_not_confirm
      - a_stop_whose_termination_fails_answers_500_and_cancels_nothing

  - rule: >
      Shutdown closes the registry, stops every live turn and records the
      stop kind that is true; its order is unchanged by the move.
    tested_by: shut_down_through_the_core_cancels_and_records
    note: >
      It starts `hang` over HTTP and shuts down through `AppCore`: Graceful,
      and the turn Cancelled. `tests/shutdown.rs` drives the same
      `shut_down` below `Turns`.


agreements:
  - between: [Operations::thread_is_busy, start_turn]
    must: >
      judge a thread busy identically: the early check and the transaction's
      check refuse the same threads
    holds: true
    why: >
      Both call `has_open_operation`, one on a read connection, one inside
      the write transaction; nothing else decides busyness on this path.
    tested_by:
      - a_busy_thread_is_refused_before_its_session_opens
      - a_second_turn_while_one_is_running_is_thread_busy
    note: >
      Each test proves one side. The same rule's agreement with
      `harness::change_model` is in Harness's contract.

  - between: [send_next, start_turn]
    must: >
      send a waiting message once or not at all: the row is taken inside the
      turn's own transaction, so a turn that does not commit leaves the row
      waiting and a row already taken starts no turn
    holds: true
    why: >
      `send_queued` passes the row as `NewTurn.dequeue`, and `start_turn`
      calls `take_queued_in` after its busy check, in the same write that
      inserts the turn; `QueuedMessageGone` aborts that write.
    tested_by: a_completed_turn_starts_the_next_waiting_message_exactly_once

  - between: [watch_turn, send_now]
    must: >
      keep the entries in the order the person saw: the watcher writes the
      steered entry after the reply text it holds, and the reply that follows
      is a new message
    holds: true
    why: >
      `send_now` asks the watcher over `LiveTurn.steer`; the watcher's `steer`
      sends the request and reads no event until it is answered, then cuts the
      open message before `steered_entry` appends the user entry, so a reply
      chunk that beats the answer is written after it. A watcher already gone
      steers nothing: `send_now` starts the message as a turn.
    tested_by: send_now_steers_the_running_turn_after_its_streamed_text

  - between: [send_now, send_next]
    must: >
      send one waiting message once: whichever of Send now and the watcher's
      next send finds the row gone does nothing
    holds: true
    why: >
      Both take the row inside a write (`start_turn` with `Dequeue`, or
      `steered_entry`), and both start under the derived command id
      `queued:<row id>`, so the second is a replay or QueuedMessageGone.
    tested_by: the_watcher_and_send_now_never_send_one_message_twice

  - between: [replayed_turn, start_turn]
    must: >
      answer the same recorded command the same way: the early replay and
      the transaction's replay find the same record and answer its operation
    holds: true
    why: >
      Both call `classify` with the scope "Thread" and the thread's id, and
      both turn the recorded outcome into a `StartedTurn` through `recorded`.
    tested_by:
      - turn_start_replays_after_the_move
      - a_replayed_turn_start_starts_nothing_and_returns_the_first_operation


not_the_caller's:
  - >
      Check `Operations::thread_is_busy`, or open or lease a session, before `send`:
      `send` does all three, in the only safe order.
  - >
      Build the "turn.start" command or fingerprint it; `send` does, from the
      same parameters as before the move, so a replay still matches.
  - >
      Map a `StopOutcome`, or read the operation after a Stop; `stop` answers
      TerminationFailed or the operation as it now stands.


tests:
  - name: listing_keeps_order_and_missing_invocations_without_other_threads
    checks: A batched listing preserves newest-first order and missing invocations, excluding other threads.
  - name: invocation_standards_preserve_pins_nulls_and_missing_results
    checks: An old pin stays exact; a null pin stays base only; foreign pins, unknown operations and removed projects keep their refusal taxonomy.
  - name: waiting_messages_keep_their_order_and_a_removed_one_is_gone
    checks: >
      While a turn is open at the store, two queued messages list in
      `position` order; removing one is fine and removing it again is
      QueuedMessageGone.
  - name: queueing_on_an_idle_thread_starts_a_turn_and_leaves_no_row
    checks: >
      POST queue on an idle thread answers 202 `started` with an operation id
      and the thread's queue stays empty.
  - name: a_replayed_queue_on_an_idle_thread_answers_its_turn
    checks: >
      The same queue body sent twice while its turn runs answers `started`
      with one operation id both times and queues no copy.
  - name: a_busy_thread_queues_and_remove_answers_gone_the_second_time
    checks: >
      A queue on a busy thread answers 202 `waiting` with the message;
      DELETE is 204 and a second DELETE is 404 QUEUED_MESSAGE_GONE.
  - name: a_completed_turn_starts_the_next_waiting_message_exactly_once
    checks: >
      A turn held open with a message waiting behind it: once released, the
      turn completes, the waiting message runs as the thread's second turn
      and appears as one entry, and the queue is empty.
  - name: send_now_steers_the_running_turn_after_its_streamed_text
    checks: >
      With `steerable` running and a message waiting, Send now answers 202
      `steered`, starts no turn, and the entries read: the prompt, the text
      streamed so far, the steered message, the reply to it; the queue is empty.
  - name: send_now_after_stop_is_thread_busy_and_keeps_the_row
    checks: >
      While a Stop is pending on `ignore-cancel`, Send now is 409 THREAD_BUSY
      and the row stays listed without `last_error`.
  - name: the_watcher_and_send_now_never_send_one_message_twice
    checks: >
      Send now as a turn completes answers 202, 404 or 409, and the message
      is one entry in a thread of two turns.
  - name: a_subagent_becomes_one_entry_with_its_steps_and_numbers
    checks: >
      An Agent call with two steps and a handback, ended and then given its
      numbers, is one card between the parent's two messages, with both steps,
      its resolved model, tokens and report; no step is an entry.
  - name: a_card_without_numbers_goes_before_the_next_text_and_a_running_one_stops
    checks: >
      A failed call with no numbers is written at the parent's next chunk; a
      call still open at the turn's end is written `stopped`.
  - name: a_cut_writes_the_streamed_text_and_the_reply_continues_as_a_new_message
    checks: >
      `Collector::cut` returns the text so far; later chunks of the same
      message id become a new message.
  - name: stop_leaves_the_queue_and_starts_nothing
    checks: >
      Stopping the running turn leaves the waiting message listed, with no
      `last_error`, and starts no second turn.
  - name: a_conversation_can_focus_another_conversations_project_plan
    checks: >
      A second conversation sends a focus on the first conversation's plan;
      the HTTP start succeeds, the turn completes and its message retains the task.
  - name: deletion_waits_for_a_committed_turn_before_live_registration
    checks: >
      A committed Pending turn is resumed only after removal commits. Delete
      answers with its cancellation requested, its ending durable, and no adapter.
  - name: turn_start_replays_after_the_move
    checks: >
      One body sent twice over HTTP answers 202 twice with the same operation
      id, and the thread has one operation.
  - name: turn_command_fingerprints_do_not_move
    checks: >
      A plain and a focused turn with a selected plan over HTTP leave two
      command records whose principal, id, kind, schema version and
      fingerprint equal the literals'.
  - name: stop_after_the_move_records_cancelled
    checks: >
      `hang` started, POST stop answers 200 with the operation; it ends
      Cancelled.
  - name: a_second_start_while_busy_is_thread_busy
    checks: A second start with a new id while `hang` runs is 409 THREAD_BUSY.
  - name: a_busy_thread_is_refused_before_its_session_opens
    checks: >
      With a Pending operation written at the store and nothing live, a start
      is 409 THREAD_BUSY and no session is live.
  - name: an_unavailable_harness_opens_no_session
    checks: A start on a codex thread is 422 HARNESS_UNAVAILABLE and no session is live.
  - name: a_refused_start_gives_the_session_back
    checks: >
      A start with an unlisted model is 422 SETTING_NOT_OFFERED after the
      session opened; the next start runs to Completed.
  - name: a_replay_found_by_the_transaction_gives_the_session_back
    checks: >
      Two sends of one command while a `/context` read holds the session both
      answer 202 with one operation id and one operation is written; the next
      start runs to Completed.
  - name: a_replay_is_answered_while_the_daemon_is_stopping
    checks: >
      After the registry closes, the first body replays 202 with its
      operation id and a new command is 503 RUNTIME_STOPPING.
  - name: a_replay_is_answered_even_after_the_mode_was_disallowed
    checks: >
      After the project drops the turn's mode, the same body replays with the
      first operation id and one UserMessage exists.
  - name: a_replayed_turn_start_starts_nothing_and_returns_the_first_operation
    checks: >
      At the store, a second `start_turn` with the same command is replayed:
      same operation and entry, one entry, one operation.
  - name: a_replay_with_another_body_over_http_is_a_command_conflict
    checks: The same id with another prompt is 409 COMMAND_CONFLICT.
  - name: the_same_command_with_another_focus_is_a_command_conflict
    checks: >
      The same focus from another tab replays; another focus under the same
      id is 409 COMMAND_CONFLICT.
  - name: a_turn_requested_after_shutdown_began_is_refused
    checks: >
      After shutdown, a start is RuntimeStopping at the fixture, storage
      refuses a Pending operation, and HTTP answers 503 RUNTIME_STOPPING with
      no operation and no entry.
  - name: a_turn_on_a_codex_thread_is_harness_unavailable
    checks: A start on a codex thread is 422 HARNESS_UNAVAILABLE.
  - name: a_second_turn_over_http_while_one_runs_is_thread_busy_and_writes_nothing
    checks: >
      While `hang` runs, a second start is 409 THREAD_BUSY and only the
      running turn's prompt is an entry; a selected plan from another project
      is 422 INVALID_COMMAND and writes nothing.
  - name: a_forks_first_turn_gets_instruction_and_continue_plan_blocks
    checks: >
      A forked conversation receives its changed project instructions and the
      selected plan context block after the person's text.
  - name: a_second_turn_while_one_is_running_is_thread_busy
    checks: A second `start_turn` at the store while the first is Pending is ThreadBusy.
  - name: a_turn_started_during_a_breakdown_read_keeps_its_output
    checks: >
      A turn sent while `/context` holds the session runs after it and keeps
      its own reply; no entry holds the breakdown.
  - name: no_breakdown_before_the_first_turn_or_while_one_runs
    checks: While `hang` runs, `/context` answers no categories, reason "running".
  - name: a_stop_while_pending_cancels_the_turn_before_its_prompt
    checks: >
      A Stop while Pending is NotLive; the turn then ends Cancelled with only
      the UserMessage, and the next turn completes on the given-back session.
  - name: a_mode_the_project_no_longer_allows_is_refused
    checks: A disallowed mode is 403 MODE_NOT_ALLOWED and there are no entries.
  - name: an_effort_the_model_does_not_offer_is_refused
    checks: An unoffered effort is 422 SETTING_NOT_OFFERED and there are no entries.
  - name: a_refused_effort_leaves_the_session_on_its_model
    checks: >
      A turn naming `fake-small` with effort `max` is 422 SETTING_NOT_OFFERED
      and the session still answers `fake-large`.
  - name: a_refused_mode_leaves_the_session_on_its_model
    checks: >
      With only acceptEdits allowed, a turn naming `fake-small` in `auto` is
      403 MODE_NOT_ALLOWED and the session still answers `fake-large`.
  - name: a_turn_whose_adapter_cannot_start_writes_nothing
    checks: A missing node is 502 HARNESS_START_FAILED, no entries, no operations.
  - name: stop_is_confirmed_by_the_harness_when_it_answers_cancelled
    checks: Stop on `hang` is ResolvedByTurn, Cancelled, and the adapter survives.
  - name: stop_terminates_the_adapter_when_the_harness_does_not_confirm
    checks: >
      Stop on `ignore-cancel` is Cancelled after the adapter is terminated
      (no session live); the next turn completes.
  - name: a_stop_whose_termination_fails_answers_500_and_cancels_nothing
    checks: >
      With termination forced to fail, POST stop is 500
      PROCESS_TERMINATION_FAILED and the operation stays Running.
  - name: shut_down_through_the_core_cancels_and_records
    checks: >
      `AppCore::shut_down` with `hang` running answers Graceful and the turn
      ends Cancelled.
