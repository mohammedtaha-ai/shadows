# Events errors translate through CoreError with unchanged responses.
# ProjectLifecycle errors translate through CoreError with unchanged responses.
# Turns errors translate through CoreError with unchanged responses.
# Plans errors translate through CoreError with unchanged responses.
# Design errors translate through CoreError with unchanged responses.
# OperationsError is translated through CoreError with unchanged responses.
# GrantsError is translated through CoreError with unchanged responses.
# ThreadsError is translated through CoreError with unchanged responses.
# Extension library methods and refusals are imported from core-extensions.
# AgentsError is translated through CoreError with unchanged responses.
# CodebaseError converts through CoreError to preserve index and scope refusals.
# StandardsError converts through CoreError to preserve InvalidCommand refusals.
# InstructionsError converts through CoreError to preserve HTTP refusals.
# PersonError converts through CoreError to preserve HTTP refusals.
# UsageError converts through CoreError to preserve HTTP refusals.
# ProjectsError converts through CoreError to preserve HTTP refusals.
name: shadows-http
version: 1
status: current
source: crates/shadows-http/src
modules:
  grants.rs: External connection HTTP translation for issue, list, project edits and revoke
  planning_context.rs: Planning context HTTP translation
  harness.rs: Harness session HTTP translation
  design.rs: Design service HTTP translation
  project_state.rs: ProjectState service HTTP translation
  code_record.rs: CodeRecord service HTTP translation
  plan_design.rs: Plans service design association HTTP translation
  standards.rs: Standards service HTTP translation
  aylul_providers.rs: Providers service HTTP translation
  aylul_agents.rs: Agents service HTTP translation, including the agent template
  aylul_threads.rs: Threads service agent listing
  groups.rs: Messages service HTTP translation
  aylul_person.rs: PersonSettings service HTTP translation
  aylul_usage.rs: Usage service HTTP translation
  aylul_extensions.rs: Extensions library HTTP translation
  planner_switches.rs: Planner switch HTTP translation
  transport.rs: shared HTTP request execution
  sse.rs: Events stream framing through private handlers
  runs.rs: Runs service HTTP translation
  failure/runs.rs: run failure status mapping
decisions: >
  GET /api/projects/{id}/decisions calls Design::decisions; POST
  /api/projects/{id}/decisions/{decision}/accept with { command_id, version } calls
  Design::accept_decision. DECISION_STALE is 409 and INVALID_DECISION is 422.
  Tested by design_routes::decisions_are_listed_and_accepted_over_http.
elements: >
  GET /api/projects/{id}/state?part_id=&outcome_id= calls ProjectState::state_for and answers
  ProjectStateView; a part not in the project's map, or both selectors, is 422 INVALID_COMMAND. GET /api/projects/{id}/elements calls
  ProjectState::elements and answers [ElementView]. GET
  /api/projects/{id}/elements/{element}/revisions calls Design::element_revisions and answers
  [DesignElement], oldest first, as Design gives it: [] for an element the project does not
  have, as the MCP design_elements tool answers. An unknown or removed project is 404 on all three. No route writes an element. ELEMENT_STALE is 409 and
  INVALID_ELEMENT is 422. Tested by design_routes::element_routes_list_states_and_revisions,
  project_state_routes::the_state_route_answers_the_method and
  project_state_routes::an_unknown_part_is_422.
planner_switches: >
  GET /api/projects/{id}/planner-extensions calls Extensions::project_extensions and answers
  AgentExtensions (plugins always empty). PUT /api/projects/{id}/planner-extensions/{kind}/{item}
  with Toggle calls Extensions::set_project_extension and answers AgentItem; a plugin is 400
  PROFILE_INVALID, an unknown project or item 404 EXTENSION_NOT_FOUND. PUT
  /api/projects/{id}/planner-claude-md with Toggle calls Projects::set_planner_claude_md and
  answers Project; an unknown project is 404 INVALID_COMMAND. A replayed command id with a
  changed body is 409 COMMAND_CONFLICT. Tested by
  planner_switches::the_routes_list_and_switch_a_project_s_items,
  planner_switches::the_routes_refuse_a_plugin_and_an_unknown_project and
  planner_switches::the_claude_md_route_sets_the_project.
code_where: >
  GET /api/projects/{id}/code-where?topic= calls CodeRecord::code_where (asking as
  Asker::Person of the project) and answers WhereAnswer. An unknown or removed project is 404;
  a blank or long topic is 422 INVALID_COMMAND. Tested by
  code_where_routes::the_route_answers_the_method and code_where_routes::a_blank_topic_is_422.
agreements:
  - between: [aylul_extensions::tools, aylul_extensions::tool_rules]
    must: Delegate per-agent MCP discovery and rule replacement to AppCore.extensions; discovery failures preserve stored rules.
    tested_by: [tools_and_rules_are_listed, rules_are_replaced, an_unknown_item_is_404,
      a_bad_tool_name_is_400, a_replayed_put_conflicts_on_change, missing_tools_keep_their_rule]
  - between: [harness::waiting_permissions, harness::answer_permission]
    must: Read and answer only through AppCore.harness; Harness owns option validation, replay and provenance.
    tested_by: [waiting_requests_are_listed_oldest_first, answering_over_http_answers_the_adapter, unknown_settled_and_not_offered_answer_their_codes, a_replayed_answer_answers_the_first_result, no_aylul_lists_nothing]
  - between: [aylul_extensions::remove, aylul_extensions::remove_mcp]
    must: Delete through the same Extensions operation for every kind, including the static MCP path.
    tested_by: [mcp_routes_answer_names_never_values, extension_routes_round_trip]
  - between: [plans::get, plans::get_for]
    must: Preserve stored values within scope; grant reads independently enforce project reach.
    tested_by: [plan_adapter_pairs_keep_their_authorization_boundaries,
      incoming_previews_obey_the_grants_one_way_project_reach,
      a_contract_written_over_mcp_is_read_the_same_over_http]
    # GET /api/workflows/{id} carries each task's contract at tasks[i].contract, from TaskContent.
  - between: [plans::approve, plans::approve_as_planner]
    must: >
      Both end in approve_plan_with. Person approval and Planner approval keep
      their distinct authority and provenance; project grants cannot approve.
    tested_by: [plan_adapter_pairs_keep_their_authorization_boundaries,
      a_replayed_approval_answers_the_first_result]
  - between: [design::agreements, design::agreements_for]
    must: Answer the same project listing while the grant is live.
    tested_by: agreement_adapter_pairs_preserve_content_and_reach
  - between: [design::agreement, design::agreement_for]
    must: Answer the same selected version while the grant is live.
    tested_by: agreement_adapter_pairs_preserve_content_and_reach
  - between: [design::start_agreement, design::start_agreement_for]
    must: Normalize the same content while preserving distinct person and grant writers.
    tested_by: agreement_adapter_pairs_preserve_content_and_reach
  - between: [design::edit_agreement, design::edit_agreement_for]
    must: Apply equivalent content edits with each caller's writer authority.
    tested_by: agreement_adapter_pairs_preserve_content_and_reach
  - between: [plans::review_agreement, plans::review_agreement_for]
    must: Answer the same review while the grant is live.
    tested_by: agreement_adapter_pairs_preserve_content_and_reach

# Provider service failures translate through CoreError before HTTP mapping.
# Harness errors translate through CoreError with unchanged adapter responses.

harness_catalog:
  module: harness.rs
  route: 'GET /api/harnesses/{kind}/catalog -> Harness::catalog (HarnessCatalog); HARNESS_UNAVAILABLE and INVALID_COMMAND 422, HARNESS_START_FAILED 502'
  tested_by: [the_catalog_route_answers_claude_codes_models]

background_tasks:
  stop: POST /api/threads/{id}/session/tasks/{task_id}/stop delegates to Harness.
  stream: The tasks frame carries the current operation if any and the session task list.
  tested_by: [stop_reaches_the_adapter, unknown_task_is_404, an_ended_task_is_not_stopped,
    a_subscriber_gets_the_tasks_after_caught_up]

planning_context:
  module: planning_context.rs
  routes: ['PUT /api/threads/{id}/anchor', 'GET /api/threads/{id}/anchor', 'GET /api/operations/{id}/context', 'POST /api/threads/{id}/context/resend']
  methods: [Design::set_thread_anchor, Design::thread_anchor, Harness::context_record, Harness::forget_context]
  resend: 'Answers 200 { owed: true } after Harness::forget_context(Forget::Request); a missing thread is 404, an AYLUL thread is 422 INVALID_COMMAND, a replay with other params 409.'
  wire: Lowercase anchor kinds map to the existing DesignAnchor enum without changing its other callers.
  absent_record: 404 CONTEXT_NOT_CARRIED, with no assertion about the reason.

runs:
  module: runs.rs
  routes:
    - 'GET /api/workflows/{workflow}/versions/{version}/tasks/{task} -> Runs::task (TaskRun with needs, start, executor)'
    - 'GET /api/workflows/{workflow}/versions/{version}/progress -> Runs::progress ([TaskProgress] in task order; 404 as the task read)'
    - 'PUT /api/workflows/{workflow}/versions/{version}/tasks/{task}/executor -> Runs::set_executor (ExecutorChoice)'
    - 'GET /api/workflows/{workflow}/versions/{version}/tasks/{task}/attempts -> Runs::attempts'
    - 'POST /api/workflows/{workflow}/versions/{version}/tasks/{task}/attempts -> Runs::start, 201, run detached'
    - 'PUT /api/workflows/{workflow}/versions/{version}/tasks/{task}/done -> Runs::mark_done'
    - 'POST /api/attempts/{id}/stop -> Runs::stop, run detached'
    - 'GET /api/attempts/{id}/brief -> Runs::brief (AttemptBrief with its version''s planned consumers; 409 context_not_recorded is a RunRefusal)'
    - 'GET /api/attempts/{id}/conflict -> Runs::conflict (TaskConflict, or null for an attempt with none; unknown attempt 404)'
    - 'GET /api/attempts/{id}/diff -> Runs::diff'
    - 'GET /api/attempts/{id}/files?path= -> Runs::file (AttemptFile; 409 outside_writes is a RunRefusal)'
    - 'GET /api/rechecks/{recheck} -> Runs::recheck_rows ([RecheckRow]; unknown batch 404)'
    - 'GET /api/rechecks/{recheck}/output -> Runs::watch_recheck, SSE live only: started, chunk, finished, lagged and end frames, each one RecheckOutput; the stream ends after end or at shutdown; unknown batch 404'
  refusals: >
    A Runs refusal is 409 RunRefusal { code, reason } with Runs' own opaque code, the same
    codes a task's start answer carries (missing_input and input_unavailable among them);
    NotFound is 404, Storage and Unavailable 5xx ErrorBody; Grants and Code carry their owner's
    error and answer its own translation (failure/runs.rs). No route asks a task question.
  paths: Plan versions are global ids, as /api/workflows/{id} already is; no project segment.
  tested_by: [the_task_answers_its_needs_start_and_executor_choice,
    the_person_saves_a_tasks_executor_over_http, start_without_a_choice_is_409_no_executor_choice,
    start_while_waiting_is_409_with_the_waiting_tasks, a_replayed_start_returns_the_same_attempt,
    the_attempts_are_listed_newest_first, stop_answers_the_attempt_as_it_stands,
    the_diff_of_an_attempt_with_no_commit_is_empty, a_done_mark_frees_the_tasks_that_need_it,
    the_folder_decides_start_not_git_and_dirty_scope, a_file_at_an_attempts_commit_is_served,
    live_a_task_started_over_http_commits_only_its_writes]

code_inventory:
  module: code.rs
  routes:
    - 'GET /api/projects/{id}/code/files -> Codebase::inventory (Asker::Person; absent prefix, after, limit take InventoryQuery::default())'
    - 'POST /api/projects/{id}/code/refresh -> Codebase::refresh_inventory (Asker::Person), no body'
  refusals: >
    INVENTORY_STALE is 409 (a cursor of another generation, files only); a limit outside 1 to
    200, a path outside the project or a foreign cursor is 422 INVALID_COMMAND; no such
    project is 404.
  tested_by: [the_person_and_the_planner_see_the_same_files]

code_servers:
  module: code.rs
  routes:
    - 'GET /api/projects/{id}/code/servers -> Codebase::servers (Asker::Person); asking does not activate'
    - 'PUT /api/code/servers/{server}/off { command_id, off } -> Codebase::set_server_off, 204'
    - 'POST /api/code/servers { command_id, id, command, args, extensions } -> Codebase::add_server, 200 ServerStatus'
    - 'DELETE /api/code/servers/{server}?command_id -> Codebase::remove_server, 204'
  refusals: >
    An unknown server, a catalog id added or removed, or an extension without a dot is 422
    INVALID_COMMAND; a replay with another body is 409 COMMAND_CONFLICT.
  tested_by: [an_added_server_is_listed_and_removable]

map_refusals: 'MAP_REFUSED is HTTP 422 with the rule-prefixed domain message; shared adapter fixtures cover it.'

layout_only: Map records contain no starter files; the stage has no Structure step or file count, and no HTTP structure-write route exists. Roadmap follows map approval.

question_answer: 'POST /api/threads/{id}/questions/{question}/answer { command_id, option } calls Turns::answer and answers 202 Queued; a second answer is 409 COMMAND_CONFLICT, a question of another thread or an option out of range 422 INVALID_COMMAND.'
queued_notices: 'QUEUED_NOTICE_KEPT is 409: DELETE of a waiting executor notice removes nothing. QueuedMessage.notice and the Notice and AttemptNotice schemas (the latter listed in openapi.rs, as the card a notice entry carries) describe it.'

route_table:
  rule: >
    `routes()` builds the table one group function at a time, in the same route order, so
    no single frame holds every `routes!` temporary. One chain needed more than 768 KiB of
    stack in a debug build, on Windows as on Linux, against the megabyte a Windows main
    thread has; the groups need under 320 KiB.
  tested_by: [the_route_table_builds_on_half_a_megabyte_of_stack]

check_results: >
  GET /api/attempts/{id}/checks calls Runs::check_results. The done route accepts optional
  reason and calls the same Runs::mark_done rule as MCP. checks_not_passed is a 409 refusal;
  unknown attempts are 404. No adapter recomputes confirmation or done policy.
# RecheckNotice and RecheckFailure are named OpenAPI schemas for the Shadows recheck card.
