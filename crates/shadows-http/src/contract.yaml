# Events errors translate through CoreError with unchanged responses.
# ProjectLifecycle errors translate through CoreError with unchanged responses.
# Turns errors translate through CoreError with unchanged responses.
# Plans errors translate through CoreError with unchanged responses.
# Design errors translate through CoreError with unchanged responses.
# OperationsError is translated through CoreError with unchanged responses.
# GrantsError is translated through CoreError with unchanged responses.
# ThreadsError is translated through CoreError with unchanged responses.
# Extension library methods and refusals are imported from core-extensions.
# AgentsError is translated through CoreError with unchanged responses.
# CodeError converts through CoreError to preserve index and scope refusals.
# StandardsError converts through CoreError to preserve InvalidCommand refusals.
# InstructionsError converts through CoreError to preserve HTTP refusals.
# PersonError converts through CoreError to preserve HTTP refusals.
# UsageError converts through CoreError to preserve HTTP refusals.
# ProjectsError converts through CoreError to preserve HTTP refusals.
name: shadows-http
version: 1
status: current
source: crates/shadows-http/src
modules:
  harness.rs: Harness session HTTP translation
  design.rs: Design service HTTP translation
  plan_design.rs: Plans service design association HTTP translation
  standards.rs: Standards service HTTP translation
  aylul_providers.rs: Providers service HTTP translation
  aylul_agents.rs: Agents service HTTP translation, including the agent template
  aylul_threads.rs: Threads service agent listing
  aylul_person.rs: PersonSettings service HTTP translation
  aylul_usage.rs: Usage service HTTP translation
  aylul_extensions.rs: Extensions library HTTP translation
  transport.rs: shared HTTP request execution
  sse.rs: Events stream framing through private handlers
agreements:
  - between: [harness::waiting_permissions, harness::answer_permission]
    must: Read and answer only through AppCore.harness; Harness owns option validation, replay and provenance.
    tested_by: [waiting_requests_are_listed_oldest_first, answering_over_http_answers_the_adapter, unknown_settled_and_not_offered_answer_their_codes, a_replayed_answer_answers_the_first_result, no_aylul_lists_nothing]
  - between: [aylul_extensions::remove, aylul_extensions::remove_mcp]
    must: Delete through the same Extensions operation for every kind, including the static MCP path.
    tested_by: [mcp_routes_answer_names_never_values, extension_routes_round_trip]
  - between: [plans::get, plans::get_for]
    must: Preserve stored values within scope; grant reads independently enforce project reach.
    tested_by: [plan_adapter_pairs_keep_their_authorization_boundaries,
      incoming_previews_obey_the_grants_one_way_project_reach]
  - between: [plans::approve, plans::approve_as_planner]
    must: >
      Both end in approve_plan_with. Person approval and Planner approval keep
      their distinct authority and provenance; project grants cannot approve.
    tested_by: [plan_adapter_pairs_keep_their_authorization_boundaries,
      a_replayed_approval_answers_the_first_result]
  - between: [design::agreements, design::agreements_for]
    must: Answer the same project listing while the grant is live.
    tested_by: agreement_adapter_pairs_preserve_content_and_reach
  - between: [design::agreement, design::agreement_for]
    must: Answer the same selected version while the grant is live.
    tested_by: agreement_adapter_pairs_preserve_content_and_reach
  - between: [design::start_agreement, design::start_agreement_for]
    must: Normalize the same content while preserving distinct person and grant writers.
    tested_by: agreement_adapter_pairs_preserve_content_and_reach
  - between: [design::edit_agreement, design::edit_agreement_for]
    must: Apply equivalent content edits with each caller's writer authority.
    tested_by: agreement_adapter_pairs_preserve_content_and_reach
  - between: [plans::review_agreement, plans::review_agreement_for]
    must: Answer the same review while the grant is live.
    tested_by: agreement_adapter_pairs_preserve_content_and_reach

# Provider service failures translate through CoreError before HTTP mapping.
# Harness errors translate through CoreError with unchanged adapter responses.
