# Events errors translate through CoreError with unchanged responses.
# ProjectLifecycle errors translate through CoreError with unchanged responses.
# Turns errors translate through CoreError with unchanged responses.
# Plans errors translate through CoreError with unchanged responses.
# Design errors translate through CoreError with unchanged responses.
# OperationsError is translated through CoreError with unchanged responses.
# GrantsError is translated through CoreError with unchanged responses.
# ThreadsError is translated through CoreError with unchanged responses.
# CodeError converts through CoreError to preserve the MCP scope and storage envelope.
name: shadows-mcp
version: 1
status: current
source: crates/shadows-mcp/src
modules:
  plan_tools.rs: Plans service MCP translation
  code_tools.rs: Code service MCP translation
  turn_tools.rs: Turns service MCP translation
  agreement_tools.rs: grant scoped agreement translation
  workspace_tools.rs: workspace read translation
  run_tools.rs: Runs service MCP translation
  server.rs: composition of tool routers under Core grant policy (thread, project and executor)
  refusal.rs: stable MCP error envelope
agreements:
  http_pairs: crates/shadows-http/src/contract.yaml
  must: >
    Every tool calls AppCore's owning service. The HTTP contract lists the
    equivalent person and grant methods, their intentional differences and tests.
  tested_by: [agreement_adapter_pairs_preserve_content_and_reach,
    plan_adapter_pairs_keep_their_authorization_boundaries]
# Harness errors translate through CoreError with unchanged tool refusals.

map_refusals: 'The generic refusal mapping preserves MAP_REFUSED and its rule-prefixed message; shared adapter fixtures cover it.'
map_layers: 'map_propose describes the single folder and layer places; the typed schema comes from Core. Tested by planner_mcp::the_map_tool_names_layers.'
map_change_parent: 'A map_propose change carries parent: the current one keeps the part, another moves it, none moves it to the top. Tested by design_parts::map::proposals::a_map_change_moves_a_part_under_another.'
vision_propose_args: 'vision_propose names which arguments each action takes: field for an add only, item_id (and text for an edit) for an edit or removal, never field; each argument carries its own description in the schema. Core refuses the wrong shape either way. Tested by mcp_server::the_discover_lifecycle_works_without_a_session.'

layout_only: Map records contain no starter files; the stage has no Structure step or file count, and no HTTP structure-write route exists. Roadmap follows map approval.

# project_files translates { prefix, after, limit } to Code::inventory and project_refresh
# (no arguments) to Code::refresh_inventory, both with Asker::Grant(grant.project_id), and
# answer the InventoryPage as JSON. A stale cursor is INVENTORY_STALE; only the Planner's
# grant lists them (Grants::tools_for). Tested by
# code_scope::the_person_and_the_planner_see_the_same_files.
# project_files' description says what each InventoryState of a page means, and that
# indexing is a listing not complete yet: ask again, never conclude the folder is empty.
# Tested by mcp_tools::the_planner_is_told_an_indexing_listing_is_not_complete.
# task_report translates { commit, report } to Runs::report with the caller's executor grant
# and answers { attempt, state, commit }. A Runs refusal is INVALID_COMMAND with Runs' own code
# leading its text (`outside_writes: ...`); a grant with no attempt is GRANT_SCOPE. Tested by
# mcp_tools::an_executor_grant_lists_its_tools_and_reads_only_its_task.
# project_git_init (no arguments) calls Runs::init_git with the caller's grant and answers
# { commit }; only the Planner's grant lists it. Its description says it is for a folder Start
# refuses as not git, is refused inside a repository, and writes no file. A Runs refusal
# (already_git, no_folder) leads its text. Tested by mcp_server::the_tool_list_depends_on_the_grant_kind
# and, in Runs, runs_attempts::init.
# A task's contract rides inside task_add and task_update; the schema comes from Core's
# TaskContent; task_context answers `contracts`. Tested by
# mcp_tools::a_contract_written_over_mcp_is_read_the_same_over_http.
# task_context translates workflow_id/task_number to Plans::task_context for
# both grant kinds. Its description directs the first read before building
# and states that it grants no execution permission. Scope and approval
# requirements remain in Plans; no adapter reads tables or grants authority.
# Optional phase_id selects a phase through Plans. plan_edit describes
# phases_set with retained IDs, new server identities and derived numbers.
# plan_edit's description ends with one complete, valid ops list: a task_add whose task
# has acceptance items and a contract with one file, symbol, produced output and use, and
# a link_put. Its input schema is Core's PlanOp unchanged. Tested by
# mcp_tools::the_plan_edit_example_parses_as_the_ops_it_shows.
