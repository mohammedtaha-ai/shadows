[package]
name = "shadows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
shadows-agent = { path = "../shadows-agent" }
shadows-core = { path = "../shadows-core" }
shadows-process = { path = "../shadows-process" }
rmcp = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[features]
# Compiles in `shadows-core`'s test hooks (`storage::test_support`,
# `from_literal`, `force_termination_failure`, `testing`), which must never
# ship in an ordinary build — see cross-cutting rule 10. Also `rmcp`'s MCP
# client, for tests that call `/mcp` as an agent does. Enabled for
# `cargo test` only via the self dev-dependency below, never a default feature.
test-support = [
    "shadows-core/test-support",
    "rmcp/client",
    "rmcp/transport-streamable-http-client-reqwest",
    "dep:reqwest",
]

[dev-dependencies]
tempfile = { workspace = true }
syn = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
tower = { workspace = true }
# Used by the tests only, since the modules that used them moved to
# `shadows-core`.
agent-client-protocol = { workspace = true }
dunce = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
# Enables `test-support` for integration tests (tests/*.rs) without turning
# it on for `cargo build` or `cargo run`: Cargo's feature resolver unifies
# features per build/test graph, so this only affects `cargo test`.
shadows = { path = ".", features = ["test-support"] }
