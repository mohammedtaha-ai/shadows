    &quot;message&quot;,

#aylul-workspace-preview .aw-bot-card button{width:100%;font-size:11px}
#aylul-workspace-preview .aw-library-hint{color:var(--aw-dim);font-size:11px;margin-top:24px;display:flex;gap:8px}
#aylul-workspace-preview .aw-activity{padding:24px;flex:1;min-height:408px}
#aylul-workspace-preview .aw-event{display:flex;align-items:flex-start;gap:11px;padding:17px 0;border-bottom:1px solid var(--aw-border);font-size:12px}
#aylul-workspace-preview .aw-event small{display:block;color:var(--aw-dim);font-size:11px;margin-top:5px}
#aylul-workspace-preview .aw-event-time{font-size:10px;color:var(--aw-dim);margin-left:auto;white-space:nowrap}
#aylul-workspace-preview .aw-settings{padding:25px;flex:1}
#aylul-workspace-preview .aw-settings-tabs{display:flex;flex-wrap:wrap;gap:7px;border-bottom:1px solid var(--aw-border);margin:20px 0;padding-bottom:12px}
#aylul-workspace-preview .aw-settings-tabs button.active{background:var(--aw-soft);color:var(--aw-accent)}
#aylul-workspace-preview .aw-setting-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 0;border-bottom:1px solid var(--aw-border);font-size:12px}
#aylul-workspace-preview .aw-setting-row small{display:block;color:var(--aw-dim);font-size:11px;margin-top:3px}
#aylul-workspace-preview .aw-setting-row select{border:1px solid var(--aw-border);border-radius:6px;background:var(--aw-panel);font-size:11px;padding:6px;max-width:160px}
#aylul-workspace-preview .aw-overlay{position:absolute;inset:0;z-index:5;background:light-dark(#29213166,#06040cb8);backdrop-filter:blur(5px);padding:55px 22px 24px;display:flex;align-items:flex-start;justify-content:center}
#aylul-workspace-preview .aw-modal{width:530px;max-width:100%;background:var(--aw-panel);border:1px solid var(--aw-border);border-radius:14px;padding:23px;box-shadow:0 20px 70px #0004}
#aylul-workspace-preview .aw-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
#aylul-workspace-preview .aw-modal-head h2{font-size:18px}
#aylul-workspace-preview .aw-modal-lead{margin:4px 0 19px;color:var(--aw-dim);font-size:12px}
#aylul-workspace-preview .aw-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#aylul-workspace-preview .aw-field{display:block;font-size:11px;color:var(--aw-dim)}
#aylul-workspace-preview .aw-field.full{grid-column:1/-1}

#aylul-workspace-preview .aw-field textarea{min-height:79px;resize:vertical}
#aylul-workspace-preview .aw-modal-footer{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--aw-border);padding-top:17px;margin-top:21px}
#aylul-workspace-preview .aw-modal-footer span{margin-right:auto;font-size:10px;color:var(--aw-dim);align-self:center}
#aylul-workspace-preview .aw-toast{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);max-width:90%;background:var(--aw-panel);border:1px solid var(--aw-border);border-radius:8px;padding:10px 17px;font-size:12px;z-index:8;box-shadow:0 8px 30px #0003}
#aylul-workspace-preview .aw-mobile-menu{display:none}
