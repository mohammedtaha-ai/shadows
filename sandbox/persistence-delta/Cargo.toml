[package]
name = "shadows-persistence-delta"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[features]
default = []
seaorm-current = ["dep:sea-orm", "dep:sea-orm-migration"]
sqlx-current = ["dep:sqlx"]

[dependencies]
shadows-domain = { path = "../shared-domain" }
sea-orm = { version = "2.0.3", optional = true, default-features = false, features = [
    "macros", "runtime-tokio-rustls", "sqlx-postgres", "with-json", "with-time", "with-uuid",
] }
sea-orm-migration = { version = "2.0.3", optional = true, default-features = false, features = [
    "runtime-tokio-rustls", "sqlx-postgres", "with-json", "with-time", "with-uuid",
] }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "json", "migrate", "macros",
] }
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures = "0.3"

[[test]]
name = "seaorm_postgres"
path = "tests/seaorm_postgres.rs"
required-features = ["seaorm-current"]

[[test]]
name = "sqlx_postgres"
path = "tests/sqlx_postgres.rs"
required-features = ["sqlx-current"]
