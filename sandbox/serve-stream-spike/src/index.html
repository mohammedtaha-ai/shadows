<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>shadows serve/stream spike</title>
<style>
  body { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 0; padding: 16px;
         background: #101215; color: #d8dee9; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .note { color: #6b7684; margin-bottom: 14px; }
  textarea { width: 100%; box-sizing: border-box; background: #181b20; color: #d8dee9;
             border: 1px solid #2b313a; border-radius: 4px; padding: 8px; font: inherit; }
  button { background: #2b6cb0; color: #fff; border: 0; border-radius: 4px;
           padding: 7px 14px; font: inherit; cursor: pointer; margin: 8px 6px 0 0; }
  button.secondary { background: #2b313a; }
  button:disabled { opacity: .5; cursor: default; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  section { border: 1px solid #2b313a; border-radius: 4px; min-height: 220px; }
  section > h2 { font-size: 12px; margin: 0; padding: 6px 10px; background: #181b20;
                 border-bottom: 1px solid #2b313a; color: #8b97a8; font-weight: 600; }
  .pane { padding: 10px; white-space: pre-wrap; word-break: break-word; max-height: 46vh;
          overflow: auto; }
  .entry { border-left: 2px solid #48a868; padding-left: 8px; margin-bottom: 8px; }
  .meta { color: #6b7684; font-size: 12px; }
  .done { color: #d8a657; }
  .fatal { color: #e06c75; }
  #status { margin-top: 10px; color: #8b97a8; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>shadows serve/stream spike</h1>
  <div class="note">Throwaway. One page, one SSE stream, one real Claude child process. No database.</div>

  <textarea id="prompt" rows="3">Say hello, then read the file sample.txt in this directory and tell me the number.</textarea>
  <button id="go">Run turn</button>
  <button id="reset" class="secondary">Forget session</button>

  <div class="cols">
    <section>
      <h2>TRANSIENT &mdash; live text deltas (render only, never stored)</h2>
      <div class="pane" id="live"></div>
    </section>
    <section>
      <h2>DURABLE &mdash; complete entries (this is what a ThreadEntry row holds)</h2>
      <div class="pane" id="entries"></div>
    </section>
  </div>

  <section style="margin-top:12px">
    <h2>OPERATIONAL &mdash; everything else</h2>
    <div class="pane meta" id="log"></div>
  </section>

  <div id="status">idle</div>

<script>
const $ = (id) => document.getElementById(id);
let es = null;

function add(paneId, text, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = text;
  $(paneId).appendChild(d);
  $(paneId).scrollTop = $(paneId).scrollHeight;
}

$('go').onclick = () => {
  if (es) es.close();
  $('live').textContent = '';
  $('entries').textContent = '';
  $('log').textContent = '';
  $('go').disabled = true;
  $('status').textContent = 'running...';

  const t0 = performance.now();
  es = new EventSource('/run?prompt=' + encodeURIComponent($('prompt').value));

  // TRANSIENT: append raw. Hundreds of these per turn.
  es.addEventListener('delta', (e) => { $('live').textContent += e.data; });

  // DURABLE: one node per finished message.
  es.addEventListener('entry', (e) => add('entries', e.data, 'entry'));

  es.addEventListener('meta',  (e) => add('log', e.data));
  es.addEventListener('fatal', (e) => add('log', e.data, 'fatal'));

  es.addEventListener('done', (e) => {
    add('log', e.data, 'done');
    const ms = Math.round(performance.now() - t0);
    $('status').textContent = 'turn ended in ' + ms + 'ms  |  ' + e.data;
  });

  es.addEventListener('exit', (e) => {
    add('log', 'child exit: ' + e.data);
    es.close(); es = null;
    $('go').disabled = false;
  });

  es.onerror = () => {
    $('status').textContent = 'stream closed';
    $('go').disabled = false;
  };
};

$('reset').onclick = async () => {
  await fetch('/reset');
  $('status').textContent = 'session forgotten; next turn starts fresh';
};
</script>
</body>
</html>
