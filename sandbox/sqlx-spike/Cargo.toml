[package]
name = "shadows-sqlx-spike"
edition = "2021"
rust-version = "1.87"
version = "0.0.0"
publish = false

[dependencies]
shadows-domain = { path = "../shared-domain" }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls", "sqlite", "postgres",
    "uuid", "time", "json", "macros", "migrate",
] }
sea-query = { version = "0.32", features = ["with-json", "with-uuid", "with-time"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
