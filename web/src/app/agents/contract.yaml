# Owns the AYLUL workspace's landing pane, provider forms and agent forms with
# environment variables (§10, per agent). Providers live inside the settings dialog.
#
# Trap 1: a provider key and an agent variable are write-only. The daemon answers
# metadata (`key_set`, names, times) and never a value; these screens keep a typed value
# only until its save answers, then clear the field.
#
# Trap 2: a provider save that creates the provider and then fails on its key leaves a
# provider behind. The form remembers the slug it was answered, so the retry edits that
# provider instead of creating a second one.

name: web-agents
version: 1
status: current
source: web/src/app/agents

external:
  Provider: web/src/api/schema.d.ts components.schemas.Provider
  Agent: web/src/api/schema.d.ts components.schemas.Agent
  EnvEntry: web/src/api/schema.d.ts components.schemas.EnvEntry

components:
  AgentExtensions:
    signature: "({ slug: string }) => JSX.Element"
    note: Saved-agent extension switches live outside the Save agent form; failed extension reads do not disable ordinary fields.
  ColorSwatches:
    signature: "({ value: string, onChange: (id: string) => void, disabled?: boolean }) => JSX.Element"
    note: Radio group in shared table order with per-entry label, title, colour and selected ring.
  ColorDot:
    signature: "({ id: string | null | undefined }) => JSX.Element"
    note: Text-free decorative dot with the resolved colour id.
  AylulHome:
    signature: "() => JSX.Element"
    # /aylul, and / while AYLUL is the stored workspace. With no provider it asks for one;
    # with providers and no agent it asks for an agent.
  ProviderPicker:
    signature: "({ onChoose: (group: PresetGroup | null) => void }) => JSX.Element"
  ProviderForm:
    signature: "({ provider: Provider | null, group: PresetGroup | null, onSaved: (p: Provider | null) => void }) => JSX.Element"
    # Preset/region or Custom URL, label, write-only key tests, model selection;
    # Delete provider retains inline confirmation.
  ProviderModels:
    signature: "({ listed, picked: ModelPick[], onChange, manual: string, onManualChange }) => JSX.Element; default is picked[0]"
  AgentForm:
    signature: "({ slug: string | null, onDone: () => void }) => JSX.Element"
    # Null creates an agent; a saved agent includes its scoped environment and deletion.
    # Successful saves return to the Agents list via onDone, without changing the page.
  DeleteAgent:
    signature: "({ slug, name, onDone, compact? }) => JSX.Element"
    # Reuses the same idempotent deletion from an agent form or list row.
  AgentEnv:
    signature: "({ slug: string }) => JSX.Element"
  DeleteZone:
    signature: "({ title, summary, consequence, action, pending, error, onConfirm, inline?, compact? }) => JSX.Element"
    # The danger zone shared by both forms; inline=true keeps confirmation inside
    # Settings. Its error line shows a refusal such as PROVIDER_IN_USE.
  Field:
    signature: "({ label, hint?, children }) => JSX.Element"
  Select:
    signature: "(props: ComponentProps<'select'>) => JSX.Element"
  TextArea:
    signature: "(props: ComponentProps<'textarea'>) => JSX.Element"

pure:
  colorOf:
    signature: "(id: string | null | undefined) => CharacterColor; unknown or missing ids resolve to the shared table base"
    file: web/src/app/agents/character-colors.ts
  presetGroups:
    signature: "(presets: Preset[]) => PresetGroup[]; first-seen group order"
  presetOf:
    signature: "(presets: Preset[], provider: Provider) => Preset | null; by preset id"
  providerTitle:
    signature: "(provider: Provider, presets: Preset[]) => string; preset name, region and optional label"
  testLine:
    signature: "(outcome: ProviderTestOutcome, providerName: string) => { kind, text }"
  modelPicksError:
    signature: "(picked: ModelPick[]) => string | null; 1..20 unique valid ids and bounded windows"
    file: web/src/app/agents/model-picks.ts

obligations:
  - rule: Enter (with or without Shift) in the manual model field uses the Add action without submitting the provider form, including when the id is invalid; an Enter that confirms an IME composition does nothing. Saving with an unadded id shows an explicit alert and preserves the draft; adding or clearing the id removes the alert.
    tested_by:
      - Enter adds a model without submitting the new provider
      - Enter adds a model without submitting the saved provider
      - Shift+Enter adds a model like Enter
      - Enter that confirms an IME composition does not add the model
      - saving the new provider with an unadded id explains it and preserves the draft
      - saving the saved provider with an unadded id explains it and preserves the draft
      - clearing an unadded id removes its message and saves the picked models
      - Enter with invalid model id "" does not submit the provider
      - Enter with invalid model id "default" does not submit the provider
      - Enter with invalid model id "m1" does not submit the provider
  - rule: A successful save of the desktop's companion agent requests an appearance refresh; other agents and browser saves do not. Failed native refresh is ignored because native polls the agent again.
    tested_by: ["saving the companion agent refreshes the character", "saving another agent does not", "a failed refresh does not fail the save"]
  - rule: Every saved-agent extension switch saves immediately, independently of Save agent, and accepts the returned enabled value. Failure rolls back its optimistic state; unchanged explicit retry reuses its command id. Pending and late responses stay scoped to their captured agent/item.
    tested_by: ["a switch saves at once", "a failed switch goes back", "late toggles remain scoped"]
  - rule: A new-agent form never queries extensions; reopening the created agent shows the disabled library. Empty saved-agent lists link to Plugins & Skills in the same dialog; failures remain local. Removing a library item invalidates all agents' views.
    tested_by: ["a new agent shows the part after it is created", "an empty library links to the section", "an extension load failure is local", "library removal clears every agent view"]
  - rule: Character colours come from the shared character table; each agent form resolves unknown IDs to the base and always saves the chosen id with its other fields. The form states whether the desktop companion currently uses this agent; no native colour mutation is issued here.
    tested_by: ["the table's colours, in order", "every colour is complete", "a new agent starts on Purple", "an agent's colour is shown and saved with the form", "an id the table does not know shows Purple and is replaced on save", "the hint says when the colour shows"]
  - rule: Presets are queried from Core; known providers save only preset and label with ordered model objects. Each chosen model owns its editable context window; the first is default. Stored keys can be tested without revealing them.
    tested_by: ["presets come from Core, grouped by name", "a preset saves its id, not its URL", "Test connection lists the key's models", "Edit tests with the stored key", "a window out of range is refused"]
  - rule: Presets are grouped by provider name; search keeps Custom visible. Known providers fix the name and URL, with International/China selection where applicable. Custom requires its URL.
    tested_by: ["presets are grouped by name", "search filters the presets and keeps Custom", "a preset hides the URL and sends it", "Custom asks for the URL", "MiniMax China sends the China URL", "Moonshot China sends the China URL", "Edit keeps the saved region"]
  - rule: Provider keys are password inputs and clear after a successful save.
    tested_by: [provider_form_saves_and_clears_key]
  - rule: The model editor refuses duplicate ids and the reserved default id before sending.
    tested_by: [models_editor_rejects_duplicates_and_default]
  - rule: An agent selects its default model from its provider models.
    tested_by: [agent_form_lists_provider_models]
  - rule: Agent variables use scoped query keys and never display stored values.
    tested_by: [lists_names_without_values, adding_clears_the_input, replaces_and_removes_a_variable]
  - rule: Agent variables live on the saved agent form inside Settings; General and new-agent forms never load an agent's environment.
    tested_by: [general_settings_has_no_agent_environment, lists_names_without_values]
  - rule: Configuration writes apply to the next spawn, including resumed conversations.
    tested_by: none
    note: Forms say this; core session tests own spawn behavior.
  - rule: Empty states guide provider creation before agent creation.
    tested_by: [empty_states_guide_to_provider_then_agent]
  - rule: Deleting a provider or an agent requires inline confirmation inside Settings; successful agent deletion preserves the current page.
    tested_by: ["provider deletion confirms inside the settings dialog", "agent deletion confirms inline and preserves the current page"]
    note: The daemon refuses a provider in use with PROVIDER_IN_USE; the dialog shows it.

tests:
  - name: provider_form_saves_and_clears_key
    checks: Saving a new provider with a key posts the provider, then the key; the field empties and the key never shows.
  - name: models_editor_rejects_duplicates_and_default
    checks: A duplicated id and `default` each show a "Models must" line, and nothing is posted.
  - name: agent_form_lists_provider_models
    checks: The new-agent form's default-model menu lists the first provider's models in order.
  - name: lists_names_without_values
    checks: A stored variable shows its name, time, Replace and Remove; the value field is a password.
  - name: adding_clears_the_input
    checks: A typed name is uppercased; after a save the value field is empty and the value never shows.
  - name: general_settings_has_no_agent_environment
    checks: General never asks for agent variables.
  - name: shows_unavailable_error
    checks: SECRETS_UNAVAILABLE on the variable list shows its error line.
  - name: replaces_and_removes_a_variable
    checks: Replace sends the new value for that name; Remove sends one DELETE.

provider_models: Provider models carry id and per-model context_window; the agent selector uses each model id.

extension_cache_owner: "api/extensions.ts owns saved switch merges and cancels stale reads before writing"

profile_query_owner: "api/aylul-profiles.ts owns provider and agent query factories"

feature_entry: "index.ts exposes providerTitle, colorOf, ColorDot, AgentForm, DeleteAgent, ProviderForm, ProviderPicker, presetOf, presetGroups, PresetGroup."

feature_imports: "Cross-feature production imports use declared public entries."
