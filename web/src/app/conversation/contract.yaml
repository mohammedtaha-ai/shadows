image_attachments:
  tested_by: [web/src/app/conversation/composer-images.test.tsx]
  owner: "useImages in use-images.ts owns selection, capability reason, intake, retry, removal and dropping sent images; PendingImages in pending-images.tsx owns previews and image controls; PendingImage in upload-images.ts carries file identity, upload command, answer, error and in-flight promise"
  useImages: "(choices, threadId, inFlight, changed, refuse, initialImages?) => { images, imageReason, filePicker, add, pick, retry, remove, drop, imagesChanged }; changed clears the pending send on add/remove; refuse delivers Core capability refusal to the composer error line"
  PendingImages: "({ images, threadId, inFlight, onRetry, onRemove }) => JSX.Element | null; owns ImagePreview and its object URL cleanup"
  uploadImages: "upload-images.ts; (threadId, images, changed) => Promise<string[]>; reuses in-flight uploads and immutable answers; returns ids in selection order; preserves Core errors"
  intake: "Paste intercepts only image clipboard files in clipboard order; other paste keeps browser behavior. Paste, drop, Add photos and Ctrl+U hand files or picking to useImages; existing threads upload immediately; draft files stay local until its first send creates a thread"
  validation: "Core alone accepts content, media type and size. No frontend type list or size limit. Session capabilities disable intake with image_reason. Draft capability is provisional until the first opened session answers."
  previews: "Local object URLs are revoked on removal/unmount; uploaded previews, queued images and durable user entries use attachmentUrl from the API owner"
  sending: "Send awaits uploads; empty text with images is valid; send/queue carries ordered ids. Text and images survive failure. Only accepted sends clear text and images. Text and files cannot change during a pending send or queue request."
  replay: "Stable local image keys participate in the turn attempt; upload command ids survive retries and draft handoff. A command conflict requires a fresh id on the next explicit retry."
  tests:
    - "%s uploads immediately with a removable thumbnail"
    - "ordinary text paste keeps the browser paste behavior"
    - "non-image clipboard files keep browser paste behavior and mixed paste uploads only images in order"
    - "switching conversations revokes local previews and ignores the old upload answer"
    - "Send waits for uploads and sends image-only ids in selection order"
    - "a failed upload keeps text and images with Core reason and retries the same upload command"
    - "a refused send keeps text and images and replays the same ordered command"
    - "Core capability disables image paste, drop and Ctrl+U with its reason"
    - "removing an uploading image prevents its late answer from being sent"
    - "draft first-send images survive %s"
    - "the transcript renders ordered message images from the thread byte route"
    - "queue preserves ordered image ids and Send now uses the saved queued images"
    - "command conflict retains the message and makes the next explicit send a new command"
    - "a refused queue keeps text and images and its unchanged retry command"
    - "a queue waiting for an upload keeps the full message locked until Core refuses it"
    - "Send now preserves queued images and retries %s with the correct command"
    - "an upload command conflict needs an explicit retry with a fresh command"
    - "the draft keeps staged images when its opened session refuses images"

session_cache_owner: "api/sessions.ts owns session/command identities, frame updates, resets and saved mutation answers; feature hooks project presentation state"

proposal_approval:
  owner: "useProposalApproval in use-proposal-approval.ts owns the live proposal read, command attempt, approval mutation and status text for all three cards"
  signature: "<T extends VisionProposal | MapProposal | RoadmapProposal>({ projectId, proposalId: string | null, proposalsQuery: UseQueryOptions<T[], Error, T[], string[]>, approveProposal, approvedSuffix?: (live: T) => string }) => ProposalApprovalState"
  result: "projectId, status, approved, approvedBy, canApprove, isPending, queryError, approvalError, submit"
  rendering: "ProposalApproval in proposal-approval.tsx takes the result, buttonLabel and textClass; renders status, ApprovedBy, Approve, query error and approval error with no wrapper"
  content: "Each card owns its snapshot parser, title and domain content; vision supplies its live approved item suffix, map supplies its waiver button label"
  replay: "Unchanged approval retries reuse attemptFor({ projectId, proposalId }); success drops the attempt and invalidates designKeys.all(projectId); refusal keeps the attempt and invalidates that card's proposals query"
  status: "Approved with the supplied suffix, Superseded, Outdated — ask the Planner to propose again, Pending, Loading status…, Status unavailable, in that order; approval requires readable live Pending without outdated"

