# Owns the open conversation's pane and the Planner's writing surface: the thread's
# stream folded into screen state (`useConversation`), the turn and reply state
# machines that decide what runs and what the reply text is, the composer's send,
# queue and stop path, and the draft-to-thread handoff (`useFirstSend`, `carrySend`).
#
# Trap: a turn's status never comes from one source alone. The operations snapshot
# and the durable operation events are merged by `turnReducer` by Core's journal `seq`:
# per turn the source with the higher `seq` wins. A reader that trusts whichever arrived
# last can pull a finished turn back.
#
# Trap: the streamed reply and the durable entries share the screen. The reply hides
# the entries it stands in for (`ShownReply.hidden`), and `Messages` drops them. Neither
# hides anything on its own, and a message must never be on screen twice.
#
# Trap: a CommandId is the replay key. A retry reuses its id only while the request is
# unchanged; changing a setting or the text makes a new command. Two paths build the
# same first-send command (the draft and the thread page) and must agree.
#
# Trap: `/model` and `/effort` typed as text are picker actions, never turns
# (`sessionCommand`). The harness's own `/` list is only shown, not executed here.
#
# Trap: `ReplyText` names two components. `entry.tsx` exports a lazy wrapper that
# shows plain text until the Streamdown chunk lands; `reply-text.tsx` is the renderer.

# Native companion targeting follows explicit Send/Queue or Use with companion only.
# A created draft thread is targeted before session opening; binding errors remain
# independent of the command and never replace its idempotency key.
name: web-conversation
version: 1
status: current
source: web/src/app/conversation

refresh_pinning:
  conversation: "pins conversation refresh for %s covers all five plan kinds; all five kinds refresh the entire workflows family, the project design and agreement versions."


# ── shapes ───────────────────────────────────────────────────────────────────

shapes:
  Status:
    # Core's status_kind. Unknown daemon statuses are read as Pending (asStatus), never as terminal.
    values: "'Pending' | 'Running' | 'Completed' | 'Failed' | 'Cancelled' | 'Interrupted'"
  Turn:
    id: string
    status: Status
    # A stop was asked for and the turn has not ended yet, or ended since.
    stopRequested: bool
    # When this client learned the turn had ended (ms); set once and kept.
    endedAt: "number | null"
    # Journal seq of the source that set the turn; -1 when only the start route has answered.
    seq: number
  ReplyState:
    # The turn whose text this is; `live` means the stream is still delivering it.
    op: "string | null"
    # Messages of this turn already announced as agent entries.
    segments: "string[]"
    # How much of the turn's streamed text `segments` hold; `tail` is the rest.
    consumed: number
    tail: string
    # Ordinals of the agent entries `segments` stand in for.
    covers: "number[]"
    live: bool
  ShownReply:
    text: string
    # Still streaming: the cursor is drawn.
    live: bool
    # Entries this text stands in for; the list does not draw them.
    hidden: "Set<number>"
  Durable:
    # What the fetched entries list holds, and when it was fetched.
    ordinals: "Set<number>"
    fetchedAt: number
    endedAt: "number | null"
  ContextFigures:
    # Either may be missing; a figure not reported is null, never estimated.
    contextUsed: "number | null"
    contextWindow: "number | null"
  PointedTask:
    # A task clicked in a card or the side panel, at the version and revision seen.
    workflowId: string
    revision: number
    task: PlanTask
  SideShown:
    workflowId: string
    taskNumber: "number | null"
  ForkPoint:
    projectId: string
    threadId: string
    # The daemon decides whether this is a valid fork point and says why when not.
    entryId: string
  CarriedSend:
    # A draft's first message whose turn failed once its thread existed.
    images: "PendingImage[] | undefined; files, upload commands, answers and errors"
    text: string
    # The failed turn's command, as `attemptFor` would have made it.
    attempt: Attempt
    error: Error
    planId: "string | undefined"
  SessionView:
    # Opened as a query; `failed` carries Retry. See `useSession`.
    values: "{ state: 'connecting' } | { state: 'ready'; choices: SessionChoices } | { state:
      'failed'; error: Error; retry: () => void }"
  SessionCommand:
    # What `/model` or `/effort` asks of the pickers.
    values: "{ kind: 'open'; setting } | { kind: 'set'; setting; id: string } | { kind: 'unknown';
      message: string }"
  SendTo:
    # Where Send goes: an open thread's next turn, or a draft that makes the thread first.
    values: "{ threadId: string } | { draft: (commandId, text, settings, images, changed) => Promise<string>;
      planId?: string; selectableModels?: boolean }"
    # selectableModels: an agent draft, whose Model menu works before a session exists.
  Shown:
    # What a harness operational label means to a person (`describeLabel`).
    icon: LucideIcon
    text: string


# ── externally owned types ───────────────────────────────────────────────────
