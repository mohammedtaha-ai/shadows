# ── functions ────────────────────────────────────────────────────────────────

components:
  ConversationRoute:
    signature: "() => JSX.Element"
    # Route component for /projects/$projectId/threads/$threadId. A removed thread
    # never mounts `Conversation`, so it never opens a session.
  DraftRoute:
    signature: "() => JSX.Element"
    # Route component for /projects/$projectId/new; keyed by project.
  AgentDraftRoute:
    signature: "() => JSX.Element"
    # Route component for /aylul/agents/$slug/new; keyed by agent. Resolves the live agent,
    # its provider's models and the hidden assistant project, then a draft whose Model
    # menu lists exactly those models, the agent's default chosen. A deleted or unknown
    # agent reads "Agent not found."
  Composer:
    signature: "(props: { to: SendTo; carried?: CarriedSend | null; harness: string; harnessLabel:
      string; session: SessionView; running: Turn | null; directory: string | null | undefined;
      known: boolean; commands?: readonly SlashCommand[]; ring?: ReactNode; onStarted: (operationId:
      string) => void; pointed: PointedTask | null; onPointed: (done: PointedTask) => void }) =>
      JSX.Element"
    # Send, queue (while a turn runs) and Stop. Send waits for `known` and for the
    # session to hold the chosen model before it can act.
  ComposerBar:
    signature: "(props: { harness: string; harnessLabel: string; session: SessionView; settings:
      TurnSettings | null; onSettings: (next: TurnSettings) => void; changingModel: boolean;
      sessionless?: boolean; selectableModels?: boolean; directory: string | null | undefined;
      note: string | null; ring?:
      ReactNode; opened?: 'model' | 'effort' | null; onOpened?: (opened: 'model' | 'effort' | null)
      => void }) => JSX.Element"
    # The row under the box: Mode, folder, Model, Effort and the ring. Every menu is
    # built from the session's choices. The effort menu is disabled until the session
    # holds the chosen model.
  Setting:
    signature: "(props: { title: string; options: readonly Choice[]; value: string; onChange: (id:
      string) => void; disabled?: boolean; describe?: (id: string) => string | null; open?: boolean;
      onOpenChange?: (open: boolean) => void }) => JSX.Element"
    private: true
    # Disabled choices render with the session's reason; `describe` adds the mode line.
  CliPicker:
    signature: "(props: { projectId: string; threadId: string; harness: string; label: string;
      locked: boolean }) => JSX.Element"
    # Locked (a lock and a tooltip) once the thread has run a turn or is a fork.
  CliMenu:
    signature: "(props: { harness: string; label: string; onPick: (kind: string) => void; disabled?:
      boolean }) => JSX.Element"
    # Also used by a draft, which holds the pick itself until its first send.
  Messages:
    signature: "(props: { entries: readonly ThreadEntry[] | undefined; projectId: string; onPointAt:
      (plan: Plan, task: PlanTask) => void; subagents: readonly SubagentCard[]; onOpenSubagent: (id:
      string) => void; operations: readonly Operation[] | undefined; models: readonly Choice[];
      harness: string; forkFrom: { projectId: string; threadId: string } | null; loading: boolean;
      reply: ShownReply | null; running: boolean; thinking: boolean; label: string | undefined }) =>
      JSX.Element"
    # Entries in order, then the reply, the running turn's cards, the waiting line
    # and the operational label. Follows the bottom while the reader is there.
  Entry:
    signature: "(props: { entry: ThreadEntry; policy: HarnessPolicy; requestedMode: string | null;
      projectId: string; onPointAt: (plan: Plan, task: PlanTask) => void; onOpenSubagent: (id:
      string) => void }) => JSX.Element"
    # Dispatches on `entry.kind`: the kind decides the card, never the text.
  ReplyText:
    signature: "(props: { text: string; live?: boolean }) => JSX.Element"
    # Declared in entry.tsx as a lazy wrapper around reply-text.tsx's renderer.
  PlanCard:
    signature: "(props: { entry: ThreadEntry; projectId: string; onPointAt: (plan: Plan, task:
      PlanTask) => void }) => JSX.Element"
    # A `PlanView` as a live graph of its version (pinned to it, never the next one).
  PlanHeading:
    signature: "(props: { plan: Plan; projectId: string; children?: ReactNode }) => JSX.Element"
    # Shared by the card and the side panel. Shows Approved and its attribution.
  PlanSidePanel:
    signature: "(props: { shown: SideShown; projectId: string; onClose: () => void; onPointAt:
      (plan: Plan, task: PlanTask) => void }) => JSX.Element"
  VisionProposalCard:
    signature: "(props: { entry: ThreadEntry; projectId: string }) => JSX.Element"
    # Approval shown only when live status is Pending, not outdated, and readable.
  MapProposalCard:
    signature: "(props: { entry: ThreadEntry; projectId: string }) => JSX.Element"
    # Waivers are shown as consent; the button label names them when present.
  RoadmapProposalCard:
    signature: "(props: { entry: ThreadEntry; projectId: string }) => JSX.Element"
  ApprovedBy:
    signature: "(props: { by: Plan['approved_by'] | null | undefined; projectId: string }) =>
      JSX.Element | null"
  SubagentCardView:
    signature: "(props: { card: SubagentCard; onOpen: (id: string) => void }) => JSX.Element"
  SubagentPanel:
    signature: "(props: { card: SubagentCard; onClose: () => void }) => JSX.Element"
  WaitingMessages:
    signature: "(props: { threadId: string; running: boolean }) => JSX.Element | null"
    # Renders nothing when nothing waits.
  MessageActions:
    signature: "(props: { text: string; forkPoint?: ForkPoint }) => JSX.Element"
    # Shown on hover and focus. Fork exists only where `forkPoint` was given.
  ContextRing:
    signature: "(props: { threadId: string; usage: ContextFigures | null; limits: Limits | null })
      => JSX.Element"
    # Opens at once. The breakdown is the only daemon read, and only on Details.
  DeletedConversation:
    signature: "(props: { thread: PlanningThread; projectId: string }) => JSX.Element"
    # Read-only history; never opens a session.
  FocusChip:
    signature: "(props: { pointed: PointedTask; onClear: () => void }) => JSX.Element"
  SlashMenu:
    signature: "(props: { items: readonly SlashCommand[]; highlighted: number; onPick: (command:
      SlashCommand) => void; onHighlight: (index: number) => void }) => JSX.Element"
    # Keys are the composer's. Pick uses mouse-down so the textarea keeps focus.
  StageChip:
    signature: "(props: { projectId: string }) => JSX.Element | null"
  StatusBadge:
    signature: "(props: { running: Turn | null; latest: Turn | null }) => JSX.Element | null"
    # Running (or Starting, or Stopping) while a turn runs; else how the latest ended.
  StreamBanner:
    signature: "(props: { connection: Connection; problem: string | null; retry: () => void }) =>
      JSX.Element | null"
    # Shows only reconnecting and failed; connecting and live show nothing.

hooks:
  useConversation:
    signature: "(threadId: string, onShowHere?: (show: PlanShowFrame) => void) => ConversationView"
    # Mount once per thread. Folds the stream into the turn and reply reducers, the
    # entries, the operations snapshot, usage, commands and plan refetches. `onShowHere`
    # hears only a live plan-show naming this tab and this thread.
  useSession:
    signature: "(threadId: string) => SessionView"
    # One POST /session, held as a query: never on a timer or on focus.
  useCarriedSend:
    signature: "(threadId: string) => CarriedSend | null"
    # Reads what carrySend left, once, on the first render.
  useCommands:
    signature: "(threadId: string | null) => readonly SlashCommand[]"
    # Enabled false: only the stream fills it. Empty when there is no thread.

pure:
  turnReducer:
    signature: "(state: TurnState, action: TurnAction) => TurnState"
    # Newest first. A status only moves forward; a terminal status never changes.
  isTerminal:
    signature: "(status: Status) => boolean"
  runningTurn:
    signature: "(state: TurnState) => Turn | null"
    # The newest turn that has not ended.
  latestTurn:
    signature: "(state: TurnState) => Turn | null"
  replyReducer:
    signature: "(state: ReplyState, action: ReplyAction) => ReplyState"
    # `stream` follows the streamed text; `agent-entry` cuts a segment where the
    # stream stood when the entry was announced.
  shownReply:
    signature: "(state: ReplyState, durable: Durable) => ShownReply | null"
    # Shown until the entries hold every covered ordinal, or until a fetch after the
    # turn ended.
  agentOrdinal:
    signature: "(payload: unknown) => number | null"
    # Exported from use-conversation.ts. AgentMessage, ToolCall and Subagent only.
  initialSettings:
    signature: "(c: SessionChoices) => TurnSettings"
  withModel:
    signature: "(c: SessionChoices, s: TurnSettings, model: string) => TurnSettings"
    # An effort is kept for a model whose efforts are not yet known, and Send waits.
  effortsKnown:
    signature: "(c: SessionChoices, model: string) => boolean"
    # True only when the session holds that model; efforts belong to one model.
  afterOptions:
    signature: "(prev: SessionChoices, next: SessionChoices, s: TurnSettings, busy: boolean) => {
      settings: TurnSettings; note: string | null }"
    # Follows the session's reports. `busy` holds back the refusal check during a send.
  modeNote:
    signature: "(prev: TurnSettings, next: SessionChoices) => string | null"
  sendable:
    signature: "(c: SessionChoices, s: TurnSettings) => boolean"
  labelOf:
    signature: "(choices: readonly Choice[], id: string | null) => string"
  sessionCommand:
    signature: "(text: string, choices: SessionChoices | null) => SessionCommand | null"
    # Null unless the text is /model or /effort. See the gap on disabled choices.
  slashMatches:
    signature: "(commands: readonly SlashCommand[], text: string) => readonly SlashCommand[] | null"
    # Null unless the whole text is a slash and one word. Prefix, then after colon, then contains.
  contextShown:
    signature: "(used: number | null, window: number | null) => { used: number; window: number;
      percent: number } | null"
  formatTokens:
    signature: "(n: number) => string"
  resetIn:
    signature: "(resetsAt: number, now: number) => string"
    # Unix seconds in, two largest units out: `3d21h`, `4h18m`, `7m`, or `now`.
  latestContext:
    signature: "(operations: readonly Operation[]) => ContextFigures | null"
  toolTitle:
    signature: "(entry: ThreadEntry) => string | null"
  toolText:
    signature: "(title: string) => string | null"
    # A sentence for Shadows' tools, the title for any other, null when the tool adds no line.
  subagentOf:
    signature: "(entry: ThreadEntry) => SubagentCard | null"
    # Null for any other kind, and for a card that fails to read (no throw escapes).
  isTool:
    signature: "(entry: ThreadEntry) => boolean"
  silent:
    signature: "(entry: ThreadEntry) => boolean"
    # True for a tool call whose title reads as nothing (plan_show).
  copyText:
    signature: "(entry: ThreadEntry) => string"
    # What Copy puts on the clipboard: a subagent's report, a tool's sentence, or the body.
  duration:
    signature: "(ms: number) => string"
  tokens:
    signature: "(n: number) => string"
  modelName:
    signature: "(model: string) => string"
  numbers:
    signature: "(card: SubagentCard) => string"
    # The card's duration, tokens and tool count, each only when reported.
  describeLabel:
    signature: "(label: string) => Shown | null"
    # Streaming bookkeeping returns null; the rest maps to an icon and a line.
  rehypeDirAuto:
    signature: "() => (tree: HastNode) => void"
    # Runs after Streamdown's plugins. Gives each block its own direction.

queries_and_mutations:
  sessionKey:
    signature: "(threadId: string) => readonly ['threads', string, 'session']"
  replaceChoices:
    signature: "(queryClient: QueryClient, threadId: string, choices: SessionChoices) => void"
    # Ignored while the opening is in flight, so the open's own answer decides.
  reopenSession:
    signature: "(queryClient: QueryClient, threadId: string) => void"
    # Clears the commands, then resets the session query so it is opened again.
  commandsKey:
    signature: "(threadId: string) => readonly ['threads', string, 'commands']"
  replaceCommands:
    signature: "(qc: QueryClient, threadId: string, list: readonly SlashCommand[]) => void"
  clearCommands:
    signature: "(qc: QueryClient, threadId: string) => void"
    # Empties the list on a harness switch: the old harness's list is not the new one's.
  carrySend:
    signature: "(threadId: string, send: CarriedSend) => void"
    # Module-level map: a draft that failed after its thread existed hands its text here.
  useFirstSend:
    signature: "(projectId: string, harness: string, planId?: string, profile?: string) =>
      (commandId: string, text: string, chosen: TurnSettings) => Promise<string>"
    private: true
    # Creates the thread (with `profile` under an agent), opens its session, applies the
    # model chosen in the draft when it differs and takes that answer's effort, starts the
    # turn, and only then navigates.
    # On a later failure it carries the send to the thread page and rethrows.


# ── obligations ──────────────────────────────────────────────────────────────

obligations:
  - rule: >
      A draft under an agent keeps the model chosen before the first send: the thread is
      created with the agent, the session opened, the chosen model applied, and only then
      the turn sent with it.
    tested_by: [first_send_keeps_chosen_model]

  - rule: >
      An AYLUL conversation's header names its agent, or "Deleted agent"; a deleted agent's
      conversation still shows its history.
    tested_by: [deleted_agent_conversation_reads]

  - rule: >
      A turn's status only moves forward (Pending, Running, one terminal). A snapshot
      read before a turn ended does not bring it back, and a replayed start does not
      restart a turn the snapshot already saw end.
    tested_by:
      - "a snapshot read before a turn ended does not bring it back"
      - "a reload during a running turn shows it running, then follows it to its end"

  - rule: >
      A turn begun after a snapshot was read is the newest turn, and a later snapshot
      does not reorder it behind older ones.
    tested_by: "a turn begun after the snapshot is newest, and stays so when the snapshot is read
      again"

  - rule: >
      The start route's answer counts as a running turn before any of its events arrive.
    tested_by: "knows a turn is running from the start route before any of its events"

  - rule: >
      A stop already requested is read from the snapshot's cancel time. An event naming no
      operation changes nothing, and returns the same state object.
    tested_by: "reads a stop already requested from the snapshot, and ignores events of no
      operation"

  - rule: >
      A streamed reply stays on screen after its turn-end until the entries list holds
      every agent entry it stands in for, and it hides exactly those entries, so a message
      is never shown twice.
    tested_by:
      - "stays after turn-end until the entries list holds the agent entry"
      - "shows nothing before any text streams"

  - rule: >
      A turn stopped mid-sentence keeps its partial reply until the entries are fetched
      after the turn ended. Entries fetched before then do not end it.
    tested_by: "a turn stopped mid-sentence stays until entries are fetched after it ended"

  - rule: >
      While a turn still streams, an announced agent entry does not hand the reply over.
    tested_by: "does not give way to the entry while the turn is still streaming"

  - rule: >
      A message is cut where the stream stood when its entry was announced, not where the
      last render left it. Text that arrived before the announcement belongs to the earlier
      message.
    tested_by: "splits messages where the stream stood when the entry was announced, not at the last
      render"

  - rule: >
      A new turn's text replaces the last turn's reply and never appends to it.
    tested_by: "a new turn replaces what the last one left"

  - rule: >
      Only an AgentMessage, ToolCall or Subagent entry moves the streamed reply on. A
      person's message, a plan card or a refusal does not.
    tested_by:
      - "moves the reply on for each kind a turn writes (§23.8)"
      - "ignores the person, plans and refusals"

  - rule: >
      A long reply streams without exceeding the update depth. The reply follows the
      streamed text during render, not through an effect per delta.
    tested_by: "streams a long reply without exceeding the update depth"

  - rule: >
      Settings follow the session's own reports, but a report that arrives during a send or
      a running turn is not a refusal of the mode.
    tested_by: "follows a model change the session reports, but not while a send or a turn is in
      flight"

  - rule: >
      Changing the model to one whose efforts are not yet known keeps the effort, and Send
      waits until the session reports that model's efforts.
    tested_by:
      - "keeps the effort until the session reports the new model, whose efforts are unknown"
      - "picking a model sets it on the session at once, so its efforts show before Send"

  - rule: >
      A model that offers no effort runs with no effort, and changing to a model that does
      not offer the current effort moves to one it does offer.
    tested_by:
      - "a model that offers no effort runs with none"
      - "changing model resets an effort it does not offer"

  - rule: >
      After a model move, the effort is the one the session reports for that model, not an
      earlier report and not the person's previous effort.
    tested_by:
      - "a picked model the session moves to takes the effort the session reports for it"
      - "a picked model ends at the effort its answer reports, not an earlier report"

  - rule: >
      A mode the project does not allow is never sendable, and the first allowed mode is
      taken instead. With no allowed mode, nothing can be sent.
    tested_by:
      - "a mode the project disallowed is not sendable"
      - "no mode left is not sendable"

  - rule: >
      When a model change moves the mode, the note says which mode the model does not offer
      and what it switched to.
    tested_by:
      - "names the model that moved the mode"
      - "a model without auto moves the mode and the bar says so"

  - rule: >
      `/model` and `/effort` typed as text are picker actions: the composer answers them
      without sending a turn. A named choice is set; a choice the session does not offer
      is refused in words and the text stays.
    tested_by:
      - "/model with a name sets the model picker and sends nothing"
      - "/model with a name the session does not offer says so"

  - rule: >
      `sessionCommand` names a choice by id, label, or a part of either, ignoring case.
    tested_by: "names a choice by id, label or a part of either, ignoring case"

  - rule: >
      `sessionCommand` refuses a choice the session does not offer, and refuses any named
      choice when no session is ready.
    tested_by: "refuses a choice the session does not offer, or no session"
    note: >
      Does not cover a choice the session offers but has disabled. See the gap at
      `sessionCommand`.

  - rule: >
      A slash menu lists only for a text that is a slash and one word. Its order is name
      prefix, then the part after the last colon, then a contained name.
    tested_by:
      - "applies only to a whole text of / and no whitespace"
      - "orders name prefix, then the part after the last colon, then contains"
      - "ignores case and keeps the adapter order within a group"
      - "applies with no match, listing nothing"

  - rule: >
      The slash menu opens on a text that is only a slash and a word, and lists the matches.
      Arrows move, Tab and Enter pick, Escape dismisses it until the text changes, and a click
      picks. A newline in the text closes it. A pick writes "/name " and shows its hint.
      Enter while a turn runs picks and does not queue.
    tested_by:
      - "opens on / and filters as the person types"
      - "arrows move, Tab picks, Escape closes and keeps the text"
      - "Enter picks without sending, writes /name and shows the hint"
      - "the hint goes once the person types"
      - "a click picks"
      - "a newline closes the menu"
      - "Enter picks while a turn runs; it does not queue"
      - "a shorter new list clamps the highlight"
      - "the highlighted entry is scrolled into view"
      - "an empty list opens nothing"
      - "with no match the menu closes and Enter sends"
      - "picking model from the menu opens the model picker"

  - rule: >
      A session that is still opening shows a word, not a spinner. A failed opening shows the
