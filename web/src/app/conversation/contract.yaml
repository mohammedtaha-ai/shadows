# ── functions ────────────────────────────────────────────────────────────────

components:
  ConversationRoute:
    signature: "() => JSX.Element"
    # Route component for /projects/$projectId/threads/$threadId. A removed thread
    # never mounts `Conversation`, so it never opens a session.
  DraftRoute:
    signature: "() => JSX.Element"
    # Route component for /projects/$projectId/new; keyed by project.
  AgentDraftRoute:
    signature: "() => JSX.Element"
    # Route component for /aylul/agents/$slug/new; keyed by agent. Resolves the live agent,
    # its provider's models and the hidden assistant project, then a draft whose Model
    # menu lists exactly those models, the agent's default chosen. A deleted or unknown
    # agent reads "Agent not found."
  Composer:
    signature: "(props: { to: SendTo; carried?: CarriedSend | null; harness: string; harnessLabel:
      string; session: SessionView; running: Turn | null; directory: string | null | undefined;
      known: boolean; commands?: readonly SlashCommand[]; agentProfile?: string; ring?: ReactNode; onStarted: (operationId:
      string) => void; pointed: PointedTask | null; onPointed: (done: PointedTask) => void }) =>
      JSX.Element"
    # Composes useSend, useStop, useImages and useSessionSettings with the prompt
    # and slash menu. Send waits for known and the session to hold the chosen model.
    # While a send or queue is in flight the message box is read-only, never disabled,
    # so it keeps focus and the person types again as soon as it settles.
  ComposerBar:
    signature: "(props: { harness: string; harnessLabel: string; session: SessionView; settings:
      TurnSettings | null; onSettings: (next: TurnSettings) => void; changingModel: boolean;
      sessionless?: boolean; selectableModels?: boolean; directory: string | null | undefined;
      note: string | null; ring?:
      ReactNode; opened?: 'model' | 'effort' | null; onOpened?: (opened: 'model' | 'effort' | null)
      => void; onSlashCommands: () => void; onPlugins?: () => void;
      onPhotos: () => void; imageReason: string | null;
      messageBox: RefObject<HTMLTextAreaElement | null> }) => JSX.Element"
    # The row under the box: Add, Mode, folder, Model, Effort and the ring. Every setting menu is
    # built from the session's choices. The effort menu is disabled until the session
    # holds the chosen model.
  Setting:
    signature: "(props: { title: string; options: readonly Choice[]; value: string; onChange: (id:
      string) => void; disabled?: boolean; describe?: (id: string) => string | null; open?: boolean;
      onOpenChange?: (open: boolean) => void }) => JSX.Element"
    private: true
    # Disabled choices render with the session's reason; `describe` adds the mode line.
  CliPicker:
    signature: "(props: { projectId: string; threadId: string; harness: string; label: string;
      locked: boolean }) => JSX.Element"
    # Locked (a lock and a tooltip) once the thread has run a turn or is a fork.
  CliMenu:
    signature: "(props: { harness: string; label: string; onPick: (kind: string) => void; disabled?:
      boolean }) => JSX.Element"
    # Also used by a draft, which holds the pick itself until its first send.
  Messages:
    signature: "(props: { entries: readonly ThreadEntry[] | undefined; projectId: string; onPointAt:
      (plan: Plan, task: PlanTask) => void; subagents: readonly SubagentCard[]; onOpenSubagent: (id:
      string) => void; tools: Readonly<Record<string, ToolFrame>>; todos: Readonly<Record<string,
      readonly TodoItem[]>>; operations: readonly Operation[] | undefined; models: readonly Choice[];
      harness: string; forkFrom: { projectId: string; threadId: string } | null; loading: boolean;
      reply: ShownReply | null; running: boolean; thinking: boolean; label: string | undefined }) =>
      JSX.Element"
    # Entries in order, then the reply, the running turn's cards, the waiting line
    # and the operational label. Follows the bottom while the reader is there. Tool calls
    # are drawn as `ToolGroup` rows (`activityRows`); the running turn's `tools` frames
    # not yet written as entries join the last group of that turn, or form one after the reply.
    # A turn's live `todos` list draws as a `TodoCard` after the reply until its entry lands.
  Entry:
    signature: "(props: { entry: ThreadEntry; policy: HarnessPolicy; requestedMode: string | null;
      projectId: string; onPointAt: (plan: Plan, task: PlanTask) => void; onOpenSubagent: (id:
      string) => void }) => JSX.Element"
    # Dispatches on `entry.kind`: the kind decides the card, never the text. A `ToolCall`
    # is not drawn here; `Messages` draws it as a `ToolGroup`.
  ToolGroup:
    signature: "(props: { steps: readonly ToolStep[]; ordinals: string; forkProjectId?: string;
      forkThreadId?: string; forkEntryId?: string }) => JSX.Element"
    # Memoised. One step is a line; two or more are a summary button (words, total time,
    # '· N failed') that opens into numbered steps. Open while a step runs, unless the person
    # chose; a link to a member's ordinal opens it. A failed step's `error` shows under its
    # line, clamped to six lines with Show all. Copy takes each step's line. An edit step with a diff
    # (or counts without one) has its own chevron that opens `ToolDiff`; every numbered step keeps
    # that chevron's column, so the numbers line up.
  ToolDiff:
    signature: "(props: { diff: readonly DiffHunk[] | null }) => JSX.Element"
    # Lines with old and new numbers (none when a hunk has no start), added on green and removed on
    # red; a gap row between hunks of one file, the path as a heading where it changes. `null`
    # reads 'Diff too long to show'.
  TodoCard:
    signature: "(props: { items: readonly TodoItem[] }) => JSX.Element"
    # Heading 'Tasks · D of N done'; a check for completed (text muted), a spinner for in progress, an
    # empty circle for pending. `Messages` draws the stream's live `todos` of an operation after the
    # reply until the entries hold a `TodoList` entry of that operation, which `Entry` draws instead
    # (never both); an unreadable card shows its body.
  ReplyText:
    signature: "(props: { text: string; live?: boolean }) => JSX.Element"
    # Declared in entry.tsx as a lazy wrapper around reply-text.tsx's renderer.
  PlanCard:
    signature: "(props: { entry: ThreadEntry; projectId: string; onPointAt: (plan: Plan, task:
      PlanTask) => void }) => JSX.Element"
    # A `PlanView` as a live graph of its version (pinned to it, never the next one).
  PlanHeading:
    signature: "(props: { plan: Plan; projectId: string; children?: ReactNode }) => JSX.Element"
    # Shared by the card and the side panel. Shows Approved and its attribution.
  PlanSidePanel:
    signature: "(props: { shown: SideShown; projectId: string; onClose: () => void; onPointAt:
      (plan: Plan, task: PlanTask) => void }) => JSX.Element"
  VisionProposalCard:
    signature: "(props: { entry: ThreadEntry; projectId: string }) => JSX.Element"
    # Approval shown only when live status is Pending, not outdated, and readable.
  MapProposalCard:
    signature: "(props: { entry: ThreadEntry; projectId: string }) => JSX.Element"
    # Waivers are shown as consent; the button label names them when present.
  RoadmapProposalCard:
    signature: "(props: { entry: ThreadEntry; projectId: string }) => JSX.Element"
  ProposalApproval:
    signature: "(props: { approval: ProposalApprovalState; buttonLabel: string; textClass: string }) => JSX.Element"
    # Fragment preserves each card's status, attribution, button and error order.
  ApprovedBy:
    signature: "(props: { by: Plan['approved_by'] | null | undefined; projectId: string }) =>
      JSX.Element | null"
  SubagentCardView:
    signature: "(props: { card: SubagentCard; onOpen: (id: string) => void }) => JSX.Element"
  SubagentPanel:
    signature: "(props: { card: SubagentCard; onClose: () => void }) => JSX.Element"
  WaitingMessages:
    signature: "(props: { threadId: string; running: boolean }) => JSX.Element | null"
    # Renders nothing when nothing waits.
  MessageActions:
    signature: "(props: { text: string; forkPoint?: ForkPoint }) => JSX.Element"
    # Shown on hover and focus. Fork exists only where `forkPoint` was given.
  ContextRing:
    signature: "(props: { usage: ContextFigures | null; limits: Limits | null }) => JSX.Element"
    # Opens at once from the figures held and makes no daemon request; one muted line points to the /context slash command.
  DeletedConversation:
    signature: "(props: { thread: PlanningThread; projectId: string }) => JSX.Element"
    # Read-only history; never opens a session, so it holds no live frames and passes empty
    # `tools` and `todos`.
  FocusChip:
    signature: "(props: { pointed: PointedTask; onClear: () => void }) => JSX.Element"
  SlashMenu:
    signature: "(props: { items: readonly SlashCommand[]; highlighted: number; onPick: (command:
      SlashCommand) => void; onHighlight: (index: number) => void }) => JSX.Element"
    # Keys are the composer's. Pick uses mouse-down so the textarea keeps focus.
  StageChip:
    signature: "(props: { projectId: string }) => JSX.Element | null"
  StatusBadge:
    signature: "(props: { running: Turn | null; latest: Turn | null }) => JSX.Element | null"
    # Running (or Starting, or Stopping) while a turn runs; else how the latest ended.
  StreamBanner:
    signature: "(props: { connection: Connection; problem: string | null; retry: () => void }) =>
      JSX.Element | null"
    # Shows only reconnecting and failed; connecting and live show nothing.

hooks:
  useSend:
    signature: "({ to: SendTo; threadId: string | null; running: Turn | null; initialAttempt?: Attempt | null; imagesChanged: () => void; dropImages: (sent: PendingImage[]) => void; clearPrompt: () => void; clearContinuedPlan: () => void; onPointed: (done: PointedTask) => void; onStarted: (operationId: string) => void }) => { deliver: ({ text, settings, pointed, planId, images }: Omit<Send, 'commandId'>) => void; clearAttempt: () => void; sending: boolean; inFlight: boolean; error: Error | null }"
    # Owns the pending attempt, send/queue mutations and their choice. deliver takes
    # the message values; it reads neither prompt state nor the slash menu.
    # clearAttempt is stable so the composer, images and settings share one reset.
    # Thread delivery awaits uploads, then companion targeting, then start/queue.
    # Draft delivery calls to.draft. Unchanged retries reuse the command; conflict
    # drops it. focusOf uses the task id in the attempt and the request alike.
    # Send success drops sent images, resets the attempt, clears continued plan and
    # prompt, clears the pointed task, then calls onStarted. Queue success drops
    # images, clears prompt and attempt, then refreshes the queue; focus/plan remain.
    # inFlight is computed once for image intake and the composer controls;
    # sending preserves the settings hook's busy input independently of queuing.
  useStop:
    signature: "(running: Turn | null) => { stop: (operationId: string) => void; isPending: boolean; error: Error | null; label: 'Stop' | 'Stopping…' | 'Stop again' }"
    # Owns the stop mutation. Stopping persists until running clears; a failed stop
    # offers Stop again. Only a pending request disables the button.
  useSessionSettings:
    signature: "(choices: SessionChoices | null, busy: boolean, threadId: string | null, changed: () => void) => { settings: TurnSettings | null; note: string | null; choose: (next: TurnSettings) => void; switching: boolean; error: Error | null; resetError: () => void }"
    # Owns held settings, their note, mode replay, model refusal and effort changes.
    # choose routes a saved mode change to Core and other choices to local settings.
    # switching holds Send and the menus while any settings mutation is pending.
    # changed drops the pending send identity; resetError clears only the effort error
    # when submitting, preserving mode-error precedence. Busy defers model/effort writes.
  useConversation:
    signature: "(threadId: string, onShowHere?: (show: PlanShowFrame) => void, projectId?: string) => ConversationView"
    # Mount once per thread. Folds the stream into the turn and reply reducers, the
    # entries, the operations snapshot, usage, commands and plan refetches. `onShowHere`
    # hears only a live plan-show naming this tab and this thread.
  useSession:
    signature: "(threadId: string) => SessionView"
    # One POST /session, held as a query: never on a timer or on focus.
  useCarriedSend:
    source: carried-send.ts
    signature: "(threadId: string) => CarriedSend | null"
    # Reads what carrySend left, once, on the first render.
  useCommands:
    signature: "(threadId: string | null) => readonly SlashCommand[]"
    # Enabled false: only the stream fills it. Empty when there is no thread.

pure:
  turnReducer:
    signature: "(state: TurnState, action: TurnAction) => TurnState"
    # Newest first. Per turn the row or event with the higher seq sets status_kind and
    # stopRequested; an equal seq keeps what is known; the started action has no seq and yields.
    # An event of no operation, or one without a status_kind in its payload, is ignored.
  isTerminal:
    signature: "(status: Status) => boolean"
    # The one piece of status knowledge kept: whether a turn has ended (Stop, endedAt).
  runningTurn:
    signature: "(state: TurnState) => Turn | null"
    # The newest turn that has not ended.
  latestTurn:
    signature: "(state: TurnState) => Turn | null"
  replyReducer:
    signature: "(state: ReplyState, action: ReplyAction) => ReplyState"
    # `stream` follows the streamed text; `agent-entry` cuts a segment where the
    # stream stood when the entry was announced.
  shownReply:
    signature: "(state: ReplyState, durable: Durable) => ShownReply | null"
    # Shown until the entries hold every covered ordinal, or until a fetch after the
    # turn ended.
  agentOrdinal:
    signature: "(payload: unknown) => number | null"
    # Exported from use-conversation.ts. AgentMessage, ToolCall and Subagent only.
  initialSettings:
    signature: "(c: SessionChoices) => TurnSettings"
  withModel:
    signature: "(c: SessionChoices, s: TurnSettings, model: string) => TurnSettings"
    # An effort is kept for a model whose efforts are not yet known, and Send waits.
  effortsKnown:
    signature: "(c: SessionChoices, model: string) => boolean"
    # True only when the session holds that model; efforts belong to one model.
  afterOptions:
    signature: "(prev: SessionChoices, next: SessionChoices, s: TurnSettings, busy: boolean) => {
      settings: TurnSettings; note: string | null }"
    # Follows the session's reports. `busy` holds back the refusal check during a send.
  modeNote:
    signature: "(prev: TurnSettings, next: SessionChoices) => string | null"
  sendable:
    signature: "(c: SessionChoices, s: TurnSettings) => boolean"
  labelOf:
    signature: "(choices: readonly Choice[], id: string | null) => string"
  sessionCommand:
    signature: "(text: string, choices: SessionChoices | null) => SessionCommand | null"
    # Null unless the text is /model or /effort. See the gap on disabled choices.
  slashMatches:
    signature: "(commands: readonly SlashCommand[], text: string) => readonly SlashCommand[] | null"
    # Null unless the whole text is a slash and one word. Prefix, then after colon, then contains.
  contextShown:
    signature: "(used: number | null, window: number | null) => { used: number; window: number;
      percent: number } | null"
  formatTokens:
    signature: "(n: number) => string"
  resetIn:
    signature: "(resetsAt: number, now: number) => string"
    # Unix seconds in, two largest units out: `3d21h`, `4h18m`, `7m`, or `now`.
  latestContext:
    signature: "(operations: readonly Operation[]) => ContextFigures | null"
  toolText:
    signature: "(title: string) => string | null"
    # A sentence for Shadows' tools, the title for any other, null when the tool adds no line.
  subagentOf:
    signature: "(entry: ThreadEntry) => SubagentCard | null"
    # Null for any other kind, and for a card that fails to read (no throw escapes).
  silent:
    signature: "(entry: ThreadEntry) => boolean"
    # True for a tool call whose title reads as nothing (plan_show).
  activityRows:
    signature: "(shown: readonly ThreadEntry[]) => Row[]"
    # Consecutive ToolCall entries of one turn with a readable card form one group; an entry
    # with no card (an old one) stands alone as a completed step with its title.
  liveSteps:
    signature: "(frames: readonly ToolFrame[], entries: readonly ThreadEntry[], op: string, ended?: boolean) => ToolStep[]"
    # A frame whose call an entry already holds is dropped: the entry is final.
  groupSummary:
    signature: "(steps: readonly ToolStep[]) => string"
    # 'Read 3 files, ran 2 commands, edited a file +36': kinds in order of first appearance.
  stepLine:
    signature: "(step: ToolStep) => { text: string; counts: string | null }"
    # A sentence, else verb + target (+ lines), else the title.
  copyText:
    signature: "(entry: ThreadEntry) => string"
    # What an entry row's Copy puts on the clipboard: a subagent's report, or the body. A tool
    # call never reaches it: `ToolGroup` copies its steps' lines.
  duration:
    signature: "(ms: number) => string"
  tokens:
    signature: "(n: number) => string"
  modelName:
    signature: "(model: string) => string"
  numbers:
    signature: "(card: SubagentCard) => string"
    # The card's duration, tokens and tool count, each only when reported.
  describeLabel:
    signature: "(label: string) => Shown | null"
    # Streaming bookkeeping returns null; the rest maps to an icon and a line.
  rehypeDirAuto:
    signature: "() => (tree: HastNode) => void"
    # Runs after Streamdown's plugins. Gives each block its own direction.

draft_owners:
  draft.tsx: "Render draft conversation routes; DraftRoute, AgentDraftRoute, Draft read API-owned query state (the harness list too: while it fails, the composer shows its error and offers no mode); first-send.ts owns mutations"
  draft-session.ts: "Offer provisional draft choices; draftSession takes the harness policy Core lists (api/harnesses policyOf) and uses the private UNOPENED placeholder before a session exists; without the policy it is connecting"
  first-send.ts: "Orchestrate the draft first send; useFirstSend owns thread creation, companion targeting, list invalidation, session opening, optional model change, image capability checking, staged uploads, first turn, navigation; DRAFT_TITLE is private; only draft.tsx imports this module"
  carried-send.ts: "Store the one-time failed first-send handoff; CarriedSend, carrySend, useCarriedSend retain the message; Attempt comes directly from api/command-id through a type-only import; no runtime API call"
  upload-images.ts: "Upload selected images with replayable commands; PendingImage, uploadImages, retryImageUpload own upload identity, shared in-flight promises, ordered answers, explicit retry"

queries_and_mutations:
  # The session and command keys and cache updates (sessionKeys, replaceChoices,
  # reopenSession, replaceCommands, clearCommands) are api/sessions.ts's; the
  # conversation imports them from there (api/contract.yaml session_cache).
  carrySend:
    source: carried-send.ts
    signature: "(threadId: string, send: CarriedSend) => void"
    # Module-level map: a draft that failed after its thread existed hands its text here.
  useFirstSend:
    source: first-send.ts
    signature: "(projectId: string, harness: string, planId?: string, profile?: string) =>
      (commandId: string, text: string, chosen: TurnSettings, images: PendingImage[], changed: () => void) => Promise<string>"
    private: true
    # Creates the thread (with `profile` under an agent), opens its session, applies the
    # model chosen in the draft when it differs and takes that answer's effort,
    # uploads the staged images, starts the turn, and only then navigates. The thread page reads Core's choices.
    # On a later failure it carries the send to the thread page and rethrows.


# ── obligations ──────────────────────────────────────────────────────────────

obligations:
  - rule: >
      A draft under an agent keeps the model chosen before the first send: the thread is
      created with the agent, the session opened, the chosen model applied, and only then
      the turn sent with it.
    tested_by: [first_send_keeps_chosen_model]

