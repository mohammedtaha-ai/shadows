# ── agreements ───────────────────────────────────────────────────────────────

agreements:
  - between: [useFirstSend (draft), useSend (thread page)]
    must: >
      fingerprint a retried first send the same way, so the thread page's retry replays the
      draft's command and is not a new turn
    holds: true
    why: >
      The draft's catch builds its attempt from the same text, settings, plan and stable image keys; the thread
      page's composer passes `carried.attempt` to useSend as `initialAttempt`.
    tested_by: "carries the selected plan and command into a failed first-send retry"

  - between: [useFirstSend, useSession]
    must: >
      read authoritative session choices after the draft navigates to its thread
    holds: true
    why: >
      useFirstSend opens the session directly without seeding the query cache. The thread
      page's useSession opens it again and reads Core's current choices, including the mode
      remembered by the first turn and its image capabilities.
    tested_by: "the mode chosen in the draft stays on the thread page and runs the second turn"

  - between: [turnReducer, reply shownReply]
    must: >
      agree on which turn is running, so the reply and the running label never disagree about it
    holds: true
    why: >
      The reply's op is set from runningTurn's id in use-conversation.ts; shownReply then looks
      that turn up in the same turn list.
    tested_by: none
    note: >
      Holds by code reading. No test drives both reducers together through use-conversation.


# ── not_the_caller's ─────────────────────────────────────────────────────────

not_the_caller's:
  - >
      Mint a CommandId for a send or a queue. Call useSend's deliver method, which owns the
      pending attempt through `attemptFor`, so a retry replays and a changed request is new.
  - >
      Send `/model` or `/effort` to the harness as text. Use the pickers; `sessionCommand` is the
      only path that reads them.
  - >
      Decide whether a reply is shown from the entries list alone. Pass the entries' ordinals and
      fetch time to `shownReply` along with the reply state.
  - >
      Treat `useCommands` as a fetch. It has no query function; only the stream fills it.


# ── gaps ─────────────────────────────────────────────────────────────────────

gaps:
  - at: sessionCommand
    gap: >
      `match` (called by sessionCommand) keeps only enabled choices. A model or effort the session
      offers but has disabled is reported as "This session offers no model named ..." The reason
      the session gave is lost, and the person is told the choice does not exist.

  - at: formatTokens
    gap: >
      It rounds to one decimal before choosing the unit, so 999999 reads "1000k" instead of "1M".
      Cosmetic, but the boundary is wrong.

  - at: tokens
    gap: >
      It rounds to whole thousands, so 999600 reads "1000k" instead of "1M". Same boundary as
      formatTokens; a subagent's token count is the visible case.

  - at: modelName
    gap: >
      The regex takes the first digits after the family as the major version. A dated model id
      such as "claude-opus-4-20250514" reads "Opus 4.20250514". "claude-3-5-sonnet" reads
      "Claude 3.5", which drops the family.

  - at: toolText
    gap: >
      `name in SENTENCES` also matches inherited Object.prototype keys. "mcp__shadows__constructor"
      returns the Object function, which is neither null nor the title. Reachable only with a
      shadows tool name outside the table. Low severity; an own-property check fixes it.

  - at: ApprovedBy
    gap: >
      Every `agent` other than 'human' reads as "Approved by the Planner at your request". An
      approval by another agent kind would be credited to the Planner. The "at your request" wording
      also shows with no link when `request` is null.

  - at: WaitingMessages
    gap: >
      Remove takes a new crypto.randomUUID() per press. A retry after a lost response carries
      a new command id, so the daemon cannot recognize it as the same request.

  - at: carrySend
    gap: >
      The module-level map keeps a carried send until its thread page mounts. If nobody opens that
      thread, the entry stays in memory for the rest of the session. Small; the map is never cleared
      otherwise.


# ── open_questions ───────────────────────────────────────────────────────────

open_questions:
  - >
      Should a queued message clear the focus chip? `useSend`'s queue `onSuccess` does not call
      `onPointed`, while a sent turn does. The queued message stores its focus (WaitingMessages'
      rows carry it), so the chip staying means the next message carries it too. Intent is not
      stated in code; decide, then align use-send.ts.

  - >
      Does the daemon retitle a draft's thread on its first start? `useFirstSend` creates the thread
      with the title "New conversation", and its comment says the first message retitles it. Nothing
      in this folder retitles it. Inspect the daemon's thread-start route.

  - >
      Does the app's QueryClient garbage-collect `sessionKeys.commands` entries? `useCommands` has no fetch,
      so
      a thread's `/` list with no mounted observer is collected after the default gcTime and comes
      back empty until the stream resends it. Inspect the QueryClient defaults (the
      app root) and whether the stream resends commands on reopen.

  - >
      Do vision, map and roadmap approvals refresh their card's status? `onSuccess` invalidates
      `['projects', projectId, 'design']`. The card reads `visionProposalsQuery` (and its map and
      roadmap twins). Inspect web/src/api/design.ts for those keys' prefix. The success tests pass,
      so some other path refetches; find it.

  - >
      Does a map 'change' proposal's changed part sit at parts[0]? MapProposalCard's changed-fields
      list compares `old` with `parts[0]`. Inspect the daemon's map proposal builder for the order
      of
      parts on a change.

  - >
      Does readSubagentCard guarantee a status of running, completed, failed or stopped? STATE in
      subagent-card.tsx is indexed by it with no fallback. Inspect web/src/stream/frames.ts.

  - >
      Which agent values can an approval carry? ApprovedBy treats every non-'human' value alike.
      Inspect
      approved_by.agent in web/src/api/schema.d.ts and the daemon's approval attribution.

  - >
      Which harness frame carries the operational label 'user'? describeLabel maps it to "Using a
      tool".
      Inspect the stream's meta frames or the harness adapter that writes labels.


