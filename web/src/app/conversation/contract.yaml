    tested_by: [deleted_agent_conversation_reads]

  - rule: >
      Per turn the source with the higher journal seq wins: a snapshot row or an operation
      event sets the status and the stop flag. A snapshot read before a turn ended does not
      bring it back, a replayed start does not reopen an ended turn, a newer row replaces an
      older event, an equal seq keeps what is known, and the start route's answer yields to
      any row or event. An unknown status keeps the turn unended.
    tested_by:
      - "a snapshot read before a turn ended does not bring it back"
      - "a replayed start does not reopen a turn the snapshot saw end"
      - "a newer snapshot row replaces an older event"
      - "an equal seq keeps what is known"
      - "the start route yields to any row or event"
      - "a cancellation request sets stopRequested without changing the status"
      - "an unknown status keeps the turn unended, so Stop stays offered"
      - "ignores an operation event without a status_kind"
      - "a reload during a running turn shows it running, then follows it to its end"

