design_cache_identity: "api/design.ts owns design query/page identities and saved standards answers"

feature_entry: "index.ts exposes MapPartDetails, VISION_FIELDS, the three proposal cards and ApprovedBy."

pagination_owner: "api/design.ts owns useDesignPages and usePartPages; design views import part pagination directly from that owner."

route_entries: "workspace-page.tsx remain separate public lazy route modules declared by index.ts."

layer_editor: 'Standards v3 exposes presence and the layer catalog (id, role, required, may use). The form edits one folder. A required layer first asks Used or Not used: Used shows the place, Not used the reason, never both. An optional layer has no row until added, and offers Remove instead of Not used. Layers off the kind''s catalog stay visible with Remove. The form does not check the reason: Core refuses a blank one and the form shows that refusal. Same-kind child groups link to children. Tested by the_part_form_sends_one_folder_and_its_layers, a_not_used_layer_needs_a_reason_before_save, choosing_not_used_hides_the_place_and_asks_for_a_reason, an_optional_layer_has_no_row_until_added, a_grouping_part_links_its_children_instead_of_layers.'

served_list: 'The part form lists only the vision items the part serves, each with Remove, and an Add button over the items it does not serve. Tested by served_items_show_only_the_parts_own.'

principles_not_layout: 'No structure writer, Structure step, file count or starter-file inspection. Layer places follow the stack; map revision comes from Core. The stage chip already renders Core state and has no static step list.'

related_tasks: 'A selected Roadmap outcome reads outcome State (projectStateQuery with outcome_id) and shows Related tasks beside, never inside, the OutcomeEditor: each approved plan with its tasks linked by exact version and number, Runs status and access, the outcome task counts, and a Draft-only plan as a Draft link with no tasks or count. A selected Map part reads part State and lists only its scoped tasks with Reads, Writes or Reads and writes; no part card reads tasks. Task progress is labelled as tasks done and never as the outcome being achieved; acceptance items stay in the editor. Tested by a_selected_outcome_lists_its_approved_and_draft_plans_with_task_status, a_selected_part_lists_its_own_tasks_with_access_labels.'

map_layers: 'Map cards show each part folder and layer places, not-used reasons and grouping-child anchors. A part groups only when it has a kind and a child of that kind, as Core reads it; an untyped part groups nothing. Approval continues to display Core refusals and retain command identity. Tested by the_map_card_shows_each_parts_layers, the_map_card_links_a_grouping_parts_children.'

proposal_approval:
  owner: "useProposalApproval in use-proposal-approval.ts owns the live proposal read, command attempt, approval mutation and status text for all three cards"
  signature: "<T extends VisionProposal | MapProposal | RoadmapProposal>({ projectId, proposalId: string | null, proposalsQuery: UseQueryOptions<T[], Error, T[], string[]>, approveProposal, approvedSuffix?: (live: T) => string }) => ProposalApprovalState"
  result: "projectId, status, approved, approvedBy, canApprove, isPending, queryError, approvalError, submit"
  rendering: "ProposalApproval in proposal-approval.tsx takes the result, buttonLabel and textClass; renders status, ApprovedBy, Approve, query error and approval error with no wrapper"
  content: "Each card owns its snapshot parser, title and domain content; vision supplies its live approved item suffix, map supplies its waiver button label"
  replay: "Unchanged approval retries reuse attemptFor({ projectId, proposalId }); success drops the attempt and invalidates designKeys.all(projectId); refusal keeps the attempt and invalidates that card's proposals query"
  status: "Approved with the supplied suffix, Superseded, Outdated — ask the Planner to propose again, Pending, Loading status…, Status unavailable, in that order; approval requires readable live Pending without outdated"

external_proposals:
  owner: external-proposals.tsx
  list: "ExternalProposals lists one kind's pending, not outdated proposals whose thread_id is null, each headed From <connection name> (connectionsQuery by connection_id; an external agent when not found). Approved and superseded ones are not listed. The design pages render it."
  cards: "The pending aside counts and links only proposals with a conversation. The vision, map and roadmap cards (VisionProposalCard, MapProposalCard, RoadmapProposalCard, props entry or proposal, projectId) take either entry (a conversation's snapshot) or proposal (the live row) and draw the same body and approval; an external one says Outdated — ask its agent to propose again."
  tested_by: [an_external_vision_proposal_is_approved_on_the_vision_page, a_retry_of_an_external_approval_reuses_its_command_id, the_pending_aside_links_only_proposals_with_a_conversation, an_external_proposal_names_its_connection, an_external_proposal_of_a_removed_connection_says_an_external_agent, the_roadmap_page_lists_external_roadmap_proposals, an_outdated_external_proposal_asks_its_agent]
