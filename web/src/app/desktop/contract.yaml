name: desktop-native-settings
version: 1
status: current
source: web/src/app/desktop
responsibility: Present retained native person actions in the shared dashboard.
public_api:
  entry: web/src/app/desktop/index.ts exposes companion presentation to other features; startup.ts isolates ConnectionSettings.
components:
  ConnectionSettings: Revisioned native Core state above a closed Advanced configuration disclosure; save or explicit Retry; fixed native errors. No HTTP consumer, including at bootstrap.
  CompanionSettings: Explicit live agent selection with provider titles (Core preset/region/label) and model IDs; independent preview preference; stale replies ignored; explicit Local Core retry also restarts the native observer.
  UseWithCompanion: Explicitly target an existing selected-agent thread; never send a turn or change the selected agent.
  CompanionControls: Subscribe before snapshot; revisioned visibility and motion switches; explicit Retry after rendering failure.
  Activity: Desktop-only local sessions and approval controls.
  CharacterSection: Companion switches followed by companion agent settings in the shared settings dialog.
  CoreSection: Native Core connection settings in the shared settings dialog.
  DesktopSidebarActions: Local activity and Hide to tray in one conditional row, followed by the native error line without an extra wrapper.
  SessionsPanel: Show session state/project; preview hook settings before confirmed installation.
  ApprovalsPanel: Show project/session; allow once, deny, preview exact rule, approve or dismiss.
  RulePreviewGuard: Invalidate edited or stale previews; approve only the captured rule and settings fingerprint.
  useActivity: Mounted visible-panel sidecar polling through React Query.
obligations:
  - rule: A bound live agent's resolved character colour appears under the companion selector; absent binding shows no colour line.
    tested_by: web/src/app/desktop/companion-binding.test.tsx
  - rule: The bootstrap form imports no HTTP consumer; the native owner validates paths and origin.
    tested_by: apps/desktop/tests/desktop-bootstrap.spec.ts
  - rule: Malformed companion updates show a local error.
    tested_by: web/src/app/desktop/native-sections.test.tsx
  - rule: The character's three switches retain explicit native mutations; a later native connection event cannot be overwritten by an older snapshot.
    tested_by:
      - web/src/app/desktop/companion-binding.test.tsx
      - web/src/app/settings/core.test.tsx
  - rule: Project and session context precede approval; a missing sidecar needs no login.
    tested_by: web/src/app/desktop/native-sections.test.tsx
  - rule: Rule edits discard in-flight previews; settings_changed and preview_mismatch force a fresh preview.
    tested_by: web/src/app/desktop/rule-preview.test.ts
gaps:
  - at: account and hook installation
    gap: Tests use synthetic native replies; real account surrender and personal hook installation are not part of this acceptance.

profile_fixture_identity: "Companion fixtures use api/aylul-profiles profileKeys for mocked Core reads"

activity_query_owner: "api/native-activity.ts owns activity query identity and polling options; useActivity supplies desktop/activity-api.getState as the native transport"

startup_entry: "startup.ts exports only ConnectionSettings before native readiness; its static graph cannot reach api/transport/index.ts."


feature_imports: "Cross-feature production imports use declared public entries."

feature_entry: "index.ts exposes UseWithCompanion, CompanionControls, CompanionSettings, ConnectionSettings, desktopSettingsSections, visibleDesktopSettingsSections, DesktopSectionId, CoreSection, DesktopSidebarActions."

route_entries: "activity.tsx remain separate public lazy route modules declared by index.ts."

desktop_capabilities:
  Activity: localCore gates local sessions and approval controls; without it the existing desktop-availability message is shown.
  desktopSettingsSections: Ordered registrations carry the desktop-owned id, label, This machine group, capability and content component. Character requires companion; Local Core requires localCore. visibleDesktopSettingsSections filters at read time.
  DesktopSidebarActions: localCore gates Local activity; tray independently gates Hide to tray. The row exists when either is available; the error line follows the row.
