name: desktop-native-settings
version: 1
status: current
source: web/src/app/desktop
responsibility: Present retained native person actions in the shared dashboard.
components:
  ConnectionSettings: Existing executable/database/configuration references; save or explicit Retry; fixed native errors.
  NativeSettings: Desktop-only companion and connection sections; account presentation now belongs to settings/sections/account.tsx.
  CompanionSettings: Explicit live agent selection with provider/model labels; independent preview preference; stale replies ignored; explicit Local Core retry also restarts the native observer.
  UseWithCompanion: Explicitly target an existing selected-agent thread; never send a turn or change the selected agent.
  CompanionControls: Subscribe before snapshot; revisioned visibility and pause; local rendering failure keeps account actions available.
  Activity: Desktop-only local sessions and approval controls.
  SessionsPanel: Show session state/project; preview hook settings before confirmed installation.
  ApprovalsPanel: Show project/session; allow once, deny, preview exact rule, approve or dismiss.
  RulePreviewGuard: Invalidate edited or stale previews; approve only the captured rule and settings fingerprint.
  useActivity: Mounted visible-panel sidecar polling through React Query.
obligations:
  - rule: The bootstrap form imports no HTTP consumer; the native owner validates paths and origin.
    tested_by: apps/desktop/tests/desktop-bootstrap.spec.ts
  - rule: Browser exposes no native section or invocation; malformed companion updates show a local error.
    tested_by: web/src/app/desktop/native-sections.test.tsx
  - rule: Project and session context precede approval; a missing sidecar needs no login.
    tested_by: web/src/app/desktop/native-sections.test.tsx
  - rule: Rule edits discard in-flight previews; settings_changed and preview_mismatch force a fresh preview.
    tested_by: web/src/app/desktop/rule-preview.test.ts
gaps:
  - at: account and hook installation
    gap: Tests use synthetic native replies; real account surrender and personal hook installation are not part of this acceptance.
