name: web-groups
version: 1
status: current
source: web/src/app/groups
responsibility: Create and open AYLUL agent groups and render their durable conversation.
obligations:
  - Creation and send keep the command id for an unchanged retry after a lost answer.
  - Creation refreshes the sidebar list before navigating, including an empty group.
  - The log follows new messages only when the reader was at the bottom.
  - Member thinking follows the member thread operation query.
