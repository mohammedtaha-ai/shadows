# Owns the screens that show a project's state, its tables and screens, and where a topic
# is in the code, read only, over Core's answers. Nothing here writes.
#
# Trap: Core states, the web shows. Element states, task counts, attempt states and every
# remainder count are shown as Core gives them. No component derives a state, sorts an
# answer again, checks a length or counts what Core counted.

name: web-project-state
version: 1
status: current
source: web/src/app/project-state
responsibility: >
  Show the project's state, its tables and screens, and code_where, read only, over
  Core's answers.
loading: Every read shows a labelled SkeletonContent; cached content stays visible during background reads.

rulings:
  read_only: "Nothing on these screens writes. Tables and screens are the Planner's."
  core_states: >
    Presentation only: a label or icon per enum value, grouping, hiding removed elements behind
    a toggle, drawing an edge only between two shown nodes.
  one_door: >
    Every read is a query in api/project-state.ts; the stream refresh is classified in
    stream/refresh.ts. No fetch, no URL built by hand, no EventSource here.
  refusals: "Every query uses retryLost; a 404 or 422 shows ErrorLine with Core's code and message."
  text_direction: "Every name, purpose, why, when, path and title Core wrote is rendered with dir=auto."

route:
  path: "/projects/$projectId/state"
  search: >
    view ('state' | 'tables' | 'screens' | 'where'; an unknown view reads as 'state'), part,
    element, topic (kept when strings), removed (true only for true or 'true').
  stream: "The shell already holds the project stream; the page opens none."

components:
  ProjectStatePage:
    signature: "() => JSX.Element"
    # Route body: the header, the section nav, and the body the view selects.
  StateView:
    signature: "({ projectId: string, part?: string, removed: boolean }) => JSX.Element"
    # Stage, parts with plans and counts, plans with no part, gaps, and one part in full.
  StateBadge:
    signature: "({ state: BuildState }) => JSX.Element"
    # An icon and a label per build state, marked data-element-state.

  ElementPanel:
    signature: "({ projectId: string, view: ElementView, names: (id) => string | undefined, onClose: () => void }) => JSX.Element"
    # One table or screen in full: why, part, outcomes, confirmation, tasks, revisions.
  ElementCanvas:
    signature: "({ label: string, nodes, edges, selected?: string, onOpen: (elementId) => void }) => JSX.Element"
    # The React Flow canvas of laid-out elements; nodes carry data-element and data-element-kind.
  TablesView:
    signature: "({ projectId: string, element?: string, removed: boolean }) => JSX.Element"
    # The ER diagram, the tables list and the opened table.
  tableDiagram / screenDiagram:
    signature: "(views: ElementView[]) => { nodes: ElementNode[]; edges: DiagramEdge[] }"
    # Deterministic dagre placement; fixed sizes; an edge only between two shown, different nodes.

obligations:
  - rule: >
      The state view shows the stage, the parts with their plans and counts, the plans with no
      part and the gaps, in Core's order.
    tested_by: the_state_view_shows_stage_parts_plans_and_gaps

  - rule: "A remainder (parts, plans, gaps) is shown as Core's count."
    tested_by: remainders_are_shown_as_cores_counts

  - rule: >
      A part is read with part_id and shows its plans' tasks (Done, Core's attempt state, or Not
      started) and its elements with their states.
    tested_by: a_part_shows_its_plans_tasks_and_elements

  - rule: "Removed elements are hidden behind a toggle."
    tested_by: removed_elements_are_hidden_until_asked

  - rule: "A refused read shows Core's code and message; a refused part keeps the All parts link."
    tested_by: an_unknown_part_shows_cores_refusal, an_unknown_project_shows_cores_not_found

  - rule: >
      The state follows the project stream without a reload: one live TaskProgressChanged adds
      one read, and replayed events add one read at caught-up.
    tested_by: task_progress_on_the_project_stream_moves_a_task_to_started_without_reload, replayed_events_reconcile_the_state_once

  - rule: "The design workspace links to this page."
    tested_by: the_workspace_links_to_the_state

  - rule: >
      The ER diagram draws one node per shown table and one edge per foreign key between two
      shown tables; the list holds the same tables.
    tested_by: the_er_diagram_draws_one_node_per_table_and_one_edge_per_foreign_key, the_layout_is_deterministic_and_every_node_has_its_size

  - rule: >
      A reference to a table not shown, or to the table itself, draws no edge; the column row
      still names it.
    tested_by: a_reference_to_a_table_not_shown_draws_no_edge_but_keeps_its_row, a_self_reference_draws_no_edge

  - rule: "Removed tables are hidden behind a toggle."
    tested_by: a_removed_table_is_hidden_until_shown

  - rule: >
      An opened table reads its revisions once and shows its part, outcomes, tasks, why and
      revisions; when behind, its built revision and the planned change come from the same read.
    tested_by: an_opened_table_shows_its_part_outcomes_tasks_and_revisions, a_behind_table_shows_its_built_shape_and_the_planned_change

  - rule: "A refused revisions read shows Core's code and message."
    tested_by: an_element_without_revisions_shows_cores_error

  - rule: "With no table the view says the Planner writes them."
    tested_by: no_tables_says_the_planner_writes_them

  - rule: >
      A DesignElementChanged reads the elements and that element's revisions again, once each.
    tested_by: a_design_element_change_reads_the_elements_and_its_revisions_again

tests:
  diagram-layout.test.ts: "Layout determinism, sizes and edge rules."
  tables-view.test.tsx: "The tables view over the fake daemon."
  state-view.test.tsx: "The state view, over the fake daemon and its project stream."
