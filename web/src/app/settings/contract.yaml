# Owns the global Settings dialog: URL-selected sections over the current page.
# The active-projects limit belongs to the code index (§15.6).
#
# Trap: the form keeps the person's typed number until it is saved or the saved value
# changes while the field is untouched. The save's success clears that edit without
# checking for a newer one, so an edit typed while the save was in flight is lost.
#
# Shared sections use the SettingsDialog content map; desktop-ui registers machine content.

name: web-settings
version: 1
status: current
source: web/src/app/settings


# ── shapes ───────────────────────────────────────────────────────────────────────

shapes:
  Limit:
    # The bounds the form enforces before it sends. The daemon's own bounds are
    # the same numbers by its comment; see open_questions.
    MIN: 1
    MAX: 20


# ── external types ───────────────────────────────────────────────────────────────

external:
  CodeSettings: "web/src/api/code; active_limit"


# ── functions ────────────────────────────────────────────────────────────────────

components:
  PluginsSection:
    signature: "() => JSX.Element"
    note: Accessible Plugins/Skills tabs; Add replaces the body without another dialog.
  ExtensionImport:
    signature: "({ kind: ExtensionKind, onDone: () => void }) => JSX.Element"
  ExtensionList:
    signature: "({ kind: ExtensionKind, items: Item[] }) => JSX.Element"
    note: ConfirmPanel renders the inline confirmation with non-submitting buttons; ExtensionList owns the selected item, mutation, per-item command attempts, invalidations and locked ref.
  UsageSection:
    signature: "() => JSX.Element"
    note: A captured range per opening/period selection; no old rows during a new pending range.
  UsageTables:
    signature: "({ report: UsageReport }) => JSX.Element"
  SettingsDialog:
    signature: "() => JSX.Element"
    # One modal in Shell; section availability follows the runtime.
  GeneralSection:
    signature: "() => JSX.Element"
    note: Active projects stays independent of Core language/theme and desktop-only machine preferences.
  GeneralPreferences:
    signature: "() => JSX.Element"
    note: Uses personQuery/savePerson and savePersonAnswer; each pick queues only its theme or language field, with one save in flight. The glass circles remain interactive during saves.
  PersonTheme:
    signature: "() => null"
    note: Mounted once in Shell after readiness; root dark class/data-theme follow saved preference or system, with complete effect cleanup.
  DesktopPreferencesControls:
    signature: "() => JSX.Element"
    note: Loads on each desktop General opening; sends flat partial native updates without a Core write.
  AccountSection:
    signature: "() => JSX.Element"
    note: You card works in browser and desktop; native state/actions mount only in desktop.
  YouCard:
    signature: "() => JSX.Element"
  ProvidersSection:
    signature: "() => JSX.Element"
    note: Provider list titles use Core presets plus region and label; Edit waits for presets to load.
  AgentsSection:
    signature: "() => JSX.Element"
    note: Each list row shows its resolved colour dot; the bound agent has a Companion tag on desktop only.
  ActiveProjects:
    signature: "() => JSX.Element"
    # Reads the code settings; renders the form once they load.

private_helpers:
  LimitForm:
    # The form. `edited` is null until the person types; it then holds their text.
    private: true

functions:
  usageRange:
    signature: "(period: UsagePeriod, now: Date) => { from: string; to: string }"
  accountView:
    signature: "(auth: AuthView | null, busy: boolean, loggingIn: boolean) => { message: string; actions: AccountAction[] }"
  visibleSections:
    signature: "() => (typeof SECTIONS[number] | ReturnType<typeof visibleDesktopSettingsSections>[number])[]"
    note: Lists settings-owned sections followed by desktop-ui's visible registrations; SectionId unites settings ids with desktop-ui's DesktopSectionId.
  readSettingsSearch:
    signature: "(search: Record<string, unknown>) => { settings?: SectionId; agent?: string }"


# ── obligations ──────────────────────────────────────────────────────────────────

obligations:
  - rule: General saves each picked theme or language immediately as a one-field patch with retry-stable command identity; failed drafts of another preference are not sent. Pending picks run in order, identical adjacent picks share a save, and later picks stay visible while earlier saves finish. A queued success preserves another preference's error and retry identity. Unsupported language tags stay omitted on theme picks. Saved whole-record answers cancel older reads before cache writes.
    tested_by: ["General instantly saves only the picked preference", "an unknown saved language survives a theme-only change", "preference patches omit even newly observed names", "a failed preference save retains its draft and command", "changing language after a failed theme save sends only language", "a quick second %s pick survives a pending theme save", "identical pending picks share one save and closing the form sends nothing", "a queued success keeps another preference failure visible and retryable with its command", "an old read cannot undo saved preferences"]
  - rule: Dark/light themes apply through the root attributes and the shared CSS palette; System listens for browser colour-scheme changes while fixed themes do not. Failure without a person leaves the initial theme intact; unmount restores prior attributes and removes listeners.
    tested_by: ["theme follows the shared person", "System follows the OS and fixed themes do not", "failed person loading preserves the initial theme", "unmount removes System listeners and restores prior attributes"]
  - rule: Native controls read actual state instead of writing defaults, serialize local updates and accept the full returned object. A failed setter rereads actual values; failed recovery disables controls until explicit read retry. Native and Core errors remain independent; stale effect reads cannot overwrite a later accepted result.
    tested_by: ["browser General has no native preferences", "desktop defaults come from native without a write", "each switch sends flat partial camelCase arguments", "failed recovery read keeps controls disabled until explicit Retry", "a StrictMode read cannot overwrite accepted desktop preferences", "a failed Core save does not disable or invoke native switches"]
  - rule: The shared library has no global enablement switch. Add uses a trimmed daemon-side folder path, retains it after failure and reuses unchanged command identities. Back discards unsubmitted input; successful import returns to the selected tab.
    tested_by: ["the library has tabs and no switches", "Add imports a folder on the daemon", "import retry preserves command identity", "Back discards an unsubmitted import"]
  - rule: Remove requires inline library-wide confirmation, uses a command id in the DELETE query, accepts 204 and preserves retry identity after failure. Library writes invalidate the library and every agent-extension cache prefix.
    tested_by: ["Remove confirms its library-wide effect", "a failed Remove can be retried", "library removal clears every agent view"]
  - rule: Usage queries rolling 7/30-day periods or the person's local calendar month, serialized as UTC RFC3339. Exactly at month start the end advances one millisecond. Requests and cache entries stay scoped to their captured range.
    tested_by: ["periods produce bounded UTC ranges", "Usage opens with Last 7 days", "changing the period fetches its own report"]
  - rule: Usage preserves historical provider titles, report ordering and per-provider model identities. Bars compare input plus output tokens; zero totals have finite zero widths. Missing cost or currency displays a dash, never estimated zero or mixed-currency totals.
    tested_by: ["provider snapshots and labelled keys stay distinct", "provider bars compare total tokens", "model rows include their provider", "unknown charges are not zero"]
  - rule: Loading, empty and error states are distinct; explicit Retry keeps the same range.
    tested_by: ["empty and failed usage are distinct", "a refused period is shown without invented rows"]
  - rule: You sends only changed, trimmed names; an empty name sends null. Unchanged names disable Save and cannot send an empty patch. Only Save is disabled during a write; newer name edits survive its answer, and untouched names follow saved updates. Names over 64 characters or with line breaks are refused locally. Failed saves retain input; the same patch reuses its command id and a changed patch gets a new one.
    tested_by: ["saving sends only the changed names", "an emptied field saves as null", "both changed names share one patch", "unchanged and whitespace-only name edits cannot send an empty patch", "names typed during a save survive its answer", "editing one name keeps the other name following saved updates", "saved names keep following later answers without becoming edits", "a changed name patch after failure gets a new command", "more than 64 characters is refused before sending", "a failed save keeps the typed values and retries with the same command"]
  - rule: Name and preference patches made from the same earlier snapshot preserve both changes in Core, regardless of save order.
    tested_by: ["both forms save from the same snapshot with patch %s applied first"]
  - rule: Browser Account exposes You without native sign-in controls; failed person loads show an error instead of a form.
    tested_by: ["the browser lists Account with only You", "a failed person load shows an error and no form"]
  - rule: Agents selects a form through the agent search key; Back and successful save clear that key to show the list without changing the page. Missing or deleted agent IDs show the list with a note. Closing discards unsaved edits.
    tested_by:
      - "Agent settings opens the dialog on that agent"
      - "New agent opens an empty form"
      - "saving and Back return to the Agents list"
      - "a deleted agent in the URL shows the list with a note"
      - "closing an unsaved agent form discards the draft"
  - rule: Providers starts on its list; add and edit replace the section body; closing discards the unsaved form. Confirming deletion stays inside the existing settings dialog.
    tested_by:
      - "closing mid-form saves nothing"
      - "provider deletion confirms inside the settings dialog"
  - rule: Character presents visibility, motion and reply preview as switches; Local Core shows its native state above configuration fields in a closed Advanced disclosure.
    tested_by:
      - "character shows three switches"
      - "the Local Core paths are under a closed Advanced"
  - rule: Account shows only state-appropriate actions; checks status on each opening; pending actions disable every action except independent sign-in cancellation. Global logout and revoke require confirmation.
    tested_by:
      - "accountView gives each state its actions"
      - "an action in progress disables every button"
      - "the state is checked when the section opens"
      - "global logout and device revoke retain explicit confirmation"
      - "sign-in can be cancelled independently of its pending worker"
  - rule: Settings opens over the current page; Escape or backdrop closes it, clears settings search keys and returns focus to the Settings button.
    tested_by:
      - "Escape closes the dialog and keeps the page"
      - "a backdrop click closes the dialog and keeps the page"
  - rule: Desktop-only sections are hidden in the browser; unknown or hidden section IDs resolve to General. Plugins and Usage are available in both runtimes.
    tested_by:
      - "the dialog lists its sections in three groups"
      - "a desktop-only section in the browser falls back to General"
      - "an unknown or hidden section falls back to General"
  - rule: The legacy /settings URL redirects to the General dialog on the home page.
    tested_by:
      - "/settings redirects to the dialog"
  - rule: >
      The limit must be a whole number from 1 to 20. Any other text disables Save and
      shows "A whole number from 1 to 20."
    tested_by:
      - "saves the active limit"

  - rule: >
      Save sends the number with one command id. A retry of the same number reuses the id;
      another number gets a new one.
    tested_by:
      - "saves the active limit"
    note: >
      The test checks the body's command id is present, not that a retry reuses it.

  - rule: >
      Save is disabled while the field holds the saved value, and while a save is in
      flight.
    tested_by:
      - "follows a value changed elsewhere while the field is untouched"
      - "saves the active limit"

  - rule: >
      A value saved elsewhere replaces an untouched field after a refetch.
    tested_by:
      - "follows a value changed elsewhere while the field is untouched"

  - rule: >
      An edit typed while a save is in flight survives that save's success.
    tested_by: none
    note: >
      Does not hold; see gaps.


# ── gaps ─────────────────────────────────────────────────────────────────────────

gaps:
  - at: LimitForm
    gap: >
      onSuccess calls setEdited(null) unconditionally. The input is not disabled while a
      save is in flight, so a number typed then is dropped: the field snaps back to the
      value the save returned. The project's instructions editor guards this case
      (its base-version rule), and this form does not.


# ── open_questions ───────────────────────────────────────────────────────────────

open_questions:
  - >
      Does the daemon hold active_limit to 1 through 20 as the comment says, and how does it
      refuse a number outside them? Answering needs the code settings route, which is outside
      this folder.


# ── tests ────────────────────────────────────────────────────────────────────────

tests:
  - name: "saves the active limit"
    checks: >
      Typing 25 shows the range message and disables Save; typing 8 and saving sends
      active_limit 8 with a command id; after the refetched value reaches the cache the
      field shows 8 and Save is disabled.
  - name: "follows a value changed elsewhere while the field is untouched"
    checks: >
      After another tab's 7 is refetched, the untouched field shows 7 and Save is disabled.

extension_refresh_owner: "Library changes invalidate extensionKeys from api/extensions.ts"

person_cache_owner: "Both person forms send only their changed fields through api/person.savePerson and pass saved whole records through api/person.savePersonAnswer"

code_cache_owner: "api/code.ts owns saved active-project settings answers"

usage_query_identity: "Usage cache inspection and feature reads use api/usage.usageKeys"

feature_imports: "Cross-feature production imports use declared public entries."

feature_entry: "index.ts exposes readSettingsSearch, SettingsDialog, PersonTheme."

desktop_capabilities:
  visibleSections: Appends desktop-ui's visible section registrations; settings-owned sections remain available in both runtimes. SettingsDialog reads desktop content from those registrations.
  GeneralSection: windowPreferences gates DesktopPreferencesControls for system startup and close-to-tray preferences.
  AccountSection: accountLogin gates the native account card; the You card remains available in both runtimes.
  AgentsSection: companion gates the bound-agent Companion badge.
