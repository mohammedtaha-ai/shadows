name: web-tasks
version: 1
status: current
source: web/src/app/tasks
loading: Initial content reads use labelled SkeletonContent regions; placeholder shapes are decorative, motion respects reduced-motion preferences, and cached content stays visible during background reads. Errors and mutation progress keep their own presentation.
responsibility: Show one task of a plan version to run and to read, over Core's answers.
obligations:
  - Report attempt headers separate the attempt number, state and labelled model; a visible Show details or Hide details control with a chevron exposes its expanded state and controlled region. Only an expanded attempt reads its brief and conflict (report_opens_the_selected_attempt_brief).
  - A task marked done by Core shows a green Done badge with a check icon; the badge does not infer completion from a committed attempt.
  - Each Report attempt says "Began from Start" for a null addition or "Carried on with the Planner's addition" with the addition shown as plain preserved text under its heading, dir auto, never markup (the_report_shows_the_planners_addition_as_plain_text).
  - The header shows "Stopped after the Planner's third addition; back to you" only when the API's stoppedOnAdditionCap holds; the web counts no additions (a_task_stopped_on_the_cap_does_not_wait, the_cap_message_is_absent_with_%s).
  - Start's state and reason are `start.allowed` and `start.reason` from Core; the page holds no readiness rule.
  - The model starts on `suggested_model` and stays what the person chose through a refused send, which shows Core's reason and refetches.
  - Start and mark done keep their command id after a lost answer and make a new one after any answer.
  - A read Core refuses (a task it cannot find answers 404) shows Core's code and message at once in place of "Reading the task…"; the read is not retried (a_task_core_cannot_find_shows_its_message_and_reads_once).
  - The Report tab shows each attempt's `report` from Core as plain preserved text, never as markup, and nothing when it is null (the_report_shows_the_executors_report_as_plain_text, the_report_shows_nothing_extra_without_a_report).
  - A running attempt and the attempt list are read again until the attempt ends; the Run tab reads its executor thread until the turn's operation has ended, since a committed attempt's turn goes on to report.
  - A committed task not marked done shows "Waiting for the Planner's judgment" and only while its latest attempt is committed, it is not marked done and Core refuses Start as task_busy (the Planner is still judging); it is read again every two seconds until it is marked or a new attempt starts. A task stopped on the cap (Start allowed) shows no waiting badge and is not read again (a_committed_task_waits_for_the_planners_judgment, a_task_marked_done_does_not_wait, a_task_stopped_on_the_cap_does_not_wait).
  - The Diff tab lists changed files as labelled disclosure sections. The first starts open; selecting another closes the previous file, and selecting the open file collapses it. Each header says Show diff or Hide diff with a chevron and accessible region linkage. The open content shows the whole file at the attempt's commit with Core's changed lines marked, in a bounded scroll area so other headers stay reachable. A refused file read keeps every file header available (diff_file_sections_can_collapse_and_open_another_file, diff_opens_the_first_file_and_switches_on_click, diff_shows_the_whole_file_with_its_changes_marked, diff_shows_cores_refusal_in_the_file_area).
  - Each Report entry opens to its own BriefPanel and ConflictPanel, not only the latest attempt's. The brief shows the original plan version, goal, contract, layout, standards, the attempt's base/model/addition and that version's planned consumers (labelled as the first ones when consumers_more); context_not_recorded shows "began before its context was saved" and nothing is rebuilt. Produces reads as its id, the contract symbol it names (kind, name, path) or its artifact, and its acceptance items; Uses reads as the existing path and symbol or the producing task and output, then its purpose; a resolved contract reads as its reference (an existing path and symbol, or a task's output named by producer_title, else T<target>), then the promised symbol (kind, name, path) or artifact when present; a part reads as its title, kind and folder, then each of the task's paths it owns with its via (folder, or layer <id>), then its rules' ids and texts folded under Rules, never as JSON (brief_contract_items_read_as_text, brief_view_keeps_original_version, historical_context_is_labelled, report_opens_the_selected_attempt_brief).
  - ConflictPanel shows Core's expected, observed, evidence, attempt_state, scope_held and delivery as plain text, dir auto, and nothing for a null conflict; it holds no stop, liveness or impact rule (conflict_shows_expected_observed_and_attempt_state, settled_conflict_stops_polling).
  - A task link with hash `attempt-<id>` opens the Report tab with that attempt expanded (the_attempt_hash_opens_report_and_that_attempt).
traps:
  - The Run tab shows entries as messages and one-line rows; the conversation's tool and diff cards are not public to this folder.
  - The model is free text: the API offers no list of executor models.
