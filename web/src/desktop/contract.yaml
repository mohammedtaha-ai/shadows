name: desktop-main-runtime
version: 1
status: current
source: web/src/desktop
responsibility: Gate shared dashboard mounting on native verified Core readiness.
public_api:
  prepareDesktop: Subscribe before snapshot; show connection controls until ready; freeze verified origin before API modules load.
  nativeCall: Desktop-only typed invocation; never called from browser startup.
  saveConnection: Persist normalized configuration natively; changed configuration reloads main at Settings.
  watchConnection: Reload main on configuration identity replacement.
  authAction/cancelLogin: Existing account IPC with credential-free View; no chat-source selection.
  getState/answerRequest/previewRule/approveRule/dismissRefusal/previewHooks/installHooks: Narrow sidecar method wrappers.
  connectCompanion/setCompanionVisible/setCompanionPaused: Subscribe-before-snapshot native presentation state; latest revision wins.
  hideToTray: Preserve native hide failure as a rejected promise.
obligations:
  - rule: Browser startup mounts without invoking native; desktop sends no API calls before readiness.
    tested_by: web/src/desktop/bootstrap.test.tsx
  - rule: Older revisions cannot win over events observed before snapshot.
    tested_by: web/src/desktop/bootstrap.test.tsx
  - rule: A failed launch waits for explicit Retry.
    tested_by: web/src/desktop/bootstrap.test.tsx
